# Cover wrap config for tools/compose_wrap.py
#   python3 tools/compose_wrap.py books/saeren/saeren-chronicles
pages: 294                    # interior r17 physical page count
paper: {stock: white50}
isbn: "979-8-2409-9043-4"     # PRINT ISBN -- becomes the EAN-13
metadata:
  title: "The Saeren Chronicles - Book One: Hazel Academy (cover)"
  author: Post Peleos
output: {dir: delivery/cover, name: Saeren-Book-One-FULL-WRAP, revision_file: REVISION}
trim: {width: 6.0, height: 9.0, bleed: 0.125, safe: 0.375}
palette: {bg: "#0A0A0C", primary: "#DCE2EC", secondary: "#AEB8C6", accent: "#C9A25A"}
front:
  art: delivery/cover/hazel-academy-front-cover-PUBLISHED-pendant-print.png
spine: {title: HAZEL ACADEMY, author: Post Peleos, title_size: 14, author_size: 11}
styles:
  series:  {font: regular,    size: 8.5, leading: 13,   color: secondary, align: center, space_after: 2}
  booknum: {font: regular,    size: 7.5, leading: 11,   color: secondary, align: center, space_after: 16}
  hook:    {font: bolditalic, size: 12,  leading: 16,   color: primary,   align: center, space_after: 14}
  para:    {font: regular,    size: 10,  leading: 14.5, color: secondary, align: left,   space_after: 9}
  closing: {font: italic,     size: 9.5, leading: 13.5, color: primary,   align: center, space_before: 6, space_after: 0}
back:
  blocks:
    - {style: series,  text: THE SAEREN CHRONICLES}
    - {style: booknum, text: BOOK ONE}
    - style: hook
      text: >-
        The last ordinary morning of Viridia&#8217;s life smelled like scorched
        bread and her mother&#8217;s tea.
    - style: para
      text: >-
        Three days later she walks through the gates of Hazel &#8212; the most
        prestigious school for mages in the country &#8212; orphaned, silent, and
        certain of one thing: no one is ever going to see her grieve.
    - style: para
      text: >-
        In a world that long ago tore its magic cleanly in two &#8212; light from
        dark, safe from forbidden &#8212; Viridia was born <i>whole.</i> Both
        halves. The one thing Hazel was built to make certain could never exist.
        To be known is to be killed. So she makes herself small, learns in secret
        what she truly is, and lets in one person: Alice, the only girl at Hazel
        who sees the drowning underneath the quiet.
    - style: para
      text: >-
        Then the people who fear what this school hides decide to burn it down
        &#8212; and a girl who survives by disappearing must choose between the
        many she can save and the one she cannot bear to lose.
    - style: closing
      text: >-
        A quiet, lyrical fantasy about grief, found family, and a girl who
        refuses to be made small &#8212; the first book of <i>The Saeren
        Chronicles.</i>
author_block:
  photo: ../../_assets/author-photo.jpg
  name: POST PELEOS
  bio: >-
    Post Peleos writes character-driven fantasy about quiet people in loud
    worlds. <i>The Saeren Chronicles</i> is his debut series.
barcode: {width: 1.9, height: 1.1}
