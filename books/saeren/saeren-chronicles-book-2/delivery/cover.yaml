# Cover wrap config for tools/compose_wrap.py
#
#   python3 tools/compose_wrap.py books/saeren/saeren-chronicles-book-2
#
# Front cover ART is supplied; everything else on the wrap is built from here.
# pages MUST be the interior's final physical page count (build_pdf.py reports
# it) and paper.stock MUST be the stock actually ordered -- together they set
# the spine width, the one dimension a reprint cannot fix.

pages: 308                    # interior r11 physical page count
paper:
  stock: white50              # IngramSpark white 50#

isbn: "979-8-2409-9382-4"     # PRINT ISBN -- becomes the EAN-13

metadata:
  title: "The Saeren Chronicles - Book Two: The Resistance (cover)"
  author: Post Peleos

output:
  dir: delivery/cover
  name: Saeren-Book-Two-FULL-WRAP
  revision_file: REVISION

trim: {width: 6.0, height: 9.0, bleed: 0.125, safe: 0.375}

palette:                      # sampled from the Book One / Book Two front art
  bg: "#0A0A0C"
  primary: "#DCE2EC"
  secondary: "#AEB8C6"
  accent: "#C9A25A"

front:
  art: delivery/cover/the-resistance-front-cover-fractured-light-print.png

spine:
  title: THE RESISTANCE
  author: Post Peleos
  title_size: 14
  author_size: 11

styles:
  series:  {font: regular,    size: 8.5, leading: 13,   color: secondary, align: center, space_after: 2}
  booknum: {font: regular,    size: 7.5, leading: 11,   color: secondary, align: center, space_after: 16}
  hook:    {font: bolditalic, size: 12,  leading: 16,   color: primary,   align: center, space_after: 14}
  para:    {font: regular,    size: 10,  leading: 14.5, color: secondary, align: left,   space_after: 9}
  closing: {font: italic,     size: 9.5, leading: 13.5, color: primary,   align: center, space_before: 6, space_after: 0}

back:
  blocks:
    - style: series
      text: THE SAEREN CHRONICLES
    - style: booknum
      text: BOOK TWO
    - style: hook
      text: The war that burned Hazel to the ground has finally found her.
    - style: para
      text: >-
        Viridia escapes to a hidden resistance camp carrying a secret she has never said
        aloud: she was born <i>whole</i> &#8212; both halves of a magic her world tore in
        two six hundred years ago &#8212; and she alone could mend it. For everyone. All
        at once. Whether they consent or not.
    - style: para
      text: >-
        But Alice, the only person who ever truly saw her, is alive and held in the heart
        of the capital that wants Viridia dead. A war she cannot stop is closing in. And
        the grieving young leader at her side is marching toward his own end.
    - style: para
      text: >-
        She will try every bloodless road first. When the armies finally meet, the cost of
        doing the impossible will be measured in the people she loves.
    - style: closing
      text: >-
        The second book of <i>The Saeren Chronicles</i> &#8212; a quiet, devastating
        fantasy about grief, found family, consent, and the weight of being the only
        one who can.

author_block:
  photo: ../../_assets/author-photo.jpg
  name: POST PELEOS
  bio: >-
    Post Peleos writes character-driven fantasy about quiet people in loud
    worlds. <i>The Saeren Chronicles</i> is his debut series.

barcode: {width: 1.9, height: 1.1}
