  genre: "Fantasy romance"
  subgenre: "Reincarnation / past-lives contemporary fantasy with historical strands (Victorian, medieval)"
  language: "English"
  word_count_target: 95000
  comp_titles: []   # TODO: book-researcher pass — reincarnation/past-lives romance shelf.
  engagement_type: {primary: "empathy", secondary: "fascination", tertiary: "romance / wish-fulfilment"}
  premise: "A young woman drawn all her life to a Victorian England she has no reason to love is the first reincarnation of the girl who died calling the wind — and the man who has spent every life since the Middle Ages sharpening one implacable will was assigned, at three years old, to watch over her."
  created: "2026-09-02"
  updated: "2026-09-02"

# GENESIS FROM AUTHOR'S PLANNING NOTES — no prose draft exists. The notes are canon
# (premise, cast, wheel rules, opening two chapters); everything else is the architect's
# to build. This is NOT a revise-existing-draft run.
