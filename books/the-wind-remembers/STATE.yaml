guardrails:
  - "Genesis Floor >= 8.5 per chapter (book-evaluator); polish-loop via book-editor (max 5)."
  - "Style gate: python3 tools/style_check.py must stay clean (simile <=4/1k, em-dash <=~10/1k, no NEW cross-chapter repeated phrase, tics under ceiling). Add this book's deliberate motifs to ALLOWLIST in tools/style_check.py — wind imagery is a MOTIF here and will otherwise trip the repetition gate."
  - "Word floor >= manuscript_min_words; verify with: wc -w manuscript/chapters/chapter-*.md."
  - "CANON — the wheel (from the notes, non-negotiable): (a) each old soul has ONE thing that sets it apart — Mandy: calling the wind; Knight: implacable will, unstoppable while he still breathes. (b) Memories unlock ONLY by USING the gift that put you on the wheel; after that they trickle back THROUGH DREAMS, and faster the more the soul embraces its past. (c) Memory return is not always pleasant — a violent death is re-lived. (d) TERMINOLOGY (author correction 2026-09-02): the newly reincarnated soul being watched over is a WARD (the handwritten pages say 'hand'; 'ward' is canon and is the pages' own word one line later). The mature soul given the duty is the PROTECTOR. Knight is the PROTECTOR; Mandy is his WARD — never the reverse. A ward is assigned only for a soul's FIRST reincarnation, and only mature souls are given one. (e) A protector starts with NO name, NO face, NOT even a gender for the ward — only a vague sense of WHERE. (f) The wheel keeps protector and ward close in age: Knight was 3 when Mandy was born, and felt the world shift at her first breath, a pull WEST, and that he had time."
  - "CANON — the leads: Mandy is the FIRST reincarnation of Elizabeth, a high-society Victorian Englishwoman who called the wind and died doing it in a moment of crisis. Mandy does NOT know she is an old soul; she only knows she is drawn to the period (the dresses, the society) without knowing why — hold that ignorance until the notes' reveal. Knight is an old soul out of the MEDIEVAL period who recovers his memories early and easily, helped by battlefield instincts."
  - "CANON — opening shape: Ch.1 is Elizabeth's Victorian life through her death. Ch.2 time-skips to Mandy as a child, kids outside a run-down abandoned house, storm-feeling but no storm; she calls the wind for the FIRST time and DISMISSES it as the coming weather (they had played the calling game before with nothing happening); sun, then they run laughing to her house out of the sprinkling rain. Then skip to Mandy in her twenties, where she meets Knight."
  - "The notes anchor flashbacks to the leads' FIRST lives — Elizabeth's Victorian one for Mandy, Knight's adulthood for him. Per the author's 2026-09-02 decisions these are not merely anchors but the WHOLE of each memory stream: Mandy's memories are Elizabeth's life only, Knight's are his first (medieval) life only. Neither stream ranges across later lives."
  - "STANDALONE DISCIPLINE 1 — never stage the wheel's administration: no council, no clerks, no officers, no binder, no audience with management. The wheel is weather, not a government. The moment the institution has staff, it has a sequel."
  - "STANDALONE DISCIPLINE 2 — answer 'why me', not 'why the wheel'. Mandy never learns why the wheel exists; she learns what being kept by it costs, and she chooses. Characters get closure; the cosmos does not."
  - "STANDALONE DISCIPLINE 3 — every reveal arrives through the mechanism already in the notes (gift used -> memories trickle back in dreams -> faster as she embraces her past). NO investigation subplot, NO archive, NO research montage: the past resolves inside the romance, not beside it."
  - "POV — Ch.1 opening on Elizabeth's death makes this a DRAMATIC-IRONY book, not a whodunit. Give Knight enough POV that the reader knows what he is early; the tension is WHEN SHE FINDS OUT AND HOW SHE TAKES IT, not 'who is this man'."
  - "MEMORY STRUCTURE (author decision 2026-09-02): past lives are INTERSPERSED THROUGHOUT, not confined to a few set-piece flashbacks. Present day still carries the spine, but memory is woven continuously through it."
  - "MEMORY ORDER (author decision 2026-09-02) — memories arrive IN CHRONOLOGICAL ORDER, not scrambled. Each lead recovers their FIRST life from its beginning forward, ending in their death. Mandy gets Elizabeth's Victorian life in sequence; Knight gets his medieval life in sequence. Both streams are complete lives told in order underneath the present-day spine."
  - "FRAGMENTARY IS NOT OUT OF ORDER — early memories are SHORT and INCOMPLETE (seconds of a scene, a sensory intrusion not yet legible as memory) while still advancing chronologically. What escalates is LENGTH, CONTINUITY and RATE, never sequence. This is how the notes' rule ('the more you embrace your past, the faster they come') becomes PACING rather than disorder."
  - "WHAT EACH MEMORY STREAM IS FOR (author decision 2026-09-02) — canon says every old soul has ONE thing that sets it apart, and each first life is THE ORIGIN STORY OF THAT THING. Elizabeth's life shows the WIND growing until it made her exceptional enough for the wheel to keep her. Knight's shows the WILL forming — how he became the man nothing on earth can stop. This is the single rule for what every memory must earn its place doing: if an installment does not advance the formation of that trait, it does not belong."
  - "KNIGHT'S WILL IS A SCAR, NOT A VIRTUE — show it being MADE. A man becomes unable to stop because stopping once cost him everything. Do NOT deliver this as one trauma revealed in a single reveal: across the ordered stream we watch it ACCRETE — small choices, a hardening, until the shape is set. And show the formation before anyone articulates it; NOBODY in the book says 'that is why you are like this.'"
  - "HIS TRAIT IS ALSO WHAT KILLS HIM — his first life should END because he would not stop. The reader learns at the midpoint that his defining virtue is lethal to him, EVERY time. So when he refuses to stop at the climax, the reader is genuinely afraid. This is also the severer's case at its strongest: the man was broken into this shape centuries ago and has never once been allowed to set it down."
  - "THE ARC CLOSES ON REASON, NOT TRAIT — Knight does not become less implacable. If the will was forged by failing to hold on to someone, then staying with Mandy after his charge ends is the SAME impulse, chosen for the first time instead of driven by a wound. The trait is constant; the reason changes."
  - "EACH INSTALLMENT IS A SCENE, NOT AN EXPLANATION — a memory has its own stakes and its own turn, or it is backstory in period costume. The risk of an origin-story stream is that it lectures; the guard against it is that every installment could stand alone as a scene."
  - "THE ORDERED STREAM IS A COUNTDOWN. The reader watched Elizabeth die in Ch.1, so every ordered memory is one step closer to the thing already seen. That is the book's dread engine and its clock — the architect should treat Elizabeth's recovered life as a second, forward-moving plotline with its own beats, not as decoration."
  - "MEMORY ASYMMETRY (revised) — both leads recover a first life in order, ending in death, but their RELATIONSHIP to it is opposite. Mandy is recovering hers for the FIRST time and does not know what is coming. Knight has recovered his EVERY SINGLE CYCLE and knows exactly how it ends — he is watching a rerun of his own death. Mandy dreads the unknown; Knight dreads the known. Do NOT flatten this into the same device twice."
  - "KNIGHT'S STREAM IS THE REHEARSAL FOR MANDY'S — canon says he remembers early and easily, so land HIS first-life death well before hers (midpoint region). It shows the reader exactly what is waiting for Mandy at the end, and it is the severer's argument DEMONSTRATED rather than spoken. Never let the severer win a scene by speech when a memory can do it."
  - "CONVERGENCE — memory unlocks by USING the gift, and the present-day climax should require Mandy to call the wind as hard as Elizabeth did. So the last memory (Elizabeth's death) lands AT the climax: she calls the wind, re-lives dying, and the severer's offer is on the table in the same scene. Three chronologies resolve in one moment."
  - "THE DEATH IS WITHHELD FROM MANDY UNTIL LAST. The READER sees Elizabeth die in Ch.1; MANDY recovers it at the end, when the memories finish arriving. The book runs on DREAD, not mystery — the reader spends it knowing what is coming for her. This is the payoff the Ch.1 opening promises."
  - "Do NOT invent past the notes without flagging it. Where the notes are silent (see open_author_decisions), the architect PROPOSES options in feedback/progress.md for author sign-off rather than quietly settling canon."

open_author_decisions:
  - "TITLE: 'The Wind Remembers' is a Claude-chosen working title — the notes name none. Confirm, or replace."
  - "What determines how OFTEN a soul is reborn? (Author's open question.)"
  - "WHY is a soul reborn at all? (Author's open question — this is the metaphysics the ending has to answer.)"
  - "Does Knight's charge as Mandy's protector end when she recovers her memories, and does the wheel give him another ward? The notes are silent, and the romance's shape depends on it."

decisions:
  - "This book is a folder-per-book genesis project under books/the-wind-remembers/."
  - "2026-09-02 AUTHOR DECISION — CONFLICT APPROVED (feedback/conflict-proposal.md v2). There is NO binder: the wheel took Elizabeth impersonally because her gift made her exceptional (the author's own note). ONE antagonist — a man who can sever souls from the wheel, who is not a menace but a MERCY: tired old souls who re-live violent deaths every cycle are offered rest, and his argument is real. HIS SIN IS THAT HE DOES NOT ASK — which is the wheel's sin too (Elizabeth was not asked; Knight was not asked at three). THEME = CONSENT. He enters through KNIGHT, not through Elizabeth: Knight is exactly the worn soul his work exists for, Knight refuses because of Mandy, so he turns to her — free her and Knight has no reason to stay. The leverage IS the romance; no coincidence required. Knight's implacable will is the CLIMAX MECHANISM, not a superpower. BALANCE = souls must be able to leave or the wheel is a prison, but if leaving is easy whatever the wheel is for collapses; the climax restores the ABILITY TO CHOOSE rather than winning a fight."
  - "2026-09-02 AUTHOR DECISION: Mandy is a MUSEUM CURATOR specializing in the VICTORIAN period — the exact era she lived. Consequence: her workplace is full of objects from her own first life, so her career is the ACCELERANT for her memory recovery. Canon-compliant, and note the limit: objects do NOT unlock memory (only USING THE GIFT does that). Before the wind, the museum supplies only the unexplained pull. After the wind unlocks the stream, the museum is the fastest place on earth for her to embrace her past, which is exactly the notes' acceleration rule — and it is also the PACING SOLUTION for recovering a whole life inside one standalone."
  - "2026-09-02 AUTHOR DECISION: romance is CLOSED-DOOR / behind-the-scenes. No on-page sex. The author wants TEENS to be able to read this."
  - "2026-09-02 SHELF NOTE (Claude, flagged for author): teen-readable + leads in their TWENTIES means this is NOT YA — YA convention puts a teenager in the lead, and the notes explicitly place Mandy in her twenties with a career. This is ADULT closed-door fantasy romance with crossover teen readership, which is a real and healthy shelf. Do NOT age Mandy down to chase the YA label; it would break the notes. Comp and package accordingly."
  - "2026-09-02 CONTENT GUARDRAIL (teen-readable): the heavy material STAYS — Elizabeth dies violently in Ch.1, Knight re-lives his own death, there are battlefield memories, and the antagonist offers to end souls. What changes is RENDERING: consequence-forward, not gore-forward. Death is felt, not dwelt on. The severer's offer is the delicate one — a sympathetic character arguing for ending existence, read by teens — and the book's own theme is the guard: his sin is that HE DOES NOT ASK, and the ending is Mandy CHOOSING TO STAY. Never render the offer as seductive or as the wiser path; let it be understandable and still refused."
  - "2026-09-02 AUTHOR DECISION: souls are reborn because THE WHEEL KEEPS WHAT IS RARE — impersonal, no decider. How often is deliberately left unanswered."
  - "2026-09-02 AUTHOR DECISION: STANDALONE. One book, self-contained ending. Consequence for the architect: the wheel's cosmology is NEVER fully explained and its administration is NEVER staged on-page (no council, no agents, no hierarchy) — the wheel is weather, not a government. The ending resolves WHY MANDY is on the wheel, not why the wheel exists. Characters get closure; the cosmos does not."
  - "The handwritten pages are transcribed VERBATIM in research/source-notes.md, with interpretation kept in a separate clearly-marked section, so the author's own words stay recoverable."
revision_cycles: 0
