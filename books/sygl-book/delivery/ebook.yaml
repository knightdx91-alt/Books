# Sygl — SINGLE SOURCE for the production build.
#
#   python3 books/sygl-book/tools/assemble_manuscript.py     # chapters -> full-manuscript-<rev>.md
#   python3 books/sygl-book/tools/build_interior.py          # print interior (paperback + hardcover)
#   python3 tools/make_epub.py books/sygl-book               # EPUB
#
# Read by tools/make_epub.py (top-level keys) AND by the book's own
# tools/build_interior.py / assemble_manuscript.py / make_placeholder_cover.py
# (the top-level keys plus the `print:` block, which make_epub ignores).
# Change the author, an ISBN or the revision HERE, once, and rebuild everything.
# Paths are relative to this book folder.

# --- identity (shared by print + ebook) ------------------------------------
full_title: "Sygl"
title: "Sygl"
author: "Søren Stromberg"            # pen name — title page, copyright, running heads, EPUB creator
publisher: "Underground Associates"   # imprint (author, 2026-10-22)
year: 2026                            # copyright year
language: "en"
revision: "r1"                        # stamps full-manuscript-r1.md and the interior PDF names

# --- ebook ------------------------------------------------------------------
isbn: "9798182959414"                 # EBOOK ISBN (not a print one)
isbn_hyphen: "979-8-1829-5941-4"     # same, formatted for the copyright page
cover: "delivery/cover/ebook-cover-sygl.jpg"   # final front cover (Canva art A + type)
out: "delivery/ebook/Sygl.epub"
edition: "First Edition 2026 &#183; Ebook Edition"
desc: "A one-handed orphan with no sygl finds Amelia, the imprisoned originator of the feared Blood sygl, sealed in the temple behind his orphanage for three thousand years. He bonds her as his familiar and walks her out into a school, a found family and a war."
# Extra copyright-page lines, shared by the EPUB (make_epub copyright_extra) and the
# print interior. The print ISBNs are listed alongside the ebook one.
copyright_extra:
  - "All characters in this book are 18 years of age or older."
  - "Hardcover ISBN 979-8-1829-5940-7"

# --- "Also by" page (author, 2026-10-22) -------------------------------------
# EPUB: raw HTML after make_epub's own "Also by <author>" heading.
also_by: |
  <p class="ab"><i>A Bond of Scale and Silver</i><br/>(adult romantasy, explicit)</p>
  <h3 class="ab">Writing as Post Peleos</h3>
  <p class="ab">The Saeren Chronicles (young adult fantasy)<br/><i>Hazel Academy</i><br/><i>The Resistance</i><br/><i>The Weight of the Source</i></p>
# PRINT: the same page on the verso facing the title page (page 2; page count unchanged).
also_by_print:
  - {h: "Also by Søren Stromberg"}
  - {i: "A Bond of Scale and Silver"}
  - {t: "(adult romantasy, explicit)"}
  - {gap: true}
  - {h: "Writing as Post Peleos"}
  - {t: "The Saeren Chronicles (young adult fantasy)"}
  - {i: "Hazel Academy"}
  - {i: "The Resistance"}
  - {i: "The Weight of the Source"}

# --- print (read by tools/build_interior.py; ignored by make_epub) ----------
print:
  isbn_paperback: ""                       # 979-8-1829-5940-7 went to the HARDCOVER (2026-10-22); paperback needs a new ISBN
  isbn_hardcover: ""                       # none yet — hardcover needs its OWN ISBN; line omitted until set
  trim: {width: 5.0, height: 8.0}          # inches; paperback AND hardcover (case laminate) share ONE interior
  interior: "B&W, cream paper"
  paper_stock: cream50                     # IngramSpark cream 50#, 0.0025"/page (tools/compose_wrap.py PAPER_STOCKS)
  margins: {inside: 0.8, outside: 0.55, top: 0.7, bottom: 0.7}   # inches; mirrored
  running_heads: true                      # author on verso, title on recto
  out_name: "Sygl-5x8-interior"            # -> delivery/production/Sygl-5x8-interior-<rev>.pdf
  # Per-edition overrides (python3 tools/build_interior.py --edition <name>).
  editions:
    hardcover:                                # author, 2026-10-22: 6 x 9, creme, Digital Cloth (blue), textured
      trim: {width: 6.0, height: 9.0}
      margins: {inside: 0.875, outside: 0.625, top: 0.75, bottom: 0.7}
      out_name: "Sygl-6x9-hardcover-interior"
      isbn_hardcover: "979-8-1829-5940-7"   # author assigned 5940-7 to the HARDCOVER in IngramSpark (2026-10-22)
      isbn_paperback: ""                     # paperback will need a different ISBN
