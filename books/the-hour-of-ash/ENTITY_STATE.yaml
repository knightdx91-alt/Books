  emilio-reyes:
    canonical_name: "Emilio Reyes"
    aliases: []
    importance: supporting
    role: "Mara's father (deceased); field archaeologist; present only as objects and the tape"
    first_appearance: { chapter: 1, mode: "absence (memorial; outgoing message)", source: "ch-01:p1; ch-01:p181" }
    physical:
      age: { value: 68, at_death: "January 1998", birth_year: "1929-30", source: "foundation:§10" }
    traits:
      - { trait: "field archaeologist at a Philadelphia university; eight months a year on digs", source: "foundation:§3; foundation:§11.1; ch-01:p2 (the carousel: 'forty years of my father's trenches'); ch-01:p191 ('thirty-odd years of trench walls' — polish cycle 1)", mutable: false }
      - { trait: "promised 'next season, you come with me' for twenty-five years; never took her", source: "foundation:§3", mutable: false }
      - { trait: "dug in Cyprus (eleven seasons with Doug Fessler; Paphos 1984; Kourion 1992), Sicily (two seasons with Doug) and Turkey (slides)", source: "ch-01:p4; ch-01:p18; ch-01:p25; ch-01:p172", mutable: false }
      - { trait: "'generous with his time' (Doug's eulogy): climbed into a student's section in his good shirt; gave a Sunday to a village boy; sat up until 2 a.m. over Doug's sherd with a 7 a.m. flight", source: "ch-01:p5; ch-01:p18", mutable: false }
      - { trait: "showed his dig slides every September at the kitchen table, projected on a bedsheet thumbtacked over the china cabinet", source: "ch-01:p11", mutable: false }
      - { trait: "read Dick Francis on planes (Wild Horses overdue at the Free Library)", source: "ch-01:p170; ch-01:p171", mutable: false }
      - { trait: "talked every season of jacking up the sagging porch (drawn on the back of a context sheet); shoveled Pat's walk when home", source: "ch-01:p24; ch-01:p168; ch-01:p163", mutable: false }
      - { trait: "offended for a week when the store recommended the two-tape answering machine as 'easier for older people' (December 1991)", source: "ch-01:p167", mutable: false }
      - { trait: "wore his 1966 Seiko daily, took it off at night face up on a folded handkerchief on the nightstand", source: "ch-01:p190", mutable: false }
      - { trait: "kept only his study (the back bedroom) in order; decades of field notebooks in yellow surveyor's covers, browned at the spine where his thumb opened them, each labelled with a site and a year; wrote small and fast, leaning forward, 'like a man running for a bus'; site plans pinned on the cork strip over his desk 'until their corners curled'", source: "ch-02:p45; ch-02:p46", mutable: false }
      - { trait: "'never in his life returned a form on time' (Mara); never typed up his notebooks (Halloran: 'He never got round to typing anything, did he')", source: "ch-02:p31; ch-02:p36", mutable: false }
      - { trait: "director of record for the Campanian survey season; last season's north transects exist only in his notebooks", source: "ch-02:p28; ch-02:p36", mutable: false }
    voice_markers:
      ref: "character-bible.md#emilio-reyes"
    greeting_ch1:
      text: "Hello, you've reached the Reyes house, which means you've reached a machine, because I'm out somewhere digging a hole in somebody else's country. Or I'm in the basement looking for the Christmas lights. Tell me who you are and where you're calling from, and say it slowly, and I'll find you. [aside, lower:] Mara? Which one stops it?"
      recorded: "c. December 1991 / 'six years ago' (Mara 26, beside him at the counter; he pressed the wrong button and never re-did it); a radio playing 'Brahms or something like Brahms' in the background"
      source: "ch-01:p180; ch-01:p181; ch-01:p184"
    relationships:
      mara-reyes: { type: "father", established: "ch-01:p1", current_status: "deceased" }
      maras-mother: { type: "former spouse (apart 'since 1981'; character-bible: divorced c. 1981)", established: "ch-01:p3", current_status: "in Phoenix; sent lilies" }
      doug-fessler: { type: "dig colleague: eleven seasons Cyprus, two Sicily", established: "ch-01:p4", current_status: "gave the eulogy" }
      pat: { type: "next-door neighbor; he shoveled her walk", established: "ch-01:p168", current_status: "has his blue Tupperware" }
      nicosia-caller: { type: "friend/colleague in Nicosia (unnamed)", established: "ch-01:p172", current_status: "has not heard of his death; holds his 1992 Kourion drawings" }
      halloran: { type: "permit contact and colleague in Naples (Campanian survey); takes over as director for the season", established: "ch-01:p176", current_status: "Ch.2: the permit passes by the heir's declaration (signed 1 Apr); Halloran wants his last-season notebooks", ch2_source: "ch-02:p28; ch-02:p35; ch-02:p36; ch-02:p44" }
    memorial: { when: "Saturday the fourteenth (March 1998), two o'clock", where: "university museum upper gallery", eulogist: "doug-fessler", note: "a priest gave a reading earlier (Gloria, p141); lilies from Mara's mother; three lemon cakes; slide carousel of his digs", source: "ch-01:p2; ch-01:p3; ch-01:p4; ch-01:p141; ch-01:p174" }
    possessions:
      - { item: "microcassette", status: "his outgoing message (greeting tape); ejected by Mara Ch.1", source: "ch-01:p188" }
      - { item: "fathers-seiko-watch", status: "stopped at ten past four on his nightstand; wound and taken by Mara Ch.1; resized for her Ch.2", source: "ch-01:p190; ch-01:p191; ch-02:p14" }
      - { item: "fathers-pentax-k1000", status: "on the shelf over his bureau; handled and put back Ch.1; loaded by Mara Ch.2", source: "ch-01:p192; ch-02:p64" }
      - { item: "answering-machine", status: "Panasonic two-tape on the kitchen counter", source: "ch-01:p167" }
      - { item: "emilio-rowhouse", status: "his house (off Baltimore Avenue); estate with a lawyer on Walnut Street", source: "ch-01:p116; ch-01:p163" }
      - { item: "cypriot-lamp", status: "chipped nozzle; on the bedroom shelf beside the Pentax", source: "ch-01:p192" }
      - { item: "kourion-drawings", status: "1992 Kourion drawings, under a friend's bed in Nicosia", source: "ch-01:p172" }
      - { item: "overdue-library-book", status: "Wild Horses (Dick Francis), overdue to the Free Library, Walnut Street West", source: "ch-01:p170" }
      - { item: "emilio-field-notebooks", status: "bottom shelf of the study bookcase; Mara runs a finger along the spines and does not take one down (Ch.2); Halloran wants last season's by the end of June", source: "ch-02:p36; ch-02:p38; ch-02:p46" }
      - { item: "campanian-survey-permit", status: "the permesso is still in his name; Halloran needs a name by 20 April (Ch.1). Ch.2: the cession is refused ('Firma mancante'); Mara signs the heir's declaration Wed 1 Apr and faxes it to Naples", source: "ch-01:p176; ch-02:p30; ch-02:p44" }
      - { item: "study-desk-and-cork-strip", status: "the cork strip over his desk (site plans once) now holds the Venetian chart's mat board; blotter; his chair", source: "ch-02:p45; ch-02:p46" }
