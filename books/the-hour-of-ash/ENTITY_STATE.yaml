        basis: "Titus took Jerusalem in the late summer of 70 (the temple burned in August, the upper city fell in September; Josephus, read in her second-year seminar); news like that reached Greece 'in weeks, by sea, and the sea was still open'; 'the olives were coming down in the valley behind me'. Vespasian is emperor (Ouespasianos)"
        note: "a present realization from the herald, not foreknowledge. NOTHING about 79, Pompeii or Vesuvius on the page (outline NON-NEGOTIABLE kept). Replaces the planned row (outline:ch-05)"
        source: "ch-05:p107; ch-05:p108"
      - { fact: "the span: 'Nineteen ninety-eight, less seventy. One thousand nine hundred and twenty-eight years'", learned_chapter: 5, method: "inferred", note: "done on her fingers. The next line is 'I had told Gloria the ninth of June.'", source: "ch-05:p109; ch-05:p110" }
      - { fact: "since the bronzes were carted off there's no buying, and 'Everybody's poorer'; the clay women are 'all pressed from one mold, with the same thumbprint on every hip'", learned_chapter: 5, method: "told_by:clay-figure-seller", source: "ch-05:p115" }
      - { fact: "four oxen for the whole town; the council will have it before it's cooked; 'for the Nemean thing' last time there was one ox and a sheep; the Jews are 'Over past Syria somewhere'", learned_chapter: 5, method: "overheard", note: "she 'could follow most of it' (p117)", source: "ch-05:p117; ch-05:p118; ch-05:p119; ch-05:p122; ch-05:p123" }
      - { fact: "DOUBT (Ch.5): 'The herald had said the fourth day, I was nearly sure, and nothing about four oxen. Either they had heard him wrong or I had.'", learned_chapter: 5, method: "inferred", note: "added in polish cycle 1 (new p128). Her Greek comprehension is uncertain; the number of oxen is not settled on the page", source: "ch-05:p99; ch-05:p118; ch-05:p128" }
      - { fact: "a man offers 'a house down past the stadium road that takes in girls on their own. Clean, and you'd eat'", learned_chapter: 5, method: "told_by:procurer-at-dusk", note: "she understands his look 'without any Greek at all'", source: "ch-05:p130" }
      - { fact: "the woman at the spring is called Kallia (a lodger shouts it from the gallery: 'Kallia! … have those Thebans had it all?'); 'Kallia, then.'", learned_chapter: 5, method: "overheard", source: "ch-05:p194; ch-05:p200" }
      - { fact: "Kallia's house: a courtyard with a pomegranate tree, an outside stair to a gallery, rooms on every side with lodgers (Thebans; a man singing about a girl from Corinth; one already snoring); lentils on the hearth; 'the girl ran off at the vintage'", learned_chapter: 5, method: "witnessed", note: "'I've a houseful of Thebans' and the girl are told_by:kallia (p171)", source: "ch-05:p171; ch-05:p193; ch-05:p194" }
      - { fact: "her terms: water into the big jar; ashes out before the light and the hearth swept; two jars from the spring before the lodgers wake; the floors (court first); the Thebans' pots; 'Don't touch the oil'; sleep in the storeroom", learned_chapter: 5, method: "told_by:kallia", note: "no pay and no food are named", source: "ch-05:p202; ch-05:p204; ch-05:p205" }
      - { fact: "BELIEF / PLAN (Ch.5): in the morning she will go back up by the boy's track, past the pen and the firs, to the crack, because 'if the cold had leaked from that rock at one-forty on a day in May it might come again on some other day, if I sat there long enough with my hand in the crack'. In the storeroom she works out an early start (ashes and water done, the cart track by full light, the plain, the long climb to the firs, 'the cave at the top of it by noon')", learned_chapter: 5, method: "inferred", note: "a plan, not a fact. The outline's 'Opens toward Ch.6: she means to go back up to the cave'", source: "ch-05:p136; ch-05:p210; outline:ch-05" }
      - fact: "the crack she came through gives nothing on a snowy November afternoon. She clears its floor at the bend to bare rock, keeps her palm in the gap from before 'ten past one' until 'five to two' (the May cold came at 1:40), and feels only 'Cold that was only cold'. 'The rock was cold. Behind me the torch flame stood straight up.' The cave is 'only a cave'"
        learned_chapter: 6
        method: "discovered"
        note: "replaces the planned row 'the Corycian door she came by is shut' (outline:ch-06). The page does not use 'door' or 'shut' for what she finds. Her own words are 'If that cave is open today' and 'I have no idea what happens if it's shut' (p165, before the test) and 'Until it opens' (p232). The planned Ch.8 attempt repeats the test"
        source: "ch-06:p1; ch-06:p2; ch-06:p8; ch-06:p13; ch-06:p14; ch-06:p34; ch-06:p238; ch-06:p239; ch-06:p243; ch-06:p245; ch-06:p247"
      - { fact: "in winter the crack's sign cannot be told from the mountain's cold: 'In May this rock had let out a cold of its own, and my skin had singled it out at once. Now the whole mountain had turned to cold … Nothing could have come through that crack that I would have known from the rest'", learned_chapter: 6, method: "inferred", note: "her own reasoning about the limit of her test; it does not say whether anything opened unseen", source: "ch-06:p2" }
      - { fact: "the hour is 'nothing to go on': she waits for the May hour (1:40) on a watch she reset by the sun's noon at Kallia's gatepost, and nothing comes", learned_chapter: 6, method: "inferred", note: "the page names the two bases: the May cold came at 1:40 'by Athens time, which ran an hour and more ahead of this sun' (p14), yet she waits for the face-value hour (CH6-8 RESOLVED)", source: "ch-06:p13; ch-06:p14; ch-06:p15; ch-06:p247" }
      - { fact: "the man who brings Kallia's wood is called Valens ('Not in my court, Valens')", learned_chapter: 6, method: "overheard", source: "ch-06:p48" }
      - { fact: "the sea is shut: 'The last ship went out of Kirrha eight days ago'; before it, from the east, 'Oil. Wine from Crete. A man with dogs to sell'; Valens 'don't carry letters'; Kallia asked about 'Letters'", learned_chapter: 6, method: "overheard", note: "Valens to Kallia in the lane; what Kallia's 'Letters' is about is not explained on the page", source: "ch-06:p68; ch-06:p69; ch-06:p70; ch-06:p71; ch-06:p72; ch-06:p73; ch-06:p74" }
      - { fact: "her arrival is a story on the mountain: 'The charcoal men had a story this autumn … A goat boy up there saw a nymph walk out of Pan's cave in trousers and eat his cheese'; the boy tells that she gave him something he spat out; the charcoal burner (his cousin's boy) has it as 'paid him in a cake made of hay'", learned_chapter: 6, method: "told_by:valens", note: "then confirmed by the burner himself on the descent (p314; p320)", source: "ch-06:p86; ch-06:p88; ch-06:p90; ch-06:p314; ch-06:p320" }
      - { fact: "the way up: 'The stair's ice from the second turn … The plain's snow. Nobody's up there now but the charcoal men, and they're coming down'; to the cave 'In summer, a morning. In this, a morning and more'; down 'Before dark, if you're quick in there'; 'The road over to Boeotia's under snow. All of it.'", learned_chapter: 6, method: "told_by:valens", source: "ch-06:p96; ch-06:p98; ch-06:p100; ch-06:p149" }
      - { fact: "there is 'a Philadelphia in Asia … Past Sardis'; 'Past Asia there's only Parthians'", learned_chapter: 6, method: "told_by:valens", note: "his answer to the one English word he caught", source: "ch-06:p167; ch-06:p169" }
      - { fact: "the temple is repainted every spring when the snow has gone: the priests hang a man off the roof on a rope 'with a pot of red'; the same man every year; he fell off the corner at the last painting and broke his arm and was back up in a month with the arm tied to his side; 'He's cheap'", learned_chapter: 6, method: "told_by:valens", source: "ch-06:p177; ch-06:p179; ch-06:p181" }
      - { fact: "Valens's mules have no names ('The gray', 'The brown'); 'A name's for calling. They come when they see the barley bag'; he speaks Latin to them because 'They came from Corinth'", learned_chapter: 6, method: "told_by:valens", source: "ch-06:p194; ch-06:p196; ch-06:p198; ch-06:p200" }
      - { fact: "what Valens made of her: first, that she was digging up hidden silver ('People who run bury it, and come back for it later'); then, on the descent, a runaway from 'a big house. Corinth, or Patrae', pursued by 'a father or a husband' with 'the money to look', and 'there's one man in Delphi who'd take a mule up Parnassus in the snow'. 'Most of it was true, and the whole of it was wrong.'", learned_chapter: 6, method: "told_by:valens", source: "ch-06:p264; ch-06:p266; ch-06:p328; ch-06:p329" }
      - { fact: "Valens laughed at her blow and scream because 'It was the first thing you did up here I understood'", learned_chapter: 6, method: "told_by:valens", source: "ch-06:p260; ch-06:p262" }
      - { fact: "Valens was at the turn of the lane before she came out and heard her at the spring twice in the dark ('A thief doesn't fill the widow's jar before she goes')", learned_chapter: 6, method: "told_by:valens", source: "ch-06:p270" }
      - { fact: "Valens will not sell the watch back ('You paid it to go up. You went up.'); he will wind it 'Forward. Till it stops, and not past.'", learned_chapter: 6, method: "told_by:valens", source: "ch-06:p301; ch-06:p306" }
      - { fact: "the charcoal burner takes her for the nymph; Valens tells him she is 'the widow Kallia's … Down by the spring', has been 'Since the olives', 'came off a ship' and 'hit Pan'; Valens expects him to have her 'all over the town by the next market'", learned_chapter: 6, method: "witnessed", source: "ch-06:p314; ch-06:p315; ch-06:p317; ch-06:p319; ch-06:p323; ch-06:p328" }
      - { fact: "the god's ox: from the burner's fast mountain Greek she catches only 'the number four in it, and the council, and a grievance about meat'; Valens 'was at Kirrha'; the burner 'ate … Smoke'", learned_chapter: 6, method: "overheard", note: "'I lost words out of everything he said' (p311). The decreed sacrifice of Ch.5 has happened by now", source: "ch-06:p311; ch-06:p312; ch-06:p313; ch-06:p314" }
      - { fact: "Valens's instruction: 'Men will come asking. You went up by yourself. You never had a watch.'", learned_chapter: 6, method: "told_by:valens", source: "ch-06:p341" }
      # --- Ch.7 (prose) ---
      - { fact: "the himation, tunic and cord were 'the girl's', who 'took herself off when the grapes came in, in what she stood up in'; she will not want them back ('Not to carry water in.')", learned_chapter: 7, method: "told_by:kallia", source: "ch-07:p12; ch-07:p14" }
      - { fact: "the town knows she went up the mountain: 'I have been up a mountain.' / 'So the town says.'", learned_chapter: 7, method: "told_by:kallia", note: "the only acquisition path on the page is the charcoal burner's gossip (Valens: 'all over the town by the next market', ch-06:p328)", source: "ch-07:p19; ch-07:p20" }
      - { fact: "how a woman passes in Delphi: short steps; eyes on the ground in front; men known by their feet; 'You've no ears. I answer.'; sitting knees together; never looking at a man ('Look at a man out there and you've asked him something. And somebody answers.')", learned_chapter: 7, method: "told_by:kallia", source: "ch-07:p16; ch-07:p18; ch-07:p20; ch-07:p22; ch-07:p24; ch-07:p26; ch-07:p33; ch-07:p35" }
      - { fact: "the public latrine beside the market is men's ground (a marble bench on three walls over running water; a sponge on a stick). A woman uses a lidded pot at home and empties it on the dung heap at the lane's end", learned_chapter: 7, method: "discovered", note: "found in her first week, still in trousers; Kallia shows her the pot 'without comment'", source: "ch-07:p36" }
      - { fact: "every morning, before her own threshold, Kallia sweeps the boards outside one shut door at the end of the gallery. She leaves that broom lying across the doorway, uses another for the rest of the house, and puts it back at the same slant if it is moved. Who the room is for is not told", learned_chapter: 7, method: "witnessed", source: "ch-07:p37; ch-07:p95; ch-07:p185" }
      - { fact: "the bath's hours are women from first light until the sun is over the cliffs, then the men after their exercise; wooden clogs for the hot room; legs are singed with a lamp; teeth are scrubbed with burnt, ground horn ('Goat's is best')", learned_chapter: 7, method: "witnessed", source: "ch-07:p38; ch-07:p42; ch-07:p55; ch-07:p57" }
      - { fact: "how Delphi pronounces Greek: ai near the e in egg; eta halfway to i, and all the way there in the mountain villages. Kallia corrects her by saying the word back", learned_chapter: 7, method: "discovered", source: "ch-07:p59; ch-07:p60" }
      - { fact: "at the spring they call her simple. Kallia: 'Let them. Simple girls don't get asked anything.'", learned_chapter: 7, method: "told_by:kallia", source: "ch-07:p73; ch-07:p75" }
      - { fact: "Kallia does not believe in her country: 'There's no such country.' / 'Then why aren't you in it?'", learned_chapter: 7, method: "told_by:kallia", source: "ch-07:p89; ch-07:p91" }
      - { fact: "Valens does not accept 'She's simple': 'No.'", learned_chapter: 7, method: "witnessed", source: "ch-07:p105; ch-07:p106" }
      - { fact: "the watch is still in Valens's belt pouch", learned_chapter: 7, method: "inferred", note: "from Ch.6 (ch-06:p142); not seen in Ch.7. Since November she has told the time only by morning, the gatepost's noon shadow and the lamps", source: "ch-07:p107" }
      - { fact: "in public she is 'Kallia's', and Kallia 'has a tongue on her and the council's ear'", learned_chapter: 7, method: "overheard", note: "the salt-seller to the drover at the spring", source: "ch-07:p119; ch-07:p121" }
      - { fact: "why the lists are being made (spring talk): the new emperor means to take back the freedom Nero gave Greece, so Greece will pay tribute again. Nobody knows when. The council is entering every household, and what manner of person each member is, 'before Rome put a governor back in Corinth to ask for it'", learned_chapter: 7, method: "overheard", note: "the draft's 'the governor's men in Corinth' was repaired (CH7-4 RESOLVED)", source: "ch-07:p129" }
      - { fact: "the cover (Kallia's): she is Kallia's 'husband's brother's girl', from Syracuse; her people died; she came 'on one of the last boats before the sea shut, after the vintage'; if the clerk asks anything, 'you've a cold'. Kallia does not answer 'What was he called? Your husband's brother.'", learned_chapter: 7, method: "told_by:kallia", source: "ch-07:p131; ch-07:p133; ch-07:p135; ch-07:p136; ch-07:p137" }
      - { fact: "the boat came from the spring: 'The whole spring knows you came on a boat.' She traces it to Valens's lie at the kiln ('She came off a ship'), carried down 'with the charcoal' and round the spring until it reached Kallia 'with a city tied onto it'", learned_chapter: 7, method: "inferred", note: "she heard Valens invent it (ch-06:p319); the route through the spring is her inference; Syracuse is Kallia's addition", source: "ch-07:p139; ch-07:p140" }
      - { fact: "the exact register line: 'Maira, daughter of Aimilios, of Syrakousai; free; kinswoman of Kallia, of her house and in her keeping.'", learned_chapter: 7, method: "witnessed", note: "read upside down as the stylus finished it", source: "ch-07:p151; ch-07:p171; ch-07:p172" }
      - { fact: "Sosandros hears her accent as Sicilian ('They all talk like that over there') and takes 'Aimilios' for a Roman name ('A Roman.'); Kallia: 'Half Syracuse is Roman.'", learned_chapter: 7, method: "witnessed", source: "ch-07:p160; ch-07:p164; ch-07:p165" }
      - { fact: "Maira is an old name: one of the Nereids in Homer, who rose from the water to mourn with Achilles' mother ('a Nereid or a star with four legs'), and a dog who found her master's body and 'was put into the sky for it'", learned_chapter: 0, method: "prior_knowledge", note: "her reflection as the clerk writes MAIRA", source: "ch-07:p161" }
      - { fact: "the women go up Parnassus at midwinter for Dionysos, every other winter, and this is the winter: 'Onto the plain. In the snow, at night, with torches, and a skin of wine for every three of you, and no man past the last house'. She is to come, with rags bound over her boots and the girl's himation", learned_chapter: 7, method: "told_by:kallia", source: "ch-07:p186; ch-07:p189; ch-07:p191; ch-07:p193" }
      - { fact: "QUESTION (her own, closing the chapter): how far is it, at night, on foot, from wherever the women dance to the cave? In November the gray mule took 'the better part of a morning' from the cliff top to the cave", learned_chapter: 7, method: "inferred", note: "not stated as a plan; in the outline's Ch.8 beat 3 she slips away to the cave", source: "ch-07:p194" }
      - { fact: "BELIEF (Ch.6, before the test, in English): if the cave is open 'today' she will walk down to the hotel on the main street in Delphi, shower, take the first bus and the first plane, call Gloria collect from Kennedy and take the train home to Philadelphia. That is, an open crack would put her back in her own time near Delphi. 'I have no idea what happens if it's shut.'", learned_chapter: 6, method: "inferred", note: "her expectation only; the plan's rule is that doors do not deliver to matching dates", source: "ch-06:p164" }
      - { fact: "consulting the Oracle needs the pelanos fee, a goat, a Delphian sponsor and a man to ask; women do not go in", learned_chapter: 9, method: "discovered", source: "outline:ch-09" }
      - { fact: "a runaway Thracian, scarred, 'answering to Lupus', is claimed as property of the household of Q. Arrius Celer (reward notice from Corinth)", learned_chapter: 9, method: "discovered", source: "outline:ch-09" }
      - { fact: "Valens is the man on the notice (she watches him read it and walk away)", learned_chapter: 9, method: "inferred", source: "outline:ch-09" }
      - { fact: "Ariston is alive, married in Emesa, a child coming, not coming home", learned_chapter: 10, method: "discovered", note: "she reads the letter aloud", source: "outline:ch-10" }
      - { fact: "Valens reads but pretends he can't; he bought Felix off a slaver and freed him with no paperwork", learned_chapter: 11, method: "discovered", source: "outline:ch-11" }
      - { fact: "Valens's history: the rudis, Nero's games at Corinth, Plautia, Celer's dowry frame; Celer wants him dead (the dowry suit)", learned_chapter: 12, method: "told_by:valens", source: "outline:ch-12" }
      - { fact: "how Valens knows about the suit: last autumn (AD 70) Plautia's brother's freedman found him at Kirrha harbor and asked him to testify; he refused; the reward notice went up within the month — so Celer wants a dead witness", learned_chapter: 12, method: "told_by:valens", revised: "2026-10-18", source: "outline:ch-12; foundation:§3; STATE:ARCH-15" }
      - { fact: "the Oracle's public answer: 'the road home lies under the mountain of vines by the western sea, where the dead go out of the city, at the door painted on a dead man's house' (two markers: the necropolis + a painted door on a tomb)", learned_chapter: 13, method: "told_by:valens", note: "his word-for-word repetition at Kallia's lodging; rendered once", revised: "2026-10-18", source: "outline:ch-13; STATE:ARCH-4" }
      - { fact: "the door home is at POMPEII", learned_chapter: 13, method: "told_by:theano", note: "in person, off duty, at Theano's house (sent for by a temple slave); a widow talking to a woman, not an oracular response", revised: "2026-10-18", source: "outline:ch-13; STATE:ARCH-4 (revised)" }
      - { fact: "the WHEN is withheld: 'not hers to give, or not given'", learned_chapter: 13, method: "told_by:theano", source: "outline:ch-13" }
      - { fact: "Plautia was never Valens's lover", learned_chapter: 16, method: "inferred", note: "from watching, not asking", source: "outline:ch-16" }
      - { fact: "Celer kept Plautia's son Marcus; the archive copy of Valens's manumission is in the provincial record office under Celer's influence", learned_chapter: 16, method: "told_by:plautia", source: "outline:ch-16" }
      - { fact: "the door is a small freedman's tomb with a painted false door outside the Nuceria Gate; faintly cool on a warm spring afternoon; dormant", learned_chapter: 19, method: "discovered", note: "found after a short search: Herculaneum Gate road and Stabian Gate tombs on her first free afternoon, the Nuceria Gate the next afternoon; the god's 'door painted on a dead man's house' lets her know it at once", revised: "2026-10-18", source: "outline:ch-19; foundation:§11.3" }
      - { fact: "Valens is summoned to testify in Rome in spring (dowry suit)", learned_chapter: 21, method: "told_by:plautias-brothers-freedman", note: "the brother's summons, brought by the freedman to Grata's counter by name; the address came via Plautia (Valens sent word summer AD 72)", revised: "2026-10-18", source: "outline:ch-21" }
      - { fact: "a Chaldean in Puteoli 'talks gibberish to himself'", learned_chapter: 24, method: "told_by:gratas-husband", source: "outline:ch-24" }
      - { fact: "Augurinus is August Fenn, alive, marooned since AD 41", learned_chapter: 25, method: "discovered", source: "outline:ch-25" }
      - { fact: "Fenn's history: 1968 crossing, landed AD 41, thirty-four years; doors 'breathe with the earth'; the 62 quake opened Pompeii's door for part of one night; he was down with fever in Misenum and three days later heard a tavern story about a tomb whose painted door 'breathed cold' — which is how he found the door, already shut", learned_chapter: 25, method: "told_by:august-fenn", revised: "2026-10-18", source: "outline:ch-25; foundation:§3" }
      - { fact: "the law in Fenn's words: the doors are one door with many mouths, so 'it' takes back the one it brought — the cave brought her, so Pompeii's mouth will take her", learned_chapter: 25, method: "told_by:august-fenn", note: "a promise; allowlisted phrase use 1/3; 'one door with many mouths' worded once", revised: "2026-10-18", source: "outline:ch-25; foundation:§4d; STATE:ARCH-16" }
      - { fact: "an opening is brief: hours at most, never days", learned_chapter: 25, method: "told_by:august-fenn", revised: "2026-10-18", source: "outline:ch-25; foundation:§9" }
      - { fact: "whether the door would take others is UNKNOWN (Fenn has always been alone)", learned_chapter: 25, method: "told_by:august-fenn", source: "outline:ch-25" }
      - { fact: "the WHEN: late summer, AD 79 (be at the tomb the night after the mountain opens)", learned_chapter: 25, method: "told_by:august-fenn", note: "she rejects it (Ch.25-35); accepted Ch.36", revised: "2026-10-18", source: "outline:ch-25" }
      - { fact: "Fenn's first two dates for the door's reopening (71, then 73) came from the tremor rhythm alone and failed: three nights at the tomb each time; after 73 he rebuilt the tables around 79, which he knows from school is Pompeii's year", learned_chapter: 25, method: "told_by:august-fenn", note: "her fig leaf: wrong twice, and the third date built around the history-book year", revised: "2026-10-18", source: "outline:ch-25; foundation:§3; STATE:ARCH-16" }
      - { fact: "in the autumn of 73 she was living a mile from where Fenn sat at the tomb", learned_chapter: 25, method: "inferred", note: "FLEX", revised: "2026-10-18", source: "outline:ch-25" }
      - { fact: "Fenn understood from 'estate sale in Chestnut Hill' that his sister is dead; he did not ask whose sale; he refuses the notebook ('Keep it. I know what's in it.')", learned_chapter: 25, method: "witnessed", note: "she does not say the name, then or ever, to him", revised: "2026-10-18", source: "outline:ch-25; STATE:ARCH-17" }
      - { fact: "Fenn left his sister a note on the hall table (unnamed in the letter)", learned_chapter: 26, method: "told_by:august-fenn", note: "letter", source: "outline:ch-26" }
      - { fact: "doors can die (the Cumae door is dead)", learned_chapter: 27, method: "witnessed", source: "outline:ch-27" }
      - { fact: "Fenn left his coat at the cave mouth in 1968", learned_chapter: 27, method: "told_by:august-fenn", source: "outline:ch-27" }
      - { fact: "Felix has sworn himself to the gladiator school as auctoratus", learned_chapter: 28, method: "told_by:valens", note: "news waiting on return from Cumae (Ch.27 end)", source: "outline:ch-27; outline:ch-28" }
      - { fact: "the tremor did not open the door (the same faint coolness as the day she found it, under sun-warmed plaster; no colder)", learned_chapter: 30, method: "discovered", revised: "2026-10-18", source: "outline:ch-30" }
      - { fact: "Valens followed her to the tomb and saw her hand on the painted door; he asked nothing", learned_chapter: 30, method: "witnessed", revised: "2026-10-18", source: "outline:ch-30" }
      - { fact: "Fenn still does not know whether the door would take others; has never seen anyone try; would like to see it", learned_chapter: 33, method: "told_by:august-fenn", note: "in Greek, with Valens present; she steers away from the date", revised: "2026-10-18", source: "outline:ch-33" }
      - { fact: "Fenn's sister's name is spoken by him for the first time (after reading his own 1968 front pages)", learned_chapter: 35, method: "witnessed", revised: "2026-10-18", source: "outline:ch-35" }
      - { fact: "Vespasian died 23 June 79; Titus is emperor", learned_chapter: 36, method: "discovered", note: "news in the streets since late June; the early-July posted notice is what makes her sit down", revised: "2026-10-18", source: "outline:ch-36" }
      - { fact: "Fenn's tables and her tremor notes (kept independently since 72 in the back pages of his notebook) agree: the door opens in the night after the mountain opens", learned_chapter: 36, method: "discovered", note: "she copies his key figures into the notebook beside hers", revised: "2026-10-18", source: "outline:ch-36" }
      - { fact: "the plan, locked: stay for the door; the daylight hours after the mountain opens go to the boat (all by sea if it can, the door let go); if the sea refuses, the door at night", learned_chapter: 37, method: "told_by:valens", note: "Valens's one condition; agreed between them", revised: "2026-10-18", source: "outline:ch-37; STATE:ARCH-18" }
      - { fact: "the backup boat cannot land", learned_chapter: 40, method: "witnessed", source: "outline:ch-40" }
      - { fact: "the door opens before dawn 25 Aug; it takes her; Valens, Lucius and Aelia meet plaster (no one native to its side)", learned_chapter: 42, method: "witnessed", source: "outline:ch-42" }
    knowledge_absent_ch3: ["the year (plan: AD 70; nothing on the page tells her)", "that she has crossed in time or that a door exists: no conclusion is drawn on the page (CH3-7)", "whether the road, the huts, the church or the ski lifts are still on the plateau (not looked at on the page; the ski lifts are on the page at ch-03:p5)", "that the cold she felt at the crack is not weather (her stated belief before it came, p67)"]
    knowledge_absent_ch4: ["the YEAR (must stay unknown until Ch.5; she gets archon Kleodamos, month Boathoos and 'Késar … En Rómi', none of which dates it for her, ch-04:p22; ch-04:p24; ch-04:p25; ch-04:p64-p66)", "WHICH Kaisar (unanswered, ch-04:p65; ch-04:p66)", "the goat-boy's name (asked; he answers with nymphē for her, ch-04:p79-p83)", "what 'nymphē' means to him (not glossed on the page)", "whether Boathoos lines up with her 'October' (not stated)", "any named door or crossing (CH3-7)"]
    knowledge_absent_ch5: ["AD 79, Vesuvius, Pompeii: not thought of on the page (outline rule kept)", "what the pierced clay discs are (ch-05:p23)", "which treasury is the Athenians' (ch-05:p65)", "whether the door/crack will open again (her plan rests on 'it might come again', ch-05:p136)", "Valens (not met; planned Ch.6)", "Kallia's widowhood and her son (not on the page in Ch.5)", "the word Kallia uses for her status; her own legal position is shown only by 'Whose are you?' / 'Whose is she?' (ch-05:p76; ch-05:p173)", "the date in the Delphic calendar (the sacrifice is 'the fourth day from now'; no month is named in Ch.5)"]
    knowledge_absent_ch6: ["AD 79, Vesuvius, Pompeii: not thought of on the page (outline rule kept)", "the month by name (no 'November' on the page) and the Delphic date", "Valens's past: where he is from ('North.'), where he learned Latin ('On the road.'), the scar's origin, the arena, Celer (none on the page)", "why Valens watches the road (she is told only 'Somebody for you')", "what Kallia's 'Letters.' means (her son is not mentioned on the page)", "whether the crack opened unseen in the cold (her own limit, p2), or whether it will ever open again", "the coin Valens prices his wood in ('Five the load'; the unit is not named)", "the clock time: from the evening before the climb she has no watch"]
    knowledge_absent_ch7: ["AD 79, Vesuvius, Pompeii: not thought of on the page (outline rule kept)", "whose room is swept, and why ('It's swept.'): no son is mentioned", "the name of Kallia's husband's brother, or whether he existed (Kallia talks past the question, ch-07:p136-p137)", "Kallia's husband's name", "the girl's name", "whether the crack will open at midwinter (the closing question is about distance, not success)", "the clock hour (no watch since November, ch-07:p107)", "the Thyiades by that name (Kallia says 'The god's women. Dionysos's.')"]
    arc_waypoints:
      - { chapter: 1, waypoint: "leaves her father's memorial to look at antiques (the failure); buys the chart; plays his greeting three times, ejects the tape rather than re-record it; winds and wears his watch", source: "ch-01:p1; ch-01:p116; ch-01:p181; ch-01:p184; ch-01:p186; ch-01:p188; ch-01:p191" }
      - { chapter: 2, waypoint: "reads Fenn's notebook in rations against her days; makes a lamp's seam invisible; laughs at the dead man's paperwork; signs as heir; leaves her father's notebooks shut; decides while flossing (Tue 5 May) and books Athens for Tue 19 May; the watch made to fit; packs (the chart stays)", source: "ch-02:p5; ch-02:p9; ch-02:p31; ch-02:p44; ch-02:p45; ch-02:p46; ch-02:p50; ch-02:p52; ch-02:p63; ch-02:p67" }
      - { chapter: 3, waypoint: "climbs to the Corycian Cave with her bag 'however long it takes'; pockets an ancient knucklebone against her own procedure; waits in the dark; at the cold she goes 'in properly' through the crack, blushes, backs out, and steps out of the mouth into a changed light (1998 → autumn, year unknown to her; plan AD 70)", source: "ch-03:p21; ch-03:p58; ch-03:p63; ch-03:p71; ch-03:p73; ch-03:p76; ch-03:p84" }
      - { chapter: 4, waypoint: "survival before meaning: her book Greek fails against a goat-boy's speech; the hunger floors her; she trades a granola bar and its foil wrapper for cheese and bread; she is pointed down to Delphi and named 'nymphē'. She does not learn the year", source: "ch-04:p11; ch-04:p36; ch-04:p51; ch-04:p58; ch-04:p75; ch-04:p83" }
      - { chapter: 5, waypoint: "walks down to Delphi and works for her bread; finds the sanctuary whole, painted and 'ugly', and reads the looted Kroton base closely (the 'first time I had stood where the taking happened' line is cut in the author fixes); is beaten off the temple steps; dates the year from the herald (autumn AD 70; Vespasian; 1,928 years); switches to English after the guide mocks her Attic (no Greek from her afterwards; CH5-6 narrowed); is taken in by Kallia as a pair of hands; means to go back up to the crack in the morning", source: "ch-05:p15; ch-05:p42; ch-05:p51; ch-05:p63; ch-05:p69; ch-05:p70; ch-05:p86; ch-05:p108; ch-05:p109; ch-05:p136; ch-05:p177; ch-05:p197" }
      - { chapter: 6, waypoint: "the first hope closed: after a month of Kallia's work she breaks her Greek silence to hire a muleteer and pays him with her father's watch. In snow the crack gives nothing. She pleads, hits the rock and makes a wordless noise; he laughs, gives her bread, keeps the watch, and tells her she never had one. She comes down with the duffel and Kallia's shovel to the first houses of Delphi", source: "ch-06:p39; ch-06:p78; ch-06:p143; ch-06:p244; ch-06:p248; ch-06:p249; ch-06:p252; ch-06:p255; ch-06:p301; ch-06:p340; ch-06:p341" }
      - { chapter: 7, waypoint: "becomes Kallia's: dressed in a runaway's clothes, taught to walk, sit and look at the ground, silent in public for a month, and written onto the tribute list as 'Maira, daughter of Aimilios, of Syrakousai; free; kinswoman of Kallia, of her house and in her keeping', which she takes as relief. At the end she is invited up the mountain at midwinter and is measuring the way to the cave", source: "ch-07:p10; ch-07:p15; ch-07:p71; ch-07:p172; ch-07:p174; ch-07:p189; ch-07:p194" }
      - { chapter: 13, waypoint: "learns WHERE: Pompeii", source: "outline:ch-13" }
      - { chapter: 14, waypoint: "plan: reach Pompeii, find the door, be gone long before the mountain", source: "outline:ch-14" }
      - { chapter: 15, waypoint: "tells Valens the truth; first union", source: "outline:ch-15" }
      - { chapter: 18, waypoint: "married at Lechaion", source: "outline:ch-18" }
      - { chapter: "19-31", waypoint: "reluctant resident", source: "foundation:§3" }
      - { chapter: 20, waypoint: "leaves a seam visible on purpose", source: "outline:ch-20" }
      - { chapter: 25, waypoint: "told the WHEN; refuses it", source: "outline:ch-25" }
      - { chapter: "32-41", waypoint: "would-be rescuer: wants the door for the children", source: "foundation:§3" }
      - { chapter: 36, waypoint: "the arithmetic accepted; first feeling calm", source: "outline:ch-36" }
      - { chapter: 37, waypoint: "tells Valens everything", source: "outline:ch-37" }
      - { chapter: 43, waypoint: "stays: sends tape, film, Fenn's notebook, his Zippo and dime through; keeps the watch; lets the seam close", source: "outline:ch-43" }
    arc_notes: "Visitor → reluctant resident → would-be rescuer → the one who stays (active choice)."

  valens:
    canonical_name: "Valens"
    aliases:
      - { alias: "Lupus", note: "former arena name; on the Celer reward notice; used by Celer's man and by Celer", source: "STATE:resolved_author_decisions; outline:ch-09; outline:ch-12; outline:ch-17" }
      - { alias: "Tata", note: "to Lucius and Aelia", source: "character-bible.md#lucius (voice)" }
    importance: major
    role: "love interest; muleteer; former murmillo; freedman"
    first_appearance: { chapter: 6, source: "ch-06:p5", note: "first line on the page: '\"Your fingers are white,\" Valens said.' (p5, the cave, present). In story order Mara first meets him in the backfill, bringing a string of mules loaded with split oak up Kallia's lane (p36). His name reaches her from Kallia, 'Not in my court, Valens' (p48). 'Lupus' is not on the page. The Ch.9 notice describes him (plan)" }
    physical:
      age: { value: 32, at_chapter: 6, birth_year: 38, era: "AD", note: "'about 32 in AD 70'; ~41 at the eruption. NOT stated on the page in Ch.6", source: "foundation:§3; foundation:§10" }
      build: { value: "big, unhurried", source: "foundation:§3", ch6_page: "big hands: 'His thumb covered the crown entirely, and the rest of his hand closed round the case'; the Seiko's band 'would not go halfway' round his wrist", ch6_source: "ch-06:p131; ch-06:p142", ch6_cycle1: "after Ch.6 polish cycle 1 the page reads 'He leaned on her shoulder, and she had to brace a foot under his weight.' His size, shown through the mule. The cycle report's second clause, 'his hands were older than the rest of him', is NOT on the page (cut after the report; CH6-9). His age is still not stated", ch6_cycle1_source: "ch-06:p44" }
      distinguishing:
        - { value: "scarred (people stop asking where the scars came from)", source: "foundation:§3", ch6_page: "ON THE PAGE: 'A scar the length of my finger ran over the back of his right hand. Whoever closed it had been in a hurry and set the stitches too far apart, and it had healed in a ladder, every rung raised and white.' (Mara's eye; no origin given)", ch6_source: "ch-06:p42" }
        - { value: "flogged back (from the 69 frame)", source: "foundation:§3; outline:ch-23" }
        - { value: "thumb too big for the watch crown", source: "ch-06:p131", note: "CONFIRMED: 'His thumb covered the crown entirely' (was outline:ch-06)" }
        - { value: "excellent teeth", source: "outline:ch-15" }
      clothing_ch6: { value: "a tunic (the bread carried 'inside his clothes, against his skin', taken from 'the front of his tunic'); boots; a pouch at his belt with a drawstring (the watch); a bag (the crust for Pan)", source: "ch-06:p12; ch-06:p142; ch-06:p198; ch-06:p225; ch-06:p255; ch-06:p256" }
      clothing_ch7: { value: "boots only, as Mara sees him with her eyes down: 'rawhide, laced to the shin, one lace broken and knotted where it had broken, the knot standing up like a little fist'. No face, hands or scar on the page", source: "ch-07:p96" }
      age_on_page: { value: "not stated in Ch.6", source: "ch-06 (absent)" }
    traits:
      - { trait: "Thracian-born; taken as a boy; trained at a gladiatorial school; fought as a murmillo at Corinth", source: "foundation:§3", mutable: false }
      - { trait: "won the rudis and his freedom at the games for Nero's Greek tour (AD 66-67)", source: "foundation:§3; outline:ch-12", mutable: false }
      - { trait: "manners too good for a muleteer; a soldier's Greek, flatly literal", source: "foundation:§3", mutable: false }
      - { trait: "reads but pretends he can't", source: "outline:ch-11", mutable: true }
      - { trait: "cannot bear to see an animal hurt; hands the chicken to someone else", source: "foundation:§3", mutable: false }
      - { trait: "irrelevant obsession: figs (Ch.11, 20, 34; potted fig tree moved twice); spent after Ch.34", source: "foundation:§3; outline:ch-38", mutable: false }
      - { trait: "cognitive distortion: mind-reading threat (Ch.6, 11, 19, 21, 28, 37) — e.g. sure the Puteoli harbor clerk marked him (short-sighted); sure Grata dislikes him (she fancies him)", source: "foundation:§3; outline:checks#4", mutable: true }
      - { trait: "unprompted memory: onions drying under Thracian eaves (Ch.12, 22, 23, 32, 41); never explained", source: "foundation:§3; outline:checks#4", mutable: false }
      - trait: "failed emotional management: weeps at a mime farce about a cuckolded baker on a street stage (Ch.29); Lucius (~2½, on his shoulders) pushes bread at his mouth to make it stop ('mortified' cut)"
        source: "outline:ch-29; foundation:§3"
        mutable: false
        resolved_from_conflict: true
        resolved_date: "2026-10-18"
        resolution_note: "C3: foundation now says 'a street stage' (was 'Pompeii's small theatre'); WARN-015 also applied"
      - { trait: "evasion: never speaks of the men he killed; never says he is afraid; says 'love' once only, Ch.43", source: "foundation:§3; outline:ch-43", mutable: true }
      - { trait: "refuses the arena for himself (Ch.21); never steps into the arena (Ch.28)", source: "outline:ch-21; outline:ch-28", mutable: false }
      # --- Ch.6 (prose) ---
      - { trait: "his Greek, to Mara, is 'as foreign as mine … slowly and flatly, every ending in its place, a man setting things down one by one where he could find them later'. Kallia haggles at him 'in Phocian too fast for me to follow, and he answered her a word at a time'", source: "ch-06:p67; ch-06:p81", mutable: false }
      - { trait: "speaks Latin to his mules, low and level ('Ambula, asini filia.'); claims 'They came from Corinth. They don't know any Greek … These know Latin'; talks to both mules in Latin on the descent 'about nothing I could hear'", source: "ch-06:p44; ch-06:p200; ch-06:p203; ch-06:p327", mutable: false }
      - { trait: "attention to footing: walks Kallia's iced lane alone before bringing the string up, asks for 'Ashes. For the ice. Before they come up.' and throws them 'in low, flat fans, so that they fell where a hoof would come down and nowhere else'; brings the mules up singly; binds sacking on every hoof where the ice begins, twine pulled tight with his teeth, and rebinds fresh at the kiln; 'Step where she steps. Not where I step … She looks where she puts her feet.'; reads the buried ground by the walls and thorn tops; calls 'Ditch.'; tests the crust with his heel; 'Keep to the wall. The edge has gone along this bit.'", source: "ch-06:p36; ch-06:p41; ch-06:p42; ch-06:p44; ch-06:p172; ch-06:p173; ch-06:p175; ch-06:p191; ch-06:p202; ch-06:p216; ch-06:p315; ch-06:p333", mutable: false }
      - { trait: "weather as plain statement: 'Before light, if the sky stays clear. If it snows in the night, we don't go.'; 'There's snow coming over the ridge … We're off the stair before it comes, or we're up here till morning'; 'Snow by afternoon.'", source: "ch-06:p20; ch-06:p145; ch-06:p220", mutable: false }
      - { trait: "mind-reading, wrong in mundane ways (the planned Ch.6 instance): watches a man with a donkey through several turns ('Somebody for you'; it is a charcoal burner going to his kiln); takes her digging for buried silver; reads her as a runaway from 'a big house. Corinth, or Patrae' whose 'father or … husband' has 'the money to look'", source: "ch-06:p182; ch-06:p183; ch-06:p185; ch-06:p187; ch-06:p264; ch-06:p266; ch-06:p328", mutable: true }
      - { trait: "keeps a bargain to the letter: 'I'm paid for the down as well as the up'; takes the fee in advance ('Paid now. Not up there. Now.'); 'I take you to the cave and I bring you down. Nowhere else.'; 'Two more pines after this one … Then down, whatever your hole's doing'; refuses to sell the watch back ('You paid it to go up. You went up.'); gives Kallia one coin back after the haggle", source: "ch-06:p27; ch-06:p35; ch-06:p67; ch-06:p143; ch-06:p145; ch-06:p301", mutable: false }
      - { trait: "careful with a small object: examines the watch back first and the band 'where the three links had come out', watches the seconds hand make one full circuit 'and his face stayed as it was'; winds it BACKWARD 'with great care, slowly', stopping to listen to the click 'as if the click were what it was for', until told; then forward until 'the crown pushed back against his thumb when the spring was full, and he felt it and stopped'; 'I won't drop it'; shows her the dial lying on his palm without handing it over (twice)", source: "ch-06:p12; ch-06:p123; ch-06:p131; ch-06:p133; ch-06:p137; ch-06:p218; ch-06:p247; ch-06:p248", mutable: false }
      - { trait: "practical questions only, about plans and objects: 'How long does it go?' / 'And if a man forgets?' / 'What's in it that goes?' / 'Who makes them?' / 'For hire?' / 'What stops it rocking?'; of her: 'Can you sit a mule?' / 'Where do you sleep?' / 'Dry?' / 'Does she hit you?'. Asks why of her plan ('Why tomorrow?'), never of a feeling", source: "ch-06:p100; ch-06:p138; ch-06:p140; ch-06:p147; ch-06:p206; ch-06:p212; ch-06:p214; ch-06:p216; ch-06:p287; ch-06:p289; ch-06:p291", mutable: false }
      - { trait: "pays Pan: breaks a corner off a crust and leaves it on the cave ledge ('It's his house.' / 'I pay him.' / 'It's what I do.')", source: "ch-06:p225; ch-06:p226; ch-06:p228; ch-06:p230", mutable: true }
      - { trait: "does not admit to reading: asks what the cut letters say and answers her 'To the Nymphs. To Pan.' with 'That's what the goat boys say it says'", source: "ch-06:p222; ch-06:p223; ch-06:p224", mutable: true }
      - { trait: "evasions on the page: where from ('North.'); where he learned Latin ('On the road.'); stops her story ('If I told you where I came from—' / 'Don't.'); has not asked her name ('You have not asked my name either.' / 'No.')", source: "ch-06:p205; ch-06:p330; ch-06:p331; ch-06:p334; ch-06:p335; ch-06:p337", mutable: true }
      - { trait: "the laugh, once: at her blow and wordless noise in the cave he laughs, 'short and surprised … a laugh with nobody at the end of it', says 'Good.', and gives her half a round of barley flatbread carried warm inside his tunic all the climb; 'Eat the crumbs. You'll want them on the stair.'", source: "ch-06:p252; ch-06:p253; ch-06:p254; ch-06:p255; ch-06:p256; ch-06:p272", mutable: false }
      - { trait: "lies smoothly for her to the charcoal burner ('She's the widow Kallia's … Down by the spring.' / 'Since the olives.' / 'She came off a ship.' / 'She hit Pan.') and then erases the trip: 'Men will come asking. You went up by yourself. You never had a watch.'", source: "ch-06:p315; ch-06:p317; ch-06:p319; ch-06:p323; ch-06:p341", mutable: true }
      - { trait: "unhurried with fire: strikes steel on flint into dried bracket fungus 'until a spark caught' ('Can you not go faster?' / 'No.'); lights each pine from the stub of the last", source: "ch-06:p7; ch-06:p234; ch-06:p235; ch-06:p236; ch-06:p273", mutable: false }
      - { trait: "no comparison or simile in his speech on the page (character-bible guarantee; checked against Ch.6)", source: "ch-06 (all Valens lines); character-bible.md#valens-lupus", mutable: false }
      # --- Ch.7 (prose) ---
      - { trait: "pursues what he is owed without heat: comes to the gate with the mules for the fifth coin ('It burned.' / 'Oak doesn't spit.') and leaves without it", source: "ch-07:p96; ch-07:p97; ch-07:p99; ch-07:p106", mutable: true }
      - { trait: "notices how she has changed and contradicts the town's word for her in one syllable: 'She's taught you to walk.' / 'You've stopped talking.' / to 'She's simple': 'No.'", source: "ch-07:p102; ch-07:p104; ch-07:p105; ch-07:p106", mutable: true }
      - { trait: "no simile or comparison in his Ch.7 lines (checked)", source: "ch-07:p97; ch-07:p99; ch-07:p102; ch-07:p104; ch-07:p106", mutable: false }
    legal_status:
      - { value: "freedman; his copy of the record seized (69); Celer contests the manumission as never registered before a magistrate and claims to have bought him from the lanista first (the 'property' basis)", source: "foundation:§3" }
      - { value: "claimed as runaway property of Celer's household (notice)", source: "outline:ch-09" }
      - { value: "manumission record recovered from the Corinth record office (bronze-and-wax diptych); it proves the registration", source: "outline:ch-17; foundation:§3" }
      - { value: "papers accepted at Puteoli", source: "outline:ch-19" }
      - { value: "vindicated as witness; says his own name in the Basilica Julia", source: "outline:ch-22" }
    lie: { value: "Whoever is close enough to know you is close enough to sell you. Be useful; be nobody.", source: "foundation:§3" }
    want: { value: "to be left alone; his freedom on paper; a small life no one can take", source: "foundation:§3" }
    need: { value: "to be known and believed, publicly and privately", source: "foundation:§3" }
    voice_markers:
      ref: "character-bible.md#valens-lupus"
    relationships:
      mara-reyes: { type: "hired hauler (Ch.6) → employer (Ch.11) → lover (Ch.15) → husband (Ch.18)", established: "ch-06:p36 (the lane; the deal at dusk, p78-p145)", current_status: "Ch.6: took her up to the Corycian cave in snow and down again for her father's Seiko, which he keeps. Has not asked her name. Reads her as a runaway from a big house. Told her to say she went up alone and never had a watch. Planned: married", source: "ch-06:p143; ch-06:p301; ch-06:p328; ch-06:p335; ch-06:p341", ch7_status: "Ch.7: one visit to Kallia's gate, halfway through her month of public silence. He speaks to her ('She's taught you to walk.' / 'You've stopped talking.'); she keeps her eyes on his boots and does not answer. He answers Kallia's 'She's simple' with 'No.'", ch7_source: "ch-07:p96; ch-07:p102; ch-07:p103; ch-07:p104; ch-07:p106" }
      kallia: { type: "wood supplier to her lodging", established: "ch-06:p36", current_status: "Ch.6: delivers split oak; 'The last lot' (pine) spat a coal on a Theban's cloak; the brown mule ate her pomegranate 'to the height of her head last winter'; haggles 5 → 4 now and the fifth when it burns without spitting, and gives one coin back; she asks him about ships and letters. She calls him Valens", source: "ch-06:p48; ch-06:p50; ch-06:p51; ch-06:p56; ch-06:p57; ch-06:p63; ch-06:p66; ch-06:p67; ch-06:p68", ch7_status: "Ch.7: she withholds the fifth coin: 'It spat.' / 'Twice. Once on my good hearthstone and once in the lentils. When it's done a month without spitting, you'll have your coin. And keep the gray's teeth off my tree while you wait.' He leaves without it", ch7_source: "ch-07:p96; ch-07:p98; ch-07:p100; ch-07:p106" }
      charcoal-burner-parnassus: { type: "acquaintance on the mountain ('Mule-man!')", established: "ch-06:p308", current_status: "Ch.6: Valens warms the mules at his kiln and lies to him about Mara", source: "ch-06:p308; ch-06:p315" }
      man-from-philadelphia-in-asia: { type: "acquaintance ('A man I knew came from there')", established: "ch-06:p167", current_status: "mention only" }
      felix: { type: "bought him off a slaver at Kirrha (~AD 70) and freed him informally; surrogate father", established: "outline:ch-11", current_status: "planned" }
      plautia: { type: "former sworn bodyguard; falsely accused as her lover", established: "foundation:§3", current_status: "never lovers; allies in the suit; he sends her word of the Pompeii lodging, summer AD 72 (outline:ch-21)" }
      plautias-brothers-freedman: { type: "messenger for the dowry suit", established: "outline:ch-12 (autumn AD 70, Kirrha harbor, told)", current_status: "brings the Rome summons to Grata's counter (Ch.21)" }
      quintus-arrius-celer: { type: "former employer; framer", established: "foundation:§3", current_status: "settled by law, Ch.22" }
      august-fenn: { type: "friendship of two exiles", established: "outline:ch-25", current_status: "friends by Ch.29; carries Fenn to the window Ch.35" }
      lucius: { type: "father", established: "outline:ch-24", current_status: "planned" }
      aelia: { type: "father", established: "outline:ch-26", current_status: "planned" }
      pomponia-grata: { type: "landlord's family / neighbor; he wrongly thinks she dislikes him", established: "outline:ch-19", current_status: "planned" }
    possessions:
      - { item: "mules-and-horses", acquired: "pre-story", status: "eleven mules, two horses (and a boy) on the Kirrha–Delphi road", source: "foundation:§3", ch6_page: "ON THE PAGE: 'a string of mules' with the split oak on wooden packsaddles, 'big, dark, dusty animals' (five, emptied in the lane: 'five empty mules'). By design they have NO names: 'the gray' (a she-mule; leads; Mara is towed up the stair by her tail and rides her on the plain; won't consider the ice until spoken to in Latin), 'the brown' (ate Kallia's pomegranate last winter; not on the climb) and 'a dun' (carries the duffel on the climb). From Corinth; spoken to in Latin. No horses, yard or boy on the page", ch6_source: "ch-06:p36; ch-06:p44; ch-06:p51; ch-06:p76; ch-06:p157; ch-06:p158; ch-06:p161; ch-06:p191; ch-06:p196; ch-06:p198; ch-06:p200" }
      - { item: "fathers-seiko-watch", acquired: "ch-06:p143 (payment from Mara for the climb, taken the evening before: 'Paid now. Not up there. Now.')", status: "Ch.6: wound backward and then forward to full by him that evening; kept in the drawstring pouch at his belt (the band will not go round his wrist); shown on his palm in the cave, never handed back; he will wind it 'Forward. Till it stops, and not past.' and denies it exists ('You never had a watch.'). Planned: kept wound seventeen months (Nov 70 → spring 72); returned Ch.18 running, set near noon by the shadow", source: "ch-06:p12; ch-06:p137; ch-06:p142; ch-06:p143; ch-06:p301; ch-06:p306; ch-06:p341" }
      - { item: "climbing gear (Ch.6)", status: "fodder sacks; a coil of rope; a bundle of pine splinters bound with withy (the 'pines', burned as torches one after another); sacking and twine for the hooves; steel, flint and dried bracket fungus; a bag with a crust; a round of barley flatbread carried inside his tunic; the barley bag (the mules come to it)", source: "ch-06:p157; ch-06:p172; ch-06:p198; ch-06:p225; ch-06:p234; ch-06:p255" }
      - { item: "manumission-record", acquired: "outline:ch-17", status: "used at Puteoli Ch.19" }
      - { item: "potted-fig-tree", acquired: "foundation:§3", status: "on the roof in Pompeii (Ch.20; he sleeps under it in the named frame); moved twice" }
