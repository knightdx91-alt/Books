    memorial: { when: "Saturday the fourteenth (March 1998), two o'clock", where: "university museum upper gallery", eulogist: "doug-fessler", note: "a priest gave a reading earlier (Gloria, p157); lilies from Mara's mother; three lemon cakes; slide carousel of his digs", source: "ch-01:p2; ch-01:p3; ch-01:p4; ch-01:p157; ch-01:p190" }
    possessions:
