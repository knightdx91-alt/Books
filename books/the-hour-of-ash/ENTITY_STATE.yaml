    knowledge:
      - { fact: "the scholion's text in English", learned_chapter: 0, method: "discovered", note: "1967; translated it", source: "ch-02:p1" }

  goat-boy-1968:
    canonical_name: "the boy with the goats (1968)"
    aliases: []
