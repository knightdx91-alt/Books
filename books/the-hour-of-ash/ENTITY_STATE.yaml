locations:

  philadelphia:
    canonical_name: "Philadelphia (1998)"
    era: "1998"
    aliases: []
    facts:
      - { fact: "modern frame city; Mara is American", source: "STATE:ARCH-1" }
      - { fact: "university museum: upper gallery (memorial reception); Mara's basement conservation lab", source: "ch-01:p2 (upper gallery); foundation:§3 (basement lab, not yet on the page)" }
      - { fact: "Pine Street's Antique Row: Irene Szabo's shop; sleet in March", source: "ch-01:p29; ch-01:p43" }
      - { fact: "Emilio's rowhouse: answering machine, nightstand (Seiko), shelf (Pentax), study (field notebooks); Mara waited at its window as a child", source: "ch-01:p179; ch-01:p183; ch-01:p206; ch-01:p208 (Pentax shelf is over the bedroom bureau); outline:ch-02 (study); foundation:§3" }
      - { fact: "Chestnut Hill: Margaret Fenn's estate sale", source: "ch-01:p96" }
      - { fact: "Chestnut Street: the Horn & Hardart automat (Fenn's memory)", source: "foundation:§3" }
      - { fact: "Fenn's 1968 hall table where he left Margaret a note", source: "outline:ch-26; outline:ch-35" }
      - { fact: "the Venetian chart stays pinned over Emilio's desk when Mara leaves", source: "outline:ch-02" }
      - { fact: "Ch.1 weather, Saturday 14 March 1998: sleet in the afternoon ('cold sand' in the collar); plain rain by nearly five and after dark", source: "ch-01:p29; ch-01:p35; ch-01:p152; ch-01:p179" }
      - { fact: "Spruce Street (cab found two blocks from the museum's loading dock); the cab crosses the river (water 'the color of an old nickel') to Pine Street at Tenth", source: "ch-01:p35; ch-01:p39; ch-01:p40" }
      - { fact: "Antique Row: three blocks of narrow fronts (a tall-case clock with a replaced finial; Staffordshire dogs badly restored); szabo-shop among them", source: "ch-01:p43" }
      - { fact: "a trolley runs back toward the museum; Mara walks down from Thirty-Third Street", source: "ch-01:p152" }
      - { fact: "a lawyer's office on Walnut Street holds Emilio's estate 'waiting for a form'", source: "ch-01:p132" }
      - { fact: "the Free Library of Philadelphia, Walnut Street West branch (Emilio's overdue book)", source: "ch-01:p186" }
      - { fact: "Chestnut Hill: Margaret Fenn's house, emptied for the estate sale last October; Bryn Mawr: where a decorator would hang the chart over a sofa", source: "ch-01:p96; ch-01:p125" }
      - { fact: "the Acme (supermarket): the memorial sheet cake; Szabo's paper sack", source: "ch-01:p2; ch-01:p149" }
      - { fact: "elsewhere mentioned in Ch.1: Jersey (mulch); Wildwood (a seafood restaurant with Fenn's diving helmet); Kennedy airport / Queens (Doug's lost duffel)", source: "ch-01:p38; ch-01:p117; ch-01:p21" }

  university-museum:
    canonical_name: "the university museum (Philadelphia)"
    era: "1998"
    aliases: ["the museum"]
    note: "not named on the page; organization entry philadelphia-university-museum"
    facts:
      - { fact: "upper gallery: emptied of cases for the memorial except a long bolted-down run of Coptic textiles; parquet floor; folding tables of food (baked ziti, arroz con pollo, a crockpot of meatballs, an Acme sheet cake piped with a trowel, three lemon cakes); Sterno under chafing dishes; a slide carousel on a screen borrowed from the classroom wing", source: "ch-01:p1; ch-01:p2" }
      - { fact: "coat rack on rollers and the guest-book table by the elevators", source: "ch-01:p29" }
      - { fact: "a door marked STAFF to the back stairs: poured concrete painted battleship gray, handrail wrapped in electrical tape; out to a loading dock with an overhang on the south side of the building", source: "ch-01:p29" }
      - { fact: "front steps (Mara returns by them, nearly five)", source: "ch-01:p152" }
    distances:
      - { to: "szabo-shop", value: "cab from Spruce Street over the river to Pine and Tenth; trolley back plus a walk down from Thirty-Third Street", source: "ch-01:p35; ch-01:p40; ch-01:p152" }

  szabo-shop:
    canonical_name: "I. Szabo · Maps · Prints · Small Antiques (Pine Street)"
    era: "1998"
    aliases: ["Szabo's shop"]
    facts:
      - { fact: "on Antique Row, Pine Street (Mara gets out at Tenth); window lettered in flaking gold 'I. SZABO · MAPS · PRINTS · SMALL ANTIQUES'; a stapled Chinese export platter on a wire stand in the window", source: "ch-01:p40; ch-01:p43" }
      - { fact: "door kept locked; buzzer and a speaker over the door; the door sticks ('Pull the door hard')", source: "ch-01:p44; ch-01:p151" }
      - { fact: "deep and narrow; smells of foxed paper and space-heater dust (orange bars by the counter); framed prints frame to frame (botanical plates; a Hogarth restrike at $40; the Battery in 1840; a 1796 map of Philadelphia with a coffee ring across Southwark); gray steel flat files at the back; glass counter; a small TV on a shelf; a mat at the door; a ledger; an old board cutter", source: "ch-01:p48; ch-01:p51; ch-01:p65; ch-01:p66; ch-01:p73; ch-01:p147" }
      - { fact: "a barber next door (Szabo's five-dollar bet)", source: "ch-01:p127" }

  emilio-rowhouse:
    canonical_name: "Emilio Reyes's rowhouse"
    era: "1998"
    aliases: ["the house", "the Reyes house"]
    facts:
      - { fact: "on a narrow street off Baltimore Avenue; fourth in a row of twelve; porch sags toward the middle 'like a hammock'; a front window with the radiator under it (child Mara knelt on the radiator cover to watch the corner for taxis); a humming streetlight in front", source: "ch-01:p179" }
      - { fact: "the key sticks unless the door is lifted by the knob", source: "ch-01:p179" }
      - { fact: "Ch.1 state: two months of mail on the hall floor; refrigerator stocked by neighbors (foil, Tupperware, Dorothy's Pyrex), eggs with a January date, a jar of pickles; Gloria's ziti added", source: "ch-01:p180; ch-01:p181" }
      - { fact: "kitchen: table (china cabinet once in the room where slides were shown), counter, wall phone, the answering machine on the counter, a window over the sink", source: "ch-01:p11; ch-01:p181; ch-01:p183; ch-01:p209" }
      - { fact: "upstairs bedroom: radiator turned down; bed made badly; nightstand (Seiko on a folded handkerchief); clock radio with red numbers; shelf over the bureau (Pentax, a Cypriot lamp with a chipped nozzle, bathtub-swollen paperbacks); a basement (the greeting mentions Christmas lights)", source: "ch-01:p197; ch-01:p206; ch-01:p207; ch-01:p208" }
      - { fact: "phone number: one Mara has known by hand since before she could spell; written on Szabo's check", source: "ch-01:p142" }
      - { fact: "someone besides Mara has a key (neighbors have been in)", source: "ch-01:p181" }

  nicosia:
    canonical_name: "Nicosia (1998)"
    era: "1998"
    aliases: []
    facts:
      - { fact: "home of the unnamed friend with Emilio's 1992 Kourion drawings; raining; 'the place by the walls'", source: "ch-01:p188; ch-01:p189" }

