    ch4_beat: { value: "the box is found by feel 'under the sweater, beside the sock'. 'The pouch was green foil and crackled when I tore it. Two bars were inside, as there always were.' She holds one up and taps his bag: 'This, for bread … Honey. It is food.' He sniffs it ('Ti esti?') and bites. It 'broke in his mouth with a crack and showered oats down his front'. He spits out every crumb, scrubs his tongue on his forearm ('Pheu! Ti esti touto? Pheu.'), hands back the rest and says 'Kopros'. She eats hers and then his, standing, and licks the honey off her thumb. The outline beat 'A granola bar split with the boy. He spits it out' is on the page", source: "ch-04:p43; ch-04:p44; ch-04:p45; ch-04:p46; ch-04:p47; ch-04:p49; ch-04:p50; outline:ch-04" }
