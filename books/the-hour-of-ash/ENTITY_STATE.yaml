# ENTITY_STATE.yaml — The Hour of Ash (run 2)
# Canonical entity state. Built from the PLAN only (pre-writing). BUILD (SEED) 2026-10-18, then
# UPDATE (plan re-sync) 2026-10-18 after the architect's patch pass on the outline audit.
# UPDATE (chapter 1, finalized draft: post-polish, post-disruption) 2026-10-18. Ch.1 facts now carry ch-01:pYY
# sources; prose-vs-plan departures are logged in meta.contradictions, never silently overwritten.
# UPDATE (chapter 2, final text: post-polish, post-disruption) 2026-10-18. Ch.2 facts carry ch-02:pYY (p1..p69);
# outline:ch-02 sources replaced where the prose confirms; departures logged as CH2-n in meta.contradictions.
# UPDATE (re-sync after editor passes) 2026-10-18: Ch.1 (gesture trims; 193 paragraphs) and Ch.2 (polish cycle 1; 69 paragraphs)
# re-read as they stand; every ch-01:pYY / ch-02:pYY re-anchored to the current files; trimmed facts removed, new facts added.
# Facts, not interpretation. Contradictions are flagged with `conflict` (flag: UNRESOLVED), never resolved here;
# a conflict is marked resolved only when the source documents themselves now carry one value.

