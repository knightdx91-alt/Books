      build: { value: "thin", source: "ch-05:p100; ch-07:p141" }
      at_work_ch7: { value: "head down over the wax books; a hot brick wrapped in a rag under his feet, which a boy whose only work it is carries to the brazier and back; he holds each wax leaf over the brazier until the black surface shines, then writes, and the letters come up 'pale in the dark wax where the bare wood showed through'", source: "ch-07:p141; ch-07:p143; ch-07:p151" }
    traits:
      - { trait: "corrects the herald: 'Autokratōr Kaisar Ouespasianos Sebastos. And for Titus Caesar his son.'; afterward 'pretended not to hear'", source: "ch-05:p100; ch-05:p116", mutable: false }
      # --- Ch.7 (prose) ---
      - { trait: "asks the form's questions in order: 'Who's in it?' / 'Bought, born in the house, or free?' / 'Kin?' / 'Resident since when? On what business?' / 'Name,' / 'Daughter of?' / 'And who answers for her? A free woman wants someone to answer for her.'", source: "ch-07:p143; ch-07:p146; ch-07:p148; ch-07:p152; ch-07:p154; ch-07:p162; ch-07:p166", mutable: false }
      - { trait: "corrects with the bare right word: 'Syrakousai,' for Kallia's 'Syracuse'. It is his second correction of that shape on the page (Ch.5: the emperor's titles)", source: "ch-05:p100; ch-07:p150", mutable: false }
      - { trait: "writes a name without asking how it is spelled: MAIRA, 'an alpha after the mu and then an iota after the alpha, without a pause and without a question, as easily as a man spelling a name he had known all his life'", source: "ch-07:p161", mutable: false }
      - { trait: "pleased with himself once: 'Sicilian … They all talk like that over there. I heard a Syracusan at the Pythian games once, and half the stand had to help him get a cup of water.'", source: "ch-07:p160", mutable: false }
      - { trait: "dry put-downs without looking up: to the father with the wall, 'Your wall has been coming down through three councils. It will stay up for one widow.'; 'Two obols, and don't tell me the god pays for wax.'; 'Next'", source: "ch-07:p156; ch-07:p173", mutable: false }
      - { trait: "objects to a woman answering for a woman ('A woman can't answer for—') and then writes Kallia down", source: "ch-07:p168; ch-07:p169; ch-07:p172", mutable: true }
      - { trait: "after Kallia's 'Half Syracuse is Roman', 'wrote that down as well, without comment'", source: "ch-07:p164; ch-07:p165; ch-07:p166", mutable: false }
    voice_markers:
      ref: "character-bible.md#sosandros"
    relationships:
      kallia: { type: "a householder on his list; they use each other's names ('Sosandros' / 'Kallia. The lodging over the spring.')", established: "ch-07:p142", current_status: "wrote her down as the woman in whose keeping Mara is", source: "ch-07:p142; ch-07:p143" }
      mara-reyes: { type: "registered her", established: "ch-07:p141", current_status: "she is on his list as Maira of Syrakousai" }
      clerks-boy: { type: "his boy (carries the brick)", established: "ch-07:p141" }
      boundary-wall-father: { type: "a householder whose boundary dispute has run 'through three councils'", established: "ch-07:p155", source: "ch-07:p155; ch-07:p156" }
    location_log:
      - { chapter: 5, location: "delphi-market-square", scene: "in a doorway on the square, correcting the herald", travel_noted: false, source: "ch-05:p100" }
      - { chapter: 7, location: "delphi-council-hall", scene: "the table at the end of the long hall beside the square; the tribute lists", travel_noted: false, source: "ch-07:p141" }
    knowledge:
      - { fact: "Kallia's household: Kallia; four Thebans 'till the thaw' (on the Boeotian list, not his); and Mara", learned_chapter: 7, method: "told_by:kallia", source: "ch-07:p143; ch-07:p144" }
      - { fact: "COVER (as told): Mara is free, Kallia's husband's brother's girl from Syracuse; her people died; she came on one of the last boats, after the vintage", learned_chapter: 7, method: "told_by:kallia", note: "not all of it went into the line (mara-reyes.legal_status)", source: "ch-07:p147; ch-07:p149; ch-07:p153" }
      - { fact: "her name ('Mara', which he writes Maira) and her father's ('Aimilios')", learned_chapter: 7, method: "told_by:mara-reyes", source: "ch-07:p158; ch-07:p161; ch-07:p163" }
      - { fact: "BELIEF: her accent is Sicilian; Aimilios is a Roman name", learned_chapter: 7, method: "inferred", source: "ch-07:p160; ch-07:p164" }
      - { fact: "the entry as he wrote it: 'Maira, daughter of Aimilios, of Syrakousai; free; kinswoman of Kallia, of her house and in her keeping.'", learned_chapter: 7, method: "witnessed", note: "his own record", source: "ch-07:p172" }
    knowledge_absent: ["anything about Mara that the form does not ask", "that the cover is false"]
    arc_notes: "The official who corrects a city's name and spells a woman's without asking."

  clay-figure-seller:
    canonical_name: "the woman with the clay figures"
    aliases: []
    importance: minor
    first_appearance: { chapter: 5, source: "ch-05:p92" }
    traits:
      - { trait: "moves her board six feet away from Mara, then comes back to ask 'Is it for the women too, the meat?' and 'Was it the god's men did that? What did you do to them?'", source: "ch-05:p92; ch-05:p111; ch-05:p112; ch-05:p113", mutable: false }
      - { trait: "'Those are a man's boots'; her husband makes the clay women ('all pressed from one mold, with the same thumbprint on every hip'); 'Since the bronzes were carted off there's no buying. Everybody's poorer.' Walks off still talking", source: "ch-05:p115", mutable: false }

  fountain-men:
    canonical_name: "two men at the fountain"
    aliases: []
    importance: minor
    first_appearance: { chapter: 5, source: "ch-05:p117" }
    traits:
      - { trait: "argue about the four oxen, a brother's wife who 'got a hoof' at 'the Nemean thing', and each other's relatives; 'Then that god will want paying for it.' / 'Not from us, he won't. It's four oxen.' Mara doubts the herald said any number (p128)", source: "ch-05:p118-p127; ch-05:p128", mutable: false }

  procurer-at-dusk:
    canonical_name: "the man with the bad smile"
    aliases: ["the procurer (character-bible)"]
    importance: minor
    first_appearance: { chapter: 5, source: "ch-05:p129" }
    physical: { value: "younger than Mara; 'a good cloak and a bad smile'; 'planted himself in front of me with his thumbs in his belt'", source: "ch-05:p129" }
    traits:
      - { trait: "offers 'a house down past the stadium road that takes in girls on their own'; puts a hand on the strap; takes it back at her English 'No' ('the words were nothing to him; the voice was enough'); 'You'll think better of it when the dogs come round'; says something 'sideways' to a man in the colonnade's shadow and watches her go from the fountain", source: "ch-05:p130; ch-05:p131; ch-05:p133", mutable: false }
    relationships:
      man-in-the-colonnade-shadow: { type: "associate (unseen by Mara until the procurer speaks 'sideways' to him)", established: "ch-05:p133" }
    knowledge:
      - { fact: "a woman alone in the square at dusk, no people, a foreign tongue; she went toward the cleft in the cliffs", learned_chapter: 5, method: "witnessed", source: "ch-05:p130; ch-05:p133" }

  sieve-neighbor:
    canonical_name: "Kallia's neighbor in the lane"
    aliases: []
    importance: minor
    first_appearance: { chapter: 5, source: "ch-05:p181" }
    traits:
      - { trait: "opens a crack with his own lamp: 'It's dark, woman.' / 'She's asleep.' / 'It had a hole when we had it.' Shuts the door twice", source: "ch-05:p181; ch-05:p182; ch-05:p186; ch-05:p190; ch-05:p192", mutable: false }
    relationships:
      sieve-neighbors-wife: { type: "wife; borrowed Kallia's sieve to strain her must; fills her jars at the same spring as Kallia", established: "ch-05:p185; ch-05:p191" }

  gallery-pilgrim:
    canonical_name: "the pilgrim on the gallery"
    aliases: []
    importance: minor
    first_appearance: { chapter: 5, source: "ch-05:p194" }
    traits:
      - { trait: "leans over the rail: 'Kallia! Is there any more of the lentils, or have those Thebans had it all?' / 'Who's that you've got?' / 'Can she sing? We've had that song since sunset.' (his shout gives Mara Kallia's name)", source: "ch-05:p194; ch-05:p196; ch-05:p198", mutable: false }

  singer-upstairs:
    canonical_name: "the man singing upstairs"
    aliases: []
    importance: minor
    first_appearance: { chapter: 5, source: "ch-05:p193" }
    traits:
      - { trait: "sings, 'not well', an endless song about a girl from Corinth (he has her as far as Sikyon by bedtime); told to shut up, he sings the last line again, louder", source: "ch-05:p193; ch-05:p209", mutable: false }

  # --- Ch.6 walk-ons and mentions ---
  charcoal-burner-parnassus:
    canonical_name: "the charcoal burner"
    aliases: ["the man with a donkey"]
    importance: minor
    first_appearance: { chapter: 6, source: "ch-06:p182", note: "first seen far below on the cliff stair at dawn, 'a man with a donkey … coming up the zigzags with a load on its back'; named by function only. Unnamed (character-bible Ch.6 walk-on note)" }
    physical:
      clothing: { value: "sits on an upturned basket 'with a sack across his head and shoulders'", source: "ch-06:p307" }
    possessions:
      - { item: "a donkey (stands in the kiln's lee with its eyes shut)", source: "ch-06:p182; ch-06:p307; ch-06:p324" }
      - { item: "a charcoal kiln at the top of the cliff path, off to the left: 'a long hump of earth and turf with smoke seeping from every seam', a red glow low in the snow, smoke 'sour where woodsmoke would have been sweet'; burning nine days", source: "ch-06:p307; ch-06:p310" }
    traits:
      - { trait: "talks to his kiln as 'she': 'Come and warm yourselves. She won't mind.' / 'Nine days she's been at it, and now this.' / 'Easy, girl. Hold it in.'; stamps a seam shut where a tongue of flame shows", source: "ch-06:p308; ch-06:p310", mutable: false }
      - { trait: "rakes split chestnuts out of the embers with a stick and pushes them across the snow to Mara with his foot ('Eat. They're split already.')", source: "ch-06:p310", mutable: false }
      - { trait: "fast mountain Greek (Mara 'lost words out of everything he said'); hails Valens as 'Mule-man!'; asks after 'the god's ox' with a grievance about meat in which 'the number four' and 'the council' come up; 'So you ate what we ate. Smoke.'", source: "ch-06:p308; ch-06:p311; ch-06:p312; ch-06:p314", mutable: false }
      - { trait: "laughs once, under the sack, at 'She hit Pan' (the donkey opens its eyes and shuts them again); offers them the night by the kiln ('Sleep here by her … You'll not get down in the dark')", source: "ch-06:p324; ch-06:p325", mutable: false }
    voice_markers:
      ref: "character-bible.md (Ch.6 unnamed walk-ons: The charcoal burner)"
    relationships:
      goat-boy: { type: "kin ('My cousin's boy')", established: "ch-06:p314", current_status: "repeats the boy's story" }
      valens: { type: "acquaintance ('Mule-man!')", established: "ch-06:p308", current_status: "Ch.6: lied to by Valens about Mara" }
      kallia: { type: "knows of her ('Since when has Kallia got anybody?')", established: "ch-06:p316", current_status: "n/a" }
    location_log:
      - { chapter: 6, location: "cliff-stair-above-delphi", scene: "at dawn on the path up from the town behind Valens and Mara, turning off at a fork toward his kiln's smoke; at dusk at the kiln at the top of the cliff path in falling snow", travel_noted: true, source: "ch-06:p182; ch-06:p183; ch-06:p185; ch-06:p307" }
    knowledge:
      - { fact: "his cousin's boy saw a nymph 'step out of Pan's cave at the olive beating'; she ate his cheese and 'paid him in a cake made of hay'", learned_chapter: 0, method: "told_by:goat-boy", note: "before Ch.6; the charcoal men had the story 'this autumn' (Valens, p86)", source: "ch-06:p86; ch-06:p314; ch-06:p320" }
      - { fact: "this woman (in trousers, with Valens) is the nymph ('That's her')", learned_chapter: 6, method: "inferred", source: "ch-06:p314; ch-06:p318" }
      - { fact: "Valens took her up the mountain in snow and is bringing her down at dusk", learned_chapter: 6, method: "witnessed", note: "he was on the path behind them in the morning (p183) and they stop at his kiln on the way down. Against Valens's cover 'You went up by yourself' (p341)", source: "ch-06:p183; ch-06:p308; ch-06:p309" }
      - { fact: "COVER (told, false or partial): she is 'the widow Kallia's … Down by the spring', has been 'Since the olives', and 'came off a ship'", learned_chapter: 6, method: "told_by:valens", source: "ch-06:p315; ch-06:p317; ch-06:p319" }
      - { fact: "her hand is hurt because 'She hit Pan'", learned_chapter: 6, method: "told_by:valens", note: "he sees the hand himself first ('And what's she done to that?')", source: "ch-06:p322; ch-06:p323" }
      - { fact: "'It was oats' (not hay)", learned_chapter: 6, method: "told_by:mara-reyes", source: "ch-06:p321" }
    knowledge_absent: ["her name", "the watch", "why she went up"]
    gossip_risk: { value: "Valens: 'He'll have you all over the town by the next market.' He is the one witness who has seen them on the mountain together (against 'You went up by yourself. You never had a watch.')", source: "ch-06:p328; ch-06:p341" }
    note: "AD 70. Kept separate from the 'charcoal men' as a group (the story's tellers 'this autumn', unnamed)"

  theban-on-gallery:
    canonical_name: "a Theban on Kallia's gallery"
    aliases: []
    importance: minor
    first_appearance: { chapter: 6, source: "ch-06:p75" }
    traits:
      - { trait: "hangs off the gallery: 'Kallia! … Are those lentils ever coming?' (Kallia: 'When the hearth comes')", source: "ch-06:p75; ch-06:p76", mutable: false }
    note: "a Theban lodger. Kept distinct from gallery-pilgrim (Ch.5), who set himself apart from 'those Thebans' (ch-05:p194). The page does not say whether this is the Theban whose cloak Mara beat (ch-06:p38) or the one whose cloak the spitting coal burned (ch-06:p56)"

  delphi-temple-painter:
    canonical_name: "the temple painter"
    aliases: []
    importance: mentioned_only
    first_appearance: { chapter: 6, mode: "mentioned by Valens", source: "ch-06:p177" }
    traits:
      - { trait: "hung off the temple roof on a rope 'with a pot of red' each spring when the snow has gone; 'The same man every year'; came off the corner at the last painting and broke his arm, and was back up in a month 'with the arm tied to his side'; 'He's cheap'", source: "ch-06:p177; ch-06:p179; ch-06:p181", mutable: false }
    note: "perhaps the painter behind the slopped blue on the porch molding Mara noticed in Ch.5 (ch-05:p72). The page does not connect them"

  man-from-philadelphia-in-asia:
    canonical_name: "a man Valens knew, from Philadelphia in Asia"
    aliases: []
    importance: mentioned_only
    first_appearance: { chapter: 6, mode: "mentioned by Valens", source: "ch-06:p167" }
    traits:
      - { trait: "'There's a Philadelphia in Asia … Past Sardis. A man I knew came from there.'", source: "ch-06:p167", mutable: false }

  larchwood-neighbor:
    canonical_name: "the ground-floor man on Larchwood"
    aliases: []
    importance: mentioned_only
    era: "1994"
    first_appearance: { chapter: 6, mode: "Mara's memory", source: "ch-06:p43" }
    traits:
      - { trait: "in the ice storm of January '94 he came out at six in the morning in his bathrobe and poured a whole bag of cat litter down the front steps; moved out in March; 'Nobody in the building ever learned his name'", source: "ch-06:p43", mutable: false }
    note: "the building is on Larchwood (Philadelphia). That Mara lived there in 1994 is implied ('Nobody in the building'), not stated, and it is not said whether it is her current apartment"

  # --- Ch.7 walk-ons and mentions ---
  kallias-runaway-girl:
    canonical_name: "the girl (Kallia's former help)"
    aliases: ["the girl"]
    importance: mentioned_only
    first_appearance: { chapter: 5, mode: "mention", source: "ch-05:p171", note: "'the girl ran off at the vintage' (Ch.5); 'She took herself off when the grapes came in, in what she stood up in' (Ch.7). UNNAMED by design (character-bible, Ch.7 note)" }
    physical:
      hair: { value: "a long hair 'darker than mine and crimped from a braid', caught in the himation's fringe", source: "ch-07:p11" }
      traces: { value: "her himation: stale sweat in the armpit fold; a hair oil 'with a sweetness in it, quince or something with ambitions to be quince' in the edge that went over the head; a corner darned 'in a browner wool by somebody in a hurry'; the elbows bagged 'into the shape of another woman's arms'", source: "ch-07:p11" }
    possessions:
      - { item: "borrowed-himation", status: "left behind; now Mara's to wear", source: "ch-07:p12" }
      - { item: "a tunic of undyed wool and a plaited cord", status: "left behind; now Mara's", source: "ch-07:p10" }
    relationships:
      kallia: { type: "former help", established: "ch-05:p171", current_status: "gone since the vintage" }
    location_log:
      - { chapter: 7, location: "unknown", scene: "gone 'when the grapes came in'", travel_noted: true, source: "ch-07:p12" }
    note: "Rule 8: not merged with any other girl. Mara's 'a runaway's clothes' (ch-07:p157) refers to her"

  bakers-wife-bath:
    canonical_name: "the baker's wife (at the bath)"
    aliases: ["the woman with the lamp"]
    importance: minor
    first_appearance: { chapter: 7, source: "ch-07:p42" }
    physical: { value: "a soft heavy body; a red clay lamp in her fist", source: "ch-07:p42" }
    traits:
      - { trait: "her own life: in the warm room 'since before light' and staying 'till the men come and throw me out, because his mother has moved in on us for the winter, and that house was never built for two women who both know best'", source: "ch-07:p42", mutable: true }
      - { trait: "offers to singe Mara's legs with the lamp ('Stand still, I'll singe them for you. It doesn't hurt if you don't jump.'); 'She's let herself go like a widow.'", source: "ch-07:p41; ch-07:p42", mutable: false }
      - { trait: "finds the vaccination scar and puts her thumb on it ('Somebody's marked her.'); 'Pox doesn't take one place.'; laughs at Kallia's answer and gives the arm back", source: "ch-07:p48; ch-07:p49; ch-07:p52; ch-07:p54", mutable: false }
      - { trait: "teases Kallia: 'Everything's over the sea with you … Last winter you told us your Thebans came by ship, and they walked here from four days up the road.'; 'And where's that, where they've no lamps?'", source: "ch-07:p45; ch-07:p47", mutable: false }
    relationships:
      bakers-mother-in-law: { type: "her husband's mother, moved in for the winter (mention only)", established: "ch-07:p42" }
      kallia: { type: "bath acquaintance", established: "ch-07:p47" }
    knowledge:
      - { fact: "Mara has unsinged legs, a pale band on her wrist and a round scar high on her left arm; Kallia says 'Over the sea' and 'Pox'", learned_chapter: 7, method: "witnessed", source: "ch-07:p40; ch-07:p44; ch-07:p46; ch-07:p48; ch-07:p51" }
    location_log:
      - { chapter: 7, location: "delphi-baths", scene: "the warm room", travel_noted: false, source: "ch-07:p42" }

  girl-with-the-mole:
    canonical_name: "the girl with a mole on her chin (at the bath)"
    aliases: []
    importance: minor
    first_appearance: { chapter: 7, source: "ch-07:p48" }
    physical: { value: "a mole on her chin; 'every tooth in her head, and all of them sound'", source: "ch-07:p48; ch-07:p58" }
    traits:
      - { trait: "turns Mara's hand toward the window: 'What's this white, then? Has she had a fetter on?'; 'Is she bought? … Is that where they put it, over there?'", source: "ch-07:p48; ch-07:p50", mutable: false }
      - { trait: "offers the horn powder twice, smiling ('Horn. Burnt and ground. Goat's is best.')", source: "ch-07:p55; ch-07:p57; ch-07:p58", mutable: false }
    knowledge:
      - { fact: "the pale band and the scar (she asks whether Mara is bought)", learned_chapter: 7, method: "witnessed", source: "ch-07:p48; ch-07:p50" }
    note: "she enters by the mole, not her teeth (character-bible: the Ch.24 midwife is the only introduction-by-teeth)"

  bath-keepers-wife:
    canonical_name: "the bath-keeper's wife"
    aliases: []
    importance: minor
    first_appearance: { chapter: 7, source: "ch-07:p38" }
    traits:
      - { trait: "takes Kallia's coin at the door and 'eyed me over it' (no line)", source: "ch-07:p38", mutable: false }

  salt-seller:
    canonical_name: "the salt-seller"
    aliases: []
    importance: minor
    first_appearance: { chapter: 7, source: "ch-07:p63" }
    physical: { value: "'a broad woman on an upturned measure behind a heap of gray salt with a wooden scoop in it'; at the spring she carries her jar on her head", source: "ch-07:p63; ch-07:p117" }
    traits:
      - { trait: "mocks by declaiming: cups her ear ('Say it again.'), throws up both arms so the salt showers her lap: 'Antigone! … She's come down off the stage for a scoop of salt!'", source: "ch-07:p64; ch-07:p65; ch-07:p67; ch-07:p68", mutable: false }
      - { trait: "gives more salt than an obol buys and pushes the coin back, wiping her eyes: 'Come again tomorrow and ask for pepper. My sister's never seen a play.'", source: "ch-07:p70", mutable: false }
      - { trait: "stops the drover at the spring: 'Leave Antigone alone.' / 'She's Kallia's.' / 'Kallia's, and Kallia has a tongue on her and the council's ear, and you've got four donkeys drinking the god's water at the wrong end of his basin. Take them down to the trough where they belong, before somebody fetches a priest to them.' Then she draws her water at the next lion 'and never glanced my way again'", source: "ch-07:p116; ch-07:p119; ch-07:p121; ch-07:p122", mutable: false }
    relationships:
      salt-sellers-sister: { type: "sister ('never seen a play'; mention only)", established: "ch-07:p70" }
      sprat-seller: { type: "neighboring stall", established: "ch-07:p69" }
      kallia: { type: "knows of her standing", established: "ch-07:p121" }
    knowledge:
      - { fact: "the woman who talks like a play is Kallia's", learned_chapter: 7, method: "inferred", note: "how she knows is not stated (Kallia's basket; the town's talk)", source: "ch-07:p63; ch-07:p119" }
    location_log:
      - { chapter: 7, location: "delphi-market-square", scene: "the salt row", travel_noted: false, source: "ch-07:p63" }
      - { chapter: 7, location: "castalian-spring", scene: "the steps; the next lion", travel_noted: false, source: "ch-07:p117; ch-07:p122" }
    note: "'Antigone' has 2 uses on the page; the bible's CAP REACHED ruling stands (CH7-6 on the bible's count of 3). 'as broad as a doorway' was cut in the continuity repair (audit W-20)"

  sprat-seller:
    canonical_name: "the sprat-seller"
    aliases: []
    importance: minor
    first_appearance: { chapter: 7, source: "ch-07:p69" }
    traits:
      - { trait: "sells sprats 'out of a basket of wet leaves' and never raises her head: 'Tell her to bury her brother first, the salt will keep.'", source: "ch-07:p69", mutable: false }

  fountain-man-laughing:
    canonical_name: "a man at the fountain (the salt market)"
    aliases: []
    importance: minor
    first_appearance: { chapter: 7, source: "ch-07:p70" }
    traits:
      - { trait: "laughs along with the row, with 'his eyes on me and not on the women' (no line)", source: "ch-07:p70", mutable: false }
    needs_review: true
    review_note: "an unnamed man at a fountain in the market. The page does not tie him to the Ch.5 procurer (who watched her 'from the fountain', ch-05:p131-p133) or to the Ch.5 fountain-men. Kept separate per rule 8"

  drover-from-the-west:
    canonical_name: "the drover at the spring"
    aliases: ["a man with donkeys"]
    importance: minor
    first_appearance: { chapter: 7, source: "ch-07:p108" }
    physical: { value: "'a voice from somewhere west, Amphissa or beyond it'; he 'smelled of donkey and of the morning's wine'", source: "ch-07:p111" }
    possessions:
