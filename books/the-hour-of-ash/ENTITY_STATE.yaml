    voice_markers:
      ref: "character-bible.md#emilio-reyes"
    greeting_ch1:
      text: "Hello, you've reached the Reyes house, which means you've reached a machine, because I'm out somewhere digging a hole in somebody else's country. Or I'm in the basement looking for the Christmas lights. Tell me who you are and where you're calling from, and say it slowly, and I'll find you. [aside, lower:] Mara? Which one stops it?"
      recorded: "c. December 1991 / 'six years ago' (Mara 26, beside him at the counter; he pressed the wrong button and never re-did it); a radio playing 'Brahms or something like Brahms' in the background"
      source: "ch-01:p196; ch-01:p197; ch-01:p200"
    relationships:
      mara-reyes: { type: "father", established: "ch-01:p1", current_status: "deceased" }
