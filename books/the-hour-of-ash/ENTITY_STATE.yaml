      - { item: "change of clothes; toothbrush", source: "ch-02:p53" }
      - { item: "floss (outside pocket), packed Tue 5 May before the ticket or the passport", source: "ch-02:p53" }
      - { item: "two boxes of granola bars (shedding oats)", source: "ch-02:p63" }
      - { item: "a bottle of Advil (side pocket, against the floss)", source: "ch-02:p63" }
      - { item: "hiking boots at the bottom; in one toe, the microcassette in a rolled wool sock", source: "ch-02:p63" }
      - { item: "flashlight (bought; packing implied)", source: "ch-02:p63" }
      - { item: "the Pentax with the Kodak roll (implied, CH2-6)", source: "ch-02:p64; ch-02:p67" }
      - { item: "Fenn's notebook, last, on top", source: "ch-02:p67" }
    not_in_bag: ["the Venetian chart (pinned in the study)", "the Phillies cigar box", "the Seiko (on her wrist)", "a flash unit (never mentioned)"]
    location_end_ch2: { value: "by the door at Emilio's house the night before the flight", source: "ch-02:p68" }
    contents_ch3:
      - { item: "'Just my clothes' (her answer to the German); the itemized contents line is cut in the author fixes", source: "ch-03:p19" }
      - { item: "the Pentax, in the end pocket", source: "ch-03:p6" }
      - { item: "the Advil bottle, in a pocket", source: "ch-03:p63" }
      - { item: "the unwritten Charioteer postcard", source: "ch-03:p66" }
      - { item: "the flashlight, granola bars and water come out on the climb and in the cave (the bag is not named as their source each time)", source: "ch-03:p45; ch-03:p55; ch-03:p63" }
      - { item: "the microcassette in its sock, down among her clothes (the boots came out when she laced them on at home)", source: "ch-03:p63" }
      - { item: "not mentioned: the floss", source: "ch-03 (absent)" }
    ch3_use: { value: "canvas; the strap works at a bony place on her right shoulder 'with the patience of a wood rasp'; never asked anything 'steeper … than the subway stairs at City Hall'; the taxi driver laughs at it; the German: 'You are carrying your whole house'; she sits on it in the dark against the slab; she gropes in it in the dark for a granola bar, past the sock with the tape; for the crossing the strap goes over her head, the bag hangs across her chest and is pushed down in front of her in both fists as she goes in on her knees; its canvas scraping the rock is 'the last sound in the world'; it catches on the slab coming out and is pulled free", source: "ch-03:p2; ch-03:p3; ch-03:p18; ch-03:p63; ch-03:p72; ch-03:p73; ch-03:p77" }
    location_end_ch3: { value: "on her (strap re-hauled on) as she steps out of the cave mouth", source: "ch-03:p78; ch-03:p84" }
    contents_ch4:
      - { item: "a sweater (first named; Ch.3 says only 'a change of clothes')", source: "ch-04:p43" }
      - { item: "the granola box ('under the sweater, beside the sock'); one two-bar green-foil pouch taken out and eaten", source: "ch-04:p43" }
      - { item: "'the sock' (read as the tape sock; tape not named)", source: "ch-04:p43" }
    ch4_use: { value: "her knees give and she sits down on it 'without deciding to'; she gets the zipper open and finds the box by feel", source: "ch-04:p37; ch-04:p43" }
    location_end_ch4: { value: "NOT STATED after p43 (on the slope at the cave mouth when last mentioned; the descent does not mention it)", source: "ch-04:p43" }
    contents_ch5:
      - { item: "the granola box (a pouch eaten at dawn; 'the rest of the granola')", source: "ch-05:p1; ch-05:p136" }
      - { item: "the flashlight (used at the sheepfold, p1; left 'somewhere in the bottom of the duffel' in the storeroom, p206)", source: "ch-05:p1; ch-05:p206" }
      - { item: "the Pentax ('I unzipped the end of the duffel for the Pentax', p52)", source: "ch-05:p52" }
      - { item: "the tape sock ('the sock and the hard little oblong in its toe')", source: "ch-05:p209" }
      - { item: "dry socks (implied: 'reached into the bag for a dry one')", source: "ch-05:p209" }
      - { item: "the sweater (taken out for a pillow)", source: "ch-05:p209" }
    ch5_use: { value: "her pillow in the sheepfold, canvas soaked with dew by morning; 'I dropped the bag in the road and knelt' at the Kroton base; seized by the warden ('took hold of the duffel instead and pulled'), held by the strap through two blows, torn out of her hand, falls down the steps and hits her legs; she takes it by the handles and runs with it clutched to her; between her feet in the square; the procurer's hand on the strap ('No. I'll carry it'), then slung crosswise; in the storeroom (the flashlight left in the bottom; a dry sock looked for; the sweater taken out)", source: "ch-05:p1; ch-05:p43; ch-05:p83; ch-05:p86; ch-05:p88; ch-05:p91; ch-05:p131; ch-05:p132; ch-05:p133; ch-05:p206; ch-05:p209" }
    location_end_ch5: { value: "in Kallia's storeroom under the stairs, by Mara's mat (she reaches into it for a dry sock and takes out the sweater)", source: "ch-05:p205; ch-05:p209" }
    contents_ch6: { value: "the flashlight, 'under everything' (p7); nothing else is named. 'packed, which was no trouble, since it had never been unpacked' (a month in the storeroom). Valens weighs it on one hand: 'Everything'", source: "ch-06:p7; ch-06:p152; ch-06:p158" }
    ch6_use: { value: "beside her on the mat the night before; hoisted when she leaves before light; lashed onto the dun; in the cave it leans on the slab, 'zipped, the strap laid ready over it' ('You brought the bag in … Into a hole in a rock.' / 'I'm not carrying it up here twice.'); she stands it by the slab when she first puts her hand in the crack; she gets back into its strap for the descent; at the first houses Valens unlashes it from the dun and gives it to her", source: "ch-06:p7; ch-06:p31; ch-06:p33; ch-06:p152; ch-06:p158; ch-06:p238; ch-06:p273; ch-06:p339; ch-06:p340" }
    location_end_ch6: { value: "in Mara's hands at the first houses of Delphi after dark, with Kallia's shovel", source: "ch-06:p340" }
    contents_ch7:
      - { item: "the jeans (folded), the fleece over them, and 'The shirt with the buttons' over the fleece", source: "ch-07:p9; ch-07:p10" }
      - { item: "the flashlight 'under all three', 'where it had lain since October, unseen by a soul in that house'", source: "ch-07:p10" }
      - { item: "the toothbrush (purple, rubber grip)", source: "ch-07:p58" }
    location_end_ch7: { value: "not stated after p58 (by implication the storeroom, since Kallia brings the bundle to the storeroom door)", source: "ch-07:p8; ch-07:p58" }
    status: "background"
    note: "the plan's 'her bag' (Ch.19, Ch.35, Ch.38) is presumably this duffel, but the page does not say so beyond Ch.3. Ch.5 confirms it came down the mountain with her"
    last_mentioned: "ch-07:p58"
    resolution: null

