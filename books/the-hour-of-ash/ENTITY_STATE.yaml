    knowledge:
      - { fact: "Pompeii is destroyed by Vesuvius in AD 79 (1998 education; 1988 plaster-cast exhibition as a graduate student)", learned_chapter: 0, method: "prior_knowledge", first_in_scene: 14, source: "outline:ch-14" }
      - { fact: "Pliny's account: column ~1 p.m. like an umbrella pine; ~18 hours of pumice; roofs collapse; boats cannot land; surges reach Pompeii ~6:30-7:30 a.m. on the 25th; date 24 August", learned_chapter: 0, method: "prior_knowledge", first_in_scene: 36, note: "date stated in present thought Ch.36; hours told to Valens Ch.37", source: "outline:ch-36; outline:ch-37; foundation:§9" }
      - { fact: "the chart (and the cigar box with the notebook) came from Margaret Fenn's estate sale (Szabo volunteers it) in Chestnut Hill last October (1997): an old lady, no children, a house full of boxes; her brother, a 'treasure hunter', went to Greece in sixty-eight and did not come back; the sister kept his things; the brother wrote on the chart", learned_chapter: 1, method: "told_by:irene-szabo", note: "Szabo does not say the brother's name", source: "ch-01:p88; ch-01:p90" }
      - { fact: "the notebook's owner: 'A. J. FENN' on the oilcloth cover, in the same square capitals as the ballpoint on the chart", learned_chapter: 1, method: "discovered", note: "she closes the lid without reading it; notebook unread at chapter end", source: "ch-01:p99" }
      - { fact: "the chart is a Venetian survey from Morosini's war (1687-88), coast sounded by the navy; Szabo bought it because 'the coast is right' and it says Castri, not Delfi; the Fenn lot also held Navy uniforms, forty years of National Geographic and a glassless diving helmet", learned_chapter: 1, method: "told_by:irene-szabo", source: "ch-01:p80; ch-01:p82; ch-01:p102" }
      - { fact: "Szabo's reading of the ink: the brother was hunting 'a library' (the one people dig for, Alexandria)", learned_chapter: 1, method: "told_by:irene-szabo", note: "Szabo's opinion; Mara notes the question mark after BIBLIOTHECA 'did not look sure'", source: "ch-01:p94; ch-01:p96; ch-01:p97" }
      - fact: "Halloran (ringing from Naples): the permesso for the Campanian survey season is still in Emilio's name; the Soprintendenza want another name on it by the twentieth of April or the season lapses (then 'one begins again from nothing'); asks whether the family will send anyone; 'It needn't be an archaeologist, strictly, for the paperwork'"
        learned_chapter: 1
        method: "told_by:halloran"
        note: "recorded message on the incoming tape; she wrote nothing down and erased it (p178). Deadline vs character-bible sample line: meta.contradictions CH1-1"
        source: "ch-01:p176; ch-01:p178"
      - { fact: "a friend in Nicosia (unnamed) has found Emilio's 1992 Kourion drawings, the whole box, under his bed, and has not heard of the death", learned_chapter: 1, method: "told_by:nicosia-caller", note: "message; she infers he has not heard", source: "ch-01:p172; ch-01:p173" }
      - { fact: "Pat next door has Emilio's blue Tupperware; Emilio shoveled her walk; the Free Library (Walnut Street West) wants Wild Horses back; the department office booked the upper gallery, Saturday the fourteenth, two o'clock; an unnamed woman breathed 'Oh, Emilio' and hung up", learned_chapter: 1, method: "told_by:pat", note: "all on the incoming tape (method covers Pat's message; the others are told_by their callers)", source: "ch-01:p168; ch-01:p170; ch-01:p174; ch-01:p175" }
      - { fact: "Tía Nilda (78) phoned the house on Thursday to tell Emilio the memorial time, got his greeting, and had to lie down; the incoming tape is full", learned_chapter: 1, method: "told_by:gloria", source: "ch-01:p160" }
      - { fact: "Emilio used to talk about rebuilding the porch every season's last week (drawn on the back of a context sheet) and talked about Mara on site 'all the time'", learned_chapter: 1, method: "told_by:doug-fessler", source: "ch-01:p24" }
      - { fact: "the dean plans a lecture fund in Emilio's name, every spring", learned_chapter: 1, method: "told_by:dean", source: "ch-01:p13" }
      - { fact: "neighbors have been in the house and stocked the refrigerator (Dorothy's Pyrex: RETURN DISH); someone has a key she did not know about", learned_chapter: 1, method: "inferred", source: "ch-01:p165" }
      - { fact: "Szabo read a Reyes professor's obituary in the Inquirer in January and asked; Mara deflected ('It's a common name')", learned_chapter: 1, method: "witnessed", source: "ch-01:p123; ch-01:p124; ch-01:p125" }
      - { fact: "Halloran's invitation: the season starts on the sixth of July, 'Three weeks, four'; a room in the dig house, 'a decent one with a window, standing empty'; 'In Emilio's place, I mean. Not to work, unless you wanted to … So that you could see it'", learned_chapter: 2, method: "told_by:halloran", note: "she answers only 'I might be in Greece' (CH2-1)", source: "ch-02:p40; ch-02:p41" }
      - { fact: "Fenn's theory (Thanksgiving 1967 entry): a scholiast's margin note, printed in small type by a German, translated for Fenn by Father Kostas at St. George's: 'The books of the Ptolemies were carried out of Alexandria by ship and taken up to the cave of the nymphs on Parnassus, and they are there.' Fenn reads it as the Library of Alexandria in a cave", learned_chapter: 2, method: "discovered", note: "read the night of Sat 14 Mar in her father's kitchen", source: "ch-02:p1; ch-02:p3" }
      - { fact: "the coordinates as Fenn wrote them, and where he got them: the chart 'got Castri right where it ought to be', and 'the Army map down at the Free Library puts the cave up the mountain from it at 38° 31′ N, 22° 32′ E'; he put that on the chart in ballpoint 'so I'd have it, with a little picture of the cave mouth beside it so I'd know which hole I meant' (= the fingernail-sized doorway she saw in Ch.1); Margaret made him add a question mark 'to be honest about it'; he needed 'about two thousand bucks and a better flashlight'", learned_chapter: 2, method: "discovered", note: "Mara does not gloss the Army-map clause", revised: "2026-10-18 (re-sync: coordinate source added in polish cycle 1)", source: "ch-02:p2; ch-01:p78" }
      - { fact: "the notebook's coordinates match the blue ballpoint above Castri on the chart 'to the minute'", learned_chapter: 2, method: "discovered", note: "she checks by sliding the chart out of its garbage bag", source: "ch-02:p4" }
      - { fact: "the scholion is real: in a Leipzig 1838 edition (marbled boards) on a bottom shelf of the university library, at the foot of a page about Phocis, it says what Father Kostas said it said; the leaves are slit with something blunt from the front up to that page and uncut after it ('He had found his line and stopped reading')", learned_chapter: 2, method: "discovered", note: "Mon 16 Mar by sequence (not stated); she does not cut the rest", source: "ch-02:p10; ch-02:p11" }
      - { fact: "Fenn's 1968 itinerary: sold the Plymouth to a mailman in Jenkintown for $600 (and a sack of oranges); TWA to Athens on 2 April 1968; at Delphi he lodged in a room over a taverna in the moved village; the cave was four hours' walk up, 'a big wet barn of a place' with names scratched on the walls, many French; 'No books'", learned_chapter: 2, method: "discovered", source: "ch-02:p13; ch-02:p17" }
      - { fact: "Fenn (undated entry; placed after the May 1968 hand-change) put his hand into a slot at the back of the cave, 'Way in past where the good light gives out', low on the left, and felt the air 'cold in a way air isn't' for 'about a minute' before it quit ('like somebody shut a door in another part of the house'); cold again one Tuesday morning; then nothing; he slept up there ('Didn't help')", learned_chapter: 2, method: "discovered", source: "ch-02:p19; ch-02:p20; ch-02:p21" }
      - { fact: "Fenn's sister was Margaret: Thanksgiving 1967 with him; she would not tell 'the girls at church' he had gone to Greece, so he was 'going to Mexico instead'; his last entry says she can stop telling them he is in Mexico", learned_chapter: 2, method: "discovered", source: "ch-02:p1; ch-02:p13; ch-02:p69" }
      - { fact: "the consulate carbon (onionskin, American consulate in Athens, dated 16 September 1968): 'Personal effects of FENN, August J., U.S. citizen: one man's overcoat, wool, gray, with contents of pockets, forwarded to next of kin, Miss Margaret Fenn, Philadelphia, Pennsylvania'; the typist put one n too many in Pennsylvania and x'd it out", learned_chapter: 2, method: "discovered", note: "found in the receipt pocket inside the notebook's back cover after humidifying the stuck back leaves; the page does not say the notebook was in the coat (CH2-3)", revised: "2026-10-18 (Ch.2 prose)", source: "ch-02:p65; ch-02:p66; ch-02:p67" }
      - { fact: "Fenn's last entry, July 21 [1968]: cold at the slot that morning, enough to see his breath, lasting 'a whole cigarette, which is the longest yet'; going in 'tomorrow first thing with the good flashlight and a ball of kite string'; 'Back before Labor Day'; Margaret will believe the story when she reads it in the Inquirer", learned_chapter: 2, method: "discovered", note: "re-read the night before her flight", source: "ch-02:p68; ch-02:p69" }
      - { fact: "Fenn's other entries: a Herald Tribune a week old left by 'a fellow off the Athens bus', read through, bridge column included ('and I don't play bridge'); June: 'Up again. Nothing.', his boots going at the toes (the goat-boy's mother has a cousin who will stitch them); 'Tired today.'", learned_chapter: 2, method: "discovered", source: "ch-02:p47; ch-02:p48; ch-02:p49; ch-02:p54" }
      - { fact: "BELIEF (Ch.2): she does not believe the scholion (p4); she explains the cold air as caves breathing with the weather (p22); she knows Fenn meant to go in on 22 July 1968 and come back before Labor Day, and that his overcoat was forwarded to Margaret in September. She states no conclusion about what became of him.", learned_chapter: 2, method: "inferred", note: "belief, not fact; Ch.1 adds 'went to Greece in sixty-eight and did not come back' (Szabo)", source: "ch-02:p4; ch-02:p22; ch-02:p66; ch-02:p69" }
      - { fact: "the Soprintendenza accept Halloran as director for the season but require the cession (the outgoing director's ink signature, witnessed); his dossier (Pennsylvania certificate, sworn translation, letter) came back Thursday marked 'Firma mancante'; instead they will take the heir's signature on a declaration before a notary, certificate attached; he will fax it Monday; 'if I could manage it by the fifteenth' (the twentieth is a Monday)", learned_chapter: 2, method: "told_by:halloran", source: "ch-02:p28; ch-02:p30; ch-02:p35" }
      - { fact: "Halloran wants Emilio's field notebooks from last season ('The north transects exist nowhere else'; never typed up) 'By the end of June, if it could be managed'", learned_chapter: 2, method: "told_by:halloran", note: "she says 'They're here'; sending them is not narrated", source: "ch-02:p36; ch-02:p37; ch-02:p38" }
      - { fact: "Halloran and his wife are leaving their Naples flat after thirty-one years; he is ringing from the floor of an emptied room; new tenants come to measure for curtains", learned_chapter: 2, method: "told_by:halloran", source: "ch-02:p26; ch-02:p42" }
      - { fact: "Halloran rang four times that week and got 'its little tone and then nothing at all' (no greeting on the machine)", learned_chapter: 2, method: "told_by:halloran", source: "ch-02:p24" }
      - { fact: "Pat has told Gloria that Mara is going to Greece", learned_chapter: 2, method: "told_by:gloria", source: "ch-02:p56" }
      # --- Ch.3 (prose). The planned row 'the cave door is real (she crossed)' is replaced by what the page gives her (CH3-7). ---
      - { fact: "on a walker's map of Parnassus with degrees and minutes in its margins (bought at a Delphi kiosk), lines laid along the grid from 38° 31′ and 22° 32′ meet on the mountain a few hundred yards from the symbol marked ΚΩΡΥΚΕΙΟ ΑΝΤΡΟ. Fenn 'had read the map right in a library in Philadelphia in 1967 without ever having seen the mountain'", learned_chapter: 3, method: "discovered", note: "plotted 'the first evening' in Delphi (before the climb day); the hotel bed, the kiosk purchase afternoon and the minute-of-latitude sentence are cut in the author fixes", source: "ch-03:p7" }
      - { fact: "the French dug the cave floor at the beginning of the seventies and 'sieved more than twenty thousand knucklebones out of it': the ankle bones of sheep and goats, 'the dice of every child in Phocis, carried up to this cave over centuries for Pan and the nymphs'", learned_chapter: 3, method: "prior_knowledge", note: "how she knows is no longer stated: the report volumes, the April reading in the stacks, 'caught once already', the plates (figurines, rings, lamps, coins, a bronze cicada) and the dyed/drilled/lead-filled bones are cut in the author fixes (2026-10-19)", source: "ch-03:p54" }
      - { fact: "the German hiker's directions: follow the red squares on the stones; the yellow-and-black E4 goes over the summit and on to the sea; the cave is 'For me, forty minutes. For you, with the house, one hour' (the two o'clock cloud warning is cut in the author fixes)", learned_chapter: 3, method: "told_by:german-hiker", source: "ch-03:p27" }
      - { fact: "Fenn's drawn doorway on the chart is this cave's mouth: the same lean to the left-hand post where the rock has broken away, the same flattening along the top; it was 'copied too exactly for a guess, from a photograph in some library book, I supposed'", learned_chapter: 3, method: "inferred", note: "she had taken it in March for 'the way a child draws any cave at all'; size comparison differs from Ch.1 (CH3-2)", source: "ch-03:p46" }
      - { fact: "the knucklebone is ancient: a sheep's (maybe a small goat's) hind-leg ankle bone, heavy for its size, stained tea-brown through and through, no smell (a modern bone would be chalky, light and smell of something), two long sides ground flat on a stone (fine parallel scratches), the edges glossy with finger polish", learned_chapter: 3, method: "inferred", note: "by examination under the flashlight", source: "ch-03:p56" }
      - { fact: "the slot's shape: a vertical crack between a leaning split slab and the wall under a low roof; at the height of her shoulder 'just wide enough to take my forearm', pinched shut above; it widens downward until 'along the floor it was a good foot and a half across'; the flashlight finds a bend four or five feet in, and beyond the bend 'the beam ran on into black'", learned_chapter: 3, method: "witnessed", source: "ch-03:p60; ch-03:p61" }
      - { fact: "the slot at first gives nothing: rock and air, cave cold, no movement of air on her palm; at twenty past twelve 'the rock was still only rock'", learned_chapter: 3, method: "witnessed", source: "ch-03:p62; ch-03:p63" }
      - { fact: "BELIEF (Ch.3, before the cold comes): cave air moves with the pressure outside ('the book about limestone had said so'); the cold Fenn felt 'was the weather on the far side of the mountain, coming through the rock'", learned_chapter: 3, method: "inferred", note: "belief, not fact; continues the Ch.2 'Caves breathed'. The Ch.2 sentence naming the limestone book is cut, so 'the book' has no antecedent on the page (CH3-8)", source: "ch-03:p67" }
      - { fact: "at twenty to two a cold came from the crack: a single thread across the back of her left hand, then her breath white in the beam, drifting toward the crack; in the opening 'This cold came from somewhere behind the rock': dry, with an edge, 'where the cold off the walls was damp and slow', aching into the bones of her fingers to the wrist (the chest-freezer cold at the Acme); 'Under my cuff the steel of the watch took the cold and held it'; the hairs stood up along her forearm; the drip behind her went thin and far away, the bells at the mouth went and were gone; her ears filled with a pressure that did not pop; 'The beam of the flashlight shook on the rock'", learned_chapter: 3, method: "witnessed", source: "ch-03:p68; ch-03:p69; ch-03:p70" }
      - { fact: "the entry: flashlight between her teeth, the bag's strap over her head so the duffel hangs across her chest, left side to the opening, left foot in at the wide bottom; she 'sank onto my knees and went in sideways with my left shoulder first and my back flat to the slab', the bag pushed down in front of her in both fists, rock against the back of her head and her shoulder blades, wet stone 'a foot from my eyes'", learned_chapter: 3, method: "witnessed", source: "ch-03:p72; ch-03:p73" }
      - { fact: "inside the crack, kneeling: cold over her face and down her collar and up her sleeves to the elbows; the last sound (the bag's canvas scraping) went smaller and was gone; 'nothing at all'; she 'knelt in the nothing'; then a scalding blush into her cheeks and the tops of her ears, 'of a kind I had thought I was too old for', the embarrassment of walking into the wrong room ('I had the word sorry in my mouth'); there was no one there", learned_chapter: 3, method: "witnessed", note: "the outline's emotional surprise; recorded as perception. After the cut of the theft-scene 'My ears went hot' (old p66), this is the only heat in her face in Ch.3", source: "ch-03:p73; ch-03:p74; ch-03:p75" }
      - { fact: "she backed out; the bag caught on the slab and she pulled it free; 'Then I was in the hall again, upright' (she came out on her knees and stood)", learned_chapter: 3, method: "witnessed", source: "ch-03:p76; ch-03:p77" }
      - { fact: "after she backed out: the drip was going again; the air was cave air, wet and still; nothing came out of the crack against her hand", learned_chapter: 3, method: "witnessed", note: "she does not name this as the door shutting (the shut door is a planned Ch.6 discovery)", source: "ch-03:p78" }
      - { fact: "at the mouth: the light reaches far into the cave in a long slant, yellow going toward orange, every pebble with a shadow longer than itself; her watch says ten to two; the sun stands low and swollen over the western ridge; half the plateau is in shadow and the lit half 'a paper-bag brown that I put down to the light'; beyond it the high summits lit to their tops, 'gray rock all the way up the gullies where the snow had lain that morning'; on the slope below her 'the thyme was over, every flower head dried to a brown husk on its stalk'; a chill in the air 'that had not been there at noon'; woodsmoke from below; dung, 'close and fresh'; bells under the lip; the last paint boulder has no red on it and no ghost of red, only lichen rosettes as wide as her hand", learned_chapter: 3, method: "witnessed", source: "ch-03:p79; ch-03:p80; ch-03:p81; ch-03:p82; ch-03:p83" }
      - { fact: "more time has passed than an afternoon ('Lichen did not grow like that in an afternoon')", learned_chapter: 3, method: "inferred", source: "ch-03:p83" }
      - { fact: "it is October ('I stepped out into October')", learned_chapter: 3, method: "inferred", basis: "the autumn evidence she reads at the mouth: the low, long, yellow-to-orange light at what her watch calls ten to two (p80, p81); the snow gone from the summit gullies she had seen streaked with old snow that morning (p45 → p82); the thyme over, flower heads dried to brown husks (p82); the plateau gone brown, first excused as the light (p82); a chill not there at noon and woodsmoke (p82); the unblazed, lichened boulder (p83)", note: "her inference; no calendar and no year on the page. Agrees with the plan's autumn AD 70 (CH3-5 RESOLVED 2026-10-18)", source: "ch-03:p80; ch-03:p81; ch-03:p82; ch-03:p83; ch-03:p84" }
      # --- Ch.4 (prose) ---
      - { fact: "her book Greek is a liability. Her 'Khaire' (in the grammars' pronunciation) comes back as 'Khére', tried 'like a coin he suspected was lead'. Her Useful Phrases question gets 'Ti?'. His speech, 'fast and flat, the vowels pinched and everything I expected to be hard gone soft', slides past her (she catches *pothen* and *antrou* only). He stops her writing ('Mí! Mí gráfe') and rubs out her ΔΕΛΦΟΙ with his foot. He 'watched my finger and not where it went'", learned_chapter: 4, method: "discovered", note: "the outline's 'Adds: the language barrier is real; her book Greek is a liability' (outline:ch-04)", source: "ch-04:p9; ch-04:p10; ch-04:p11; ch-04:p15; ch-04:p18; ch-04:p27; ch-04:p29; ch-04:p30" }
      - { fact: "his speech, which otherwise slides past her with 'a sound in the middle I had no Greek letter for', carries the case endings she knows from her grammars and had 'only ever heard … in my own voice'", learned_chapter: 4, method: "discovered", note: "the recognition beat before she tries Attic ('Khaire', p9); added in Ch.4 polish cycle 1. The page states no conclusion from it: no year, no 'ancient', no 'past' (CH3-7)", source: "ch-04:p7; ch-04:p8; ch-04:p9" }
      - { fact: "the boy's word for her is nymphē. He says it three times; the third time, slowly, 'for the deaf', she watches his mouth and the letters surface: nu, an upsilon 'rounded tight, nothing like mine', mu, phi ('the same strokes as the ones cut beside the arch'), an eta 'that was not the eta of any grammar I owned' → 'Nymphē.' It is his answer to 'What is your name?': he sends his stick uphill to the cave mouth and brings its end round to rest on her breastbone. Earlier she took 'Nümfi' for HIS name ('Mara … Nümfi?'), and he laughed 'in high hiccups, like a much smaller child'. The paragraph before the last line ends 'his voice came down on an eta', so the closing 'Nymphē.' is his", learned_chapter: 4, method: "discovered", note: "the page gives the word and the gesture, not a gloss. Nymph / bride / young woman is the outline's meaning (outline:ch-04 beat 5). The chapter ends on the word (outline: NON-NEGOTIABLE)", source: "ch-04:p7; ch-04:p8; ch-04:p32; ch-04:p33; ch-04:p34; ch-04:p79; ch-04:p80; ch-04:p82; ch-04:p83" }
      - { fact: "the autumn reading holds: from the pen 'the plain lay in shadow. It was brown from end to end'; the goat track runs 'through dead thyme'; two threads of smoke; the low sun on the foil, then dusk and one star. Asked the month, the boy says 'Boathoos'", learned_chapter: 4, method: "witnessed", note: "the words 'autumn' and 'October' are not repeated in Ch.4. The page does not say whether she knows that Boathoos is a Delphic month or how it lines up with the calendar (character-bible: roughly Sept–Oct). Agrees with plan autumn AD 70 and Ch.3's inferred October", source: "ch-04:p23; ch-04:p24; ch-04:p56; ch-04:p60; ch-04:p62; ch-04:p73; ch-04:p80" }
      - { fact: "the boy's answers to her dating questions: the archon is 'Kleodamos' (which 'meant exactly as much to me as Nümfi had'); the month is 'Boathoos'; there is a Kaisar, 'Késar … En Rómi'. Asked which Kaisar, 'His name', he is busy telling a goat to get on", learned_chapter: 4, method: "told_by:goat-boy", note: "NO YEAR. Kleodamos is a fictional Delphic eponymous archon and NOT a dating clue (character-bible). 'A Kaisar in Rome' does not fix a reign. The outline rule 'Do not date the year here; that is Ch.5's beat' is kept", source: "ch-04:p22; ch-04:p24; ch-04:p25; ch-04:p63; ch-04:p64; ch-04:p65; ch-04:p66" }
      - { fact: "what she sees at the mouth and on the way down: on the rock round the arch, the face 'dressed flat' with sharp-edged letters, red paint in the strokes, 'ΝΥΜΦΑΙΣ, and further along ΠΑΝΙ, every letter there'; on the ledge, a clay lamp with a sooted nozzle and three knucklebones in a row. The path is 'only a goat track now', with no road ('He looked where I was looking and saw grass'). The pen stands where it stood that morning, whole herringbone, its corner keeping the same slant, with a brush hurdle tied with green withy. On the brown plain are low huts roofed with brush held down by stones, and grass where the road had crossed. The ridge above the far firs 'had only sky on it'", learned_chapter: 4, method: "witnessed", note: "she states no conclusion from any of it", source: "ch-04:p28; ch-04:p60; ch-04:p61; ch-04:p62" }
      - { fact: "Delphi lies down the mountain toward 'the dark gap between the mountains' (at the foot of the slope he takes her by the sleeve and turns her toward it: 'Delphous. Katō, katō. Delphous.'), and it is far ('Makran')", learned_chapter: 4, method: "told_by:goat-boy", note: "'That one I heard whole … and the back of my neck loosened'", source: "ch-04:p74; ch-04:p75; ch-04:p76; ch-04:p78" }
      - { fact: "BELIEF (Ch.4, shown in her actions, never stated in narration): she is somewhere where an archon, a king, a Kaisar in Rome and Attic Greek are the right questions", learned_chapter: 4, method: "inferred", note: "belief, not fact. No door, crossing or year is named (CH3-7 ch4_note)", source: "ch-04:p13; ch-04:p16; ch-04:p21; ch-04:p63" }
      # --- Ch.5 (prose) ---
      - { fact: "raw olives are inedible ('like biting chalk soaked in aspirin'); a girl on a terrace shouts 'You salt them first!'; Mara knows they are cured in brine for weeks, and the rest of what she knows comes 'from the backs of bottles'", learned_chapter: 5, method: "discovered", note: "plus told_by the olive girl; the brine curing is prior knowledge", source: "ch-05:p5" }
      - { fact: "the press woman's husband has been 'Two days at Kirrha with the jars'; she asks 'Where's your man?', and to 'I have no man' says 'Lucky'; she warns 'If you're going up to the god, take money … They charge you for breathing up there'", learned_chapter: 5, method: "told_by:olive-press-woman", note: "the Kirrha line is said to the sleeping boy (overheard)", source: "ch-05:p8; ch-05:p11; ch-05:p14; ch-05:p15" }
      - { fact: "this is the road to Delphi: 'Up there's the god and down there's the sea, and this is the road in between'", learned_chapter: 5, method: "told_by:pilgrim-family-with-kid", source: "ch-05:p17; ch-05:p18" }
      - { fact: "strangers read her as something to keep clear of: the pilgrim mother ('You don't know what she is'), the clay-figure seller who moves her board, the faces at the spring (the old woman with the laurel branch is cut in the author fixes)", learned_chapter: 5, method: "witnessed", source: "ch-05:p20; ch-05:p21; ch-05:p92" }
      - { fact: "the Castalian spring, a dry niche behind a wire fence in May 1998, now pours from bronze lion heads into a long basin, with a man taking coins at a table with a ladle", learned_chapter: 5, method: "witnessed", source: "ch-05:p21" }
      - { fact: "the market stalls sell gifts for the god (clay women, white wool, laurel) and strings of small pierced clay discs stamped with something worn too flat to read. They are 'too light for loom weights', and she 'could not think what else they might be for'", learned_chapter: 5, method: "witnessed", note: "UNIDENTIFIED by Mara. A man buys a string later (p93)", source: "ch-05:p23; ch-05:p93" }
      - { fact: "everyone passing the stone basin at the gate dips two fingers and touches the forehead; she does not (her hands black with olive paste)", learned_chapter: 5, method: "witnessed", source: "ch-05:p23" }
      - { fact: "the guide's tour: the Corcyraean bronze bull, dedicated from a tenth of the tunny catch after the god's answer, made by 'A man from Aegina'; the boxer from Thasos 'whose statue killed a man, which is another story and costs extra', with 'Everyone beats somebody at Delphi, and then they come and put it up where the others have to walk past it' (moved here from the cut Arcadians/Spartans speech); the runner from Kroton, three times at Olympia, in bronze with gilt on the wreath", learned_chapter: 5, method: "told_by:sacred-way-guide", source: "ch-05:p27; ch-05:p30; ch-05:p37; ch-05:p39; ch-05:p41" }
      - { fact: "the sanctuary is painted: the bronze bull polished, horns gilded, eyes inlaid; marble figures with tinted skin, red lips, painted lashes; the frieze of 'the next treasury' (not named) against Egyptian blue; the temple's frieze dark blue and red, the cornice banded red, blue and gold, gilded shields, gilt figures at the roof corners, the pediment figures with tinted skin and gilded hair", learned_chapter: 5, method: "witnessed", source: "ch-05:p31; ch-05:p36; ch-05:p67" }
      - { fact: "the Kroton base is empty and freshly robbed: two foot sockets; a raw, clean flake broken from the lip where a bar was driven in and leaned on; a chopped crumb of lead; chisel bites where lead was hacked out; old copper-green streaks with no bronze left above them. More empty bases: one with two holes, one with a single heel sawn off above the instep, a whole row along the terrace wall", learned_chapter: 5, method: "discovered", source: "ch-05:p42; ch-05:p44; ch-05:p45" }
      - { fact: "'The singer' (Nero) came for the games and was given the crown; his men took 'five hundred of the god's bronzes' down to Kirrha in ox-carts and onto ships; the Thessalians were taken off their horses and the horses left as 'bad bronze'; the guide says the singer died 'in a ditch outside Rome with his own knife in his neck'", learned_chapter: 5, method: "told_by:sacred-way-guide", note: "the guide never says Nero's name. Mara identifies him and corrects the death privately (next row)", source: "ch-05:p46; ch-05:p48; ch-05:p50" }
      - { fact: "the robbery is recent and the date is at least after June 68: Nero was in Greece for the games 66 into 67; he died in June 68 'in a freedman's villa and not a ditch, with the freedman's hand helping the knife'. 'It was at least that late, then.' The lead in the socket has 'dulled to a skin of gray', but scored 'with the edge of a coin from my pocket it was soft and bright underneath', which means 'two or three years of weather at the very most'", learned_chapter: 5, method: "inferred", note: "prior knowledge plus physical evidence. Her first dating step on the page", source: "ch-05:p51" }
      - { fact: "the guide reads the Greek capitals on her hundred-drachma coin 'perfectly well. They were his own letters'; he has never seen a hundred struck in brass", learned_chapter: 5, method: "witnessed", source: "ch-05:p55; ch-05:p56" }
      - { fact: "she passes the Athenian treasury without knowing which it is (in May it had stood 'white and alone on its terrace, the one on all the postcards')", learned_chapter: 5, method: "witnessed", note: "an absence of recognition, recorded", source: "ch-05:p65" }
      - { fact: "the temple's porch molding (key pattern in red and Egyptian blue) has been touched up: under a lifted flake is an older, paler, finer blue; the new blue is slopped over the old border, and a hand's breadth behind the column was missed", learned_chapter: 5, method: "discovered", source: "ch-05:p72" }
      - { fact: "on the god's steps she is read as unwashed, ownerless and a runaway ('Whose is she?', 'She's run off from some house'); her English is taken for Syrian", learned_chapter: 5, method: "overheard", source: "ch-05:p75; ch-05:p76; ch-05:p77; ch-05:p82" }
      - { fact: "the herald's proclamation, from letters 'up from Corinth with the ship': Titus Caesar, son of the Emperor, has taken Jerusalem by storm; the temple is burned, the city thrown down, the war in Judaea ended. The archon Kleodamos with the council and people of Delphi decree oxen for Pythian Apollo 'on the fourth day from now' for the Emperor Caesar Ouespasianos Sebastos and Titus Caesar his son; a garlanded procession from the council house to the altar; householders to set a lamp in the door on the eve and keep the day as a feast; strangers to keep clear of the altar; the meat given out in the square to citizens", learned_chapter: 5, method: "overheard", note: "a public proclamation; the clerk corrects the herald's titles (p100)", source: "ch-05:p95; ch-05:p97; ch-05:p99; ch-05:p100; ch-05:p102" }
      - { fact: "Ouespasianos = Vespasianus = Vespasian (Greek trying to say a Latin name 'the way the coins did', the coins she had cleaned 'with a cocktail stick')", learned_chapter: 5, method: "inferred", source: "ch-05:p107" }
      - { fact: "the Greek spoken in town is within her reach. The guide's speech is 'worn smooth, in a town Greek far nearer my books than the boy's had been on the mountain, and I lost none of it'. This is the stated basis of her comprehension in Delphi (contrast the goat-boy's speech, which 'slid straight past me, all but the case endings')", learned_chapter: 5, method: "discovered", note: "added in the author fixes, 2026-10-19; the limits are still on the page (the hired-man verb form, 'the only one the book had given me', p10; 'a word I had never seen written down', p80; the herald's 'fourth day' only 'nearly sure', p117-p118)", source: "ch-05:p28; ch-04:p8; ch-05:p10; ch-05:p80" }
