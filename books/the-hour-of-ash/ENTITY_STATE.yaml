  sacred-way-guide:
    canonical_name: "the guide"
    aliases: ["my guide"]
    importance: minor
    first_appearance: { chapter: 5, source: "ch-05:p22" }
    physical:
      age: { value: "not stated (the 'man of fifty' wording is cut in polish cycle 1)", at_chapter: 5, source: "ch-05:p24" }
      build: { value: "lean, bandy-legged", source: "ch-05:p24" }
      clothing: { value: "a brown cloak whose brooch has lost its pin, fastened through the wool 'with a long thorn instead, neatly, years ago'", source: "ch-05:p24" }
    traits:
      - { trait: "walks backward up the paving in front of the visitor; 'his feet found every broken slab on their own'", source: "ch-05:p24", mutable: false }
      - { trait: "a memorized speech 'given ten thousand times, worn smooth' (the bull, the boxer from Thasos, the runner from Kroton recited over an empty base, his palm cupped where a hip would be); Mara, in his 'town Greek', 'lost none of it'", source: "ch-05:p27; ch-05:p28; ch-05:p37; ch-05:p41", mutable: false }
      - { trait: "cares about the story and the fee, not the maker: 'Who made it? Nobody asks that. A man from Aegina, and they paid him … They want the fish, the people who come here, not the man from Aegina'", source: "ch-05:p30", mutable: false }
      - { trait: "feuds with a rival guide in green 'from Amphissa' who 'tells it all wrong'; warns against the wool woman who 'washes it in the horse trough'", source: "ch-05:p25; ch-05:p33; ch-05:p34; ch-05:p35", mutable: false }
      - { trait: "drops out of the speech, flatter, for 'The singer': the five hundred bronzes, the Thessalians' horses left as bad bronze, 'The god's own'; 'What is a stranger going to look at? The holes?'", source: "ch-05:p46; ch-05:p47; ch-05:p48; ch-05:p50", mutable: false }
      - { trait: "asks two obols, takes the hundred-drachma coin and reads its capitals 'where it lay on his palm, with his lips moving' (no biting on the page), then mimics her Attic to the crowd 'in my voice exactly'; at 'Keep the coin' in English he stops laughing, gives her 'a look of real interest', tucks the coin inside the cloak and goes back to the gate", source: "ch-05:p54; ch-05:p55; ch-05:p56; ch-05:p58; ch-05:p63; ch-05:p64", mutable: false }
    possessions:
      - { item: "taxi-drachma-coins (one: the hundred-drachma piece)", status: "inside his cloak", source: "ch-05:p64" }
    knowledge:
      - { fact: "Nero ('the singer') took five hundred bronzes; he died 'in a ditch outside Rome with his own knife in his neck'", learned_chapter: 0, method: "prior_knowledge", note: "his version; Mara privately corrects the death (freedman's villa, June 68)", source: "ch-05:p48; ch-05:p50; ch-05:p51" }
      - { fact: "the stranger pays in a brass hundred-drachma coin lettered in Greek, with a young man's head; speaks slow, schoolbook Attic, then an unknown tongue ('Keep the coin')", learned_chapter: 5, method: "witnessed", source: "ch-05:p55; ch-05:p56; ch-05:p57; ch-05:p63" }
    location_log:
      - { chapter: 5, location: "delphi-sacred-way", scene: "from the gateway up the Way to the bend above the Kroton base; then back to the gate", travel_noted: false, source: "ch-05:p22; ch-05:p53; ch-05:p64" }

