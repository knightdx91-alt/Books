      - { fact: "Mara is from 1998", learned_chapter: 25, method: "witnessed", note: "she speaks English to him", source: "outline:ch-25" }
      - { fact: "Mara has his 1968 notebook, bought at an estate sale in Chestnut Hill", learned_chapter: 25, method: "told_by:mara-reyes", note: "refuses it ('Keep it. I know what's in it.')", revised: "2026-10-18", source: "outline:ch-25; STATE:ARCH-17" }
      - { fact: "his sister Margaret is dead", learned_chapter: 25, method: "inferred", note: "from 'estate sale'; does not ask whose; the name is not spoken in Ch.25", revised: "2026-10-18", source: "outline:ch-25; character-bible.md#august-fenn-augurinus; STATE:ARCH-17" }
      - { fact: "1990s vocabulary such as 'voicemail' exists", learned_chapter: 26, method: "told_by:mara-reyes", note: "via her letter; rages (once only)", source: "outline:ch-26" }
