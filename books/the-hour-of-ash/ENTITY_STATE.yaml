      - { chapter: 3, detail: "FIRST INSTANCE (on the page). (a) She reaches into the crack: rock and air, cave cold, her palm flat in the opening feels no air moving (p62). (b) She slides her hand in at intervals while she waits: at 12:20 'the rock was still only rock' (p63). (c) At 1:40 the cold crosses the back of her left hand on her knee; she pushes her hand in, palm toward the dark: dry, edged cold aching to the wrist, the drip thinning, the bells gone (p69-p70). (d) She draws her hand out and goes in bodily (p72-p73). (e) Back in the hall, her hand held to the crack: nothing coming out (p78)", source: "ch-03:p62; ch-03:p63; ch-03:p69; ch-03:p70; ch-03:p72; ch-03:p78" }
