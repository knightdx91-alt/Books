# =====================================================================
# LOCATIONS
# =====================================================================
locations:

  philadelphia:
    canonical_name: "Philadelphia (1998)"
    era: "1998"
    aliases: []
    facts:
      - { fact: "modern frame city; Mara is American", source: "STATE:ARCH-1" }
      - { fact: "university museum: upper gallery (memorial reception); Mara's basement conservation lab (on the page Ch.2: always cold, a hood with a fan, raking lamp, magnifier, a fax machine)", source: "ch-01:p2 (upper gallery); ch-02:p6; ch-02:p7; ch-02:p8; ch-02:p44" }
      - { fact: "Pine Street's Antique Row: Irene Szabo's shop; sleet in March", source: "ch-01:p26; ch-01:p40" }
      - { fact: "Emilio's rowhouse: answering machine, nightstand (Seiko), shelf (Pentax), study (field notebooks); Mara waited at its window as a child", source: "ch-01:p163; ch-01:p167; ch-01:p190; ch-01:p192 (Pentax shelf is over the bedroom bureau); ch-02:p46 (study); foundation:§3" }
      - { fact: "Sansom Street: a jeweler (Seiko band shortened)", source: "ch-02:p14" }
      - { fact: "Baltimore Avenue: a check-cashing place with a notary (and lottery tickets)", source: "ch-02:p44" }
      - { fact: "1967 (Fenn's entry): St. George's (Father Kostas); 'the Terminal' (roast pork sandwich); 'the big new library at the university'", source: "ch-02:p1" }
      - { fact: "Jenkintown: the mailman who bought Fenn's Plymouth (1968)", source: "ch-02:p13" }
      - { fact: "Kennedy airport (New York): Mara's Olympic flight to Athens, Tue 19 May 1998", source: "ch-02:p52" }
      - { fact: "Chestnut Hill: Margaret Fenn's estate sale", source: "ch-01:p88" }
      - { fact: "Chestnut Street: the Horn & Hardart automat (Fenn's memory)", source: "foundation:§3" }
      - { fact: "Fenn's 1968 hall table where he left Margaret a note", source: "outline:ch-26; outline:ch-35" }
      - { fact: "the Venetian chart stays pinned over Emilio's desk when Mara leaves (window-matted; the mat board pinned to the cork strip, Sat 4 Apr)", source: "ch-02:p45" }
      - { fact: "Ch.1 weather, Saturday 14 March 1998: sleet in the afternoon ('cold sand' in the collar); plain rain by nearly five and after dark", source: "ch-01:p26; ch-01:p32; ch-01:p136; ch-01:p163" }
      - { fact: "Spruce Street (cab found two blocks from the museum's loading dock); the cab crosses the river (water 'the color of an old nickel') to Pine Street at Tenth", source: "ch-01:p32; ch-01:p36; ch-01:p37" }
      - { fact: "Antique Row: three blocks of narrow fronts (a tall-case clock with a replaced finial; Staffordshire dogs badly restored); szabo-shop among them", source: "ch-01:p40" }
      - { fact: "a trolley runs back toward the museum; Mara walks down from Thirty-Third Street", source: "ch-01:p136" }
      - { fact: "a lawyer's office on Walnut Street holds Emilio's estate 'waiting for a form'", source: "ch-01:p116" }
      - { fact: "the Free Library of Philadelphia, Walnut Street West branch (Emilio's overdue book); 1967: 'the Army map down at the Free Library' (branch not named) gives Fenn the cave's position", source: "ch-01:p170; ch-02:p2" }
      - { fact: "Chestnut Hill: Margaret Fenn's house, emptied for the estate sale last October; Bryn Mawr: where a decorator would hang the chart over a sofa", source: "ch-01:p88; ch-01:p110" }
      - { fact: "the Acme (supermarket): the memorial sheet cake; Szabo's paper sack", source: "ch-01:p2; ch-01:p133" }
      - { fact: "elsewhere mentioned in Ch.1: Wildwood (a seafood restaurant with Fenn's diving helmet); Kennedy airport / Queens / Amman (Doug's lost duffel)", source: "ch-01:p102; ch-01:p18" }

  university-museum:
    canonical_name: "the university museum (Philadelphia)"
    era: "1998"
    aliases: ["the museum"]
    note: "not named on the page; organization entry philadelphia-university-museum"
    facts:
      - { fact: "upper gallery: emptied of its cases for the afternoon except a long bolted-down run of Coptic textiles; parquet floor; folding tables down the middle (foil trays of baked ziti, a crockpot of meatballs with its cord taped to the parquet, an Acme sheet cake piped with a trowel, three lemon cakes); Sterno burning blue under chafing dishes; at the far end a slide carousel and a humming projector, shown on a screen", source: "ch-01:p1; ch-01:p2; ch-01:p25" }
      - { fact: "coat rack on rollers and the guest-book table by the elevators", source: "ch-01:p26" }
      - { fact: "a door marked STAFF to the back stairs: poured concrete painted battleship gray, handrail wrapped in electrical tape; out to a loading dock with an overhang on the south side of the building", source: "ch-01:p26" }
      - { fact: "front steps (Mara returns by them, nearly five)", source: "ch-01:p136" }
      - { fact: "Mara's conservation lab is in the basement: always cold; a fume hood with a fan; overhead light and a low raking lamp; a magnifier (she takes it home in June); a fax machine (Halloran's form comes through it, and she faxes the signed declaration to Naples from it)", source: "ch-02:p6; ch-02:p7; ch-02:p8; ch-02:p44; ch-02:p47" }
      - { fact: "storerooms: the North African lamp was damaged there c.1935 and mended with shellac", source: "ch-02:p6" }
    distances:
      - { to: "szabo-shop", value: "cab from Spruce Street over the river to Pine and Tenth; trolley back plus a walk down from Thirty-Third Street", source: "ch-01:p32; ch-01:p37; ch-01:p136" }

  szabo-shop:
    canonical_name: "I. Szabo · Maps · Prints · Small Antiques (Pine Street)"
    era: "1998"
    aliases: ["Szabo's shop"]
    facts:
      - { fact: "on Antique Row, Pine Street (Mara gets out at Tenth); window lettered in flaking gold 'I. SZABO · MAPS · PRINTS · SMALL ANTIQUES'; a stapled Chinese export platter on a wire stand in the window", source: "ch-01:p37; ch-01:p40" }
      - { fact: "door kept locked; buzzer and a speaker over the door; the door sticks ('Pull the door hard')", source: "ch-01:p41; ch-01:p135" }
      - { fact: "deep and narrow; smells of foxed paper and the hot dust on a space heater (orange bars by the counter); framed prints frame to frame on both walls (botanical plates, a Hogarth, the Battery in 1840); gray steel flat files at the back (drawers open with a steel shriek); glass counter; a small TV on a shelf behind the counter; a mat at the door; a ledger; a receipt pad; an old board cutter; a register", source: "ch-01:p45; ch-01:p48; ch-01:p54; ch-01:p67; ch-01:p121; ch-01:p131; ch-01:p134" }
      - { fact: "a barber next door (Szabo's five-dollar bet)", source: "ch-01:p113" }

  emilio-rowhouse:
    canonical_name: "Emilio Reyes's rowhouse"
    era: "1998"
    aliases: ["the house", "the Reyes house"]
    facts:
      - { fact: "on a narrow street off Baltimore Avenue; fourth in a row of twelve; porch sags toward the middle 'like a hammock'; a front window with the radiator under it (child Mara knelt on the radiator cover to watch the corner for taxis); a humming streetlight in front", source: "ch-01:p163" }
      - { fact: "the key sticks unless the door is lifted by the knob", source: "ch-01:p163" }
      - { fact: "Ch.1 state: two months of mail on the hall floor; refrigerator stocked by neighbors (foil, Tupperware, Dorothy's Pyrex), eggs with a January date, a jar of pickles; Gloria's ziti added", source: "ch-01:p164; ch-01:p165" }
      - { fact: "kitchen: table (china cabinet once in the room where slides were shown), counter, wall phone, the answering machine on the counter, a window over the sink", source: "ch-01:p11; ch-01:p165; ch-01:p167; ch-01:p193" }
      - { fact: "upstairs bedroom: radiator turned down; bed made badly; nightstand (Seiko on a folded handkerchief); clock radio with red numbers; shelf over the bureau (Pentax, a Cypriot lamp with a chipped nozzle, bathtub-swollen paperbacks); a basement (the greeting mentions Christmas lights)", source: "ch-01:p181; ch-01:p190; ch-01:p191; ch-01:p192" }
      - { fact: "phone number: one Mara has known by hand since before she could spell; written on Szabo's check", source: "ch-01:p126" }
      - { fact: "someone besides Mara has a key (neighbors have been in)", source: "ch-01:p165" }
      - { fact: "kitchen (Ch.2): a wall phone with a coiled cord pulled straight in places; the sink and a drainboard (the cereal box goes over its edge); dish rack; linoleum floor; a dish towel", source: "ch-02:p23; ch-02:p31; ch-02:p35" }
      - { fact: "a broom in the cellar way", source: "ch-02:p43" }
      - { fact: "study: the back bedroom, 'the only room in the house he had ever kept in order'; his desk with a blotter and chair; a strip of cork over the desk (once his site plans, now the chart's mat board); a bookcase whose bottom shelf holds decades of his field notebooks", source: "ch-02:p45; ch-02:p46" }
      - { fact: "a porch where circulars pile up; a flowerpot (Gloria: leave the key there, not under the mat); Dorothy's dish still in the refrigerator in May", source: "ch-02:p60; ch-02:p62" }
      - { fact: "Mara is there every Saturday by May; the duffel stands by its door the night before the flight", source: "ch-02:p55; ch-02:p68" }

  nicosia:
    canonical_name: "Nicosia (1998)"
    era: "1998"
    aliases: []
    facts:
      - { fact: "home of the unnamed friend with Emilio's 1992 Kourion drawings; raining; 'the place by the walls'", source: "ch-01:p172; ch-01:p173" }

  maras-apartment:
    canonical_name: "Mara's apartment (Philadelphia, 1998)"
    era: "1998"
    aliases: ["my own apartment"]
    facts:
      - { fact: "by May she uses it 'for very little else' than flossing", source: "ch-02:p50" }
      - { fact: "bathroom: a medicine-cabinet mirror with the silvering gone at one corner, and a light over it that buzzes", source: "ch-02:p50" }
      - { fact: "kitchen: the phone book on top of the refrigerator", source: "ch-02:p50" }
      - { fact: "hall closet: the half-packed canvas duffel; a dresser drawer: the passport at the back under a toaster warranty", source: "ch-02:p53" }

  university-library:
    canonical_name: "the university library (Philadelphia)"
    era: "1967 / 1998"
    aliases: ["the big new library at the university (Fenn, 1967)"]
    note: "not named; on the same campus as the museum by implication (Mara walks up at lunch and back down to the lab)"
    facts:
      - { fact: "1967: Fenn slit the uncut leaves of the German's volume there with his thumb; 'The girl at the desk looked at me like I came about the radiators'", source: "ch-02:p1" }
      - { fact: "1998: stacks where food is not allowed; the Leipzig 1838 volume in marbled boards on a bottom shelf; still slit only up to the scholion's page", source: "ch-02:p10" }
    distances:
      - { to: "university-museum", value: "up at lunch and back down to the lab (a walk; no figure)", source: "ch-02:p10; ch-02:p11" }

  delphi-modern:
    canonical_name: "Delphi (modern village, 1968 / 1998)"
    era: "1968 / 1998"
    aliases: ["the real Delphi isn't (Fenn)"]
    facts:
      - { fact: "'they picked up the whole village and moved it down the road so the French could dig' (Fenn, 1968; cf. Kastri moved in the 1890s, Ch.1)", source: "ch-02:p17" }
      - { fact: "1968: Fenn's room over a taverna; the owner's mother feeds him beans; a goat eats what is left on the sill, including half a postcard", source: "ch-02:p17" }
      - { fact: "1968: the Athens bus arrives here (a passenger leaves a week-old Herald Tribune on Fenn's table)", source: "ch-02:p54" }
    distances:
      - { to: "corycian-cave", value: "four hours up on foot (Fenn, 1968)", source: "ch-02:p17" }

  athens:
    canonical_name: "Athens"
    era: "1968 / 1998"
    aliases: []
    facts:
      - { fact: "Fenn flew in by TWA on 2 April 1968", source: "ch-02:p13" }
      - { fact: "the American consulate in Athens issued the effects carbon of 16 September 1968", source: "ch-02:p65" }
      - { fact: "Mara's Olympic Airways destination from Kennedy, Tue 19 May 1998", source: "ch-02:p51; ch-02:p52" }

  phoenix:
    canonical_name: "Phoenix (1998)"
    era: "1998"
    aliases: []
    facts:
      - { fact: "where Mara's mother lives (sent lilies)", source: "ch-01:p3" }

  naples:
    canonical_name: "Naples (1998)"
    era: "1998"
    aliases: []
    facts:
      - { fact: "Halloran phones from here about the Campanian survey season ('the office'; fax number begins 081 552; six hours ahead of Philadelphia)", source: "ch-01:p176" }
      - { fact: "Halloran's flat of thirty-one years, emptied for the move to 'the new place'; the telephone stays until the new tenants take over the line", source: "ch-02:p26; ch-02:p42" }
      - { fact: "the survey's season starts 6 July 1998 (three or four weeks); a dig house with a decent room with a window, unassigned (location not stated)", source: "ch-02:p40" }

  kalivia-plateau:
    canonical_name: "Kalivia plateau"
    era: "1998 / AD 70"
    aliases: []
    facts:
      - { fact: "trailhead to the Corycian Cave; thyme, goat bells, wind; a refuge hut (1998) that is a shepherd's stone pen in AD 70", source: "outline:ch-03; outline:ch-04" }
      - { fact: "reached via Olympic Airways to Athens and the KTEL bus to Delphi", source: "foundation:§9" }

  corycian-cave:
    canonical_name: "the Corycian Cave"
    era: "1998 / AD 41-71"
    aliases: ["the cave of the nymphs on Parnassus", "the nymphs' cave"]
    facts:
      - { fact: "the crossing site (Mara 1998; Fenn 1968)", source: "STATE:ARCH-2; foundation:§9" }
      - { fact: "sacred to Pan and the nymphs; tens of thousands of knucklebones excavated there", source: "foundation:§9" }
      - { fact: "vast first chamber; stalagmites; tourist graffiti (1998); a cold back recess at Fenn's coordinates", source: "outline:ch-03" }
      - { fact: "the trail's paint blaze is gone on the AD 70 side", source: "outline:ch-03" }
      - { fact: "shut after Mara's crossing: only cold (Ch.6), nothing (Ch.8)", source: "outline:ch-06; outline:ch-08" }
      - { fact: "Fenn left his coat at the cave mouth in 1968, the notebook in its pocket; a shepherd brought the coat down", source: "outline:ch-27; foundation:§3", ch2_note: "Ch.2 shows only the consulate forwarding the overcoat 'with contents of pockets' (ch-02:p66); CH2-3" }
      - { fact: "1968 (Fenn): 'a big wet barn of a place with names scratched all over the walls, a lot of them French'", source: "ch-02:p17" }
      - { fact: "1968 (Fenn): the slot is 'Way in past where the good light gives out, the rock comes down low on the left and there's a kind of slot you could get your arm into'. Cold air at its back for 'about a minute', then 'like somebody shut a door in another part of the house'; cold again one Tuesday morning; then nothing for weeks; on July 21 cold enough to see his breath, for 'a whole cigarette'", source: "ch-02:p19; ch-02:p20; ch-02:p69" }
      - { fact: "Fenn slept up there at least once (1968)", source: "ch-02:p21" }
      - { fact: "the scholion's name for it: 'the cave of the nymphs on Parnassus'", source: "ch-02:p1" }
    distances:
      - { to: "delphi", value: "most of a day down the mountain on foot", source: "outline:ch-05" }
      - { to: "delphi-modern", value: "'four hours up and every one of them uphill' to the plateau and the cave (Fenn, 1968)", source: "ch-02:p17" }

  parnassus:
    canonical_name: "Mount Parnassus"
    aliases: ["Parnassus"]
    facts:
      - { fact: "Thyiades' winter rites; women trapped by snow until dawn (Ch.8)", source: "outline:ch-08; foundation:§9" }
      - { fact: "high summer pasture with a shepherd hut (Ch.15)", source: "outline:ch-15" }

  delphi:
    canonical_name: "Delphi (AD 70-71)"
    aliases: []
    facts:
      - { fact: "genteel decline but busy; the temple of Apollo painted red, blue and gilt", source: "foundation:§9; outline:ch-05" }
      - { fact: "Sacred Way: crowds, hawkers, treasuries, painted statues, empty statue bases with fresh pry-marks (Nero took hundreds three years earlier)", source: "outline:ch-05" }
      - { fact: "Castalian spring; Kallia's pilgrims' lodging beside it", source: "outline:ch-05" }
      - { fact: "agora: herald announces Titus's capture of Jerusalem; reward notice for 'Lupus' posted", source: "outline:ch-05; outline:ch-09" }
      - { fact: "polygonal wall carries manumission records (sale to Apollo; paramone clauses)", source: "outline:ch-09; foundation:§9" }
      - { fact: "consultation on fixed (monthly) days in the warm season; the year's first on the seventh of Bysios; goat must shiver at cold water; women ask through a male representative", source: "foundation:§9; foundation:§3; outline:ch-13" }
      - { fact: "Theano's house (crows), where she names Pompeii to Mara off duty; Valens recounts the consultation at Kallia's lodging (not an inn)", source: "outline:ch-08; outline:ch-13; outline:ch-14" }

  valens-yard:
    canonical_name: "Valens's mule yard"
    aliases: []
    facts:
      - { fact: "on the Kirrha–Delphi road; mules, horses, a tack shed", source: "outline:ch-11; foundation:§3" }

  kirrha:
    canonical_name: "Kirrha"
    aliases: ["the Kirrha road"]
    facts:
      - { fact: "port below Delphi; Valens bought Felix off a slaver here", source: "foundation:§3" }
      - { fact: "harbor where Plautia's brother's freedman found Valens (autumn AD 70)", source: "outline:ch-12; foundation:§3" }
      - { fact: "Ariston's autumn letter sat at the harbor all winter while the sea was closed; up the hill with the first carter of the year", source: "outline:ch-10" }
      - { fact: "source of the consultation goat; road where Celer's men attack (one dies, two run)", source: "outline:ch-11; outline:ch-12" }
      - { fact: "embarkation for the gulf crossing to Lechaion (autumn AD 71)", source: "outline:ch-16" }

  corinth:
    canonical_name: "Corinth"
    aliases: []
    facts:
      - { fact: "Roman colony with games and an amphitheatre; no proconsul during Achaea's 'freedom' (late 67 to its revocation); a proconsul governs again from Corinth by 71 (in this book)", source: "foundation:§9; foundation:§3" }
      - { fact: "Plautia lives in her brother's house", source: "outline:ch-16" }
      - { fact: "provincial record office holds the archive copy of Valens's manumission; newly back under the restored proconsul, on whose staff Celer serves again", source: "outline:ch-16; outline:ch-17" }
      - { fact: "a colonnade where Celer meets Valens; scaffolding Celer won't walk under", source: "outline:ch-17" }

  isthmia:
    canonical_name: "Isthmia (the Isthmian Games)"
    aliases: []
    facts:
      - { fact: "games in spring AD 72 empty the city of officials; athletes, pine-crowns, sausage sellers", source: "foundation:§9; outline:ch-17" }

  lechaion:
    canonical_name: "Lechaion"
    aliases: []
    facts:
      - { fact: "Corinth's harbor on the gulf; arrival from Kirrha (Ch.16)", source: "outline:ch-16" }
      - { fact: "wet quay: the ten-word wedding; a mule refuses the gangplank (spring AD 72)", source: "outline:ch-18" }

  puteoli:
    canonical_name: "Puteoli"
    aliases: []
    facts:
      - { fact: "harbor with moles; arrival spring AD 72; view of Misenum's fleet and the mountain", source: "outline:ch-19" }
      - { fact: "Fenn's upper room by the harbor: star charts, wax tablets, a dead Zippo, a potted basil", source: "outline:ch-25" }
      - { fact: "sulphur fields and steam vents nearby (texture)", source: "outline:ch-27" }

  vesuvius:
    canonical_name: "the mountain (Vesuvius)"
    aliases: ["the mountain of vines by the western sea", "a fine mountain for vines"]
    facts:
      - { fact: "green, vine-covered, a single broad summit (AD 72)", source: "outline:ch-19" }
      - { fact: "not mentioned or framed in Ch.34 (Surrentum)", source: "outline:ch-34" }
      - fact: "a thread of cloud on the summit at dawn 19 Aug 79 'that may only be cloud'"
        source: "outline:ch-38; foundation:§4 row 38"
        resolved_from_conflict: true
        resolved_date: "2026-10-18"
        resolution_note: "C5: foundation's 'smoking very faintly' portent removed (STATE:ARCH-14)"
      - { fact: "column rises ~1 p.m. 24 Aug 79, umbrella-pine shape", source: "outline:ch-39; foundation:§9" }

  pompeii:
    canonical_name: "Pompeii"
    aliases: []
    facts:
      - fact: "still rebuilding after the AD 62 earthquake: scaffolds, patched columns, trades in demand — 'a city ten years after the quake and still mending' at the AD 72 arrival"
        source: "foundation:§9; foundation:§5; foundation:§10; outline:ch-19"
        resolved_from_conflict: true
        resolved_date: "2026-10-18"
        resolution_note: "C8: 'seventeen' corrected to 'ten' in outline Ch.19 and foundation §5; Ch.20 and Ch.30 cite no count (STATE:ARCH-14)"
      - { fact: "tombs line the roads out of every gate; the Herculaneum Gate road (marble benches, grand altars) and the Stabian Gate's few tombs have no painted door; use modern gate names, never a 'Vesuvius Gate'", source: "outline:ch-19" }
      - { fact: "Via dell'Abbondanza: Grata's thermopolium; the family rents rooms behind and the shop front", source: "foundation:§3; outline:ch-19; outline:ch-20" }
      - { fact: "painted election notices; one painted over the old earthquake crack in Grata's wall", source: "outline:ch-20" }
      - { fact: "amphitheatre and gladiator barracks", source: "outline:ch-21; outline:ch-28" }
      - { fact: "a street fountain (the pebble)", source: "outline:ch-20" }
      - { fact: "Temple of Isis", source: "outline:ch-32" }
      - { fact: "mime show at a street stage (Ch.29)", source: "outline:ch-29" }
      - { fact: "Nuceria Gate and its necropolis", source: "outline:ch-19" }
      - { fact: "Vinalia Rustica 19 Aug: first new wine, garlands", source: "outline:ch-38; foundation:§9" }
      - { fact: "news of Vespasian's death in the streets since late June 79; the posted notice in early July", source: "foundation:§9; outline:ch-36" }
    distances:
      - { to: "puteoli", value: "coast road past villas, salt pans and the Sarno; two days with mules and baggage, a night at a roadside inn near Neapolis", source: "outline:ch-19" }

  nuceria-gate-tomb:
    canonical_name: "the tomb with the painted false door (outside the Nuceria Gate)"
    aliases: ["the door", "the tomb", "where the dead go out of the city"]
    facts:
      - { fact: "a small freedman's tomb with a painted false door, in the necropolis outside the Nuceria Gate; the door home; marked in the god's answer as 'the door painted on a dead man's house'", source: "STATE:ARCH-3; STATE:ARCH-4; outline:ch-13; outline:ch-19" }
      - { fact: "AD 62: breathed cold for part of the quake night (tavern story Fenn heard three days later)", source: "outline:ch-25; foundation:§3" }
      - { fact: "AD 71 and AD 73: shut through Fenn's three-night vigils", source: "outline:ch-25" }
      - { fact: "Ch.19: faintly cool on a warm spring afternoon — dormant", source: "outline:ch-19" }
      - { fact: "Ch.30 (after a tremor): the same faint coolness under sun-warmed plaster, no colder; Valens sees it", source: "outline:ch-30; foundation:§4f" }
      - { fact: "Ch.36: cooler than before", source: "outline:ch-36" }
      - { fact: "Ch.41: cold in the hot night; strangers shelter in neighboring tombs", source: "outline:ch-41" }
      - { fact: "Ch.42: opens before dawn 25 Aug 79 onto a sodium streetlamp, chain-link fence, cicada, distant scooter, diesel and pine (1998, or near it)", source: "outline:ch-42" }
      - { fact: "Ch.43: the seam closes", source: "outline:ch-43" }

  nuceria-road:
    canonical_name: "the Nuceria road (the road between the tombs)"
    aliases: []
    facts:
      - { fact: "the family walks out along it at first light, 25 Aug 79", source: "outline:ch-44" }

  nuceria:
    canonical_name: "Nuceria"
    aliases: []
    facts:
      - { fact: "Grata's sister lives here", source: "outline:ch-38" }

  sarno-river-port:
    canonical_name: "the Sarno river port / mouth"
    aliases: ["the Sarno mouth"]
    facts:
      - { fact: "hired boat with a painted eye; the backup plan (early Aug 79)", source: "outline:ch-37" }
      - { fact: "24 Aug: sea heaving, rafts of pumice, onshore wind; boat cannot come in", source: "outline:ch-40" }

  stabiae:
    canonical_name: "Stabiae"
    aliases: []
    facts:
      - { fact: "Felix tries for it with the boat (Ch.40)", source: "outline:ch-40" }

  neapolis:
    canonical_name: "Neapolis"
    aliases: []
    facts:
      - { fact: "a roadside inn near it: the night stop on the two-day coast road, Puteoli → Pompeii (Ch.19)", source: "outline:ch-19" }
      - { fact: "Valens's proposed escape destination ('tomorrow')", source: "outline:ch-37" }

  misenum:
    canonical_name: "Misenum"
    aliases: []
    facts:
      - { fact: "the fleet, seen from the deck at Puteoli (Ch.19)", source: "outline:ch-19" }
      - { fact: "Fenn lay with fever here during the AD 62 quake and missed the Pompeii opening", source: "outline:ch-25; foundation:§3" }

  rome:
    canonical_name: "Rome (AD 74)"
    aliases: []
    facts:
      - { fact: "Basilica Julia tribunals: the dowry suit (actio rei uxoriae), spring AD 74, before a single iudex with assessors among the benches of other courts; no jury", source: "outline:ch-22; STATE:ARCH-5" }
      - { fact: "the Forum Mara visited as a student in 1991, now whole", source: "outline:ch-22" }
      - { fact: "Flavian Amphitheatre rising in scaffolding; the smell of the Tiber", source: "outline:ch-22" }

  appian-way-inn:
    canonical_name: "the inn on the Appian Way near Tarracina"
    aliases: []
    facts:
      - { fact: "flea-bitten roadside inn; bad supper; landlady; rain on the roof tiles; rough blanket", source: "outline:ch-23" }

  cumae:
    canonical_name: "Cumae (the Sibyl's cave)"
    aliases: []
    facts:
      - { fact: "long trapezoidal gallery, cut light; contains a dead door", source: "outline:ch-27" }
      - { fact: "approach via the Phlegraean fields and Lake Avernus", source: "outline:ch-27" }

  surrentum:
    canonical_name: "Surrentum"
    aliases: []
    facts:
      - { fact: "across the bay by boat; cliffs; a fish lunch; green water; an inn (summer AD 78)", source: "outline:ch-34" }

  emesa:
    canonical_name: "Emesa (Syria)"
    aliases: []
    facts:
      - { fact: "Ariston lives here with his wife", source: "outline:ch-10" }

  thrace:
    canonical_name: "Thrace"
    aliases: []
    facts:
      - { fact: "Valens's birthplace; onions drying under the eaves (memory)", source: "foundation:§3" }

