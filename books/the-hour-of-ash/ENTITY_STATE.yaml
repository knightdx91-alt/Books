      - { chapter: 3, location: "delphi-modern → arachova → kalivia-plateau → parnassus → corycian-cave", scene: "(reported) the flight from Kennedy; a room in Delphi with a balcony (the map, from a kiosk, plotted the first evening; the museum on Wednesday; the stadium in the last of the light); room given up at 7 a.m. on the climb day → (by means not stated) a taxi with a driver from Arachova to the end of the asphalt, a little after nine → on foot up the red-marked path above the plateau: the goats and goatherd; the herringbone pen; the firs (the German hiker); open zigzags; the last paint boulder; the cave mouth (inscription) → the first chamber (graffiti; the knucklebone by the slumped stalagmite) → up the flowstone past the daylight to the slab and the crack; waits from about noon; pees behind the big stalagmite at 12:30 → into the crack at 1:40, kneeling, left shoulder first → backs out on her knees and stands in the hall → down to the mouth; steps out (1:50 by her watch; the sun low)", travel_noted: true, note: "the Athens-to-Delphi leg (foundation's KTEL bus) is not staged; 'the four o'clock bus' is named only as the day-visitor's option. How she got from Delphi to Arachova is not stated", source: "ch-03:p3; ch-03:p4; ch-03:p7; ch-03:p9; ch-03:p10; ch-03:p14; ch-03:p15; ch-03:p45; ch-03:p48; ch-03:p49; ch-03:p51; ch-03:p55; ch-03:p60; ch-03:p63; ch-03:p65; ch-03:p72; ch-03:p76; ch-03:p82; ch-03:p84" }
      - { chapter: 4, location: "corycian-cave (mouth) → parnassus → kalivia-plateau (the pen, above the plain)", scene: "AD 70 (plan), autumn, late afternoon into dusk. At the mouth: goats scattered below the lip; the boy round the corner of the arch; the dressed rock with ΝΥΜΦΑΙΣ / ΠΑΝΙ, where she writes ΔΕΛΦΟΙ in the dust; she sits on the duffel and eats → down the goat track behind the boy and his goats → past the firs to the pen (whole herringbone; the plain below in shadow, brown, huts and smoke, no road; more firs across the plain) → 'Halfway down' (the thorn) → 'At the foot of the slope', where he takes her by the sleeve and turns her toward 'the dark gap between the mountains' (Delphi); the cave black in the gray cliff above with one star over it", travel_noted: true, note: "Location named by the page: 'the arch', 'the lip', 'the pen', 'the plain', 'the firs', 'the foot of the slope'. The words Kalivia, Livadi and Parnassus are not used in Ch.4. Order cave → firs → pen now matches Ch.3 in reverse (CH4-5 RESOLVED 2026-10-19)", source: "ch-04:p2; ch-04:p3; ch-04:p28; ch-04:p37; ch-04:p59; ch-04:p60; ch-04:p61; ch-04:p62; ch-04:p68; ch-04:p74; ch-04:p80" }
      - { chapter: 5, location: "kalivia-plateau → arachova (the AD 70 village) → descent-road-to-delphi (olive terraces; the press) → delphi (gymnasium track; castalian-spring; market square; sacred-way; temple-of-apollo-delphi; market square; castalian-spring at dark) → kallias-house (storeroom)", scene: "(night of the arrival) an hour walking in the dark toward 'a road that was not there', then a wall found with the flashlight and the corner of a sheepfold below the slope; at first light 'back the way it had come', eastward, over stubble to the lip, a cart track, the village where Arachova had been; down the valley road in loops past the olive terraces; the press in a farmyard at an elbow of the road (carries olives for lunch); the road from the gorge joins; past the running track; the cleft and the spring (not stopping); up into the town → the gateway (the guide) → the Sacred Way: the Corcyraean bull, the next treasury (frieze; unnamed), the Thasian boxer's place, the empty Kroton base (frame), the bend (the coin), more treasuries (the Athenian one missed), the polygonal wall, the black altar → the temple terrace (the Wednesday spot) → the temple steps and porch (seized; beaten down the steps and the ramp) → the colonnade in the market square below the gate (the herald; the clay-figure seller; the procurer at dusk) → the Castalian spring at nearly dark (Kallia) → up the road, a lane, the sieve neighbor's door → Kallia's courtyard (hearth under a lean-to) → the storeroom under the stairs", travel_noted: true, note: "the outline's 'most of a day down the mountain' is the opening line (p1). Day two of AD 70 on the page: the night in the sheepfold divides Ch.4's evening from Ch.5's day", source: "ch-05:p1; ch-05:p2; ch-05:p3; ch-05:p4; ch-05:p6; ch-05:p16; ch-05:p21; ch-05:p22; ch-05:p26; ch-05:p36; ch-05:p39; ch-05:p53; ch-05:p65; ch-05:p69; ch-05:p72; ch-05:p88; ch-05:p91; ch-05:p133; ch-05:p134; ch-05:p176; ch-05:p181; ch-05:p193; ch-05:p201; ch-05:p205; ch-05:p206" }
      - { chapter: 6, location: "corycian-cave → (backfill) kallias-house → castalian-spring → delphi → cliff-stair-above-delphi → kalivia-plateau → corycian-cave → cliff-stair-above-delphi → delphi", scene: "OPENS in the present: on her knees at the bend of the crack at the back of the cave, digging with Kallia's ash shovel (p1-p35). BACKFILL: the afternoon before, in Kallia's gateway and lane (the ice, the ashes, unloading the split oak, the woodstack under the outside stair); alone in the lane with Valens at dusk (the ask and the watch). That night: the storeroom; after midnight the morning's chores and two trips to the lions in the dark; the court; the turn of the lane. Before light: through the sleeping town past the high corner of the sanctuary wall; up the cliff stair towed by the gray's tail; daylight on the last of the cliff; the snowy plain on the gray; the pen under the firs; the cave mouth; across the hall to the slab and the crack (p36-p242). THEN: the wall, the bread; out into falling snow; down through the firs, past the pen and across the plain ('Past the pen we crossed the plain, and I did not see the huts', p307); the charcoal kiln at the top of the cliff path at dusk; down the stair in the dark; stopped at the first houses of Delphi (p243-p341). Earlier (reported): on her fourth morning at Kallia's she reached the top of the town with the duffel and turned back (p38)", travel_noted: true, source: "ch-06:p1; ch-06:p36; ch-06:p38; ch-06:p59; ch-06:p77; ch-06:p152; ch-06:p160; ch-06:p162; ch-06:p176; ch-06:p190; ch-06:p219; ch-06:p221; ch-06:p237; ch-06:p238; ch-06:p274; ch-06:p276; ch-06:p286; ch-06:p307; ch-06:p327; ch-06:p339" }
      - { chapter: 7, location: "delphi: kallias-house (court, storeroom, hearth) → delphi-latrine (her first week, recalled) → delphi-baths → the hillside below the castalian-spring (the lentisk) → delphi-market-square (the salt row) → castalian-spring (daily; the jar broken under the third lion) → delphi-council-hall → kallias-house", scene: "a winter at Kallia's, from the morning after the mountain to the last morning of the month of public silence: the shovel returned; the girl's clothes; lessons in walking, sitting and keeping her eyes down, in the court; the bath on a frosty morning; the salt market; a month of silence outside the gate; the carding evening; Valens at the gate; the drover at the spring; the Syracuse plan in the storeroom doorway; the registration at the council hall; the step; the court ('Maira. The water.'); the last morning (the broom; midwinter). No travel outside Delphi", travel_noted: false, source: "ch-07:p2; ch-07:p15; ch-07:p36; ch-07:p38; ch-07:p58; ch-07:p63; ch-07:p108; ch-07:p130; ch-07:p141; ch-07:p174; ch-07:p176; ch-07:p182; ch-07:p185" }
