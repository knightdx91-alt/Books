  halloran:
    canonical_name: "Prof. Halloran"
    aliases: ["Halloran"]
    importance: minor
    role: "Emilio's permit contact, phoning from Naples"
    first_appearance: { chapter: 1, mode: "answering machine", source: "ch-01:p192" }
    traits:
      - { trait: "in Naples; handles Emilio's permit for the Campanian survey season", source: "ch-01:p192", mutable: false }
      - { trait: "on the page: says 'ringing', 'rung'; apologizes before the request; never says 'died' ('the family of Professor Reyes', 'since January'); forgets the six-hour time difference; starts to give a fax number (081 552 …) and abandons it", source: "ch-01:p192", mutable: false }
    voice_markers:
      ref: "character-bible.md#prof-halloran"
    message_ch1:
      text: "Ah. Hello. This message is for the family of Professor Reyes. Ms. Reyes, I hope. It's Halloran, ringing from Naples. […] I'm very sorry indeed to be ringing about paperwork, of all things, and I'm sorry, I should have rung sooner, since January I've been meaning to. The difficulty is the permit. The permesso for the Campanian survey season is still in Emilio's name, and the Soprintendenza want a name on it by the twentieth of April or the season lapses, and then of course one begins again from nothing, which takes, well. Years, sometimes. I wondered whether the family would be sending anyone. Anyone at all. It needn't be an archaeologist, strictly, for the paperwork. Or you could fax, if it's easier, the number at the office is zero-eight-one, five-five-two, oh, I'll give it again at the end. I'll try you again. It's six hours later here than with you, which I always forget, so forgive me if I've woken anyone. Oh, the fax. No. I'll ring. Well."
      status: "last message on the incoming tape; erased by Mara (p194); he says he will ring again"
      source: "ch-01:p192; ch-01:p194"
    location_log:
      - { chapter: 1, location: "naples", scene: "message on the machine (from 'the office')", travel_noted: false, source: "ch-01:p192" }
      - { chapter: 2, location: "naples", scene: "phone call", travel_noted: false, source: "outline:ch-02" }
    note: "His Campania invitation is a neutral fact with no payoff by design."

