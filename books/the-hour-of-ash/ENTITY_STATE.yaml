  fathers-seiko-watch:
    introduced: "ch-01:p190"
    description: "Emilio's 1966 hand-wound Seiko; stopped on his nightstand; Mara winds it"
    physical:
      value: "steel case scratched in fine circles from trench walls; crystal nicked at two o'clock; steel band shortened by three links, so it sits snug against Mara's wristbone; must be wound by hand daily (she knows where the spring begins to resist)"
      source: "ch-01:p190; ch-01:p191; ch-02:p14; ch-02:p16; ch-02:p63"
      previous:
        - { value: "band at Emilio's size: far too big for Mara's wrist (slides over the knuckle of her thumb)", source: "ch-01:p191", until: "ch-02:p14 (Sansom Street jeweler; legitimate change, not a conflict)" }
    status: "chekhov_open"
    planted: 1
    custody:
      - { chapter: 1, holder: "mara-reyes", detail: "found face up on a folded handkerchief, band coiled, stopped at ten past four (stopped 'in January'); wound by the crown until stiff, set by the clock radio's red numbers, buckled on; ticking 'quick and light'", source: "ch-01:p190; ch-01:p191; ch-01:p193" }
      - { chapter: 2, holder: "mara-reyes", detail: "on her wrist; three links out at a Sansom Street jeweler ($8; the links in a stamp-sized manila envelope); wound each morning 'at whatever window I was standing near'; 'needed no packing'", source: "ch-02:p14; ch-02:p16; ch-02:p63" }
      - { chapter: 3, holder: "mara-reyes", detail: "RUNNING. Wound on the Delphi balcony that morning. Its luminous dots 'had stopped glowing years ago', so she reads it by flashlight in the cave: 12:20, 12:30; the cold 'came at twenty to two'; at the slot 'Under my cuff the steel of the watch took the cold and held it'; on her wrist at the slot; back at the mouth 'The watch said ten to two' while the sun stands low over the western ridge (watch time and sun time no longer agree; she does not reset it on the page)", source: "ch-03:p4; ch-03:p63; ch-03:p68; ch-03:p70; ch-03:p81; ch-03:p82" }
      - { chapter: 4, holder: "mara-reyes (presumed: on her wrist from Ch.3)", detail: "NOT MENTIONED in Ch.4; no clock time given. The plan's 'worn Ch.4-5' is not shown, which is an omission and not a contradiction", source: "ch-04 (absent); ch-03:p81" }
      - { chapter: 5, holder: "mara-reyes", detail: "on her wrist. The rod 'caught my wrist and the watch on it' (no damage stated). To Kallia: 'My father's Seiko says it was ten minutes' (the 1:40 → 1:50 crossing). In the storeroom (the planned beat): 'The watch was loud in the dark an inch from my ear'; she sleeps with her wrist under her cheek, listening to 'the mouse and the watch going about their two small businesses in the dark', so it is running. No clock time is read and it is not wound on the page. Cut in polish cycle 1: the skinned wrist, 'The watch was going; I listened to it at my ear to be sure', 'its luminous paint was long dead and the hands were invisible'", source: "ch-05:p86; ch-05:p159; ch-05:p210" }
      - { chapter: 6, holder: "mara-reyes → valens", detail: "WRITTEN. Before the deal: on her wrist, set to local time 'on my second day at Kallia's by the shortest shadow of her gatepost' (she says she has wound it 'every morning since March', which agrees with Ch.1; CH6-1 RESOLVED). The evening before the climb, in the lane, to 'A father, then.', she springs the stiff clasp in two tries ('The clasp was stiff with the cold') and passes it to Valens across the gray's withers, 'still warm on the inside of the band' ('This was my father's.' / 'You took it from him.' / 'He does not need it.'). He examines the back and the band 'where the three links had come out', watches the seconds hand go round once ('Something's going in it.' / 'Where's the shadow?'), and winds it BACKWARD, slowly and with great care, his thumb covering the crown entirely, stopping to listen to the loose backward click, until she says 'Stop. The other way.' She turns it forward three turns until it tightens. He then winds it forward himself until the spring is full and stops. The band 'would not go halfway' round his wrist, so it goes into the drawstring pouch at his belt: 'Paid now … Not up there. Now.' In the cave he shows her the dial on his palm without handing it over, at 'Ten past one, or near it' and at 'Five to two', and his fingers close over it. He refuses to sell it back ('You paid it to go up. You went up.'), will wind it 'Forward. Till it stops, and not past.', and ends the chapter with 'You never had a watch.'", source: "ch-06:p118; ch-06:p12; ch-06:p13; ch-06:p119; ch-06:p120; ch-06:p121; ch-06:p122; ch-06:p123; ch-06:p124; ch-06:p127; ch-06:p131; ch-06:p133; ch-06:p134; ch-06:p135; ch-06:p137; ch-06:p142; ch-06:p143; ch-06:p164; ch-06:p247; ch-06:p248; ch-06:p301; ch-06:p306; ch-06:p341" }
      - { chapter: 7, holder: "valens", detail: "NOT SEEN. Mara: 'My father's watch was in his belt pouch' (her belief from Ch.6); 'The hour had been lost to me since November; I had morning, noon by the shadow of Kallia's gatepost, and the day's end by the lamps'; she wonders 'whether he wound it before he saw to the mules or after, and whether he remembered which way'. Its trace is 'the white stripe where the watch had lived under its steel band since March', which the bath reads as a fetter mark", source: "ch-07:p48; ch-07:p107" }
      - { chapter: 11, holder: "valens", detail: "she does not get it back", source: "outline:ch-11" }
      - { chapter: 18, holder: "mara-reyes", detail: "returned on the quay as a wedding gift, wound; kept wound seventeen months; running, near enough the sun's noon that he must have set it by the shadow", source: "outline:ch-18" }
    windings:
      - { chapter: 6, by: "valens", detail: "BACKWARD (the loose click), several turns, until told; 'I let him turn it twice more'. SPENT per the character-bible: every later winding is forward and worded fresh", source: "ch-06:p131; ch-06:p133" }
      - { chapter: 6, by: "mara-reyes", detail: "forward 'three turns, until I felt it tighten', the watch lying flat in his palm (her last winding)", source: "ch-06:p135" }
      - { chapter: 6, by: "valens", detail: "forward himself until 'the crown pushed back against his thumb when the spring was full, and he felt it and stopped'", source: "ch-06:p137" }
      - { chapter: 24, by: "valens", detail: "winds it on her wrist while she sleeps", source: "outline:ch-24" }
      - { chapter: 32, by: "valens", detail: "at midnight, without a word", source: "outline:ch-32" }
      - { chapter: 41, by: "valens", detail: "in the tomb's niche by lamplight", source: "outline:ch-41" }
    physical_ch3: { value: "luminous dots dead ('had stopped glowing years ago'); steel case", source: "ch-03:p63; ch-03:p70" }
    physical_ch5: { value: "struck by the rod with her wrist (no damage stated); running in the storeroom. The luminous paint is no longer mentioned in Ch.5 (cut in polish cycle 1; Ch.3's dead dots stand)", source: "ch-05:p86; ch-05:p210" }
    physical_ch6: { value: "RUNNING and WOUND to full the evening before the climb; 'its steel gone dull with the cold'; the band 'hanging down between his fingers'; the steel link band (three links out) closes with a clasp, stiff with cold ('It took me two tries to spring it'; the editor's note calls it a fold-over clasp; there is no buckle); three links out of the band; 'The thin seconds hand was going round'. Read by torchlight in the cave (no luminous dial mentioned)", source: "ch-06:p12; ch-06:p119; ch-06:p123; ch-06:p137" }
    time_setting_ch6: { value: "set to AD 70 local time by Mara 'on my second day at Kallia's by the shortest shadow of her gatepost' (local noon). In the cave it reads 'Ten past one, or near it', later 'Five to two'. The May crossing reading (1:40) was on the 1998 setting. The page now names it: 'by Athens time, which ran an hour and more ahead of this sun' (CH6-8 RESOLVED)", source: "ch-06:p13; ch-06:p14; ch-06:p247" }
    what_valens_was_told_ch6: { value: "it tells the hours without shadow, sun or water and goes in the dark; wind every morning, forward until it will not go, never past; it runs 'A day and a night. A little more'; if forgotten it stops, and goes again when wound; inside a thin rolled strip and a little rocking wheel let the spring open one tooth at a time; men in a far country make thousands, for sale; dirt, cold, dropping or a run-down spring stop the wheel. NOT shown how to set the hands", source: "ch-06:p125; ch-06:p128; ch-06:p130; ch-06:p136; ch-06:p139; ch-06:p141; ch-06:p208; ch-06:p210; ch-06:p213; ch-06:p215; ch-06:p217" }
    secrecy_ch6: { value: "Valens: 'Men will come asking. You went up by yourself. You never had a watch.' Kallia was not present for the deal (she had gone in to the hearth). The charcoal burner is not shown seeing it", source: "ch-06:p76; ch-06:p341" }
