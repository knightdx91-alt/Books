timeline:
  - { chapter: 1, time: "Saturday 14 March 1998: forty minutes into the 2 p.m. memorial reception (~2:40) → Pine Street → back at the museum 'nearly five' → the house 'nearly dark'", season: "late winter (sleet turning to rain)", year: 1998, note: "no dateline in Part One. Date from the department office message 'Saturday the fourteenth, two o'clock' + Szabo's 'On a Saturday' + March (plan); 14 March 1998 is a Saturday. Gloria: Mara gone 'Two hours'. Emilio died in January (obituary, Seiko, Halloran); 'two months of mail'. Tía Nilda's call 'Thursday' = 12 March.", source: "ch-01:p1; ch-01:p58; ch-01:p136; ch-01:p158; ch-01:p160; ch-01:p163; ch-01:p164; ch-01:p174; outline:ch-01" }
  - { chapter: 2, time: "night of Sat 14 March 1998 (first reading) → Mon 16 Mar (lab; library at lunch) → a Thursday (jeweler; Thu 19 Mar by sequence) → Sat 28 Mar a little after 10 a.m. (Halloran) → Mon 30 Mar (fax arrives) → Wed 1 Apr (notarized, faxed) → Sat 4 Apr (chart hung) → Saturdays in the study → Tue 5 May just before midnight (decision; booking) → Sat 9 May (Gloria) → Sun 17 May (Pentax loaded) → a night and morning (notebook humidified; consulate carbon) → Mon 18 May night (last entry re-read)", season: "spring", year: 1998, note: "about nine weeks and three days (plan: eight weeks; CH2-4). Fenn's documents run Thanksgiving 1967 → 21 July 1968 and are read in order. Weekdays check: 28 Mar, 4 Apr, 9 May 1998 are Saturdays; 20 Apr and 18 May are Mondays; 5 and 19 May are Tuesdays. Halloran's targets: the 15th (his walk-over), the 20th (Monday; the deadline from Ch.1). Season starts 6 July. Mara tells Gloria she is back on 9 June. No date clash with Ch.1.", source: "ch-02:p3; ch-02:p6; ch-02:p14; ch-02:p23; ch-02:p35; ch-02:p44; ch-02:p45; ch-02:p50; ch-02:p52; ch-02:p55; ch-02:p61; ch-02:p64; ch-02:p65; ch-02:p68" }
  - { chapter: 3, time: "one day in May 1998 (date not stated; after a Wednesday spent in Delphi): room given up at 7 a.m.; taxi drop at the end of the asphalt a little after nine; climbing half an hour at the opening; the German in the firs; inside the cave mouth by noon; 12:20 and 12:30 by the Seiko; the cold at 1:40; through the crack and back out; at the mouth 'ten to two' by the Seiko, with the sun low and swollen over the western ridge", season: "spring (May: the plain 'green in a way nothing in Philadelphia was ever green in May'; old snow in the high gullies; ski lifts idle 'for the summer') → at the exit, autumn: 'I stepped out into October' (Mara's inference from the low orange light, the snow gone from the summit gullies, the thyme gone to husk, the browned plateau, the chill and woodsmoke, p80-p82; no calendar; CH3-5 RESOLVED)", year: "1998 → year NOT known to Mara (plan: AD 70)", note: "the crossing. Single scene, no breaks. A first evening in Delphi (map plotted); a Wednesday in Delphi (museum ticket); a postcard bought instead of calling Gloria. Flight was Tue 19 May from Kennedy, so the Wednesday is 20 May or later; the climb day is not dated. The Seiko runs 10 minutes across the crossing (1:40 → 1:50) while the sun outside stands at late afternoon: her watch keeps the 1998 day. Plan's timeline: AD 70, autumn (Ch.4-5), November (Ch.6).", source: "ch-03:p2; ch-03:p3; ch-03:p4; ch-03:p5; ch-03:p7; ch-03:p59; ch-03:p63; ch-03:p65; ch-03:p66; ch-03:p68; ch-03:p80; ch-03:p81; ch-03:p82; ch-03:p84; outline:ch-03; foundation:§10" }
  - { chapter: 4, time: "her first hour in the past: straight on from the Ch.3 exit (late afternoon, low sun) at the cave mouth → 'the low sun' on the foil wrapper → the plain below the pen 'in shadow' → the thorn flicked 'into the dusk' → at the foot of the slope, the cave 'black in the gray cliff with one star over it'", season: "autumn (plan). Page evidence: the plain 'brown from end to end', 'dead thyme', woodsmoke; the boy names the month 'Boathoos' (Delphic; character-bible ≈ Sept–Oct; not glossed on the page). Agrees with Ch.3's inferred 'October'", year: "AD 70 (plan) — NOT known to Mara: she gets archon 'Kleodamos', month 'Boathoos' and 'Késar … En Rómi', none of which dates it for her", note: "eight shards, in order, no time jump between them. No clock time: the Seiko is not mentioned. 'I came up from Delphi this morning' (to the boy, in English) matches the Ch.3 climb day. The outline rule 'Do not date the year here' is kept (Ch.5 gives the year)", source: "ch-04:p12; ch-04:p22; ch-04:p24; ch-04:p56; ch-04:p60; ch-04:p62; ch-04:p64; ch-04:p73; ch-04:p80; outline:ch-04" }
  - { chapter: 5, time: "the night after the arrival (an hour's walk in the dark, then a sheepfold, dew, a barking dog) → first light, east across the plain → the press at lunch → Delphi in the afternoon (on the temple terrace 'the light coming low') → the herald 'a little later' after the beating → the sun goes off the square an hour after → dusk (the procurer) → 'nearly dark' at the spring → night at Kallia's; she plans to be on the cart track 'by full light' the next morning", season: "autumn: the olive harvest (families beating olives onto cloths; the press working), the sea 'still open'. Mara's own word: 'the autumn of the year seventy'. CONFIRMS the plan", year: "AD 70 (known to Mara from this chapter; 'Nineteen ninety-eight, less seventy. One thousand nine hundred and twenty-eight years')", note: "five shards, in order; one night between Ch.4's dusk and Ch.5's day (Ch.5 is day 2 in AD 70). The herald's sacrifice is 'on the fourth day from now' (no month named). Plan Ch.6 is a November snow day, so the next-morning climb she plans (p210) either fails or is delayed off the page before Ch.6. Recorded, not judged. Mara's 1998 references: 'on Wednesday' (temple; ch-03 Wednesday), 'The morning before' (the taxi, subjective time)", source: "ch-05:p1; ch-05:p2; ch-05:p4; ch-05:p15; ch-05:p69; ch-05:p94; ch-05:p99; ch-05:p108; ch-05:p109; ch-05:p117; ch-05:p129; ch-05:p134; ch-05:p210; outline:ch-06" }
  - { chapter: 6, time: "two days, told out of order. PRESENT (shard 1, p1-p35): early afternoon of the climb day, in the cave ('The light's off the mouth. Past the middle of the day'; 'Ten past one, or near it' by the Seiko). BACKFILL (shard 2, p36-p242): 'The afternoon before' (the split oak in Kallia's lane; dusk, 'the pink had gone off the snow'); that night (little sleep; after midnight she 'did the morning'); before light (the town asleep; the cliff stair in the dark); 'Daylight arrived while we were on the last of the cliff', the sun clearing the ridge; the plain; the pen; the cave. AFTER (shard 3, p243-p341): 'Five to two' when she gives up; snow falling at the mouth; down through the firs and past the pen as the light fades ('so slowly that I could not have said when it was gone'); across the plain; dusk at the kiln at the top of the cliff path; after dark at the first houses (lamps in doorways, supper smoke)", season: "the edge of winter, snow season. Snow on the plain a hand deep, knee deep in drifts; ice on the cliff stair from the second turn; for a month the snow line has come 'a little lower on Parnassus every night', now down to the rim of the cliffs above the sanctuary; the sea shut (the last ship left Kirrha eight days before the delivery); the road over to Boeotia under snow. 'November' is the plan's word. The page never names the month, though it says the arrival was 'in October' (p90; p219). CONFIRMS the plan", year: "AD 70 (from Ch.5; not restated in Ch.6)", note: "ELAPSED: 'most of a month' since Ch.5's night at the spring ('Twice a day for most of a month', p37; 'a month', p95, p111, p164, p244, p271). About four weeks after the crossing; no day count. Other markers: the Seiko set 'on my second day at Kallia's' (p13); 'On the fourth morning' Mara turned back at the top of the town (p38); the kiln has burned 'Nine days' (p310); the god's ox (decreed in Ch.5 for the fourth day) is past (p312). WEATHER: the afternoon before, clear, the cliffs gray-blue and the snow pink at sunset; the climb only 'if the sky stays clear', so the night stayed clear; a gray dawn, then sun on the gilt roof; 'There's snow coming over the ridge' (seen from the mouth, early afternoon); 'a long bank of cloud … behind the ridge' at the pen ('Snow by afternoon'); snow begins while they are in the cave: 'big wet flakes, so thick that everything below the lip was gone'; wind below the mouth; snow falling straight down in the firs; still snowing at the kiln ('and now this'). No breaks within shard 3; one night between the backfill's afternoon and the climb", source: "ch-06:p10; ch-06:p12; ch-06:p13; ch-06:p20; ch-06:p36; ch-06:p37; ch-06:p38; ch-06:p39; ch-06:p69; ch-06:p77; ch-06:p90; ch-06:p145; ch-06:p149; ch-06:p152; ch-06:p160; ch-06:p176; ch-06:p190; ch-06:p220; ch-06:p247; ch-06:p274; ch-06:p276; ch-06:p286; ch-06:p310; ch-06:p312; ch-06:p327; ch-06:p339; outline:ch-06" }
  - { chapter: 7, time: "one winter at Kallia's, in order: first light on the morning after the mountain (the shovel) → 'Two days after it' (the girl's clothes) → the lessons over several days, in 'the slack hour after the lodgers had had their bread' → the bath, 'on a morning when the frost was still on the paving' → the salt market (the start of the month of public silence) → 'Halfway through my silence' (Valens at the gate) → 'Four days after that', at 'the end of the afternoon' (the jar) → 'that same night' (the Syracuse plan) → 'Tomorrow' (the council; 'the first word I had said outside her gate in nineteen days') → 'Before the month was out' → 'the last morning of the month', frost white on the court (the midwinter invitation)", season: "winter (frost on the paving; the cliffs 'white to their rim' and the plain under snow; the sea shut; the Thebans held 'till the thaw')", year: "AD 70 (the climb was in November, so the chapter opens in late November AD 70); whether it runs past the turn of the year is not stated", note: "Mara dates it 'the second year of Vespasian' (p1). Her narration names the months: the flashlight has lain in the duffel 'since October' (p10); the hour has been 'lost to me since November' (p107). 'fed me lentils for two months' (p157) agrees with an October arrival. No watch: morning, the gatepost's noon shadow and the lamps (p107). Day count: Valens about day 15 of the silence, the jar about day 19, the council the next day, which fits 'nineteen days' (p159). At the chapter's end the midwinter rite is still to come", source: "ch-07:p1; ch-07:p2; ch-07:p8; ch-07:p10; ch-07:p15; ch-07:p38; ch-07:p71; ch-07:p96; ch-07:p107; ch-07:p108; ch-07:p130; ch-07:p131; ch-07:p157; ch-07:p159; ch-07:p183; ch-07:p185; ch-07:p194" }
  - { chapter: 8, time: "one night to dawn", season: "midwinter", year: "AD 71", note: "Ch.7 sets it up: 'At midwinter the women climb Parnassus … They go every other winter, and this is the winter' (ch-07:p186; ch-07:p189). The page does not say whether midwinter falls before or after the turn of the year; the outline's AD 71 needs it to fall after (a note, not a conflict)", source: "outline:ch-08" }
