  # --- Ch.7 ---
  delphi-tribute-list-entry:
    introduced: "ch-07:p172"
    description: "Mara's entry on the Delphian council's tribute list, written in wax by the clerk Sosandros"
    text: "Maira, daughter of Aimilios, of Syrakousai; free; kinswoman of Kallia, of her house and in her keeping."
    made: { where: "delphi-council-hall, at the clerk's table", when: "winter AD 70 (the day after the jar; day 19-20 of the month of public silence)", by: "sosandros", answered_for_by: "kallia ('I do.')", fee: "two obols, from Kallia's kerchief knot ('don't tell me the god pays for wax')", source: "ch-07:p141; ch-07:p159; ch-07:p167; ch-07:p170; ch-07:p173" }
    occasion: { value: "every household and everyone in it, 'and what manner of person each was', is being entered on tablets because the talk is that Vespasian will take back Nero's freedom and Greece will pay tribute again, 'before Rome put a governor back in Corinth to ask for it'", source: "ch-07:p129" }
    medium: { value: "a fresh page in a wax book, the leaf warmed over the brazier; each letter 'surfaced pale in the dark wax where the bare wood showed through'; then the book is shut and added to his stack. Mara's understanding: the council will 'warm and scrape and write over' it for next year's list, 'the least lasting surface in Delphi'", source: "ch-07:p150; ch-07:p151; ch-07:p173; ch-07:p174" }
    questions_and_answers: { value: "'Who's in it?' (Kallia; four Thebans on the Boeotian list; 'her') / 'Bought, born in the house, or free?' 'Free.' / 'Kin?' 'My husband's brother's girl. From Syracuse.' 'Syrakousai' / 'Resident since when? On what business?' 'Her people died. She came on one of the last boats, after the vintage.' / 'Name' 'Mara' (written MAIRA) / 'Daughter of?' 'Aimilios.' 'A Roman.' 'Half Syracuse is Roman.' / 'And who answers for her?' 'I do.' … 'Write me.'", source: "ch-07:p143; ch-07:p144; ch-07:p146; ch-07:p147; ch-07:p148; ch-07:p149; ch-07:p150; ch-07:p152; ch-07:p153; ch-07:p154; ch-07:p158; ch-07:p161; ch-07:p162; ch-07:p163; ch-07:p164; ch-07:p165; ch-07:p166; ch-07:p167; ch-07:p169" }
    not_in_the_line: "told but not written: the husband's-brother relation, the boat, the vintage and the dead parents. 'A Roman' is also not in the line, although 'Sosandros wrote that down as well' (what 'that' refers to is not clear)"
    copies: "none given to Mara or Kallia on the page; Kallia cannot read it ('What did he put?')"
    knowers: "sosandros (wrote it); mara-reyes (read it upside down); kallia (told by Mara); the clerk's boy and the line of householders were present (what they took in is not stated)"
    depends_on_it: "outline: Ch.16 and Ch.18 (a free woman, never property)"
    status: "chekhov_open"
    last_mentioned: "ch-07:p178"
    resolution: null

