      ref: "character-bible.md#mara-reyes"
    relationships:
      emilio-reyes: { type: "daughter; grew up in his rowhouse (knelt on the radiator cover watching the corner for his taxis); installed his answering machine with him, December 1991", established: "ch-01:p1", current_status: "father deceased (January 1998). End of Ch.2: she has signed the heir's declaration for his permit (Wed 1 Apr); his Seiko is resized and on her wrist; his Pentax is loaded; the chart hangs over his desk; she has not taken down any of his field notebooks; she spends Saturdays in his study chair. Ch.3: carries his Pentax and wears his Seiko up Parnassus and through the slot; frames her first photograph as he framed his; remembers his September sherds and the cellar dark (the July she was seven)", source: "ch-01:p1; ch-01:p163; ch-01:p167; ch-01:p188; ch-01:p191; ch-01:p192; ch-02:p14; ch-02:p44; ch-02:p45; ch-02:p46; ch-02:p64; ch-03:p6; ch-03:p25; ch-03:p64; ch-03:p67" }
      maras-mother: { type: "daughter; mother lives in Phoenix", established: "ch-01:p3", current_status: "sent lilies and a card ('Thinking of you, sweetheart, today and always'); has said little about Emilio 'since 1981'; off-page. Ch.3: Mara tells the German hiker 'My mother's in Phoenix' (he takes her photograph 'for your mother')", ch3_source: "ch-03:p39; ch-03:p40; ch-03:p41" }
      gloria: { type: "cousin (side not stated on the page; character-bible: father's side)", established: "ch-01:p26", current_status: "Ch.2 (Sat 9 May, by phone): has heard from Pat about Greece; gets 'Till the ninth of June'; tells Mara to leave the key in the flowerpot and to call collect when she arrives. Ch.3: Mara has NOT called her (bought a postcard of the Charioteer instead). Ch.5: after the year comes, the next line is 'I had told Gloria the ninth of June.' To Kallia, in English: 'my cousin expects me home in June'", ch2_source: "ch-02:p55; ch-02:p56; ch-02:p61; ch-02:p62", ch3_source: "ch-03:p66", ch5_source: "ch-05:p110; ch-05:p159" }
      german-hiker: { type: "stranger on the Parnassus path (1998)", established: "ch-03:p15", current_status: "one meeting; she photographs him with his Olympus and he photographs her with the Pentax; last seen as a red speck crossing the plateau toward the road", source: "ch-03:p15; ch-03:p36; ch-03:p42; ch-03:p50" }
      doug-fessler: { type: "her father's dig colleague (eleven seasons in Cyprus, two in Sicily); acquaintance", established: "ch-01:p4", current_status: "offers to clear Emilio's office; asks if she is keeping the house (unanswered); absent from Ch.2" }
      pat: { type: "her father's next-door neighbor", established: "ch-01:p168", current_status: "Ch.2: Mara has asked Pat to keep an eye on the house, and Pat has told Gloria about Greece", ch2_source: "ch-02:p56; ch-02:p57" }
      valens: { type: "stranger-hire (Ch.6) → yard worker (Ch.11) → lovers (Ch.15) → wife (Ch.18)", established: "ch-06:p36 (first meeting, backfill: he brings split oak up Kallia's lane); first on the page ch-06:p5", current_status: "Ch.6: she hires him to take her up to the Corycian cave and pays with her father's Seiko the evening before ('Paid now. Not up there. Now.'). He takes her up and brings her down. He keeps the fee, refuses to sell it back, and tells her to deny it ('You went up by yourself. You never had a watch.'). Neither has asked the other's name. She learned his from Kallia; he heard hers only inside her English monologue and caught only 'Philadelphia'. Planned: married, parents of Lucius and Aelia", source: "ch-06:p48; ch-06:p143; ch-06:p164; ch-06:p165; ch-06:p301; ch-06:p334; ch-06:p335; ch-06:p341", ch7_status: "Ch.7: once, at Kallia's gate for the fifth coin, halfway through her month of public silence. She sees only his boots. 'She's taught you to walk.' / 'You've stopped talking.' / to Kallia's 'She's simple': 'No.' She says nothing to him. She thinks of the watch in his belt pouch", ch7_source: "ch-07:p96; ch-07:p101; ch-07:p102; ch-07:p104; ch-07:p106; ch-07:p107" }
      kallia: { type: "unpaid help (Ch.5) → registered dependent kinswoman (Ch.7) → farewell (Ch.16)", established: "ch-05:p137", current_status: "Ch.5: met at the Castalian spring at night. Kallia inspects her hands and teeth, tests her at carrying and asks about carding, weaving, grinding and cooking, asks 'Whose are you?' ('Mine.'), and takes her home as labor: 'Bring the jar.' No reply of Mara's to her is Greek on the page (English, a head-shake, or untagged; CH5-6). Terms: water, ashes, hearth, floors and the lodgers' pots; 'Don't touch the oil'; sleep in the storeroom under the stairs; a goat-hair blanket. No pay is mentioned. She learns Kallia's name only when a lodger shouts it from the gallery. Kallia never asks Mara's name. Planned: parted autumn AD 71", source: "ch-05:p137; ch-05:p147-p175; ch-05:p177; ch-05:p194; ch-05:p200; ch-05:p202; ch-05:p204; ch-05:p205; ch-05:p208", ch6_status: "Ch.6: most of a month of unpaid work for bed and lentils ('Does she hit you?' 'No.' / 'She feeds you.' 'Lentils.'). Kallia to Valens: 'Don't wait for an answer. She doesn't talk.' Mara still speaks no Greek to her and thanks her for the blanket in English. Before light on the climb day Kallia, from the dark at the top of the stair, says only 'The shovel comes back.' and 'Shut the gate behind you.' She has still not asked Mara's name ('Kallia has not asked it'). Valens's advice: 'Stay where you are. She'll keep you while you work.'", ch6_source: "ch-06:p37; ch-06:p61; ch-06:p115; ch-06:p154; ch-06:p155; ch-06:p156; ch-06:p291; ch-06:p292; ch-06:p293; ch-06:p294; ch-06:p295", ch7_status: "Ch.7: Mara returns the shovel and from then on talks to her in Greek indoors. Kallia dresses her in the girl's clothes, teaches her to walk, sit and keep her eyes down, lies for her at the bath, sends her to market, and asks her first questions about her country ('who carries the water?'). She invents the Syracuse cover, answers for her at the council ('I do.') and is written down as the woman in whose keeping she is. She asks 'Say your name for me.', calls her 'Maira' for the first time ('Maira. The water.') and invites her up the mountain at midwinter", ch7_source: "ch-07:p2; ch-07:p10; ch-07:p15; ch-07:p44; ch-07:p60; ch-07:p77; ch-07:p131; ch-07:p167; ch-07:p172; ch-07:p180; ch-07:p182; ch-07:p189" }
      charcoal-burner-parnassus: { type: "stranger at a kiln above Delphi; the goat-boy is 'my cousin's boy' to him", established: "ch-06:p182 (the man with a donkey on the path below); ch-06:p308 (at his kiln)", current_status: "Ch.6: knows her as 'the nymph' of his cousin's boy's story; was told by Valens she is the widow Kallia's, came off a ship, and 'hit Pan'; gave her roasted chestnuts; she answered him once ('It was oats')", source: "ch-06:p310; ch-06:p314; ch-06:p315; ch-06:p319; ch-06:p321; ch-06:p323" }
      sosandros: { type: "the council's clerk who registered her", established: "ch-07:p141", current_status: "wrote her onto the tribute list as Maira of Syrakousai, free, Kallia's kinswoman; heard her accent as Sicilian", source: "ch-07:p158; ch-07:p160; ch-07:p161; ch-07:p172" }
      salt-seller: { type: "market stallholder; mocked her Greek, then defended her", established: "ch-07:p63", current_status: "calls her 'Antigone'; drove the drover off at the spring ('She's Kallia's.') and then 'never glanced my way again'", source: "ch-07:p68; ch-07:p116; ch-07:p119; ch-07:p122" }
      drover-from-the-west: { type: "stranger at the spring", established: "ch-07:p108", current_status: "took her wrist; she dropped Kallia's jar; the salt-seller sent him off", source: "ch-07:p111; ch-07:p113; ch-07:p115; ch-07:p122" }
      kallias-runaway-girl: { type: "wears her clothes", established: "ch-07:p12", current_status: "never met; the girl's tunic, cord and himation are now Mara's to wear", source: "ch-07:p10; ch-07:p11; ch-07:p12" }
      sacred-way-guide: { type: "stranger; a guide who takes her up the Sacred Way uninvited", established: "ch-05:p22", current_status: "one afternoon. She pays him the hundred-drachma coin; he mimics her Attic to the crowd; she tells him in English to keep the coin; he goes back to the gate for the next stranger", source: "ch-05:p22; ch-05:p55; ch-05:p58; ch-05:p63; ch-05:p64" }
      temple-slave-with-rod: { type: "assailant", established: "ch-05:p84", current_status: "beat her off the temple steps and down to the ramp; his rod split on her", source: "ch-05:p84; ch-05:p85; ch-05:p86; ch-05:p89" }
      felix: { type: "household member", established: "outline:ch-11", current_status: "planned: family's first member; fate open after Ch.40" }
      plautia: { type: "jealousy → first female friendship in the past", established: "outline:ch-16", current_status: "allies (Ch.16-22)" }
      pomponia-grata: { type: "landlady and neighbor; rents rooms (Ch.19) and shop front (Ch.20)", established: "outline:ch-19", current_status: "neighbor through Ch.40" }
      august-fenn: { type: "reader of his 1967-68 notebook (Ch.2) → fellow traveler; correspondent; friend; she nurses his death", established: "ch-02:p1 (documents); in person outline:ch-25", current_status: "Ch.2: knows him only from his notebook, the chart and the consulate carbon; packs his notebook. Ch.3: follows his coordinates to the cave and the slot; thinks of him on this floor in the dark 'most of a summer'; refuses his way of waiting ('I was going in properly or I was going home'); carries his notebook through. Planned: Fenn dies winter AD 78-79 (Ch.35)", ch3_source: "ch-03:p7; ch-03:p67; ch-03:p71" }
      lucius: { type: "mother", established: "outline:ch-24", current_status: "planned" }
      aelia: { type: "mother", established: "outline:ch-26", current_status: "planned" }
      halloran: { type: "her father's permit contact; phone only", established: "ch-01:p176", current_status: "1998 only. Ch.2: he rings Sat 28 March and she answers. She signs and faxes the heir's declaration (Wed 1 Apr). He asks for Emilio's last-season notebooks by the end of June (not sent on the page). His invitation for 6 July 'in Emilio's place' gets 'I might be in Greece'.", ch2_source: "ch-02:p23; ch-02:p36; ch-02:p38; ch-02:p40; ch-02:p41; ch-02:p44" }
      irene-szabo: { type: "seller of the map", established: "ch-01:p41", current_status: "1998 only; holds Mara's $1,150 check (bearing Emilio's house phone number) and her license number" }
      theano: { type: "the Pythia who names Pompeii to her", established: "outline:ch-13", current_status: "one meeting" }
      goat-boy: { type: "the first person she meets on the far side of the crossing (AD 70); unnamed", established: "ch-04:p3", current_status: "one evening. He calls her nymphē and learns her name ('Mára'). He spits out her granola bar and keeps the foil wrapper. He feeds her cheese and barley bread from his bag. He leads her down past the firs and the pen to the foot of the slope, takes her by the sleeve and turns her toward Delphi ('Delphous. Katō, katō'; 'Makran'). His own name is never given. Ch.5: 'The boy had left me where the slope ran out and gone off over the plain behind his goats, toward the smoke'; his track is part of her plan to climb back up", source: "ch-04:p3; ch-04:p35; ch-04:p46; ch-04:p51; ch-04:p58; ch-04:p59; ch-04:p74; ch-04:p75; ch-04:p78; ch-04:p83; ch-05:p1; ch-05:p136" }
    possessions:
      - { item: "fathers-pentax-k1000", acquired: "ch-01:p192 (on her father's shelf); taken down and loaded ch-02:p64", status: "Ch.1: handled and put back on the shelf. Ch.2: loaded at the house's kitchen table on the Sunday before the flight (Sun 17 May) with a new roll of Kodak (36 frames); counter at 1; no frames taken. Ch.3: in the end pocket of the duffel (CH2-6 resolved); used on the path and at the mouth (six frames on the page; see objects.film-roll); goes through the slot with her; lens cap off, in her jacket pocket. Ch.4: not mentioned; no frames shot. Ch.5: 'I unzipped the end of the duffel for the Pentax and spent a frame on the base'; the shutter 'fired like a slammed drawer'; the guide flinches ('What was that? What did it do?'). Not mentioned again in Ch.5 (the storeroom inventory naming it is cut in polish cycle 1). Planned: frame 36 Ch.38, roll rewound and removed; camera back on the shelf (not packed)", ch3_source: "ch-03:p6; ch-03:p49", ch5_source: "ch-05:p52" }
      - { item: "film-roll", acquired: "ch-02:p64 (a new roll of Kodak loaded)", status: "Ch.2: 36 frames, 0 taken (two blank advances with the cap on, to frame 1). Ch.3: 'a little of the roll' spent in Delphi before the climb (count not stated) + six frames on the page (plateau; the pen's join x2; Mara, taken by the German; the cave arch; the inscription with the lens cap). The counter is never mentioned. Ch.4: no frames (camera not mentioned). Ch.5: one frame, the empty Kroton base close up (the first antiquity frame; unscheduled on the page, CH5-3). Running count: plan 9 shot, 27 left; page at least 8 shot, at most 28 left. Planned: 8 frames shot in 1998; canister packed Ch.38; sent through the door Ch.43", ch3_source: "ch-03:p6; ch-03:p13; ch-03:p14; ch-03:p42; ch-03:p46; ch-03:p49", ch5_source: "ch-05:p52" }
      - { item: "microcassette", acquired: "ch-01:p188 (ejected from the answering machine's greeting well)", status: "Ch.1: in her jacket pocket, buttoned. Ch.2: in the jacket 'since March' (in her pocket beside the jeweler's envelope, ch-02:p16), then put inside a wool sock, rolled tight, in the toe of a hiking boot at the bottom of the bag (ch-02:p63). Ch.3: in its sock 'down among my clothes' in the duffel since she laced the boots on at home; touched without comment as she gropes for a granola bar in the dark of the cave (ch-03:p63); crosses with her in the duffel (CH3-6 RESOLVED 2026-10-18). Ch.4: her hands find the granola box 'under the sweater, beside the sock' (ch-04:p43). The tape is not named, so this is read as the Ch.3 tape sock by its definite article. Ch.5: in the storeroom, her right sock soaked, she reaches into the bag for a dry one, and 'my hand closed on the sock and the hard little oblong in its toe. I let it be and drew out the sweater instead'. No comment, tape not named; the only Ch.5 touch (the planned Ch.5 touch; CH5-4 on the count). Planned: next touches Ch.19 and Ch.35; sent through the door Ch.43", ch5_source: "ch-05:p209" }
      - { item: "fathers-seiko-watch", acquired: "ch-01:p190-p191 (nightstand; she winds it, sets it by the clock radio, buckles it on)", status: "Ch.1: on her wrist, too big. Ch.2: three links taken out at a Sansom Street jeweler (Thursday after work, $8), so it sits snug against her wristbone; wound each morning; 'needed no packing' (ch-02:p14; ch-02:p16; ch-02:p63). Ch.3: wound on the Delphi balcony that morning; running throughout (read at 12:20, 12:30, 1:40; 'ten to two' at the mouth with the sun low in the west); at the slot 'Under my cuff the steel of the watch took the cold and held it'; on her wrist through the slot (ch-03:p4; ch-03:p63; ch-03:p68; ch-03:p70; ch-03:p81). Ch.4: not mentioned (no clock time on the page). Ch.5: the rod catches 'my wrist and the watch on it' (no damage stated); cited to Kallia ('My father's Seiko says it was ten minutes'); in the storeroom 'The watch was loud in the dark an inch from my ear', and she listens to 'the mouse and the watch going about their two small businesses' with her wrist under her cheek, so it is running. Not wound on the page in Ch.5. (Cut in polish cycle 1: the skinned wrist, 'I listened to it at my ear to be sure', 'its luminous paint was long dead'.) Planned: paid to Valens Ch.6; returned wound and running Ch.18; on her wrist Ch.43-44", ch5_source: "ch-05:p86; ch-05:p159; ch-05:p210", ch6_status: "Ch.6: set to local time 'on my second day at Kallia's by the shortest shadow of her gatepost'. She says she has wound it 'every morning since March' (agrees with Ch.1; CH6-1 RESOLVED). The evening before the climb she springs the clasp and pays it to Valens as his fee for the climb ('This was my father's.' / 'He does not need it.'). From then on it is in VALENS's keeping (his belt pouch); see objects.fathers-seiko-watch", ch6_source: "ch-06:p13; ch-06:p119; ch-06:p120; ch-06:p122; ch-06:p142; ch-06:p143; ch-06:p164" }
      - { item: "seiko-band-links", acquired: "ch-02:p14 (three links in a stamp-sized sealed manila envelope)", status: "she leaves the shop with the envelope in her pocket beside the tape (p16); where it goes after that is not stated" }
      - { item: "fenn-notebook", acquired: "ch-01:p98-p99 (in the Phillies cigar box that 'comes with' the chart)", status: "Ch.2: read in rations from the night of 14 March (kitchen; later the study on Saturdays); the stuck back leaves were humidified overnight and the consulate carbon found in the back-cover pocket; then it 'went into the duffel last, on top'; she re-reads the last entry the night before the flight (ch-02:p3; ch-02:p5; ch-02:p46; ch-02:p65; ch-02:p67; ch-02:p68). Ch.3: in her jacket with the walker's map; its straight edge used on the map in Delphi; the slot directions re-read by flashlight in the cave; through the slot with her (ch-03:p7; ch-03:p60). Planned: tremor notes in its back pages from Ch.20; offered to Fenn and refused Ch.25; read by him and returned Ch.35; sent through the door Ch.43" }
      - { item: "consulate-effects-slip", acquired: "ch-02:p65 (folded in three in the receipt pocket inside the notebook's back cover)", status: "read, refolded along its creases and put back in the pocket (p67); travels inside the notebook" }
      - { item: "phillies-cigar-box", acquired: "ch-01:p98 ('This comes with it … The box is free')", status: "Ch.1: in the Acme sack on Emilio's kitchen table at chapter end (ch-01:p193). Ch.2: not mentioned (the sentence returning the notebook to its tobacco crumbs is cut); only the notebook goes into the duffel (ch-02:p67)" }
      - { item: "venetian-map", acquired: "ch-01:p102-p131 ($1,150 by check, with a board; Szabo asked $1,400)", status: "Ch.2: window-matted (four-ply board; where is no longer stated after the author fixes; hinged with tissue and wheat starch paste), carried flat in a portfolio, and the mat board pinned to the cork strip over Emilio's desk on the first Saturday in April (Sat 4 Apr) (ch-02:p45). Stays in Philadelphia; not packed" }
      - { item: "fathers-house-key", acquired: "prior ('You still have a key?' 'I have a key.')", status: "used Ch.1; the lock sticks unless the door is lifted by the knob. Ch.2: Gloria tells her to leave it in the flowerpot, 'Not under the mat' (ch-02:p62); whether she does is not stated", source: "ch-01:p160; ch-01:p161; ch-01:p163; ch-02:p62" }
      - { item: "corycian-knucklebone", acquired: "ch-03:p55-p58 (found at the edge of a drip-basin near the slumped stalagmite; lifted; not photographed; 'I pocketed it')", status: "Ch.3: in a pocket, her hand around it; she means to hand it in at the Delphi museum on the way down; goes through the slot with her. Ch.4: not mentioned (the hand-on-bone sentence was cut in polish cycle 1; the ledge's three offered knucklebones remain, ch-04:p28; CH4-1 RESOLVED). Ch.5: not mentioned; her Ch.3 plan to hand it in at the Delphi museum is not recalled. Planned: Lucius's by Ch.26; Lucius gives it to Aelia Ch.41; in Aelia's fist Ch.44" }
      - { item: "maras-duffel", acquired: "prior (half packed in her hall closet 'as it had in every apartment since college')", status: "Ch.2: packed (change of clothes, toothbrush, floss in the outside pocket, granola bars, Advil in the side pocket, hiking boots with the sock and microcassette at the bottom, flashlight implied, Fenn's notebook last, on top); by the door the night before the flight. Ch.3: carried up from the end of the asphalt (strap on the right shoulder, then the left); the German: 'You are carrying your whole house'; sat on in the dark; strap over her head, bag across her chest and pushed ahead of her into the crack; catches on the slab and is pulled free. Ch.4: she sits down on it when her knees give; she opens the zipper and finds the granola box 'under the sweater, beside the sock'. It is not mentioned after p43. Ch.5: her pillow in the sheepfold (p1); with her all day; torn from her grip on the temple steps and recovered (p83-p86); slung crosswise against the procurer (p133); in Kallia's storeroom the flashlight stays in the bottom of it (p206) and it yields the sweater for a pillow (p209). So it came down the mountain with her", source: "ch-02:p53; ch-02:p63; ch-02:p67; ch-02:p68; ch-03:p2; ch-03:p18; ch-03:p63; ch-03:p72; ch-03:p73; ch-03:p77; ch-04:p37; ch-04:p43; ch-05:p1; ch-05:p83; ch-05:p86; ch-05:p133; ch-05:p206; ch-05:p209" }
      - { item: "flashlight", acquired: "ch-02:p63 (bought 'because Fenn had wanted a better one')", status: "Ch.3: used in the cave (a yellow oval showing a yard of rock at a time); switched off to save the batteries while she waits; held between her teeth through the crack; taken out of her mouth back in the hall. Ch.5: used once in the dark at the foot of the slope: 'I found a wall with the flashlight, and a dog somewhere out on the plain went frantic at the beam until I put it out' (p1); in Kallia's storeroom it stays 'somewhere in the bottom of the duffel, and it could stay there; Kallia was not going to come back and find a light under her stairs that burned nothing' (p206). Planned: shown to Valens Ch.15", ch3_source: "ch-03:p55; ch-03:p60; ch-03:p63; ch-03:p72; ch-03:p77", ch5_source: "ch-05:p1; ch-05:p206" }
      - { item: "granola-bars", acquired: "ch-02:p63 (two boxes 'for the plane and then for the mountain'; shedding oats into the duffel's seams within a day)", status: "Ch.3: no count given (the 'box and a half' at the German meeting is cut in the author fixes); one eaten at the second rest stop (wrapper chased into a thornbush), another in the dark of the cave (oats down her front). Ch.4: one green-foil pouch ('Two bars were inside, as there always were'). She gives him one; he bites, spits it all out and hands back the rest ('Kopros'). She eats hers and then his remainder. He keeps the wrapper. The count left is not stated (CH4-2). Ch.5: a pouch opened with her teeth at dawn in the sheepfold; 'I had the rest of the granola'; count not stated (the storeroom 'corners of the granola box' are cut in polish cycle 1)", ch3_source: "ch-03:p45; ch-03:p47; ch-03:p63", ch4_source: "ch-04:p43; ch-04:p45; ch-04:p46; ch-04:p49; ch-04:p50; ch-04:p57", ch5_source: "ch-05:p1; ch-05:p136" }
      - { item: "taxi-drachma-coins", acquired: "1998: change from the Arachova taxi (Ch.3 'I paid him what he asked without understanding the number', ch-03:p3); first on the page in Ch.5", status: "Ch.5: three coins in her jeans pocket; the biggest, a hundred-drachma piece, goes to the guide, who keeps it inside his cloak; two remain in her jeans pocket (denominations not stated). Ch.6: she offers Valens 'the bigger' of the two ('brass, and the head of an old man with a beard'; 'A poet.'; the denomination is not on the page, and the editor's note identifies it as the 50-drachma piece; CH6-2 RESOLVED); he hands it back ('That buys nothing up there. Or down here.'); two remain", source: "ch-03:p3; ch-05:p55; ch-05:p64; ch-06:p107; ch-06:p110" }
      - { item: "kallias-ash-shovel", acquired: "ch-06:p152 (taken from the ash pail by the hearth the night before the climb; on loan: 'The shovel comes back.')", status: "used to dig the crack's floor; left lying in the crack, fetched by Valens; handed back to her at the first houses of Delphi after dark (ch-06:p273; ch-06:p340). Not yet returned to Kallia on the page", source: "ch-06:p152; ch-06:p154; ch-06:p273; ch-06:p340", ch7_status: "RETURNED to Kallia at first light on the morning after the mountain, its edge turned on 'the god's rock' (objects.kallias-ash-shovel, chekhov_closed)", ch7_source: "ch-07:p2; ch-07:p3; ch-07:p7" }
      - { item: "ibuprofen", acquired: "ch-02:p63 ('a bottle of Advil', rattling in the duffel's side pocket against the floss)", status: "Ch.3: 'the Advil bottle chattered in its pocket whenever I moved' (ch-03:p63). Planned: last two given to Theano for her knees Ch.13 (a payment); optional past-facing mention Ch.32" }
      - { item: "walkers-map-parnassus", acquired: "ch-03:p7 (from a kiosk in Delphi; plotted 'the first evening')", status: "in her jacket with Fenn's notebook. Ch.4: only recalled ('antrou, which was nearly the word printed on my walker's map beside a little black symbol'), not taken out (ch-04:p18)" }
      - { item: "charioteer-postcard", acquired: "ch-03:p66 (in Greece, 'instead' of calling Gloria; where and when no longer stated)", status: "in the bag, unwritten" }
      - { item: "lens-cap", acquired: "with the Pentax (on the lens, ch-02:p64)", status: "Ch.3: balanced on the ledge under the inscription for scale, then dropped into her jacket pocket instead of being refitted (ch-03:p49)" }
      - { item: "sherd-shoebox", acquired: "childhood (the sherds Emilio brought each September)", status: "a Buster Brown shoebox on the top shelf of her closet behind the winter sweaters (Philadelphia); not opened since her antiquities-trade seminar at twenty-four; not thrown out", source: "ch-03:p25" }
