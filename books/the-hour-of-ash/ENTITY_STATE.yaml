      - { fact: "Chestnut Hill: Margaret Fenn's estate sale", source: "ch-01:p88" }
      - { fact: "Chestnut Street: the Horn & Hardart automat (Fenn's memory)", source: "foundation:§3" }
      - { fact: "Ch.3 (Mara's references): the subway stairs at City Hall; Mount Airy (a department Christmas party, 1989); the Acme's chest freezers; Philadelphia never 'green in May' like the Kalivia plain", source: "ch-03:p2; ch-03:p5; ch-03:p70; ch-03:p75" }
