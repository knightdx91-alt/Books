  august-fenn:
    canonical_name: "August Fenn"
    aliases:
      - { alias: "Augurinus", note: "Puteoli astrologer persona", source: "STATE:ARCH-6" }
      - { alias: "the Chaldean", note: "as rumored in Pompeii", source: "outline:ch-24" }
    importance: major
    role: "vanished treasure hunter, marooned; cautionary mirror; gives the WHEN"
    first_appearance: { chapter: 2, mode: "documents (notebook)", in_person: 25, source: "ch-02:p1; outline:ch-25", ch2_note: "his own voice opens Ch.2 (Thanksgiving 1967 entry); named 'August Fenn' in it (p1) and 'FENN, August J.' on the consulate carbon (p66)", note: "first mentioned Ch.1: Szabo calls him only 'the brother. Treasure hunter.' (ch-01:p90); his name is on the page only as 'A. J. FENN' on the notebook cover (ch-01:p99); his ink on the chart (ch-01:p78). See meta.contradictions CH1-3." }
    physical:
      age: { value: 68, at_chapter: 25, birth_year: 1934, note: "34 when he vanished (1968); years since landing (AD 41): 34 in Ch.25 (AD 75), 35 in Ch.27 (AD 76), 37–38 in Ch.35 (winter 78–79)", resolved_from_conflict: true, resolved_date: "2026-10-18", resolution_note: "C13: outline Ch.27 now 'thirty-five years'", source: "foundation:§3; foundation:§10; outline:ch-27" }
      build: { value: "thin", source: "foundation:§3" }
      distinguishing:
        - { value: "ink-stained fingers", source: "foundation:§3" }
        - { value: "tremor in the left hand", source: "foundation:§3" }
        - { value: "Chaldean's robe; Philadelphia accent", source: "foundation:§4 (Ch.25 anchor)" }
    traits:
      - { trait: "born Philadelphia 1934; Navy; self-styled treasure hunter (Spanish wreck, Templar cache, Alexandrian scrolls)", source: "foundation:§3", mutable: false }
      - { trait: "English frozen in 1968; perfect formal Greek", source: "foundation:§3", mutable: false }
      - { trait: "writes in square capitals pressed so hard the pen nearly goes through (chart: coordinates 38° 31′ N / 22° 32′ E, 'BIBLIOTHECA?', and a fingernail-sized drawn doorway, all in blue ballpoint; notebook cover 'A. J. FENN'). The doorway is his 'little picture of the cave mouth beside it so I'd know which hole I meant'", source: "ch-01:p78; ch-01:p99; ch-02:p2", mutable: false }
      - { trait: "initials A. J.; full name 'August Fenn' / 'FENN, August J., U.S. citizen'", source: "ch-01:p99; ch-02:p1; ch-02:p66", mutable: false }
      - { trait: "1967-68 hand: block capitals nearly a quarter of an inch high, every stroke retraced, pressed so hard each page carries a raised backward copy on its back, a black bead of ink in each R's bowl (through April 1968). In May the letters shrink, then join, then become a small lowercase hand that leans right and leaves loops open, and the backs are smooth. The June entries are so small Mara needs the lab magnifier; the July 21 entry barely marks the page", source: "ch-02:p3; ch-02:p12; ch-02:p18; ch-02:p47; ch-02:p68", mutable: true }
      - { trait: "1967: could not read the scholion's Greek himself; Father Kostas at St. George's translated it for the price of a roast pork sandwich at the Terminal", source: "ch-02:p1", mutable: true }
      - { trait: "cut the uncut leaves of the 1838 Leipzig volume 'with his thumb' in 'the big new library at the university', up to the note and no further", source: "ch-02:p1; ch-02:p10", mutable: false }
      - { trait: "Navy: 'down in the sinkholes in Florida'; knows 'cave cold'", source: "ch-02:p19", mutable: false }
      - { trait: "smokes (measures the July 21 cold by 'a whole cigarette')", source: "ch-02:p69", mutable: true }
      - { trait: "1968 voice: runaway 'and'-chains, bravado, jokes ('You don't find the books on the first day'; 'Never been to Mexico. Maybe after.'); collapses to fragments when tired ('Slept up there. Didn't help.'; 'Tired today.')", source: "ch-02:p13; ch-02:p17; ch-02:p21; ch-02:p49", mutable: true }
      - { trait: "sold his Plymouth to fund the trip (to a mailman in Jenkintown, $600 and a sack of oranges); flew TWA to Athens, 2 April 1968", source: "ch-02:p13", mutable: false }
      - { trait: "reads every word of a week-old Herald Tribune, bridge column included, though he does not play bridge", source: "ch-02:p54", mutable: false }
      - { trait: "his things in Margaret's boxes: Navy uniforms, forty years of National Geographic, a diving helmet with no glass (sold by Szabo to a Wildwood seafood restaurant, now holding a lobster)", source: "ch-01:p102", mutable: false }
      - { trait: "casts horoscopes; teaches rich men's sons geometry", source: "foundation:§3", mutable: false }
      - { trait: "irrelevant obsession: the 1964 Phillies (Ch.25, 26, 29, 35)", source: "foundation:§3; outline:checks#4", mutable: false }
