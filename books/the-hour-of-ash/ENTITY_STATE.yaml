# ENTITY_STATE.yaml — The Hour of Ash (run 2)
# Canonical entity state. BUILD mode (SEED, pre-writing): built from the PLAN only.
# Facts, not interpretation. Contradictions are flagged with `conflict` (flag: UNRESOLVED), never resolved here.

meta:
  version: "1.0"
  last_updated: "2026-10-18"
  last_updated_by: "entity-tracker"
  mode: "BUILD (SEED — pre-writing, no chapters exist)"
  source: outline
  last_updated_chapter: 0
  chapters_tracked: []
  chapters_planned: 44
  canon_inputs:
    - "STATE.yaml (guardrails, resolved_author_decisions, decisions ARCH-1..13)"
    - "foundation.md (run 2, architect v4)"
    - "outline.md (44 chapters; Macro-Structure, turning-point map, Anti-Predictability Ledger)"
    - "character-bible.md (voice only; used for voice_markers.ref, not for facts)"
  excluded: "research/prior-run-2026-07/ — retired run, NOT canon; nothing taken from it"
  source_convention:
    plan: "outline:ch-XX = planned in that chapter's outline entry; outline:macro = Macro-Structure/ledger block; foundation:§N = foundation section; STATE:ARCH-N = architect decision in STATE.yaml"
    manuscript: "ch-XX:pYY once written. UPDATE mode replaces outline:ch-XX with ch-XX:pYY as each chapter confirms (or contradicts) the plan."
  status_convention: "Every fact below is PLANNED until its chapter is written. A written chapter that departs from a planned fact is a conflict, not an overwrite."
  method_extension: "knowledge.method adds `prior_knowledge` (known before the story's first scene, e.g. Mara's 1998 education) to the standard set told_by:slug | overheard | witnessed | discovered | inferred."
  conflicts_index:
    - "C1 pomponia-grata.first_appearance — foundation Ch.20 vs outline Ch.19"
    - "C2 objects.microcassette.touches — foundation schedules a Ch.35 touch; outline Ch.35 omits it"
    - "C3 valens.traits(mime) — foundation 'Pompeii's small theatre' vs outline Ch.29 'a street stage'"
    - "C4 mara-reyes.legal_status Ch.7 — foundation 'registered as Kallia's property' vs outline 'dependent kinswoman'"
    - "C5 objects.film-roll frame 36 — foundation 'smoking very faintly' vs outline 'may only be cloud'"
    - "C6 mara-reyes.traits(mundane breaks) — foundation 'two' (Ch.20, 22) vs outline three (Ch.6, 20, 22)"
    - "C7 plot_threads.the-when — foundation ladder: after Ch.25 she 'gives up home'; outline Ch.30 she still runs to the tomb hoping for an early door"
    - "C8 locations.pompeii — 'seventeen years after the quake' (foundation §5 + outline Ch.19) at AD 72; AD 62 + 17 = AD 79"
    - "C9 valens Ch.23 — 'the truth cost three years' (foundation §4 + outline Ch.23); frame AD 69 to trial AD 74 = five years"
    - "C10 marcus.age — foundation 'now seven' in the Ch.16 frame (c. AD 71-72, 'three years' after 69) vs outline Ch.22 'seven' in AD 74"
    - "C11 foundation-internal — §11.13 'Four on-page heat scenes' lists three; §6e, outline and STATE:ARCH-13 say three"
    - "C12 STATE:ARCH-4 'the Oracle speaks to Mara through Valens's errand rather than face to face' vs outline Ch.13 Theano names Pompeii to Mara in person"
    - "C13 august-fenn — outline Ch.27 (AD 76) 'thirty-four years of waiting'; landed AD 41 = 35 years (Ch.25, AD 75 = 34 is consistent)"
    - "C14 outline-internal — Ch.24 gives the Chaldean rumor to Grata's husband; Ch.25 'Builds on' calls it 'Grata's rumor'"
  plan_gaps:
    - "Which notebook goes through the door: outline Ch.43 'the notebook with Fenn's tables' / anchor 'Fenn's notebook'; Ch.36 'her 1998 notebook' (tremor notes since 72). Ch.2 packing lists only 'the notebook' (Fenn's). Whether Mara has a separate 1998 notebook is not established."
    - "The map is not in the Ch.2 packing list; its whereabouts after Ch.2 are unplanned (Fenn's coordinates are also in his notebook)."
    - "Outline Ch.12 says 'the flash is never used'; no flash unit is listed in the Ch.2 packing and the K1000 has no built-in flash."
    - "When Valens learns the door's LOCATION (the Nuceria Gate tomb) is unplanned. He knows the public riddle (Ch.13) and discusses the door to 1998 by Ch.33; 'everything' is told Ch.37."
    - "Whether Fenn knows AD 79 is the eruption year is unplanned (shareable #4 frames his door as 'the night Vesuvius erupts')."
    - "Whether Felix knows about the door is unplanned."
    - "Mara's eye colour, hair and height are not specified anywhere in the plan; Ch.1 (or first mention) will set canon."

