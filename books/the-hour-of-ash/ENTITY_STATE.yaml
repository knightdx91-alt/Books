  goat-boy:
    canonical_name: "the goat-boy"
    aliases: ["the boy"]
    importance: minor
    first_appearance: { chapter: 4, source: "ch-04:p3" }
    name_status: "UNNAMED. Mara asks his name (p79); he answers with nymphē, his word for HER (p80-p83). Her guess that 'Nümfi' was his name made him laugh (p33-p34). character-bible.md: promote to a full card only if he is ever named"
    note: "AD 70 (plan). Not the 1998 goatherd of Ch.3 (goatherd-1998) and not Fenn's 1968 boy (goat-boy-1968)"
    physical:
      age: { value: "'nine, perhaps'", at_chapter: 4, source: "ch-04:p4" }
      clothing: { value: "a brown tunic 'of some coarse stuff' belted with a cord; barefoot, feet 'gray with dust to the ankle'", source: "ch-04:p4" }
      hair: { value: "cut short with a knife 'by a person in a hurry'", source: "ch-04:p4" }
      distinguishing:
        - { value: "a crust under his nose", source: "ch-04:p4" }
        - { value: "one ear sticks out further than the other", source: "ch-04:p73" }
        - { value: "the sole of his foot 'as hard as saddle leather'", source: "ch-04:p73" }
      teeth: { value: "REMOVED from the plan (patch pass: teeth cut from Ch.4)", last_confirmed: "outline v4 pre-patch", source: "outline:ch-04 (Character chaos: 'teeth are not used here'); audit WARN-022", ch4_note: "not on the page (as planned)" }
    possessions:
      - { item: "a stick, kept low; sent uphill to the cave, then brought round to rest on her breastbone (his answer to her name question). At the foot of the slope he turns her toward Delphi by the sleeve, not with the stick", source: "ch-04:p4; ch-04:p74; ch-04:p80" }
      - { item: "a sling round his neck, its pouch on his chest", source: "ch-04:p4" }
      - { item: "a leather bag at his hip, 'black with handling', smelling of sour milk, smoke and something baked. In a gray rag inside: a lump of white cheese and the heel of a dark loaf (half barley, gritty). He shares both with Mara", source: "ch-04:p39; ch-04:p51; ch-04:p55" }
      - { item: "the granola pouch's foil wrapper (silver inside), given by Mara. He finds his own face in it and goes 'entirely still', then folds it small and tucks it down the neck of his tunic", source: "ch-04:p56; ch-04:p57; ch-04:p58" }
      - { item: "his goats: 'a few dozen, with burrs in their coats' (no colours given in Ch.4), belled; a nanny with one horn broken off short; a kid scratching its ear with a hind hoof. He whistles them together and drives them down ('Sitta! Sitta, íkade', said to Kissa)", source: "ch-04:p2; ch-04:p59; ch-04:p78" }
    speech:
      dialect: { value: "on the page: 'fast and flat, the vowels pinched and everything I expected to be hard gone soft'. 'Phocian' is the plan's label (character-bible: rural Phocian Koine); the page does not name the dialect", source: "ch-04:p18; outline:ch-04" }
      words_on_page: { value: "'Nümfi?' (p7); 'Khére' (p11, her Khaire repeated); 'Ti?' (p15); 'Pothen? Pothen ílthes? Ek tou antrou?' (p17); 'Pothen?' (p20); 'Archon … Kleodamos … Móni í?' (p22); 'Boathoos. Ti thélis?' (p24); 'Mí! Mí gráfe.' (p30); 'Nümfi.' (p32); 'Mára … Mára!' (p35); 'Ti dósis?' (p40); 'Ti esti?' (p45); 'Pheu! Ti esti touto? Pheu.' (p47); 'Kopros.' (p49); 'Phage.' x2 (p52; p54); 'Kalon.' (p58); 'Késar … En Rómi.' (p64); 'Ai! Ai, ai. Káki, káki. Kissa! Kissa, deuro. Deuro, káki.' (p72); 'Ide.' (p73); 'Delphous. Katō, katō. Delphous.' (p75); 'Makran … Sitta! Sitta, íkade.' (p78); 'Nymphē.' (p83, his third saying of the word, p82)", note: "since polish cycle 1 his shifted vowels are spelled as sound (ílthes, Móni í, thélis, Mí gráfe, dósis, Káki, Rómi, íkade); pothen, antrou, phage, kalon, makran, katō keep book spelling. The doubling (Pothen? Pothen…; Mí! Mí…; Káki, káki; Kissa! Kissa…; Katō, katō; Sitta! Sitta…; Phage x2) is his only", source: "ch-04:p7-p83" }
      nymphe_count: { value: "said three times: 'Nümfi?' (p7), 'Nümfi.' (p32), and the third time slowly, heard as 'Nymphē' (p82-p83)", source: "ch-04:p7; ch-04:p32; ch-04:p82; ch-04:p83" }
      kissa: { value: "'Kissa! Kissa, deuro' comes in his grumbling at the thorn and the bush (p72). At the foot of the slope, as the goats shove past, he says 'Sitta! Sitta, íkade' 'to Kissa, in the same breath' (p78). character-bible.md calls Kissa a goat; the page addresses Kissa among the goats but does not say what Kissa is", source: "ch-04:p71; ch-04:p72; ch-04:p78; ch-04:p80" }
    traits:
      - { trait: "comes up off the ground 'the way a cat leaves a sofa when a door slams, already facing me'; holds his stick low", source: "ch-04:p3; ch-04:p4", mutable: false }
      - { trait: "against the uncanny: hooks a finger in the neck of his tunic and spits down inside it, 'a small, dry, careful spit' (once). Steps back when she says she came out of the cave", source: "ch-04:p6; ch-04:p20", mutable: false }
      - { trait: "will not have writing: rubs out her ΔΕΛΦΟΙ with his bare foot, 'Mí! Mí gráfe'", source: "ch-04:p29; ch-04:p30", mutable: false }
      - { trait: "his mouth falls open, and he folds over his stick and laughs 'in high hiccups, like a much smaller child' when she takes 'Nümfi' for his name; then tells the goats her name", source: "ch-04:p34; ch-04:p35", mutable: false }
      - { trait: "bargains before he gives ('Ti dósis?', a hand flat over his bag). Spits the granola bar out entirely, scrubs his tongue on his forearm and calls it 'Kopros'; watches her eat 'with his top lip lifted'. Then shares his cheese and bread unasked ('Phage')", source: "ch-04:p40; ch-04:p46; ch-04:p47; ch-04:p49; ch-04:p50; ch-04:p51; ch-04:p52", mutable: false }
      - { trait: "wants the foil wrapper without asking (stands 'close enough to breathe on it'); keeps it", source: "ch-04:p56; ch-04:p58", mutable: false }
      - { trait: "digs a thorn from his left heel with a fresh thorn broken off the same bush, tongue in the corner of his mouth, grumbling at the thorn and the bush and not at her. Holds it up ('Ide'), very pleased, and flicks it into the dusk. He ignores her offer to draw it", source: "ch-04:p68; ch-04:p69; ch-04:p71; ch-04:p72; ch-04:p73", mutable: false }
      - { trait: "answers her dating questions patiently but without interest: frowns at 'Archon' and gives the name; tells a goat to get on rather than name the Kaisar", source: "ch-04:p22; ch-04:p66", mutable: false }
      - { trait: "at the foot of the slope takes her by the sleeve and turns her toward Delphi (the outline's 'Opens toward Ch.5'); takes his time before answering her name question", source: "ch-04:p74; ch-04:p75; outline:ch-04", mutable: false }
    voice_markers:
      ref: "character-bible.md (Ch.4 unnamed walk-on: The goat-boy)"
    relationships:
      charcoal-burner-parnassus: { type: "kin: the burner calls him 'my cousin's boy'", established: "ch-06:p314", current_status: "the burner repeats the boy's story" }
      mara-reyes: { type: "stranger out of the nymphs' cave; he calls her nymphē", established: "ch-04:p3", current_status: "fed her; took her wrapper; led her down to the foot of the slope and turned her toward Delphi by the sleeve" }
    location_log:
      - { chapter: 4, location: "corycian-cave (mouth) → parnassus → kalivia-plateau", scene: "sitting against the rock round the corner of the arch, out of the wind → down the goat track with his goats, past the firs and the pen → halfway down (the thorn) → the foot of the slope, sending Kissa for home ('Sitta, íkade')", travel_noted: true, source: "ch-04:p3; ch-04:p59; ch-04:p61; ch-04:p68; ch-04:p74; ch-04:p78" }
      - { chapter: 5, location: "kalivia-plateau", scene: "(reported) left her where the slope ran out and 'gone off over the plain behind his goats, toward the smoke'", travel_noted: true, source: "ch-05:p1" }
    knowledge:
      - { fact: "she came out of the cave ('Yes. I came out of the cave.')", learned_chapter: 4, method: "told_by:mara-reyes", note: "in answer to his 'Ek tou antrou?'", source: "ch-04:p17; ch-04:p19" }
      - { fact: "she is alone ('Yes, alone.', to his 'Móni í?')", learned_chapter: 4, method: "told_by:mara-reyes", source: "ch-04:p22; ch-04:p23" }
      - { fact: "she says she is 'From beyond the Pillars of Herakles, very far to the west'", learned_chapter: 4, method: "told_by:mara-reyes", note: "whether he understands it is not stated", source: "ch-04:p21" }
      - { fact: "her name is Mara ('Mára')", learned_chapter: 4, method: "told_by:mara-reyes", source: "ch-04:p33; ch-04:p35" }
      - { fact: "she wants Delphi and is hungry (Delphoi; Peinō; 'Have you bread? Artos')", learned_chapter: 4, method: "told_by:mara-reyes", source: "ch-04:p26; ch-04:p38; ch-04:p44; ch-04:p77" }
      - { fact: "her food is foul ('Kopros'); her wrapper shows his face", learned_chapter: 4, method: "discovered", source: "ch-04:p46; ch-04:p49; ch-04:p58" }
      - { fact: "she is nymphē, from the cave (stick from the cave to her breastbone)", learned_chapter: 4, method: "inferred", note: "his reading of her; the page does not gloss it", source: "ch-04:p6; ch-04:p80; ch-04:p82; ch-04:p83" }
    knowledge_absent: ["Philadelphia, America, 1998 (she says 'American … Delphi this morning' only in English, p12)", "what ΔΕΛΦΟΙ in the dust said (he rubs it out)"]
    ch6_report: { value: "NOT on the page in person in Ch.6. His story has spread: 'The charcoal men had a story this autumn … A goat boy up there saw a nymph walk out of Pan's cave in trousers and eat his cheese' (Valens); 'He tells that part' (her spitting-out). He is the charcoal burner's 'cousin's boy' ('My cousin's boy saw her step out of Pan's cave at the olive beating'), and his version is 'you ate his cheese and paid him in a cake made of hay' ('It's all hay to a boy'). Mara: 'He gave me the cheese.' / 'It was oats.'", source: "ch-06:p86; ch-06:p87; ch-06:p88; ch-06:p89; ch-06:p90; ch-06:p314; ch-06:p320; ch-06:p321; ch-06:p322" }
    told_ch6: { value: "the boy told his story (the nymph from Pan's cave in trousers; the cheese; the 'cake made of hay') to his family and the charcoal men by 'this autumn' (the olive beating)", method: "n/a (teller)", source: "ch-06:p86; ch-06:p314; ch-06:p320" }

  kleodamos:
    canonical_name: "Kleodamos"
    aliases: []
