  kalivia-plateau:
    canonical_name: "Kalivia plateau"
    era: "1998 / AD 70"
    aliases: []
    facts:
      - { fact: "trailhead to the Corycian Cave; thyme, goat bells, wind; a refuge hut (1998) that is a shepherd's stone pen in AD 70", source: "outline:ch-03; outline:ch-04" }
      - { fact: "reached via Olympic Airways to Athens and the KTEL bus to Delphi", source: "foundation:§9" }

  corycian-cave:
    canonical_name: "the Corycian Cave"
    era: "1998 / AD 41-71"
    aliases: ["the cave of the nymphs on Parnassus", "the nymphs' cave"]
    facts:
      - { fact: "the crossing site (Mara 1998; Fenn 1968)", source: "STATE:ARCH-2; foundation:§9" }
      - { fact: "sacred to Pan and the nymphs; tens of thousands of knucklebones excavated there", source: "foundation:§9" }
      - { fact: "vast first chamber; stalagmites; tourist graffiti (1998); a cold back recess at Fenn's coordinates", source: "outline:ch-03" }
      - { fact: "the trail's paint blaze is gone on the AD 70 side", source: "outline:ch-03" }
      - { fact: "shut after Mara's crossing: only cold (Ch.6), nothing (Ch.8)", source: "outline:ch-06; outline:ch-08" }
      - { fact: "Fenn left his coat at the cave mouth in 1968, the notebook in its pocket; a shepherd brought the coat down", source: "outline:ch-27; foundation:§3" }
    distances:
      - { to: "delphi", value: "most of a day down the mountain on foot", source: "outline:ch-05" }

  parnassus:
    canonical_name: "Mount Parnassus"
    aliases: ["Parnassus"]
    facts:
      - { fact: "Thyiades' winter rites; women trapped by snow until dawn (Ch.8)", source: "outline:ch-08; foundation:§9" }
      - { fact: "high summer pasture with a shepherd hut (Ch.15)", source: "outline:ch-15" }

  delphi:
    canonical_name: "Delphi (AD 70-71)"
    aliases: []
    facts:
      - { fact: "genteel decline but busy; the temple of Apollo painted red, blue and gilt", source: "foundation:§9; outline:ch-05" }
      - { fact: "Sacred Way: crowds, hawkers, treasuries, painted statues, empty statue bases with fresh pry-marks (Nero took hundreds three years earlier)", source: "outline:ch-05" }
      - { fact: "Castalian spring; Kallia's pilgrims' lodging beside it", source: "outline:ch-05" }
      - { fact: "agora: herald announces Titus's capture of Jerusalem; reward notice for 'Lupus' posted", source: "outline:ch-05; outline:ch-09" }
      - { fact: "polygonal wall carries manumission records (sale to Apollo; paramone clauses)", source: "outline:ch-09; foundation:§9" }
      - { fact: "consultation on fixed (monthly) days in the warm season; the year's first on the seventh of Bysios; goat must shiver at cold water; women ask through a male representative", source: "foundation:§9; foundation:§3; outline:ch-13" }
      - { fact: "Theano's house (crows), where she names Pompeii to Mara off duty; Valens recounts the consultation at Kallia's lodging (not an inn)", source: "outline:ch-08; outline:ch-13; outline:ch-14" }

  valens-yard:
    canonical_name: "Valens's mule yard"
    aliases: []
    facts:
      - { fact: "on the Kirrha–Delphi road; mules, horses, a tack shed", source: "outline:ch-11; foundation:§3" }

  kirrha:
    canonical_name: "Kirrha"
    aliases: ["the Kirrha road"]
