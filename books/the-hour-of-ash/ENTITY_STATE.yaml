      - { trait: "dug in Cyprus (eleven seasons with Doug Fessler; Paphos 1984; Kourion 1992), Sicily (two seasons with Doug) and Turkey (slides)", source: "ch-01:p4; ch-01:p19; ch-01:p28; ch-01:p188", mutable: false }
      - { trait: "'generous with his time' (Doug's eulogy): climbed into a student's section in his good shirt; gave a Sunday to a village boy; sat up until 2 a.m. over Doug's sherd with a 7 a.m. flight", source: "ch-01:p5; ch-01:p19", mutable: false }
      - { trait: "showed his dig slides every September at the kitchen table, projected on a bedsheet thumbtacked over the china cabinet", source: "ch-01:p11", mutable: false }
      - { trait: "read Dick Francis on planes (Wild Horses overdue at the Free Library)", source: "ch-01:p186; ch-01:p187", mutable: false }
      - { trait: "talked every season of jacking up the sagging porch (drawn on the back of a context sheet); shoveled Pat's walk when home", source: "ch-01:p27; ch-01:p184; ch-01:p179", mutable: false }
      - { trait: "offended for a week when the store recommended the two-tape answering machine as 'easier for older people' (December 1991)", source: "ch-01:p183", mutable: false }
