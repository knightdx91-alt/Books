    physical:
      distinguishing:
        - { value: "bad knees (the descent into the adyton hurts)", source: "foundation:§3" }
        - { value: "old woman; a farmer's widow off duty", source: "outline:ch-08; foundation:§3" }
    traits:
      - { trait: "negotiating with the priests for a stool", source: "foundation:§3", mutable: true }
      - { trait: "feeds the sanctuary crows from the god's own barley, shouts at them for taking it, and lies about it", source: "foundation:§3; outline:ch-08", mutable: false }
      - { trait: "goes down into the adyton on the monthly consultation days of the warm season", source: "foundation:§3; character-bible.md#theano", mutable: false }
      - { trait: "plain mountain-Phocian Greek; never comforts, never explains", source: "foundation:§3", mutable: false }
      - { trait: "takes Mara's last two ibuprofen for her knees, without thanks (Ch.13)", source: "outline:ch-13; character-bible.md#theano", mutable: false }
    voice_markers:
      ref: "character-bible.md#theano"
    location_log:
      - { chapter: 8, location: "delphi", scene: "her house; shouting at crows", travel_noted: false, source: "outline:ch-08" }
      - { chapter: 13, location: "delphi", scene: "the adyton (voice from below, described not quoted, per Valens); her own house, off duty (sends a temple slave for Mara)", travel_noted: false, source: "outline:ch-13" }
    knowledge:
      - { fact: "the door home is at Pompeii", learned_chapter: 0, method: "discovered", note: "source never explained; tells a stranger more than the god gave, in person and off duty (not an oracular response)", revised: "2026-10-18", source: "outline:ch-13; STATE:ARCH-4 (revised)" }
      - { fact: "the hour: 'not hers to give, or not given' — will not say which", learned_chapter: 13, method: "inferred", source: "outline:ch-13" }

