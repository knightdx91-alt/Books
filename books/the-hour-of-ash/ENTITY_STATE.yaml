        - { value: "the knucklebone, in a pocket (garment not stated), her hand closed around it", source: "ch-03:p58; ch-03:p59; ch-03:p67; ch-03:p78" }
      worn_ch4:
        - { value: "'my fleece' (crumbs down it; the boy's stick end rests on it 'over the breastbone'). Not called a jacket in Ch.4 (CH4-3)", source: "ch-04:p50; ch-04:p80" }
      carries_ch4:
        - { value: "the duffel: she sits down on it when her knees give, and opens its zipper. The granola box is 'under the sweater, beside the sock'. The page does not say whether she carries it down the mountain after p43", source: "ch-04:p37; ch-04:p43" }
        - { value: "not mentioned in Ch.4: the Seiko, the Pentax, the flashlight, Fenn's notebook, the lens cap, the knucklebone (last in her pocket at ch-03:p78; CH4-1 RESOLVED), the jeans (the walker's map is only recalled, p18)", source: "ch-04 (absent)" }
      hunger_ch4: { value: "'The hunger arrived all at once': it rises under her ribs and clenches, her mouth runs with water, her knees let go and she sits on the duffel. She says 'I'm hungry … God help me. Peinō.' The smell of the boy's bag fills her head. She eats both bars of the pouch standing, 'fast, head down', licks the honey off her thumb, and is 'still hungry'. Then the boy's cheese (goat hair on it; it squeaks; so salty her eyes run) and barley bread 'full of grit'. Later 'The hunger had come back', and her stomach makes a noise the goats turn to look at. The outline's emotional surprise: hunger, not wonder", source: "ch-04:p36; ch-04:p37; ch-04:p38; ch-04:p39; ch-04:p50; ch-04:p55; ch-04:p67; outline:ch-04" }
      age_at_eruption: { value: 42, note: "body-age, 33 + 9", source: "foundation:§10" }
      hands: { value: "steady, competent; betray her only at thresholds; touches surfaces to read them", source: "foundation:§3", ch2_note: "on the page: holds a resin join under the hood until her fingers ache from the wrist down (p7); tests the seam with her thumbnail, eyes shut (p9)" }
      teeth: { value: "kept clean 'like a religion'; flossed twice daily in 1998", source: "foundation:§3", ch2_detail: "an old filling with a lip on the last upper-left molar catches and frays the floss; she flosses at the medicine-cabinet mirror in her apartment (p50); the floss is packed before the ticket or the passport (p53)", ch2_source: "ch-02:p50; ch-02:p52; ch-02:p53" }
      clothing_on_arrival: { value: "jeans and fleece (CONFIRMED on the page in Ch.5: 'my jeans' ch-05:p4, ch-05:p55; others see 'trousers' / 'the legs' ch-05:p18, p25, p77, p140; 'the fleece' ch-05:p73 and after; boots that a stallholder calls 'a man's boots' ch-05:p115)", source: "outline:ch-05; ch-05:p4; ch-05:p18; ch-05:p55; ch-05:p73; ch-05:p115" }
      worn_ch5:
        - { value: "the fleece (collar, back, sleeves; no 'jacket' on the page, CH4-3). The sweater is worn in the sheepfold on the first night ('my knees pulled up inside the sweater', p1), and by night two it is back in the duffel and becomes her pillow (p209)", source: "ch-05:p1; ch-05:p73; ch-05:p86; ch-05:p91; ch-05:p136; ch-05:p162; ch-05:p209" }
        - { value: "jeans: the pocket holds the three taxi coins (p55); she wipes a raw olive on them (p4). No damage to the jeans is stated (the knee-through-the-denim line is cut in polish cycle 1)", source: "ch-05:p4; ch-05:p55" }
        - { value: "boots 'bought for mountains', clumsy on the glassy paving ('I climbed it with my toes clenched inside them'); called 'a man's boots' by the clay-figure seller; water from the jar carried on her hip runs 'cold down my leg into my boot'; unlaced by feel in the storeroom and stood 'against the jar'; the right sock is soaked and she reaches into the bag for a dry one", source: "ch-05:p38; ch-05:p115; ch-05:p178; ch-05:p209" }
        - { value: "the Seiko on her wrist: the rod 'caught my wrist and the watch on it' (no injury to the wrist and no damage to the watch is stated); running in the storeroom (which wrist is not stated in Ch.5; ch-03:p70 implies the left)", source: "ch-05:p86; ch-05:p210" }
      carries_ch5:
        - { value: "the duffel, all chapter: her pillow in the sheepfold (p1); 'I dropped the bag in the road and knelt' at the Kroton base (p43); the end unzipped 'for the Pentax' (p52); shouldered again (p64); the warden pulls it and it is torn from her hand on the steps; it falls down the steps after her and she takes it by the handles (p83, p86); she runs clutching it (p88); bag between her feet in the square (p91); she refuses the procurer's hand on the strap and slings it crosswise (p131-p133); the flashlight stays in the bottom of it in the storeroom (p206); a dry sock is looked for and the sweater taken out for a pillow (p209)", source: "ch-05:p1; ch-05:p43; ch-05:p52; ch-05:p64; ch-05:p83; ch-05:p86; ch-05:p88; ch-05:p91; ch-05:p133; ch-05:p206; ch-05:p209" }
        - { value: "contents named in Ch.5: the granola box (a pouch eaten at dawn, p1; 'the rest of the granola', p136); the flashlight (used at the sheepfold, p1; 'somewhere in the bottom of the duffel', p206); the Pentax (out of 'the end of the duffel' for one frame, p52); dry socks (implied: she reaches 'into the bag for a dry one', p209); the tape sock (p209); the sweater (p209)", source: "ch-05:p1; ch-05:p52; ch-05:p136; ch-05:p206; ch-05:p209" }
        - { value: "three coins 'from the taxi' in her jeans pocket; the biggest, a hundred-drachma piece, goes to the guide; two remain (denominations not stated)", source: "ch-05:p55; ch-05:p64" }
        - { value: "not mentioned in Ch.5: Fenn's notebook, the walker's map, the lens cap, the knucklebone, the Advil, the toothbrush and floss, the Charioteer postcard. (The flashlight IS mentioned now: used at the sheepfold, deliberately left in the duffel in the storeroom, p1, p206)", source: "ch-05 (absent)" }
      marks_ch5:
        - { value: "from the temple slave's rod: blows across the shoulders, across the back ('the fleece took it'), across the forearm she put up ('that one I felt to the bone'), on the hip (she goes backward down the steps, sitting), and across the wrist and watch", source: "ch-05:p85; ch-05:p86" }
        - { value: "after (two sensations, as the page now gives them): 'two hot stripes across my right forearm, and the skin had split on one of them in a short line beaded with blood'; 'When I moved my shoulders the back of the fleece pulled at something underneath that had begun to stick'. Later the welts stiffen and the fleece comes 'unstuck from the place on my shoulder with a small tearing feeling'. Not on the page any more (cut in polish cycle 1): 'raised', 'red going purple', the skinned wrist, the knee through the denim", source: "ch-05:p91; ch-05:p209" }
        - { value: "the cold spring water on the welts 'burned, and went numb' (p136); she barks her hip on the shoulder of a storage jar in the dark (p206). No bone is broken, and no injury slows her walking on the page", source: "ch-05:p136; ch-05:p206" }
        - { value: "shock: 'I began to shake. It started in my knees, in the full sun', and it goes on through the herald's arrival", source: "ch-05:p93" }
        - { value: "the thornbush scratch across the knuckles of the right hand (from ch-03:p45, where the right hand is now named). The olive oil 'found the thornbush scratch on my knuckles and stung'", source: "ch-05:p15; ch-05:p150" }
      hands_ch5: { value: "as Kallia sees them by lamplight, palms up: clean from the basin, 'soft, and pink'; a scar on the side of the left forefinger 'from a scalpel' (the 'in my first year in the lab' clause cut in the author fixes); the thornbush scratch across the right knuckles; 'the smooth tight shine that years of acetone had left on the pads of my fingers'; 'The only hard place on either of them was a pen callus on the side of my middle finger'. Earlier in the day they were black to the wrist with olive paste (p23); she works it off with her thumbs through the proclamation (the creases stay dark, the nails black, p116)", source: "ch-05:p23; ch-05:p116; ch-05:p150" }
      teeth_ch5: { value: "Kallia looks in by lamplight at 'the upper molars on the left', where Mara has 'a filling back there, an old one, silver gone dull, with a lip on it that frayed the floss' (agrees with ch-02:p50, the last upper-left molar). Kallia: 'What's that? Lead?' Memory: her dentist Dr. Pinsky on Walnut Street, in February, told her she brushed too hard and was wearing the enamel away at the gumline; she bought a softer, angled brush that afternoon at the Rite Aid on Chestnut 'because he was right, and that was worse than the enamel'", source: "ch-05:p152; ch-05:p153; ch-05:p154; ch-05:p155; ch-02:p50" }
      hunger_ch5: { value: "a granola pouch opened with her teeth at dawn in the sheepfold (p1); the hunger 'had come down with me', so she bites a raw olive from the road (p4-p5); she works for her lunch carrying olives and is paid with bread dipped in bitter new oil ('The bread was gray and crunched … and I ate it all', p15); at the spring she drinks 'until my stomach hurt' (p136); no supper is mentioned at Kallia's (the lentils go to the lodgers)", source: "ch-05:p1; ch-05:p4; ch-05:p5; ch-05:p15; ch-05:p136; ch-05:p194" }
      worn_ch6:
        - { value: "jeans (the two taxi coins in the pocket); boots, 'which had carried me off the mountain in October and had not had a day off since'; 'trousers' to the burner and to Valens. No upper garment is named (no fleece, jacket or sweater; CH4-3 ch6_note)", source: "ch-06:p90; ch-06:p107; ch-06:p318; ch-06:p328" }
        - { value: "the Seiko on her wrist until the evening before the climb, when she unfastens it ('The clasp was stiff with the cold. It took me two tries to spring it') and hands it over 'still warm on the inside of the band'. From then on she wears no watch", source: "ch-06:p119; ch-06:p142" }
      carries_ch6:
        - { value: "the duffel, packed and never unpacked in a month ('which was no trouble, since it had never been unpacked'): 'Everything' (Valens). Lashed onto the dun, carried into the cave and leaned on the slab, its strap back on her for the descent, returned to her at the first houses. Contents not named", source: "ch-06:p7; ch-06:p152; ch-06:p158; ch-06:p238; ch-06:p273; ch-06:p340" }
        - { value: "Kallia's little iron ash shovel, taken from the pail by the hearth (objects.kallias-ash-shovel)", source: "ch-06:p152; ch-06:p340" }
        - { value: "the flashlight, in the duffel 'under everything', unused: 'I had let him burn his pines rather than have him see it'", source: "ch-06:p7" }
        - { value: "two 1998 taxi coins in her jeans (one shown to Valens and handed back)", source: "ch-06:p107; ch-06:p110" }
        - { value: "the empty water jar on her hip in the gateway (backfill)", source: "ch-06:p40" }
      marks_ch6:
        - { value: "hands after a month of jars: 'every knuckle had split from the cold water, and a blister was healing on each palm where the jar handles rode. They were still not a working woman's hands'", source: "ch-06:p111" }
        - { value: "the shovel's iron 'had taken the skin off the pad of my thumb'; fingertips white with cold, then numb ('stopped hurting, which was worse'); knees numb from kneeling in the crack; they give a little when she straightens 'as far as the roof let me'", source: "ch-06:p2; ch-06:p5; ch-06:p8; ch-06:p248" }
        - { value: "she hits the slab 'with the side of my fist and then with the heel of my hand, and the skin came off the heel'; 'my bleeding hand held away from it' (ch-06:p257). Which hand is not stated. The charcoal burner sees it ('And what's she done to that?')", source: "ch-06:p248; ch-06:p253; ch-06:p322" }
        - { value: "nose running on the cliff in the dark; chestnuts from the kiln burn her fingers", source: "ch-06:p162; ch-06:p311" }
      hunger_ch6: { value: "'When the bread was gone I could have eaten the same again, which after a month of Kallia's lentils was nothing new'; she eats the crumbs on Valens's order", source: "ch-06:p271; ch-06:p272" }
      worn_ch7:
        - { value: "from two days after the mountain, the girl's clothes: a tunic of undyed wool 'so long I could stand on the hem', a plaited cord to take it up at the waist, and the himation 'of wet-sand brown' (objects.borrowed-himation). The boots stay on ('The hem hides the boots if you walk right. You don't walk right.'). The 1998 clothes (jeans, fleece, 'The shirt with the buttons') go into the duffel", source: "ch-07:p8; ch-07:p9; ch-07:p10; ch-07:p14; ch-07:p17" }
        - { value: "no watch: 'the pale band on my wrist … the white stripe where the watch had lived under its steel band since March'. Which wrist is not stated", source: "ch-07:p48" }
      carries_ch7:
        - { value: "an obol and Kallia's basket to the salt market; the water jar on her hip (a full one 'the length of the lane on one hip'; an empty one stays up on her head only 'for a few steps'); Kallia's tally stick to the baker's hatch", source: "ch-07:p25; ch-07:p63; ch-07:p72" }
        - { value: "a lentisk stick for her teeth, cut on the afternoon of the bath and chewed at the trough every morning (objects.lentisk-stick)", source: "ch-07:p58; ch-07:p183" }
      marks_ch7:
        - { value: "a smallpox vaccination scar 'high on my left arm, a round pitted mark, puckered in the middle': 'a cow's pox, scratched into my arm on purpose by a nurse at a pediatric clinic in West Philadelphia when I was too small to object'. The bath reads it as a brand ('Somebody's marked her.' / 'Is she bought?'). Kallia: 'Pox … When she was small.'", source: "ch-07:p48; ch-07:p49; ch-07:p50; ch-07:p51; ch-07:p54" }
        - { value: "the pale watch band on her wrist, read at the bath as the mark of a fetter ('Has she had a fetter on?'). The drover takes her by that wrist", source: "ch-07:p48; ch-07:p113" }
        - { value: "legs neither singed nor plucked: 'Look at her legs.' / 'She's let herself go like a widow.' Kallia: 'They keep them like that where she's from.'", source: "ch-07:p40; ch-07:p41; ch-07:p44" }
      teeth_ch7: { value: "the bath's burnt-horn tooth powder smells 'of a farrier's yard, of singed hoof'. 'I had seen burnished slip scoured to a dull fog by less', and she refuses it twice. She cuts a lentisk twig and chews the end into a brush (it tastes 'of pine resin and of the gin and tonic a friend's husband had once made me in an apartment on Rittenhouse Square'). At the council a lentisk splinter is wedged on the left 'between the molar with the old filling and its neighbor'. That agrees with the upper-left filling of ch-02 and ch-05; upper or lower is not stated here", source: "ch-07:p55; ch-07:p57; ch-07:p58; ch-07:p170" }
      hunger_ch7: { value: "'Supper was lentils and I ate it and it was all right.' Kallia had 'fed me lentils for two months'", source: "ch-07:p157; ch-07:p183" }
      hair_ch7: { value: "the colour is still not named. The long hair in the girl's himation fringe is 'darker than mine and crimped from a braid', so hers is lighter than that", source: "ch-07:p11" }
      pregnancy_1: { value: "pregnant with Lucius; revealed end Ch.20; ~six months in spring AD 74", source: "outline:ch-20; outline:ch-22; outline:ch-23; foundation:§10" }
      pregnancy_2: { value: "Aelia born winter AD 75-76, off-page", source: "outline:ch-26; STATE:ARCH-8" }
    physical_unset: ["eye_color", "hair", "height"]
    traits:
      - { trait: "American; Philadelphia", source: "STATE:ARCH-1", mutable: false }
      - { trait: "objects conservator at a Philadelphia university museum (basement lab; reglues Roman lamps, stabilizes bronze disease)", source: "foundation:§3; ch-01:p53 ('I work at the museum. In the conservation—'); ch-01:p59 ('Conservators work Saturdays'); ch-01:p40 ('my department')", mutable: false }
      - { trait: "reads Attic Greek and Latin well; speaks neither at first; classroom (Erasmian) pronunciation is comic to 1st-c ears", source: "foundation:§3; outline:ch-07; ch-01:p85 ('I read it'); ch-01:p93 (Latin: 'Yes')", mutable: true }
      - { trait: "reads objects and rooms as a conservator: watches the reception 'the way I watched a cracked pot … to see where the strain had gone'; spots a replaced finial, a bad Staffordshire restoration, the stapled platter's half-drilled holes ('The holes don't go all the way through'), verdigris damage, the tre lune watermark", source: "ch-01:p3; ch-01:p40; ch-01:p51; ch-01:p71; ch-01:p74", mutable: false }
      - { trait: "admires a visible 150-year-old staple repair ('could have kissed him') while noting its maker 'would have been out of work in my department in a week, because you could see it from the street'", source: "ch-01:p40", mutable: true }
      - { trait: "knows Kastri was moved off the Delphi site in the 1890s at French expense; knows Venetian paper mills by watermark", source: "ch-01:p76; ch-01:p83", mutable: false }
      - { trait: "writes her father's house phone number on the check by reflex ('an order my hand had known since before I could spell') and lets the check go with the wrong number", source: "ch-01:p126; ch-01:p127; ch-01:p128", mutable: false }
      - { trait: "lies to deflect: 'I came from work' (p57), 'It's a common name' (p124), 'I ate it' (p138), 'Not much' (p155); does not answer Doug's 'Are you keeping the house?' (p22-p23)", source: "ch-01:p22; ch-01:p23; ch-01:p57; ch-01:p124; ch-01:p138; ch-01:p155", mutable: true }
      # --- Ch.2 (prose) ---
      - { trait: "read 'a good many scholia in graduate school' (best remembered: a monk complaining about the ink); does not believe the Parnassus scholion, which she reads as a monk 'on a slow afternoon' wanting to feel 'nearer to something'", source: "ch-02:p4", mutable: true }
      - { trait: "rations Fenn's notebook: one entry a night, two when the day has been bad, 'though nobody had told me to make it last'", source: "ch-02:p5; ch-02:p12", mutable: true }
      - { trait: "conservator practice: removed a c.1935 shellac repair with acetone poultices and a sharpened stick (most of February); rejoins with reversible acrylic resin; checks under a raking lamp swung in low from the side; takes apart and redoes a join over a step 'no thicker than a fingernail paring'; has 'kept every brush in the lab away from' the soot crust on the nozzle tip", source: "ch-02:p6; ch-02:p7; ch-02:p8; ch-02:p9", mutable: false }
      - { trait: "eats lunch in the university library stacks, where food is not allowed; does not cut the volume's uncut leaves", source: "ch-02:p10; ch-02:p11", mutable: true }
      - { trait: "rationalizes the cold air: 'Caves breathed. The air inside went in and out with the weather, slow as a sleeper'; then turns the page (no source named since the author fixes cut 'I had read it somewhere, in a book about limestone'; ch-03:p67 still cites 'the book about limestone', CH3-8)", source: "ch-02:p22", mutable: true }
      - { trait: "one unplanned surfacing of feeling in 1998: a laughing fit at 'Firma mancante' that comes out 'as a bark first and then a long run that bent me over the sink', receiver jammed to her ear, cord stretched across the kitchen; her elbow knocks the cereal box off the drainboard; she stays on her feet and later wipes her face on the dish towel (p31, p35; the outline's planned emotional surprise). The jeweler scene carries none: it ends on the watch sitting snug (p16). Not one of the three antiquity 'mundane breaks' (Ch.6, 20, 22).", source: "ch-02:p16; ch-02:p31; ch-02:p35", mutable: true }
      - { trait: "kneels at her father's field notebooks, runs a finger along the spines from one end of the shelf to the other ('each binding ticking under it in turn'), and does not take one down; on the Saturdays after, she reads Fenn's notebook in his chair, 'the yellow spines down by my ankles'", source: "ch-02:p46", mutable: true }
      - { trait: "keeps a canvas duffel half packed in the hall closet 'as it had in every apartment since college' (a change of clothes and a toothbrush), 'kept against nothing in particular'", source: "ch-02:p53; foundation:§3 (lie: 'keep a bag packed')", mutable: true }
      - { trait: "decides while flossing: near midnight on the first Tuesday in May she stops with the floss still in her teeth, calls Olympic Airways and says 'Athens' before taking the floss out", source: "ch-02:p50; ch-02:p51", mutable: false }
      - { trait: "by May uses her own apartment 'for very little else' than flossing; at her father's house every Saturday (reads Fenn's notebook in his study chair)", source: "ch-02:p46; ch-02:p50; ch-02:p55", mutable: true }
      - { trait: "evasion holds in Ch.2: never states her father's death ('my father's kitchen', 'his greeting had been'); answers Halloran's invitation only with 'I might be in Greece'", source: "ch-02:p3; ch-02:p41", mutable: true }
      # --- Ch.3 (prose) ---
      - { trait: "learned Greek 'from grammars with paper covers'; can get through a page of Thucydides faster than she can buy a stamp in it; her 'kalimera' is correct, 'which my Greek mostly was not'; composes Attic Greek with the correct optative in her head, 'more than I could have managed out loud'", source: "ch-03:p13; ch-03:p65", mutable: true }
      - { trait: "has worked about ten years in the basement lab ('My lungs had spent ten years in a basement lab'); out of breath on the climb", source: "ch-03:p2", mutable: false, ch7_note: "Ch.7 agrees: 'For ten years I had sat at a bench' (ch-07:p174; the draft's 'fifteen years' was repaired, CH7-1 RESOLVED)" }
      - { trait: "photographs as her father did: the site from above first, horizon a third of the way from the top; balances the lens cap in the frame for scale and drops it into her pocket instead of refitting it ('which he also would have done')", source: "ch-03:p6; ch-03:p49", mutable: true }
      - { trait: "reads the cave graffiti in raking light ('It was the raking light I used in the lab to find a seam') and notes the overcutting (a 1952 run through a French lieutenant)", source: "ch-03:p53", mutable: false }
      - { trait: "wrote the lab's page of procedure for unprovenanced finds (taped above the lab sink: leave it, or return it to its hollow, photograph with a scale, record, tell the ephorate); gives a speech at parties about objects lifted without records; pockets the knucklebone anyway ('I pocketed it'), stands up too fast and looks out at the mouth, and means to hand it in at the Delphi museum on the way down", source: "ch-03:p57; ch-03:p58; ch-03:p59", mutable: true }
      - { trait: "will not leave litter: chases a granola wrapper twenty feet downhill into a thornbush and tears her sleeve getting it back", source: "ch-03:p45", mutable: false }
      - { trait: "all-or-nothing at the slot: 'I was going in properly or I was going home' (the outline's chaos moment)", source: "ch-03:p71; outline:ch-03", mutable: true }
      - { trait: "evasion holds in Ch.3: answers the German's questions in a few words ('Just my clothes.' 'However long it takes.' 'I fix pots. In a museum.'); does not say why she is on the mountain; still never states her father's death ('my father's camera', 'my father's watch')", source: "ch-03:p19; ch-03:p21; ch-03:p30; ch-03:p41; ch-03:p67", mutable: true }
      - { trait: "keeps the sherds her father brought her each September in a Buster Brown shoebox (once under her bed, sorted by color on rainy Saturdays; now on the top shelf of her closet behind the winter sweaters); at twenty-four, halfway through a seminar on the antiquities trade, she 'understood what each of them was'; has not opened the box since and has not thrown it out", source: "ch-03:p25", mutable: true }
      - { trait: "unprompted memories (Ch.3): a boy going out on 'aglet' with two g's at the citywide spelling bee in 1977; the cellar dark the July she was seven, when she screamed; a department Christmas party in Mount Airy in 1989 (opening a bedroom door on eight or nine strangers around a candle); the Hanson song from the summer before (chorus only)", source: "ch-03:p9; ch-03:p47; ch-03:p64; ch-03:p75", mutable: false }
      - { trait: "has not called Gloria from Greece ('I had bought a postcard of the Charioteer instead'); the kiosk phone, the phone card and 'Ray having his fit' are cut in the author fixes", source: "ch-03:p66", mutable: true }
      # --- Ch.4 (prose) ---
      - { trait: "speaks book Greek in the grammars' reconstructed pronunciation: 'Khaire' with 'the rasp of the k and both halves of the diphthong, the way the books printed it'. She reaches for the grammars' Useful Phrases ('who is archon this year?', which sits 'between buying fish and asking the way to the Piraeus'), the Odyssey's 'strangers and beggars are from Zeus', and 'beyond the Pillars of Herakles'. To his ear it fails: he hands 'Khaire' back as 'Khére', tried 'like a coin he suspected was lead', and answers her phrase with 'Ti?'. Confirms the planned trait 'classroom pronunciation is comic'", source: "ch-04:p9; ch-04:p10; ch-04:p11; ch-04:p13; ch-04:p14; ch-04:p15; ch-04:p21; ch-04:p44", mutable: true }
      - { trait: "cannot follow spoken Greek: his speech is 'thin and quick and slid straight past me', with 'a sound in the middle I had no Greek letter for', all but the case endings ('I knew those from my grammars, and I had only ever heard them in my own voice'). She catches only *pothen* and *antrou*, and she 'heard whole' 'Delphous' (though 'the ending was wrong and the *ph* had gone soft'). She hears 'Nymphē' only on the third, slow saying, as letters surfacing from the sound (nu, a tight-rounded upsilon, mu, phi, an eta 'that was not the eta of any grammar I owned')", source: "ch-04:p8; ch-04:p18; ch-04:p75; ch-04:p76; ch-04:p82; ch-04:p83", mutable: true }
      - { trait: "falls back on English when flustered or alone with a feeling: 'Sorry … I'm American. I came up from Delphi this morning …'; 'I know. They're terrible. They're supposed to be good for you.'; 'Far. Of course it's far.' ('That came out in English. I went back to Greek.')", source: "ch-04:p12; ch-04:p48; ch-04:p79", mutable: true }
      - { trait: "recognizes the boy's spit down his tunic as Theophrastus's superstitious man's gesture 'whenever he passed a lunatic in the street'", source: "ch-04:p6", mutable: false }
      - { trait: "writes Greek capitals by reflex: ΔΕΛΦΟΙ in the dust, 'in square capitals with good serifs'. The boy rubs it out with his foot", source: "ch-04:p28; ch-04:p29", mutable: true }
      - { trait: "offers her conservator's hands: 'I will draw the thorn out. I am skilled at small work.' (declined; he digs it out himself)", source: "ch-04:p70; ch-04:p71", mutable: false }
      - { trait: "laughs with the boy 'without knowing what at'; follows him down 'because he was going down'", source: "ch-04:p34; ch-04:p59", mutable: true }
      - { trait: "unprompted memory (Ch.4): 'There was a Wawa on Chestnut Street with a hoagie case lit up like an aquarium' (at the height of the hunger)", source: "ch-04:p42", mutable: false }
      - { trait: "evasion holds in Ch.4: 'The true answer was still Philadelphia', but she says 'From beyond the Pillars of Herakles, very far to the west'; she does not name the year, the door or a crossing in narration; the teeth are not used (as planned)", source: "ch-04:p20; ch-04:p21; outline:ch-04", mutable: true }
      # --- Ch.5 (prose) ---
      - { trait: "her book Greek works in places and fails in others. Her 'I am a foreigner and hungry. I can work' uses 'the form for a man laboring for hire, the only one the book had given me'. 'Where's your man?': 'I understood that one.' The guide's memorized speech is 'worn smooth, in a town Greek far nearer my books than the boy's had been on the mountain, and I lost none of it' (the basis of her comprehension in town). The press woman's 'word for a husband who was no earthly use' comes through (no source named). 'One of them said a word I had never seen written down'. Ouespasianos takes her 'the length of the whole repetition'. At the fountain she 'could follow most of it' but is only 'nearly sure' of the herald's 'fourth day' ('Either they had heard him wrong or I had'). She knows the 'Whose' from the temple steps in Kallia's mouth. The pilgrim's son says she 'sounds like the man who reads out the laws'", source: "ch-05:p8; ch-05:p9; ch-05:p10; ch-05:p12; ch-05:p19; ch-05:p28; ch-05:p80; ch-05:p107; ch-05:p117; ch-05:p128; ch-05:p174", mutable: true }
      - { trait: "all-or-nothing about Greek (the outline's chaos moment): when the guide mimics her careful Attic to the crowd ('with every aspirate blown'), she has 'the next sentence ready … with an optative in it. I put it away.' 'Keep the coin,' I said, in English. From there no line on the page is Greek: English is tagged to the clay-figure seller ('No idea,' in English, p114), the procurer ('It was English', p133) and Kallia ('She heard the English', p146; the outpouring 'In English', p159); 'I shook my head' (p167) is wordless; 'Eggs. I can do eggs.' (Kallia 'took that for a no', p169-p170), 'Mine.' (p175) and 'Where are we going?' (p179) carry no language tag (CH5-6, narrowed)", source: "ch-05:p57; ch-05:p58; ch-05:p62; ch-05:p63; ch-05:p114; ch-05:p132; ch-05:p133; ch-05:p145; ch-05:p146; ch-05:p159; ch-05:p167; ch-05:p169; ch-05:p170; ch-05:p175; ch-05:p179; outline:ch-05", mutable: true }
      - { trait: "conservator's eye on the Sacred Way: asks 'Who made the bull?' (the dewlap 'chased so fine that the tracer's marks showed'); reads the Kroton base like an object on her bench: fresh crystal in the flake, no dirt or lichen in the scar, chisel bites 'still sharp enough to catch a fingertip', chopped lead, old copper-green streaks ('The streaks were the oldest thing on the block; the holes were the newest'); scores the lead 'with the edge of a coin from my pocket' ('soft and bright underneath') and dates the robbery from it; has seen Egyptian blue before: 'A few grains of that blue off a sherd from Kourion had once glittered under my lens like ground sugar'; on the temple porch finds the blue molding retouched over an older, paler blue 'by a painter in a hurry' and has 'my thumbnail at the edge of the flake', smiling", source: "ch-05:p29; ch-05:p36; ch-05:p44; ch-05:p51; ch-05:p72", mutable: false }
      - { trait: "has looked at polychromy 'through a stereo microscope for most of my working life'; once painted a plaster cast of a marble youth from the published pigment analysis for a museum open day, 'and been proud of myself for liking him'", source: "ch-05:p31", mutable: false }
      - { trait: "the living sanctuary disappoints her: on Wednesday she had stood among the tourists 'and wished the light would stay' (the word 'loved' is cut in polish cycle 1); now she waits on the Wednesday spot 'for it to turn into my temple', and 'the word that came to me for all of it was English: ugly'; she checks the pilgrims' faces 'in case one of them had heard', and concedes that 'they had been right about their own temple, and I had been wrong about it for twenty years in a library … I preferred it dead' (outline emotional anchor and surprise). The looted Kroton base gets her close reading (p42-p51); the explicit line 'This was the first time I had stood where the taking happened while the marks were still sharp' is cut in the author fixes, so the outline beat subversion ('Her first real wonder is the … empty bases') is now carried by the reading alone", source: "ch-05:p42; ch-05:p44; ch-05:p51; ch-05:p67; ch-05:p69; ch-05:p70; outline:ch-05", mutable: true }
      - { trait: "knows her history to the year: Nero in Greece for the games in 66 and into 67; Nero's death in June 68 'in a freedman's villa and not a ditch, with the freedman's hand helping the knife'; Titus and Jerusalem from Josephus (a seminar in her second year, a hot third-floor room with a radiator nobody could turn off); Vespasian's coins, which she had 'cleaned … with a cocktail stick' (the 'in the lab' is cut in the author fixes). She does the subtraction on her fingers, 'because it was the kind of sum I made mistakes in'. (The Gettysburg Address and Pausanias provenance lines are cut in polish cycle 1)", source: "ch-05:p51; ch-05:p107; ch-05:p108; ch-05:p109", mutable: false }
      - { trait: "under assault she argues the conservation point in English ('Your molding's been retouched and it's been done badly … I was only looking at the—'), holds on to the duffel strap through two blows, then runs; afterwards she shakes and cannot stop it", source: "ch-05:p81; ch-05:p83; ch-05:p86; ch-05:p87; ch-05:p93", mutable: true }
      - { trait: "refuses the procurer flat, in English ('No. I'll carry it.'), slings the bag crosswise and walks out of the square toward the cleft in the cliffs; at the corner he is still watching her go", source: "ch-05:p132; ch-05:p133", mutable: true }
      - { trait: "the one long outpouring of the chapter, to Kallia in English: 'There isn't a person on earth who knows where I am. I work in a museum in Philadelphia, in a basement, I glue lamps back together for a living, I came to Greece for three weeks on a credit card because of a dead man's notebook, and my cousin expects me home in June. I walked out of a cave yesterday. I was in it ten minutes. My father's Seiko says it was ten minutes.' The voice goes on her; 'I don't even know your name.' Evasion holds: 'my father's Seiko', no death named", source: "ch-05:p159", mutable: true }
      - { trait: "cannot do any of the household work Kallia names: cannot carry a full jar higher than her chest, does not know how to carry on the head, knows 'card' only from the women in the palace on Ithaca ('that was the whole of my acquaintance with it'), shakes her head at 'Weave?'; 'Eggs. I can do eggs.' ('She took that for a no, which it more or less was'). Carries the jar 'on my hip, which was wrong'", source: "ch-05:p162; ch-05:p163; ch-05:p165; ch-05:p167; ch-05:p169; ch-05:p170; ch-05:p178", mutable: true }
      - { trait: "answers 'Whose are you?' with 'Mine.' (no language tag on the page; Kallia turns and starts up the road)", source: "ch-05:p173; ch-05:p175; ch-05:p176", mutable: true }
      - { trait: "unprompted memories and comparisons (Ch.5): a car alarm on Baltimore Avenue at three in the morning (the dog); the backs of olive-oil bottles; a Kourion sherd under her lens; the Mummers ('The Mummers had got at it'); Dr. Pinsky and the Rite Aid on Chestnut; coming in at her own door and getting rid of her keys (Kallia unloading the jar)", source: "ch-05:p1; ch-05:p5; ch-05:p36; ch-05:p68; ch-05:p138; ch-05:p153", mutable: false }
      - { trait: "does not thank Kallia for the blanket before she is gone: 'I had thanked her in neither language'", source: "ch-05:p208", mutable: true }
      # --- Ch.6 (prose) ---
      - { trait: "a month of Kallia's work: the hearth cleared and two jars in before light, then the court with the broom, the floors, the Thebans' pots, a Theban's cloak beaten; water carried up the lane on her hip twice a day ('because I still could not do it on my head'); 'I'm getting better at the water'", source: "ch-06:p37; ch-06:p38; ch-06:p164", mutable: true }
      - { trait: "builds the woodstack under the outside stair with the ends crosswise, 'two this way and two that, so that it would stand on its own and not lean on Kallia's wall' (Valens: 'Who showed you that?'; no answer)", source: "ch-06:p59; ch-06:p60; ch-06:p61", mutable: false }
      - { trait: "the Greek refusal held for the month ('I had spoken no Greek aloud since the guide on the Sacred Way … whatever got away from me got away in English'). She breaks it to ask Valens to take her up ('You go up on the mountain'), and the sentence comes out 'with all its breathings in, in the voice of a woman reading aloud to a seminar'. Her Greek is formal and bookish on the page ('I shall not need to come down'; 'Had I any silver'; 'I had no word for it except an old one. A hōrologion'). She also answers the charcoal burner ('It was oats'). It holds with Kallia ('She doesn't talk'; the blanket thanked for in English)", source: "ch-06:p23; ch-06:p39; ch-06:p61; ch-06:p78; ch-06:p79; ch-06:p125; ch-06:p155; ch-06:p267; ch-06:p321", mutable: true }
      - { trait: "understands Latin: laughs aloud at Valens's 'Ambula, asini filia' to the gray mule ('It was the plain truth about her'); Valens takes note ('You've got Latin')", source: "ch-06:p44; ch-06:p45; ch-06:p114", mutable: false }
      - { trait: "the second long English speech to a listener who cannot follow it: on the cliff in the dark, to Valens's back, unmeant ('I talked. I had not meant to.'): her name, age, work, cousin, apartment, rent, her father, the watch, the water, what she would do if the cave were open. Stopped by the one word he catches, 'Philadelphia' (the character-bible marks this device CLOSED)", source: "ch-06:p163; ch-06:p164; ch-06:p165; ch-06:p166", mutable: true }
      - { trait: "Ch.6's break (the planned failed emotional management, the one the plot earns): after the hour has passed she pleads with the rock in English ('Please … I did the water this morning. I've done the floors every day for a month, and everything anybody asked me. Please.'), then hits the slab with her fist and the heel of her hand until the skin comes off, and makes 'The noise I made had no word in it', which the cave echoes 'from places I could not see'", source: "ch-06:p244; ch-06:p248; ch-06:p249; ch-06:p250", mutable: false }
      - { trait: "reads laughter: Valens's laugh is 'a laugh with nobody at the end of it'; she knows the difference from the Sacred Way mockery", source: "ch-06:p253", mutable: false }
      - { trait: "duty before flight: on the night before the climb she gets up after midnight and 'did the morning' (ashes cleared by touch, the hearth swept, two trips to the lions in the dark, the big jar topped up), folds the blanket in four, and takes the shovel only on loan ('It is the widow's. She shall have it back.')", source: "ch-06:p30; ch-06:p152; ch-06:p270", mutable: false }
      - { trait: "will not give up a hope cheaply: digs the crack's floor down to bare rock with an ash shovel, bargains for time by the watch ('Give me until the long hand stands at the eight'), brings the whole bag into the cave ('I shall not need to come down')", source: "ch-06:p1; ch-06:p23; ch-06:p28; ch-06:p31; ch-06:p243", mutable: true }
      - { trait: "evasions with Valens: answers 'What's up there?' with 'Where I came in'; 'Until what opens?' is 'left … where it was'; 'It was not a who'; offers 'If I told you where I came from—' and accepts his 'Don't.'; tells him in Greek that no one is coming after her and that 'In Delphi not one person knows my name'", source: "ch-06:p84; ch-06:p115; ch-06:p232; ch-06:p233; ch-06:p285; ch-06:p330; ch-06:p331", mutable: true }
      - { trait: "rides a mule for the first time ('I have never tried'); is towed up the cliff stair in the dark holding the gray's tail ('by the third turn neither did I' think anything of it)", source: "ch-06:p148; ch-06:p161; ch-06:p162; ch-06:p191; ch-06:p192", mutable: true }
      - { trait: "unprompted memories (Ch.6): the ground-floor man on Larchwood pouring cat litter down the front steps in the January '94 ice storm; her father winding the Seiko at the kitchen counter 'on the few mornings he was there' while the percolator went; Ray's snow tires on the Buick every Thanksgiving weekend to Easter Monday", source: "ch-06:p43; ch-06:p132; ch-06:p172", mutable: false }
      # --- Ch.7 (prose) ---
      - { trait: "learns to pass from Kallia's lessons: shorter steps 'From the knee'; eyes 'On the ground in front of you … not on the men in it' ('You see their feet.'); 'You've no ears. I answer.'; sitting with her knees together; never looking at a man ('Look at a man out there and you've asked him something. And somebody answers.'). By the month's end 'My eyes went to the ground of their own accord in the lane … and I knew the men of Delphi by their feet'. She still cannot carry a jar on her head", source: "ch-07:p16; ch-07:p18; ch-07:p20; ch-07:p22; ch-07:p24; ch-07:p25; ch-07:p27; ch-07:p33; ch-07:p183", mutable: true }
      - { trait: "her Greek is the book's: Erasmian vowels 'a Dutch scholar in the fifteen-hundreds had decided it ought to have', asked for 'careful with every syllable'. For her ai the town says 'something near the e in egg', and its eta is 'halfway to an i'. The salt market hears her as tragedy ('Antigone!')", source: "ch-07:p59; ch-07:p63; ch-07:p68", mutable: true }
      - { trait: "all-or-nothing (the planned Ch.7 instance): after the market laughs at her, 'for a month after that, outside Kallia's gate, I said nothing to anyone if I could help it'. Indoors she talks, 'since the morning of the shovel'. She breaks the silence once, on day nineteen, to give the clerk her name", source: "ch-07:p60; ch-07:p71; ch-07:p72; ch-07:p159", mutable: true }
      - { trait: "reads upside down: 'I had read upside down across a good many desks in my life, and I read this one' (the clerk's wax)", source: "ch-07:p151; ch-07:p171", mutable: false }
      - { trait: "improvises under pressure: gives the clerk 'Mara' when Kallia has no name to give, and her father's name in Greek, 'Aimilios', 'before I had decided anything about it'", source: "ch-07:p157; ch-07:p158; ch-07:p163", mutable: true }
      - { trait: "freezes when a man takes hold of her: at the spring she lets the jar fall, steps back twice and stands 'with my hands at my sides'. To Kallia she says only 'A man with donkeys … Only my wrist.'", source: "ch-07:p114; ch-07:p115; ch-07:p125; ch-07:p127", mutable: true }
      - { trait: "irrelevant thought at the decisive moment: a lentisk splinter between her molars 'took up my entire mouth' while Kallia and the clerk settle what she is, and she misses the laugh Kallia gets from the line", source: "ch-07:p170", mutable: false }
      - { trait: "relief at being written down: on the step she pulls the himation up to her eyes and 'laughed into it without a sound, with my shoulders' (the 'I could not stop' of the draft is cut in the continuity repair, so no loss of control). The wax 'was the only thing in that whole country that had ever said I was in it' (CH7-5, RESOLVED)", source: "ch-07:p174", mutable: false }
      - { trait: "the cost, paid in small losses: she gives up English 'even with myself'; she cannot say her own address straight through ('I had to go back for the zip code'); she answers to 'Mera' without thinking", source: "ch-07:p183", mutable: true }
      - { trait: "unprompted memories (Ch.7): Mrs. Dunphy crying at her desk (green cardigan; the planned surfacing); her father's slides of Syracuse and his voice 'in our dark kitchen' (she has not been there); the vaccination at a West Philadelphia clinic; a gin and tonic on Rittenhouse Square", source: "ch-07:p54; ch-07:p58; ch-07:p140; ch-07:p184", mutable: false }
      - { trait: "can speak Greek by Ch.32 (argues with Philokrates in it)", source: "outline:ch-32", mutable: true }
      - { trait: "dry, quick, over-prepared, allergic to being looked after", source: "foundation:§3", mutable: true }
      - { trait: "irrelevant obsession: teeth (full surfacings Ch.7, 20, 31; glancing only Ch.2 floss, Ch.5 Kallia inspects hers, Ch.15 Valens's, Ch.24 the midwife's = the book's only introduction-by-teeth; cut from Ch.1, 4, 8, 19, 23; horrified by burnt-horn tooth powder and urine mouthwash; chews a mastic-wood stick)", source: "foundation:§3; outline:checks#4; outline:ch-01", mutable: false, ch5_note: "Ch.5 on the page: Kallia inspects HER teeth (the planned reversal, p151-p155). The beat includes one paragraph of memory about Dr. Pinsky and the softer brush (p153) and the filling 'that frayed the floss' (p154). Whether that counts as 'glancing' is for continuity-guardian; recorded, not judged", ch7_confirmed: "Ch.7 surfacing WRITTEN: the burnt-horn powder refused twice (horror at the grit); a lentisk (mastic) twig chewed into a brush; the purple toothbrush put away in the duffel; the splinter at the council (ch-07:p55; ch-07:p57; ch-07:p58; ch-07:p170; ch-07:p183)" }
      - { trait: "cognitive distortion: all-or-nothing (Ch.1, 5, 7, 9, 20, 29, 33)", source: "foundation:§3; outline:checks#4; ch-01:p11 ('If I stayed for the Sicily tray I would stay for all of them, then for the coffee, then for the foil …'); ch-03:p71 ('I was going in properly or I was going home'; outline Ch.3 chaos moment)", mutable: true, ch7_confirmed: "Ch.7 instance WRITTEN: the month of public silence (ch-07:p71; ch-07:p72)" }
      - { trait: "unprompted memory: Mrs. Dunphy crying at her desk (green cardigan Ch.7; brown Ch.24; unsure it was long division Ch.41)", source: "foundation:§3", mutable: false, ch7_confirmed: "WRITTEN: green cardigan, second button gone, long division (ch-07:p184)" }
      - trait: "failed emotional management: three breaks — Ch.6 scream at the shut cave wall (the one break the plot earns); Ch.20 weeps at a fountain over a toddler's wet pebble; Ch.22 laughing fit when a man on the benches sneezes (unearned)"
        source: "foundation:§3; outline:checks#4; outline:ch-06; outline:ch-20; outline:ch-22"
        mutable: false
        resolved_from_conflict: true
        resolved_date: "2026-10-18"
        resolution_note: "C6: foundation now says three breaks (was two)"
        ch6_confirmed: "Ch.6 break WRITTEN: she hits the slab, skins the heel of her hand, and screams wordlessly (ch-06:p248-p250); Valens laughs (p252) and gives her bread (p255). The word 'scream' is not used ('The noise I made had no word in it')."
        ch7_note: "the Ch.7 step laugh is not a break: the continuity repair cut 'I could not stop' (meta.contradictions CH7-5, RESOLVED; ch-07:p174)"
      - { trait: "refuses to speak Greek for a month after being laughed at", source: "outline:ch-05; outline:ch-07", mutable: true, ch5_note: "onset on the page: the guide's mimicry, then 'I put it away' and 'Keep the coin' in English (ch-05:p62; ch-05:p63). After polish cycle 1 and its finalize fixes: no reply to Kallia is Greek on the page; two are tagged English (ch-05:p146; ch-05:p159), one is a head-shake (ch-05:p167), and 'Eggs', 'Mine.' and 'Where are we going?' are untagged (ch-05:p169; ch-05:p175; ch-05:p179). CH5-6 narrowed, still open", ch6_note: "CONFIRMED and ENDED in part by Ch.6. The month held ('I had spoken no Greek aloud since the guide on the Sacred Way', ch-06:p39; CH5-6 RESOLVED). She broke it for Valens (ch-06:p78) and answered the charcoal burner (ch-06:p321). It still holds with Kallia (ch-06:p61; ch-06:p155). See CH6-7 for outline Ch.7 beat 3", ch7_note: "Ch.7 gives the second month, reversed as the patched outline has it (CH6-7): she talks indoors from the morning of the shovel and is silent in public for a month after the salt market (ch-07:p60; ch-07:p71). 'if I could help it' leaves room for the one break, at the council on day nineteen (ch-07:p158; ch-07:p159). The month ends at ch-07:p185" }
      - { trait: "refuses to sing at Saturnalia because she cannot do it well; then sings badly", source: "outline:ch-29", mutable: true }
      - { trait: "evasion: never uses the word 'love' in her narration until Part Two; never states her father's death plainly; never claims to be brave", source: "foundation:§3; confirmed Ch.1: 'memorial reception', 'my father's estate', the stopped watch; no 'died'/'death' in her narration (ch-01:p1; ch-01:p116; ch-01:p190)", mutable: true }
      - { trait: "evasion (narrowed): after Ch.25 she will not put FENN'S DATE in the future tense until Ch.36; hope for an earlier opening (Ch.30) and the Ch.33 debate are allowed", source: "character-bible.md#mara-reyes; audit WARN-013", mutable: true }
      - { trait: "never says 'Margaret' to Fenn (Ch.25, Ch.35)", source: "character-bible.md#mara-reyes; outline:ch-25; outline:ch-35; STATE:ARCH-17", mutable: false }
      - { trait: "keeps tremor notes in the blank back pages of Fenn's notebook from Ch.20 (a private eruption watch; no reckoning)", source: "outline:ch-20; outline:ch-30; outline:ch-36", mutable: true }
    legal_status:
      - value: "registered by a magistrate's clerk as Kallia's dependent kinswoman 'from Syracuse' — a free woman under Kallia's guardianship, never property (Ch.16 and Ch.18 depend on it)"
        source: "outline:ch-07; foundation:§4 row 7"
        resolved_from_conflict: true
        resolved_date: "2026-10-18"
        resolution_note: "C4: foundation 'property' replaced by 'dependent kinswoman' (STATE:ARCH-14)"
      - value: "ON THE PAGE (Ch.7): the clerk Sosandros enters her on the Delphian council's tribute list, in wax: 'Maira, daughter of Aimilios, of Syrakousai; free; kinswoman of Kallia, of her house and in her keeping.' Free, not property ('Bought, born in the house, or free?' / 'Free.'). Kallia answers for her ('I do.' … 'Write me.'). The fee is two obols"
        source: "ch-07:p146; ch-07:p147; ch-07:p167; ch-07:p169; ch-07:p172; ch-07:p173"
        confirms: "the plan's dependent-kinswoman status (C4). The word 'dependent' is not on the page (CH7-7)"
        where_kept: "in the clerk's wax book, added to his stack. No copy is given to her or to Kallia on the page. Mara's understanding is that the council 'would warm and scrape and write over' the wax for next year's list (ch-07:p173; ch-07:p174)"
        not_in_the_line: "the husband's-brother relation, 'Her people died', the boat and the date of arrival were told to the clerk (ch-07:p149; ch-07:p153) but are not in the line he wrote"
      - { value: "married to Valens on the Lechaion quay (consent before witnesses)", source: "outline:ch-18" }
    lie: { value: "Love the things that stay put (the made things, the dead), and keep a bag packed. Then nothing can leave you first.", source: "foundation:§3" }
    want: { value: "to go home carrying the proof her father never found; later, to take her children to her century", source: "foundation:§3" }
    need: { value: "to stop living like a visitor; to be the one who stays", source: "foundation:§3" }
