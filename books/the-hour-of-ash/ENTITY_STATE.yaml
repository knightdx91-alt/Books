    ch5_beat: { value: "at dawn in the sheepfold, fingers too stiff for the notch in the foil, 'I opened a pouch from the granola box with my teeth'; at the spring, 'I had the rest of the granola, and now I had water'. (The storeroom 'corners of the granola box' are cut in polish cycle 1)", source: "ch-05:p1; ch-05:p136" }
