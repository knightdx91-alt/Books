# ENTITY_STATE.yaml — The Hour of Ash (run 2)
# Canonical entity state. Built from the PLAN only (pre-writing). BUILD (SEED) 2026-10-18, then
# UPDATE (plan re-sync) 2026-10-18 after the architect's patch pass on the outline audit.
# UPDATE (chapter 1, finalized draft: post-polish, post-disruption) 2026-10-18. Ch.1 facts now carry ch-01:pYY
# sources; prose-vs-plan departures are logged in meta.contradictions, never silently overwritten.
# Facts, not interpretation. Contradictions are flagged with `conflict` (flag: UNRESOLVED), never resolved here;
# a conflict is marked resolved only when the source documents themselves now carry one value.

meta:
  version: "1.0"
  last_updated: "2026-10-18"
  last_updated_by: "entity-tracker"
  mode: "UPDATE (chapter 1 reconciled against manuscript/chapters/chapter-1.md)"
  source: "manuscript Ch.1 (finalized draft) + outline (patched 2026-10-18) for Ch.2-44"
  last_updated_chapter: 1
  chapters_tracked: [1]
  chapters_planned: 44
  canon_inputs:
    - "STATE.yaml (guardrails, resolved_author_decisions, decisions ARCH-1..18; ARCH-4 revised)"
    - "foundation.md (run 2, architect v4, patched 2026-10-18)"
    - "outline.md (44 chapters; Macro-Structure, turning-point map, Anti-Predictability Ledger; patched 2026-10-18)"
    - "character-bible.md (voice; patched facts used where the card states a fact, e.g. Marcus b. autumn AD 64)"
    - "evaluations/continuity/outline-audit.md § RESOLUTIONS (patch pass, 2026-10-18)"
  excluded: "research/prior-run-2026-07/ — retired run, NOT canon; nothing taken from it"
  source_convention:
    plan: "outline:ch-XX = planned in that chapter's outline entry; outline:macro = Macro-Structure/ledger block; foundation:§N = foundation section; STATE:ARCH-N = architect decision in STATE.yaml"
    manuscript: "ch-XX:pYY once written. UPDATE mode replaces outline:ch-XX with ch-XX:pYY as each chapter confirms (or contradicts) the plan."
    paragraph_rule: "pYY = the YY-th prose paragraph of the chapter file, counting every non-empty line except the '# Chapter' heading and the '* * *' scene breaks (Ch.1 = p1..p209)."
  status_convention: "Every fact below is PLANNED until its chapter is written. A written chapter that departs from a planned fact is a conflict, not an overwrite."
  method_extension: "knowledge.method adds `prior_knowledge` (known before the story's first scene, e.g. Mara's 1998 education) to the standard set told_by:slug | overheard | witnessed | discovered | inferred."
