    opened: { chapter: 6, detail: "the charcoal men had it 'this autumn' (Valens); the charcoal burner, the boy's kin, recognizes her at his kiln; Valens gives him a cover ('She's the widow Kallia's … Since the olives … She came off a ship' / 'She hit Pan')", source: "ch-06:p86; ch-06:p314; ch-06:p315; ch-06:p317; ch-06:p319; ch-06:p323" }
    risk: { value: "'He'll have you all over the town by the next market' (Valens). The burner saw them on the mountain together, which cuts against Valens's line 'You went up by yourself'", source: "ch-06:p183; ch-06:p308; ch-06:p328; ch-06:p341" }
    constraint: "character-bible at-risk list: 'the goat-boy's nymph story told by a third party' is SPENT. The rumor is not retold again on the page (its effects may be shown)"
    constraint_source: "character-bible.md (At-risk after Ch.6)"
    ch7_effects: { value: "its effects are shown and the story is not retold: 'So the town says' (the mountain, p20); 'The whole spring knows you came on a boat' (p139); Mara traces the boat to the kiln (p140). After the continuity repair the narration does not use the word 'nymph' at all; Homer's Maira is one of 'the Nereids' (p161)", source: "ch-07:p20; ch-07:p139; ch-07:p140; ch-07:p161" }
    payoff_chapter: null
    status: "open (unplanned)"
    source: "ch-06:p86; ch-06:p314-p328"

  syracuse-cover:
    description: "Mara's public identity in Greece: Kallia's husband's brother's girl, from Syracuse, come on one of the last boats"
    opened: { chapter: 7, source: "ch-07:p131", detail: "Kallia's plan in the storeroom doorway (p131-p139) and the council entry (p149-p172)" }
    parts: "Valens's boat (ch-06:p319) → the spring (ch-07:p139) → Kallia's Syracuse, the husband's brother, the dead parents, 'one of the last boats before the sea shut, after the vintage' (ch-07:p131-p135) → Mara's 'Aimilios' (ch-07:p163) → Sosandros's 'Syrakousai', MAIRA and 'Sicilian' (ch-07:p150; ch-07:p160; ch-07:p161)"
    fit_with_ch6: "COMPATIBLE with Valens's 'She came off a ship' and 'Since the olives' (the vintage comes before the olives). The draft's 'the last boat' strained against an arrival about three weeks before the last ship left Kirrha. The continuity repair made it 'one of the last boats' (CH7-3, RESOLVED)"
    weak_points: "Kallia never names the husband's brother ('What was he called?' goes unanswered, p136-p137), so by the record he is Aimilios, a Roman name ('A Roman.' / 'Half Syracuse is Roman.', p164-p165). Mara's 'Sicilian' Greek rests on 'nobody here has heard enough of it to say how strange' (p137). Mara knows Syracuse only from her father's slides (p140)"
    payoff_chapter: null
    status: "open (unplanned detail; the plan's 'from Syracuse' is planned)"
    source: "ch-06:p319; ch-07:p131-p172; outline:ch-07"

  kallias-fifth-coin:
    description: "the fifth coin for Valens's split oak, owed when it burns without spitting"
    opened: { chapter: 6, source: "ch-06:p66", detail: "'Four now, and the fifth when I've seen it burn without spitting'" }
    ch7_beat: { chapter: 7, detail: "'It spat.' / 'Twice. Once on my good hearthstone and once in the lentils. When it's done a month without spitting, you'll have your coin.' He leaves without it", source: "ch-07:p96; ch-07:p98; ch-07:p100; ch-07:p106" }
    constraint: "continuity audit W-13: the spitting-oak haggle is SPENT; the coin is paid or forgotten off the page, and never argued a third time"
    payoff_chapter: null
    status: "open (unplanned)"
    source: "ch-06:p66; ch-07:p100; evaluations/continuity/chapter-7-audit.md W-13"

  thyiades-midwinter:
    description: "the women's midwinter climb for Dionysos"
    opened: { chapter: 7, source: "ch-07:p186; ch-07:p189; ch-07:p191; ch-07:p193", detail: "'At midwinter the women climb Parnassus' / 'The god's women. Dionysos's. Every woman in this town who's any good, and a few who aren't. They go every other winter, and this is the winter. You'll come. You've the boots for it.' / 'Onto the plain. In the snow, at night, with torches, and a skin of wine for every three of you, and no man past the last house.' / 'Bind your feet in rags over the boots, and bring the girl's himation.' / 'Dance. Drink. Freeze. Not as high as your cave.'" }
    mara_question: { value: "'How far was it, at night, on foot, from wherever the women danced to the cave?'", source: "ch-07:p194" }
    payoff_chapter: 8
    status: "planned_open"
    source: "ch-07:p186-p194; outline:ch-08"
  kleodamos-archon:
    description: "the archon's name, heard twice (the goat-boy Ch.4; the herald's decree Ch.5)"
    opened: { chapter: 4, source: "ch-04:p22" }
    beats: [5]
    payoff_chapter: null
    status: "no_payoff_by_design (character-bible: a fictional eponymous archon, a name only, not a dating clue). The page does not say whether Mara connects the two hearings"
    source: "ch-04:p22; ch-05:p99; character-bible.md (Ch.4 walk-ons)"

  mrs-dunphy:
    description: "unprompted, mutating memory"
    beats: [7, 24, 41]
    beats_written: [{ chapter: 7, source: "ch-07:p184" }]
    payoff_chapter: null
    status: "no_payoff_by_design (never connected)"
    source: "foundation:§3"

# =====================================================================
# WORLD RULES
# =====================================================================
world_rules:
  - { rule: "THE LAW OF THE DOORS: a door takes back anyone who came through a door, from any time, through any mouth, but no one native to its side. Fenn's phrase 'it takes back the one it brought' states this exactly because his 'it' is ALL the doors as one ('one door with many mouths'): the cave brought Mara, so Pompeii's mouth takes her.", revised: "2026-10-18", source: "foundation:§9; foundation:§4d; foundation:§1; outline:ch-25; STATE:ARCH-16" }
  - { rule: "Fenn does not know the native exclusion (always alone); Mara discovers it at the door in Ch.42, never stated as a rule.", source: "foundation:§9; outline:ch-42" }
  - { rule: "WHAT CANNOT PASS: Valens, Lucius and Aelia (all native to the AD side — children born in the past count as native) meet painted plaster.", source: "outline:ch-42" }
  - { rule: "WHAT CAN PASS: the traveler, and the objects she puts through — microcassette, film canister, Fenn's notebook (his key figures and her tremor notes in its back pages), his Zippo and 1964 dime go to the other side in Ch.43 (all made on the modern side). Whether objects made on the ancient side can pass is not established.", revised: "2026-10-18", source: "outline:ch-43; foundation:§4c", ch3_observed: "Ch.3 (prose): everything Mara carries goes through the crack with her (the duffel and contents, the Pentax, the Seiko, Fenn's notebook, the walker's map, the lens cap) AND the knucklebone, an object made in antiquity, in her pocket, in the 1998 → past direction (ch-03:p73; ch-03:p78). The page states no rule; whether an ancient-made object can pass in the past → modern direction is still not established." }
  - { rule: "A door is felt as a seam of cool air and an absence of sound; no voices, glow or special effects.", source: "foundation:§9; outline:ch-03; ch-03:p70; ch-03:p73", ch3_observed: "Ch.3 on the page: the cold arrives as 'a single thread' across the back of a hand; unlike damp cave cold it is dry, has 'an edge', aches into the bones to the wrist (a chest-freezer cold); the breath shows white; the cave's sounds go 'thin and far away' then are gone; the ears fill with pressure that does not pop; 'The beam of the flashlight shook on the rock' (her hand, not the door); inside, kneeling, 'nothing at all'; no light, voices or visions. Mara's own response is a blush of embarrassment. Afterwards: cave air, and nothing from the crack. Timing: the cold came at 1:40 after about an hour and forty minutes of still air (ch-03:p62; ch-03:p63; ch-03:p68-p78)" }
  - { rule: "OBSERVED (Fenn's 1968 notebook, before his crossing): the Corycian slot breathed cold intermittently: 'about a minute', then 'like somebody shut a door in another part of the house' (May); again one Tuesday morning; then nothing for weeks; on 21 July cold enough to see his breath, for 'a whole cigarette, which is the longest yet'. Fenn: 'cold in a way air isn't', unlike the 'cave cold' he knew from Florida sinkholes. Mara's counter-reading: 'Caves breathed' with the weather. The page does not say how these breaths relate to the OPENING DURATION rule.", source: "ch-02:p19; ch-02:p20; ch-02:p22; ch-02:p69" }
  - { rule: "OPENING RHYTHM: doors open on their own timing; Fenn's empirical rule is that they 'breathe with the earth'.", source: "foundation:§9; outline:ch-25" }
  - { rule: "OPENING DURATION: an opening lasts hours, never days. AD 62 = part of one night (the quake night); AD 79 = from the night after the mountain opens until before first light on the 25th.", revised: "2026-10-18", source: "foundation:§9; outline:ch-25; audit WARN-016" }
  - { rule: "Tremors alone did not predict the Pompeii door: Fenn's tremor-only dates (71, 73) failed; his 79 date is the tremor tables rebuilt around the known eruption year.", revised: "2026-10-18", source: "outline:ch-25; foundation:§3" }
  - { rule: "The Pompeii door's next opening is late summer AD 79 (Fenn); the arithmetic (Fenn's tables + Mara's independent tremor notes) puts it in the night after the mountain opens; it opens before dawn 25 Aug 79.", source: "outline:ch-25; outline:ch-36; outline:ch-42" }
  - { rule: "An ordinary tremor (AD 77) does not open the door.", source: "outline:ch-30" }
  - { rule: "Dormant/waking door temperature: faintly cool (Ch.19) → the same faint coolness, no colder, after the tremor (Ch.30) → cooler (Ch.36) → cold (Ch.41) → open (Ch.42).", revised: "2026-10-18", source: "outline:ch-19; outline:ch-30; outline:ch-36; outline:ch-41; outline:ch-42; foundation:§4f; audit N-24" }
  - { rule: "Doors do not deliver to matching dates: 1968 → AD 41 (Fenn); May 1998 → autumn AD 70 (Mara). So the far side in Ch.42 is '1998, or near it' only; the narration never asserts the year (Ch.43 says 'the other side' / 'her own century').", revised: "2026-10-18", source: "foundation:§9; outline:ch-03; outline:ch-42; outline:ch-43", ch3_observed: "Ch.3 (prose): Mara goes in on a May day and comes out under a low autumn sun she reads as October; her Seiko advances only ten minutes (1:40 → 1:50) and keeps the 1998 day's time; the year on the far side is not shown or known to her (ch-03:p68; ch-03:p81; ch-03:p82; ch-03:p84)", ch4_observed: "Ch.4 (prose): on the far side the inscription is freshly cut and painted, the pen is unbroken, and there is no road, no ski ridge, no tin roof. The year is still not given: archon Kleodamos, month Boathoos, a Kaisar in Rome (ch-04:p22; ch-04:p24; ch-04:p28; ch-04:p61; ch-04:p62; ch-04:p64)" }
  - { rule: "OBSERVED (Ch.3): the Corycian slot gave still air and ordinary cave cold to Mara's hand from about noon until 1:40; the cold then came at 1:40 p.m. by her watch on a day in May (Fenn's July 21 1968 cold was in the morning). The page does not relate this timing to any rule.", source: "ch-03:p62; ch-03:p63; ch-03:p68; ch-02:p69" }
  - { rule: "A door used for a crossing can stay shut afterwards (the Corycian door, Ch.6 and Ch.8).", source: "outline:ch-06; outline:ch-08", ch6_observed: "Ch.6 (prose), about a month after the crossing: the Corycian crack, tested by hand from before 1:10 to 1:55 by the watch on a snowy afternoon (the May cold came at 1:40), gives nothing: 'Rock. Air. Cold that was only cold.' / 'The rock was cold. Behind me the torch flame stood straight up.' One null afternoon; the page does not say the door is shut for good (Mara: 'I have no idea what happens if it's shut')", ch6_source: "ch-06:p13; ch-06:p14; ch-06:p164; ch-06:p239; ch-06:p245; ch-06:p247" }
  - { rule: "OBSERVED (Ch.6): in deep cold the door's sign cannot be told apart. The Ch.3 cold was a single dry, edged thread against damp, slow cave cold (ch-03); Ch.6 recalls it as 'a cold of its own, and my skin had singled it out at once'; in November 'the whole mountain had turned to cold … Nothing could have come through that crack that I would have known from the rest'. A hand test proves nothing in winter, so the planned midwinter attempt (Ch.8) has the same limit. The page does not say whether anything opened unseen", source: "ch-06:p2" }
  - { rule: "OBSERVED (Ch.6): the opening is not tied to a repeating clock hour, at least on this day. Her only rule, the May hour (1:40), gives nothing ('It was nothing to go on, and I had nothing else'). The page names the change of time basis: the May cold came at 1:40 'by Athens time, which ran an hour and more ahead of this sun' (p14), and she waits for the face-value hour anyway (CH6-8 RESOLVED). Agrees with Fenn's 1968 record of breaths on scattered days with weeks of nothing", source: "ch-06:p13; ch-06:p14; ch-02:p20" }
  - { rule: "OBSERVED (Ch.6): the door answers nothing the traveler does. Clearing the floor to bare rock, bringing 'Everything' she owns to the crack, pleading in English, striking the slab: none of it changes anything. No voices, light or sign: only the drip, the torch hissing and her own echo. Keeps 'The mechanism is never explained' and 'no special effects'", source: "ch-06:p158; ch-06:p243; ch-06:p244; ch-06:p248; ch-06:p250; ch-06:p251" }
  - { rule: "OBSERVED (Ch.6): a native standing by changes nothing that can be seen. Valens stands on the flowstone below the crack holding the torches the whole time, and nothing opens, so the page says nothing either way about the native exclusion (Ch.42)", source: "ch-06:p7; ch-06:p237" }
  - { rule: "OBSERVED (Ch.6): time on this side runs on at the same rate as hers. About a month passes for her in Delphi and on the mountain ('Somebody had tied the hurdle shut with a fresh withy since October'; the ledge offerings of Ch.4 gone under snow), and nothing suggests otherwise", source: "ch-06:p37; ch-06:p219; ch-06:p221" }
  - { rule: "CONSEQUENCE (Ch.6 → Ch.7, plan): with the way back closed she must live here, and the Greece-first obstacles apply in full (a guardian, a name, a story, clothes). Her belief that an open crack would put her in 1998 near Delphi (hotel, bus, Kennedy, Philadelphia) is untested, and the plan's rule is that doors do not deliver to matching dates", source: "ch-06:p164; outline:ch-07; foundation:§9" }
  - { rule: "Doors can die (the Cumae door).", source: "outline:ch-27" }
  - { rule: "Each opening is brief: the door's seam closes (Ch.43).", source: "outline:ch-43" }
  - { rule: "The mechanism is never explained (Outlander standard).", source: "foundation:§9" }
  - { rule: "Women did not enter to consult the Oracle; they asked through a male representative. The Pythia speaking to a woman privately, off duty, is not an oracular response (Ch.13).", revised: "2026-10-18", source: "foundation:§9; foundation:§11.4; STATE:ARCH-4 (revised)" }
  - { rule: "Oracle consulted on fixed (monthly) days in the warm months; year's first consultation on the seventh of Bysios; the goat must shiver at a sprinkling of cold water.", revised: "2026-10-18", source: "foundation:§9; foundation:§3" }
  - { rule: "A foreign woman with no guardian is legally nobody; she must be registered as someone's.", source: "foundation:§3; outline:ch-07", ch5_observed: "Ch.5 (prose) shows the social side, not the law: strangers ask 'Where's your man?' and 'Whose is she?' / 'Whose are you?'; on the god's steps she is assumed to have 'run off from some house'; at dusk a man offers her 'a house … that takes in girls on their own' (ch-05:p11; ch-05:p76; ch-05:p77; ch-05:p130; ch-05:p173)", ch6_observed: "Ch.6: Valens's questions assume a woman alone is someone's runaway ('Who's coming after you?' / 'A husband.' / 'A father, then.'); trousers 'so the road wouldn't take you for a woman'; the charcoal burner: 'Since when has Kallia got anybody?'; the cover that makes her safe is 'She's the widow Kallia's' (ch-06:p114; ch-06:p116; ch-06:p118; ch-06:p315; ch-06:p316; ch-06:p328)", ch7_observed: "Ch.7 (prose) shows the law. The council's clerk enters every household on the tribute lists, with the form's questions: 'Bought, born in the house, or free?' / 'Kin?' / 'Resident since when? On what business?' / 'Name' / 'Daughter of?' / 'who answers for her? A free woman wants someone to answer for her.' A widow answers for her own house and for her kinswoman over 'A woman can't answer for—'. The entry costs two obols and is kept in wax (ch-07:p129; ch-07:p146; ch-07:p148; ch-07:p152; ch-07:p154; ch-07:p162; ch-07:p166; ch-07:p168; ch-07:p169; ch-07:p173)" }
  - { rule: "OBSERVED (Ch.5): at Delphi, touching the god's house 'unwashed' is grounds for removal by the temple's men and a slave with a rod; passers-by touch water from a basin at the gate to their foreheads; strangers are to keep clear of the altar at the decreed sacrifice, and the meat goes to citizens only", source: "ch-05:p23; ch-05:p75; ch-05:p78; ch-05:p84; ch-05:p102; ch-05:p103" }
  - { rule: "Roman marriage needs no priest: consent before witnesses.", source: "outline:ch-18" }
  - { rule: "A husband who divorces an adulterous wife may retain part of her dowry; recovery via the actio rei uxoriae, heard by a single iudex (no jury); the father keeps the children after divorce, and custody/access is not a remedy in a dowry suit.", revised: "2026-10-18", source: "foundation:§3; foundation:§9; outline:ch-22" }
  - { rule: "An auctoratus (free man sworn to a gladiator school for a term) cannot be bought out before his first fight. An informally freed slave (Junian Latin) is free enough to swear the oath.", revised: "2026-10-18", source: "outline:ch-28; foundation:§3" }
  - { rule: "An arena manumission unregistered before a magistrate can be contested as void (Celer's 'property' claim); the Corinth archive copy proves registration.", source: "foundation:§3" }
  - { rule: "The sea is closed from about November to March (letters wait in harbor; Ariston's sat at Kirrha all winter).", source: "foundation:§9; outline:ch-10", ch5_observed: "Ch.5: 'News like that came to Greece in weeks, by sea, and the sea was still open' (autumn AD 70, Mara's reasoning); letters from Corinth arrive 'with the ship' (ch-05:p95; ch-05:p108)", ch6_observed: "Ch.6: shut. 'Is the sea shut yet?' / 'The last ship went out of Kirrha eight days ago.' Before it, from the east: oil, Cretan wine, a man with dogs. No letters carried by Valens. Overland too: 'The road over to Boeotia's under snow. All of it.' (ch-06:p68; ch-06:p69; ch-06:p71; ch-06:p73; ch-06:p149)", ch7_observed: "Ch.7: the cover 'one of the last boats before the sea shut, after the vintage'; four Thebans held 'till the thaw' (ch-07:p135; ch-07:p144)" }
  - { rule: "Political backdrop: Nero granted Achaea 'freedom' (late 67), removing the proconsul; there is no proconsul in 69; Vespasian revoked it, and in this book a proconsul governs from Corinth again by 71.", revised: "2026-10-18", source: "foundation:§9; foundation:§3", ch7_observed: "Ch.7, winter AD 70-71: 'The talk at the spring was that the new emperor meant to take back the freedom Nero had given Greece, and freedom … had meant chiefly that Greece paid no tribute; nobody at the spring knew when'; the council registers every house 'before Rome put a governor back in Corinth to ask for it'. No governor yet, which agrees with this rule (ch-07:p129; CH7-4 RESOLVED)" }
  - { rule: "Roman equids went barefoot or in strapped hipposandals; no nailed horseshoes (Ch.24 hooves trimmed).", source: "outline:ch-24", ch6_observed: "Ch.6: no shoes on Valens's mules. On ice he binds sacking round each hoof with twine pulled tight with his teeth, and rebinds fresh at the kiln. On Kallia's iced lane he throws ashes where the hooves land (ch-06:p42; ch-06:p172; ch-06:p315)" }
  - { rule: "OBSERVED (Ch.6): offerings at the Corycian cave go on in AD 70. A muleteer leaves a corner of crust on the ledge under the inscription for Pan ('It's his house' / 'I pay him'). Ch.4 showed a lamp and three knucklebones there; by Ch.6 the ledge 'held only snow'", source: "ch-04:p28; ch-06:p221; ch-06:p225; ch-06:p226; ch-06:p228" }
  - { rule: "OBSERVED (Ch.6): the temple of Apollo is repainted each spring after the snow, by a man the priests hang off the roof on a rope 'with a pot of red'", source: "ch-06:p177; ch-06:p179" }
  - { rule: "OBSERVED (Ch.7): a woman in Phocis belongs to somebody, and the town works out whose (the women at the spring look for who 'had sent me down for the water'; men slow in a lane to see who is behind her). Mara's claim: 'A woman with nobody behind her was a piece of luck lying in the road for whoever bent down first'", source: "ch-07:p1" }
  - { rule: "OBSERVED (Ch.7): how a respectable woman moves in public: short steps; eyes on the ground a few steps ahead; men known by their feet; never looking at a man ('Look at a man out there and you've asked him something. And somebody answers.'); never answering men (her keeper answers); sitting knees together, the himation drawn down, hands folded", source: "ch-07:p18; ch-07:p20; ch-07:p22; ch-07:p24; ch-07:p26; ch-07:p33" }
  - { rule: "OBSERVED (Ch.7): the public latrine is men's ground; women's bodily needs are met at home (a lidded pot, the dung heap at the lane's end)", source: "ch-07:p36" }
  - { rule: "OBSERVED (Ch.7): the bath is shared by hours (women from first light until the sun clears the cliffs, men after their exercise); women singe their legs with lamps and clean their teeth with burnt horn powder ('Goat's is best')", source: "ch-07:p38; ch-07:p42; ch-07:p55; ch-07:p57" }
  - { rule: "OBSERVED (Ch.7): at the Castalian spring the lions are for people and the trough at the bottom of the basin is for animals. Watering donkeys at the lions is 'drinking the god's water at the wrong end of his basin', a matter for a priest", source: "ch-07:p108; ch-07:p121" }
  - { rule: "OBSERVED (Ch.7): the Dionysian women's rite on Parnassus is held 'every other winter', at midwinter, at night on the snowbound plain, with torches and wine and 'no man past the last house'", source: "ch-07:p186; ch-07:p189; ch-07:p191" }
  - { rule: "OBSERVED (Ch.7): Delphian Greek in AD 70 is not the Erasmian Attic of Mara's books: the town says its ai 'near the e in egg' and its eta 'halfway to an i' (all the way to an i in the mountain villages). Book Attic sounds like the tragic stage", source: "ch-07:p59; ch-07:p68" }
  - { rule: "Eruption per Pliny: column ~1 p.m. 24 Aug; ~18 hours of pumice; roofs collapse; boats cannot land; surges reach Pompeii ~6:30-7:30 a.m. 25 Aug. The October theory is never raised.", source: "foundation:§9; STATE:ARCH-10" }
  - { rule: "Narrative law: the narrator's horizon is the moment narrated — no foreshadowing; Mara's historical knowledge of 79 is present-tense dread only.", source: "foundation:§6a; STATE:guardrails" }

# =====================================================================
# ORGANIZATIONS
# =====================================================================
organizations:
  thyiades:
    canonical_name: "the Thyiades"
    aliases: ["the Delphian women of Dionysus"]
    facts:
      - { fact: "winter rites on Parnassus by torchlight (ivy, fawnskins, drums, wine); trapped by snow until dawn in Ch.8", source: "outline:ch-08; foundation:§9" }
      - { fact: "Ch.7 (Kallia): 'The god's women. Dionysos's. Every woman in this town who's any good, and a few who aren't'. They go up 'every other winter, and this is the winter', at midwinter: 'Onto the plain. In the snow, at night, with torches, and a skin of wine for every three of you, and no man past the last house'. The page does not use the name Thyiades", source: "ch-07:p186; ch-07:p189; ch-07:p191" }

  delphic-sanctuary:
    canonical_name: "the sanctuary of Apollo at Delphi"
    aliases: ["the priests", "the prophetes"]
    facts:
      - { fact: "priests hire Mara to mend bronze (incense stand) and pay with contempt", source: "outline:ch-09" }
      - { fact: "a temple slave beats Mara off the steps with a rod", source: "outline:ch-05; ch-05:p84; ch-05:p85; ch-05:p86", ch5_confirmed: "CONFIRMED: a man in a white tunic with a purple stripe and a staff, with two more men, hauls her off the porch; a barefoot slave with a peeled rod beats her down the steps and to the head of the ramp; the rod splits; 'Get her down before the priest comes out'" }
      - { fact: "Ch.5: a priest's assistant sluices blood off the black altar's step; a sacrificial goat is led up to a flute; the temple steps and porch are policed against the unwashed", source: "ch-05:p32; ch-05:p65; ch-05:p75; ch-05:p79" }
      - { fact: "Ch.6: the priests have the temple repainted every spring by the same cheap painter on a rope (Valens); the sanctuary wall's high corner marks the start of the cliff stair; 'the sanctuary dogs' know Valens", source: "ch-06:p160; ch-06:p177; ch-06:p179; ch-06:p339" }
      - { fact: "Ch.7: the Castalian water is 'the god's water' and the basin 'his basin'; misusing it is a matter for a priest; the women's bath lies below the sanctuary", source: "ch-07:p38; ch-07:p121" }

  delphi-council:
    canonical_name: "the council and people of the Delphians"
    aliases: ["the council"]
    facts:
      - { fact: "receives letters from Corinth by ship and has its herald proclaim them in the market square; the archon Kleodamos with the council and the people decree a sacrifice of oxen to Pythian Apollo for the Emperor and Titus (autumn AD 70); a council house (the procession's start); a clerk who knows the titles", source: "ch-05:p95; ch-05:p99; ch-05:p100; ch-05:p102" }
      - { fact: "the square expects the council to take most of the meat ('The council will have it all before it's cooked')", source: "ch-05:p118" }
      - { fact: "Ch.6: after the sacrifice, the charcoal burner's grievance about 'the god's ox' names 'the number four' and 'the council' (Mara catches no more); he got 'Smoke'", source: "ch-06:p312; ch-06:p314" }
      - { fact: "the prophetes conducts the consultation; Theano is the Pythia; consultation days are monthly in the warm season", source: "outline:ch-13; foundation:§3" }
      - { fact: "a temple slave carries Theano's summons to Mara (Ch.13)", source: "outline:ch-13" }
      - { fact: "Ch.7: its clerk is Sosandros; it meets in a long hall beside the square; in winter AD 70-71 it enters every household on the tribute lists in wax books, 'before Rome put a governor back in Corinth to ask for it'; the fee is two obols; one boundary dispute has run 'through three councils'; Kallia has 'the council's ear' (the salt-seller)", source: "ch-07:p121; ch-07:p129; ch-07:p141; ch-07:p156; ch-07:p173" }

  household-of-celer:
    canonical_name: "the household of Q. Arrius Celer"
    aliases: ["Celer's men"]
    facts:
      - { fact: "claims Valens as runaway property (Ch.9 notice; issued autumn AD 70)", source: "outline:ch-09; outline:ch-12" }
      - { fact: "three men attack on the Kirrha road; one dies, two run (Ch.12)", source: "outline:ch-12" }
      - { fact: "still hunting Valens in summer AD 71 (Ch.15)", source: "outline:ch-15" }
      - { fact: "carry Celer around scaffolding", source: "foundation:§3" }

  corinth-record-office:
    canonical_name: "the provincial record office at Corinth"
    aliases: []
    facts:
      - { fact: "holds the archive copy of Valens's manumission under Celer's influence (he is on the restored proconsul's staff by 71–72); a bored fig-eating clerk", source: "outline:ch-16; outline:ch-17; foundation:§3" }

  pompeii-gladiator-school:
    canonical_name: "Pompeii's gladiator school"
    aliases: ["the barracks", "the ludus"]
    facts:
      - { fact: "an old trainer recognizes Lupus; an editor offers an exhibition bout (refused)", source: "outline:ch-21" }
      - { fact: "Felix sworn as auctoratus (AD 76); term served out by Aug 79", source: "outline:ch-28; outline:ch-37" }

  basilica-julia-court:
    canonical_name: "the court in the Basilica Julia"
    aliases: []
    facts:
      - { fact: "a single iudex with assessors hears the dowry suit, spring AD 74; Celer must return the dowry; Plautia's access to Marcus is Celer's private settlement, not the court's order", source: "outline:ch-22" }

  french-excavators:
    canonical_name: "the French (archaeologists at Delphi and the Corycian Cave)"
    aliases: ["the French"]
    note: "the page never names the institution"
    facts:
      - { fact: "paid for Kastri to be moved off the Delphi site in the 1890s (Mara)", source: "ch-01:p83" }
      - { fact: "1968 (Fenn): the village was moved 'so the French could dig'", source: "ch-02:p17" }
      - { fact: "dug the Corycian Cave floor at the beginning of the seventies; 'sieved more than twenty thousand knucklebones out of it'; their spoil went back into the floor", source: "ch-03:p54" }

  delphi-ephorate:
    canonical_name: "the ephorate (Greek antiquities service at Delphi, 1998)"
    aliases: ["the ephorate"]
    facts:
      - { fact: "by Mara's procedure, the body a finder reports to in Delphi; 'who would thank you without warmth and send a man up in a month'; not told of the knucklebone", source: "ch-03:p57" }

  philadelphia-university-museum:
    canonical_name: "the Philadelphia university museum"
    aliases: []
    facts:
      - { fact: "employs Mara as objects conservator; hosts Emilio's memorial in the upper gallery", source: "foundation:§3; ch-01:p1; ch-01:p53" }
      - { fact: "has a dean (and dean's office), a registrar (Frank), a slide library, and a department office that booked the memorial; the dean plans a spring lecture fund in Emilio's name; no food normally allowed in the galleries", source: "ch-01:p2; ch-01:p9; ch-01:p13; ch-01:p174", ch1_revision_note: "the classroom wing and the fire-department bill are no longer on the page (removed 2026-10-18 re-sync)" }
      - { fact: "Ch.2: Mara's basement lab with a fax (receives Halloran's form; the declaration is faxed to Naples that afternoon, sending place not stated); the storerooms (a lamp damaged there c.1935); Mara's department head signs her leave form against a seed catalogue (and asks whether the Greeks grow a decent tomato)", source: "ch-02:p6; ch-02:p44; ch-02:p63" }

  soprintendenza:
    canonical_name: "the Soprintendenza (Campania)"
    aliases: []
    facts:
      - { fact: "issues the permesso for the Campanian survey season; wants a new name on Emilio's permit by 20 April 1998 or the season lapses", source: "ch-01:p176" }
      - { fact: "accepts Halloran as director for the season; requires the cession signed in ink by the outgoing director, witnessed (notary or consul); returned his dossier marked in red 'Firma mancante'; will accept the heir's declaration before a notary with the certificate", source: "ch-02:p28; ch-02:p30; ch-02:p35" }
      - { fact: "'did not work Mondays in any sense that mattered' (Halloran), hence his target of the 15th", source: "ch-02:p35" }

  free-library-of-philadelphia:
    canonical_name: "the Free Library of Philadelphia"
    aliases: ["Walnut Street West branch"]
    facts:
      - { fact: "recorded overdue notice to Emilio for Wild Horses", source: "ch-01:p170" }
      - { fact: "1967: holds 'the Army map' from which Fenn takes the cave's coordinates (branch not named)", source: "ch-02:p2" }

  philadelphia-inquirer:
    canonical_name: "the Philadelphia Inquirer"
    aliases: ["the Inquirer"]
    facts:
      - { fact: "ran Emilio's obituary in January 1998 ('a professor who dug things'), read by Szabo", source: "ch-01:p123" }
      - { fact: "1968: Fenn expects Margaret to believe his story only 'until she reads it in the Inquirer'", source: "ch-02:p69" }

  us-consulate-athens:
    canonical_name: "the American consulate in Athens"
    aliases: []
    facts:
      - { fact: "issued the carbon of 16 September 1968 forwarding Fenn's overcoat 'with contents of pockets' to Miss Margaret Fenn; the typist misspelled Pennsylvania and x'd it out", source: "ch-02:p65; ch-02:p66; ch-02:p67" }

  olympic-airways:
    canonical_name: "Olympic Airways"
    aliases: []
    facts:
      - { fact: "800 number answered in New York near midnight; sells Mara a seat Kennedy → Athens for Tue 19 May 1998", source: "ch-02:p50; ch-02:p52" }
      - { fact: "Ch.3 confirms she flew from Kennedy ('somewhere between Kennedy and here'); the airline is not named in Ch.3", source: "ch-03:p9" }

  twa:
    canonical_name: "TWA"
    aliases: []
    facts:
      - { fact: "Fenn's airline to Athens, 2 April 1968", source: "ch-02:p13" }
