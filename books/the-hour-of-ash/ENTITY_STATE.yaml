    knowledge:
      - { fact: "Pompeii is destroyed by Vesuvius in AD 79 (1998 education; 1988 plaster-cast exhibition as a graduate student)", learned_chapter: 0, method: "prior_knowledge", first_in_scene: 14, source: "outline:ch-14" }
      - { fact: "Pliny's account: column ~1 p.m. like an umbrella pine; ~18 hours of pumice; roofs collapse; boats cannot land; surges reach Pompeii ~6:30-7:30 a.m. on the 25th; date 24 August", learned_chapter: 0, method: "prior_knowledge", first_in_scene: 36, note: "date stated in present thought Ch.36; hours told to Valens Ch.37", source: "outline:ch-36; outline:ch-37; foundation:§9" }
      - { fact: "the chart (and the cigar box with the notebook) came from Margaret Fenn's estate sale (Szabo volunteers it) in Chestnut Hill last October (1997): an old lady, no children, a house full of boxes; her brother, a 'treasure hunter', went to Greece in sixty-eight and did not come back; the sister kept his things; the brother wrote on the chart", learned_chapter: 1, method: "told_by:irene-szabo", note: "Szabo does not say the brother's name", source: "ch-01:p88; ch-01:p90" }
      - { fact: "the notebook's owner: 'A. J. FENN' on the oilcloth cover, in the same square capitals as the ballpoint on the chart", learned_chapter: 1, method: "discovered", note: "she closes the lid without reading it; notebook unread at chapter end", source: "ch-01:p99" }
      - { fact: "the chart is a Venetian survey from Morosini's war (1687-88), coast sounded by the navy; Szabo bought it because 'the coast is right' and it says Castri, not Delfi; the Fenn lot also held Navy uniforms, forty years of National Geographic and a glassless diving helmet", learned_chapter: 1, method: "told_by:irene-szabo", source: "ch-01:p80; ch-01:p82; ch-01:p102" }
      - { fact: "Szabo's reading of the ink: the brother was hunting 'a library' (the one people dig for, Alexandria)", learned_chapter: 1, method: "told_by:irene-szabo", note: "Szabo's opinion; Mara notes the question mark after BIBLIOTHECA 'did not look sure'", source: "ch-01:p94; ch-01:p96; ch-01:p97" }
      - fact: "Halloran (ringing from Naples): the permesso for the Campanian survey season is still in Emilio's name; the Soprintendenza want another name on it by the twentieth of April or the season lapses (then 'one begins again from nothing'); asks whether the family will send anyone; 'It needn't be an archaeologist, strictly, for the paperwork'"
        learned_chapter: 1
        method: "told_by:halloran"
        note: "recorded message on the incoming tape; she wrote nothing down and erased it (p178). Deadline vs character-bible sample line: meta.contradictions CH1-1"
        source: "ch-01:p176; ch-01:p178"
      - { fact: "a friend in Nicosia (unnamed) has found Emilio's 1992 Kourion drawings, the whole box, under his bed, and has not heard of the death", learned_chapter: 1, method: "told_by:nicosia-caller", note: "message; she infers he has not heard", source: "ch-01:p172; ch-01:p173" }
      - { fact: "Pat next door has Emilio's blue Tupperware; Emilio shoveled her walk; the Free Library (Walnut Street West) wants Wild Horses back; the department office booked the upper gallery, Saturday the fourteenth, two o'clock; an unnamed woman breathed 'Oh, Emilio' and hung up", learned_chapter: 1, method: "told_by:pat", note: "all on the incoming tape (method covers Pat's message; the others are told_by their callers)", source: "ch-01:p168; ch-01:p170; ch-01:p174; ch-01:p175" }
      - { fact: "Tía Nilda (78) phoned the house on Thursday to tell Emilio the memorial time, got his greeting, and had to lie down; the incoming tape is full", learned_chapter: 1, method: "told_by:gloria", source: "ch-01:p160" }
      - { fact: "Emilio used to talk about rebuilding the porch every season's last week (drawn on the back of a context sheet) and talked about Mara on site 'all the time'", learned_chapter: 1, method: "told_by:doug-fessler", source: "ch-01:p24" }
      - { fact: "the dean plans a lecture fund in Emilio's name, every spring", learned_chapter: 1, method: "told_by:dean", source: "ch-01:p13" }
      - { fact: "neighbors have been in the house and stocked the refrigerator (Dorothy's Pyrex: RETURN DISH); someone has a key she did not know about", learned_chapter: 1, method: "inferred", source: "ch-01:p165" }
      - { fact: "Szabo read a Reyes professor's obituary in the Inquirer in January and asked; Mara deflected ('It's a common name')", learned_chapter: 1, method: "witnessed", source: "ch-01:p123; ch-01:p124; ch-01:p125" }
      - { fact: "Halloran's invitation: the season starts on the sixth of July, 'Three weeks, four'; a room in the dig house, 'a decent one with a window, standing empty'; 'In Emilio's place, I mean. Not to work, unless you wanted to … So that you could see it'", learned_chapter: 2, method: "told_by:halloran", note: "she answers only 'I might be in Greece' (CH2-1)", source: "ch-02:p40; ch-02:p41" }
      - { fact: "Fenn's theory (Thanksgiving 1967 entry): a scholiast's margin note, printed in small type by a German, translated for Fenn by Father Kostas at St. George's: 'The books of the Ptolemies were carried out of Alexandria by ship and taken up to the cave of the nymphs on Parnassus, and they are there.' Fenn reads it as the Library of Alexandria in a cave", learned_chapter: 2, method: "discovered", note: "read the night of Sat 14 Mar in her father's kitchen", source: "ch-02:p1; ch-02:p3" }
      - { fact: "the coordinates as Fenn wrote them, and where he got them: the chart 'got Castri right where it ought to be', and 'the Army map down at the Free Library puts the cave up the mountain from it at 38° 31′ N, 22° 32′ E'; he put that on the chart in ballpoint 'so I'd have it, with a little picture of the cave mouth beside it so I'd know which hole I meant' (= the fingernail-sized doorway she saw in Ch.1); Margaret made him add a question mark 'to be honest about it'; he needed 'about two thousand bucks and a better flashlight'", learned_chapter: 2, method: "discovered", note: "Mara does not gloss the Army-map clause", revised: "2026-10-18 (re-sync: coordinate source added in polish cycle 1)", source: "ch-02:p2; ch-01:p78" }
      - { fact: "the notebook's coordinates match the blue ballpoint above Castri on the chart 'to the minute'", learned_chapter: 2, method: "discovered", note: "she checks by sliding the chart out of its garbage bag", source: "ch-02:p4" }
      - { fact: "the scholion is real: in a Leipzig 1838 edition (marbled boards) on a bottom shelf of the university library, at the foot of a page about Phocis, it says what Father Kostas said it said; the leaves are slit with something blunt from the front up to that page and uncut after it ('He had found his line and stopped reading')", learned_chapter: 2, method: "discovered", note: "Mon 16 Mar by sequence (not stated); she does not cut the rest", source: "ch-02:p10; ch-02:p11" }
      - { fact: "Fenn's 1968 itinerary: sold the Plymouth to a mailman in Jenkintown for $600 (and a sack of oranges); TWA to Athens on 2 April 1968; at Delphi he lodged in a room over a taverna in the moved village; the cave was four hours' walk up, 'a big wet barn of a place' with names scratched on the walls, many French; 'No books'", learned_chapter: 2, method: "discovered", source: "ch-02:p13; ch-02:p17" }
      - { fact: "Fenn (undated entry; placed after the May 1968 hand-change) put his hand into a slot at the back of the cave, 'Way in past where the good light gives out', low on the left, and felt the air 'cold in a way air isn't' for 'about a minute' before it quit ('like somebody shut a door in another part of the house'); cold again one Tuesday morning; then nothing; he slept up there ('Didn't help')", learned_chapter: 2, method: "discovered", source: "ch-02:p19; ch-02:p20; ch-02:p21" }
      - { fact: "Fenn's sister was Margaret: Thanksgiving 1967 with him; she would not tell 'the girls at church' he had gone to Greece, so he was 'going to Mexico instead'; his last entry says she can stop telling them he is in Mexico", learned_chapter: 2, method: "discovered", source: "ch-02:p1; ch-02:p13; ch-02:p69" }
      - { fact: "the consulate carbon (onionskin, American consulate in Athens, dated 16 September 1968): 'Personal effects of FENN, August J., U.S. citizen: one man's overcoat, wool, gray, with contents of pockets, forwarded to next of kin, Miss Margaret Fenn, Philadelphia, Pennsylvania'; the typist put one n too many in Pennsylvania and x'd it out", learned_chapter: 2, method: "discovered", note: "found in the receipt pocket inside the notebook's back cover after humidifying the stuck back leaves; the page does not say the notebook was in the coat (CH2-3)", revised: "2026-10-18 (Ch.2 prose)", source: "ch-02:p65; ch-02:p66; ch-02:p67" }
      - { fact: "Fenn's last entry, July 21 [1968]: cold at the slot that morning, enough to see his breath, lasting 'a whole cigarette, which is the longest yet'; going in 'tomorrow first thing with the good flashlight and a ball of kite string'; 'Back before Labor Day'; Margaret will believe the story when she reads it in the Inquirer", learned_chapter: 2, method: "discovered", note: "re-read the night before her flight", source: "ch-02:p68; ch-02:p69" }
      - { fact: "Fenn's other entries: a Herald Tribune a week old left by 'a fellow off the Athens bus', read through, bridge column included ('and I don't play bridge'); June: 'Up again. Nothing.', his boots going at the toes (the goat-boy's mother has a cousin who will stitch them); 'Tired today.'", learned_chapter: 2, method: "discovered", source: "ch-02:p47; ch-02:p48; ch-02:p49; ch-02:p54" }
      - { fact: "BELIEF (Ch.2): she does not believe the scholion (p4); she explains the cold air as caves breathing with the weather (p22); she knows Fenn meant to go in on 22 July 1968 and come back before Labor Day, and that his overcoat was forwarded to Margaret in September. She states no conclusion about what became of him.", learned_chapter: 2, method: "inferred", note: "belief, not fact; Ch.1 adds 'went to Greece in sixty-eight and did not come back' (Szabo)", source: "ch-02:p4; ch-02:p22; ch-02:p66; ch-02:p69" }
      - { fact: "the Soprintendenza accept Halloran as director for the season but require the cession (the outgoing director's ink signature, witnessed); his dossier (Pennsylvania certificate, sworn translation, letter) came back Thursday marked 'Firma mancante'; instead they will take the heir's signature on a declaration before a notary, certificate attached; he will fax it Monday; 'if I could manage it by the fifteenth' (the twentieth is a Monday)", learned_chapter: 2, method: "told_by:halloran", source: "ch-02:p28; ch-02:p30; ch-02:p35" }
      - { fact: "Halloran wants Emilio's field notebooks from last season ('The north transects exist nowhere else'; never typed up) 'By the end of June, if it could be managed'", learned_chapter: 2, method: "told_by:halloran", note: "she says 'They're here'; sending them is not narrated", source: "ch-02:p36; ch-02:p37; ch-02:p38" }
      - { fact: "Halloran and his wife are leaving their Naples flat after thirty-one years; he is ringing from the floor of an emptied room; new tenants come to measure for curtains", learned_chapter: 2, method: "told_by:halloran", source: "ch-02:p26; ch-02:p42" }
      - { fact: "Halloran rang four times that week and got 'its little tone and then nothing at all' (no greeting on the machine)", learned_chapter: 2, method: "told_by:halloran", source: "ch-02:p24" }
      - { fact: "Pat has told Gloria that Mara is going to Greece", learned_chapter: 2, method: "told_by:gloria", source: "ch-02:p56" }
      - { fact: "the cave door is real (she crossed)", learned_chapter: 3, method: "witnessed", source: "outline:ch-03" }
      - { fact: "the year is AD 70; Vespasian reigns (herald: Titus has taken Jerusalem)", learned_chapter: 5, method: "inferred", note: "overheard the herald; did the history herself; no thought of 79 yet", source: "outline:ch-05" }
      - { fact: "the Corycian door she came by is shut", learned_chapter: 6, method: "discovered", note: "confirmed again Ch.8", source: "outline:ch-06; outline:ch-08" }
      - { fact: "consulting the Oracle needs the pelanos fee, a goat, a Delphian sponsor and a man to ask; women do not go in", learned_chapter: 9, method: "discovered", source: "outline:ch-09" }
      - { fact: "a runaway Thracian, scarred, 'answering to Lupus', is claimed as property of the household of Q. Arrius Celer (reward notice from Corinth)", learned_chapter: 9, method: "discovered", source: "outline:ch-09" }
      - { fact: "Valens is the man on the notice (she watches him read it and walk away)", learned_chapter: 9, method: "inferred", source: "outline:ch-09" }
      - { fact: "Ariston is alive, married in Emesa, a child coming, not coming home", learned_chapter: 10, method: "discovered", note: "she reads the letter aloud", source: "outline:ch-10" }
      - { fact: "Valens reads but pretends he can't; he bought Felix off a slaver and freed him with no paperwork", learned_chapter: 11, method: "discovered", source: "outline:ch-11" }
      - { fact: "Valens's history: the rudis, Nero's games at Corinth, Plautia, Celer's dowry frame; Celer wants him dead (the dowry suit)", learned_chapter: 12, method: "told_by:valens", source: "outline:ch-12" }
      - { fact: "how Valens knows about the suit: last autumn (AD 70) Plautia's brother's freedman found him at Kirrha harbor and asked him to testify; he refused; the reward notice went up within the month — so Celer wants a dead witness", learned_chapter: 12, method: "told_by:valens", revised: "2026-10-18", source: "outline:ch-12; foundation:§3; STATE:ARCH-15" }
      - { fact: "the Oracle's public answer: 'the road home lies under the mountain of vines by the western sea, where the dead go out of the city, at the door painted on a dead man's house' (two markers: the necropolis + a painted door on a tomb)", learned_chapter: 13, method: "told_by:valens", note: "his word-for-word repetition at Kallia's lodging; rendered once", revised: "2026-10-18", source: "outline:ch-13; STATE:ARCH-4" }
      - { fact: "the door home is at POMPEII", learned_chapter: 13, method: "told_by:theano", note: "in person, off duty, at Theano's house (sent for by a temple slave); a widow talking to a woman, not an oracular response", revised: "2026-10-18", source: "outline:ch-13; STATE:ARCH-4 (revised)" }
      - { fact: "the WHEN is withheld: 'not hers to give, or not given'", learned_chapter: 13, method: "told_by:theano", source: "outline:ch-13" }
      - { fact: "Plautia was never Valens's lover", learned_chapter: 16, method: "inferred", note: "from watching, not asking", source: "outline:ch-16" }
      - { fact: "Celer kept Plautia's son Marcus; the archive copy of Valens's manumission is in the provincial record office under Celer's influence", learned_chapter: 16, method: "told_by:plautia", source: "outline:ch-16" }
      - { fact: "the door is a small freedman's tomb with a painted false door outside the Nuceria Gate; faintly cool on a warm spring afternoon; dormant", learned_chapter: 19, method: "discovered", note: "found after a short search: Herculaneum Gate road and Stabian Gate tombs on her first free afternoon, the Nuceria Gate the next afternoon; the god's 'door painted on a dead man's house' lets her know it at once", revised: "2026-10-18", source: "outline:ch-19; foundation:§11.3" }
      - { fact: "Valens is summoned to testify in Rome in spring (dowry suit)", learned_chapter: 21, method: "told_by:plautias-brothers-freedman", note: "the brother's summons, brought by the freedman to Grata's counter by name; the address came via Plautia (Valens sent word summer AD 72)", revised: "2026-10-18", source: "outline:ch-21" }
      - { fact: "a Chaldean in Puteoli 'talks gibberish to himself'", learned_chapter: 24, method: "told_by:gratas-husband", source: "outline:ch-24" }
      - { fact: "Augurinus is August Fenn, alive, marooned since AD 41", learned_chapter: 25, method: "discovered", source: "outline:ch-25" }
      - { fact: "Fenn's history: 1968 crossing, landed AD 41, thirty-four years; doors 'breathe with the earth'; the 62 quake opened Pompeii's door for part of one night; he was down with fever in Misenum and three days later heard a tavern story about a tomb whose painted door 'breathed cold' — which is how he found the door, already shut", learned_chapter: 25, method: "told_by:august-fenn", revised: "2026-10-18", source: "outline:ch-25; foundation:§3" }
      - { fact: "the law in Fenn's words: the doors are one door with many mouths, so 'it' takes back the one it brought — the cave brought her, so Pompeii's mouth will take her", learned_chapter: 25, method: "told_by:august-fenn", note: "a promise; allowlisted phrase use 1/3; 'one door with many mouths' worded once", revised: "2026-10-18", source: "outline:ch-25; foundation:§4d; STATE:ARCH-16" }
      - { fact: "an opening is brief: hours at most, never days", learned_chapter: 25, method: "told_by:august-fenn", revised: "2026-10-18", source: "outline:ch-25; foundation:§9" }
      - { fact: "whether the door would take others is UNKNOWN (Fenn has always been alone)", learned_chapter: 25, method: "told_by:august-fenn", source: "outline:ch-25" }
      - { fact: "the WHEN: late summer, AD 79 (be at the tomb the night after the mountain opens)", learned_chapter: 25, method: "told_by:august-fenn", note: "she rejects it (Ch.25-35); accepted Ch.36", revised: "2026-10-18", source: "outline:ch-25" }
      - { fact: "Fenn's first two dates for the door's reopening (71, then 73) came from the tremor rhythm alone and failed: three nights at the tomb each time; after 73 he rebuilt the tables around 79, which he knows from school is Pompeii's year", learned_chapter: 25, method: "told_by:august-fenn", note: "her fig leaf: wrong twice, and the third date built around the history-book year", revised: "2026-10-18", source: "outline:ch-25; foundation:§3; STATE:ARCH-16" }
      - { fact: "in the autumn of 73 she was living a mile from where Fenn sat at the tomb", learned_chapter: 25, method: "inferred", note: "FLEX", revised: "2026-10-18", source: "outline:ch-25" }
      - { fact: "Fenn understood from 'estate sale in Chestnut Hill' that his sister is dead; he did not ask whose sale; he refuses the notebook ('Keep it. I know what's in it.')", learned_chapter: 25, method: "witnessed", note: "she does not say the name, then or ever, to him", revised: "2026-10-18", source: "outline:ch-25; STATE:ARCH-17" }
      - { fact: "Fenn left his sister a note on the hall table (unnamed in the letter)", learned_chapter: 26, method: "told_by:august-fenn", note: "letter", source: "outline:ch-26" }
      - { fact: "doors can die (the Cumae door is dead)", learned_chapter: 27, method: "witnessed", source: "outline:ch-27" }
      - { fact: "Fenn left his coat at the cave mouth in 1968", learned_chapter: 27, method: "told_by:august-fenn", source: "outline:ch-27" }
      - { fact: "Felix has sworn himself to the gladiator school as auctoratus", learned_chapter: 28, method: "told_by:valens", note: "news waiting on return from Cumae (Ch.27 end)", source: "outline:ch-27; outline:ch-28" }
