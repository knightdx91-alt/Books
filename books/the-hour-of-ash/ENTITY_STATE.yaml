  august-fenn:
    canonical_name: "August Fenn"
    aliases:
      - { alias: "Augurinus", note: "Puteoli astrologer persona", source: "STATE:ARCH-6" }
      - { alias: "the Chaldean", note: "as rumored in Pompeii", source: "outline:ch-24" }
    importance: major
    role: "vanished treasure hunter, marooned; cautionary mirror; gives the WHEN"
    first_appearance: { chapter: 2, mode: "documents (notebook)", in_person: 25, source: "ch-02:p1; outline:ch-25", ch2_note: "his own voice opens Ch.2 (Thanksgiving 1967 entry); named 'August Fenn' in it (p1) and 'FENN, August J.' on the consulate carbon (p66)", note: "first mentioned Ch.1: Szabo calls him only 'the brother. Treasure hunter.' (ch-01:p90); his name is on the page only as 'A. J. FENN' on the notebook cover (ch-01:p99); his ink on the chart (ch-01:p78). See meta.contradictions CH1-3." }
    physical:
      age: { value: 68, at_chapter: 25, birth_year: 1934, note: "34 when he vanished (1968); years since landing (AD 41): 34 in Ch.25 (AD 75), 35 in Ch.27 (AD 76), 37–38 in Ch.35 (winter 78–79)", resolved_from_conflict: true, resolved_date: "2026-10-18", resolution_note: "C13: outline Ch.27 now 'thirty-five years'", source: "foundation:§3; foundation:§10; outline:ch-27" }
      build: { value: "thin", source: "foundation:§3" }
      distinguishing:
        - { value: "ink-stained fingers", source: "foundation:§3" }
        - { value: "tremor in the left hand", source: "foundation:§3" }
        - { value: "Chaldean's robe; Philadelphia accent", source: "foundation:§4 (Ch.25 anchor)" }
    traits:
      - { trait: "born Philadelphia 1934; Navy; self-styled treasure hunter (Spanish wreck, Templar cache, Alexandrian scrolls)", source: "foundation:§3", mutable: false }
      - { trait: "English frozen in 1968; perfect formal Greek", source: "foundation:§3", mutable: false }
      - { trait: "writes in square capitals pressed so hard the pen nearly goes through (chart: coordinates 38° 31′ N / 22° 32′ E, 'BIBLIOTHECA?', and a fingernail-sized drawn doorway, all in blue ballpoint; notebook cover 'A. J. FENN'). The doorway is his 'little picture of the cave mouth beside it so I'd know which hole I meant'", source: "ch-01:p78; ch-01:p99; ch-02:p2", mutable: false }
      - { trait: "initials A. J.; full name 'August Fenn' / 'FENN, August J., U.S. citizen'", source: "ch-01:p99; ch-02:p1; ch-02:p66", mutable: false }
      - { trait: "1967-68 hand: block capitals nearly a quarter of an inch high, every stroke retraced, pressed so hard each page carries a raised backward copy on its back, a black bead of ink in each R's bowl (through April 1968). In May the letters shrink, then join, then become a small lowercase hand that leans right and leaves loops open, and the backs are smooth. The June entries are so small Mara needs the lab magnifier; the July 21 entry barely marks the page", source: "ch-02:p3; ch-02:p12; ch-02:p18; ch-02:p47; ch-02:p68", mutable: true }
      - { trait: "1967: could not read the scholion's Greek himself; Father Kostas at St. George's translated it for the price of a roast pork sandwich at the Terminal", source: "ch-02:p1", mutable: true }
      - { trait: "cut the uncut leaves of the 1838 Leipzig volume 'with his thumb' in 'the big new library at the university', up to the note and no further", source: "ch-02:p1; ch-02:p10", mutable: false }
      - { trait: "Navy: 'down in the sinkholes in Florida'; knows 'cave cold'", source: "ch-02:p19", mutable: false }
      - { trait: "smokes (measures the July 21 cold by 'a whole cigarette')", source: "ch-02:p69", mutable: true }
      - { trait: "1968 voice: runaway 'and'-chains, bravado, jokes ('You don't find the books on the first day'; 'Never been to Mexico. Maybe after.'); collapses to fragments when tired ('Slept up there. Didn't help.'; 'Tired today.')", source: "ch-02:p13; ch-02:p17; ch-02:p21; ch-02:p49", mutable: true }
      - { trait: "sold his Plymouth to fund the trip (to a mailman in Jenkintown, $600 and a sack of oranges); flew TWA to Athens, 2 April 1968", source: "ch-02:p13", mutable: false }
      - { trait: "reads every word of a week-old Herald Tribune, bridge column included, though he does not play bridge", source: "ch-02:p54", mutable: false }
      - { trait: "his things in Margaret's boxes: Navy uniforms, forty years of National Geographic, a diving helmet with no glass (sold by Szabo to a Wildwood seafood restaurant, now holding a lobster)", source: "ch-01:p102", mutable: false }
      - { trait: "casts horoscopes; teaches rich men's sons geometry", source: "foundation:§3", mutable: false }
      - { trait: "irrelevant obsession: the 1964 Phillies (Ch.25, 26, 29, 35)", source: "foundation:§3; outline:checks#4", mutable: false }
      - { trait: "sunk cost: finishes every terrible jar of wine he has paid for", source: "foundation:§3", mutable: false }
      - { trait: "unprompted memory: Horn & Hardart automat on Chestnut Street (coconut cream Ch.25; lemon meringue Ch.27; can't remember the pie Ch.35)", source: "foundation:§3; outline:ch-35", mutable: false }
      - { trait: "rage at 1990s English he doesn't know ('voicemail') — once only, Ch.26 letter; the Ch.27 in-person repeat is cut", source: "foundation:§3; outline:ch-27; outline:checks#4", mutable: false }
      - { trait: "never says his sister's name in person until Ch.35; in Ch.25 'estate sale' tells him she is dead and he does not ask whose; he refuses the notebook until Ch.35", source: "foundation:§3; outline:ch-25; outline:ch-35; character-bible.md#august-fenn-augurinus", mutable: true }
      - { trait: "thinks of the doors as one door with many mouths ('it' in 'the one it brought' = all the doors as one)", source: "foundation:§4d, §9; outline:ch-25; STATE:ARCH-16", mutable: false }
      - { trait: "never furnishes a room here; insists to his death he'd go through; no deathbed conversion", source: "foundation:§3; outline:ch-35", mutable: false }
    voice_markers:
      ref: "character-bible.md#august-fenn-augurinus"
    relationships:
      margaret-fenn: { type: "sister: Thanksgiving 1967 together (she thinks a scholiast is a foot doctor; asks whether the books would be wet; makes him add a question mark to the chart); she covers his Greece trip as 'Mexico' to the girls at church; he left her a note on the hall table (outline:ch-26)", established: "ch-02:p1", current_status: "she died 1997 (1998 frame); next of kin on the 1968 consulate carbon", source: "ch-02:p1; ch-02:p2; ch-02:p13; ch-02:p66; ch-02:p69; outline:ch-26" }
      father-kostas: { type: "translator of the scholion (1967), paid in a roast pork sandwich", established: "ch-02:p1", current_status: "1967 only" }
      goat-boy-1968: { type: "the boy with the goats at Delphi who brings him bread and cheese", established: "ch-02:p20", current_status: "1968 only" }
      goat-boys-mother-1968: { type: "washes his shirts and will not take a drachma; her cousin can stitch his boots", established: "ch-02:p48", current_status: "1968 only" }
      mara-reyes: { type: "her reader (Ch.2, documents) → fellow traveler; correspondent; friend", established: "ch-02:p3 (reads him); in person outline:ch-25", current_status: "planned" }
      valens: { type: "friendship of two exiles", established: "outline:ch-29", current_status: "planned" }
      lucius: { type: "draws a baseball diamond for him (Ch.27)", established: "outline:ch-27", current_status: "planned" }
    possessions:
      - { item: "fenns-zippo", status: "1968 Zippo; refilled with lamp oil; dead (Ch.25); he tries to light it for Mara's photograph on the Cumae road (Ch.27); catches once (Ch.35); given to Mara", source: "foundation:§3; outline:ch-25; outline:ch-27; outline:ch-35" }
      - { item: "fenn-tables-original", status: "given to Mara Ch.35; last margin line in his hand", source: "outline:ch-35" }
      - { item: "fenns-1964-dime", status: "given to Mara Ch.35", source: "outline:ch-35" }
      - { item: "fenns-coverless-paperback", status: "given to Mara Ch.35", source: "outline:ch-35" }
      - { item: "potted-basil", status: "in his upper room", source: "outline:ch-25" }
      - { item: "fenn-notebook", status: "in the coat he left at the Corycian Cave mouth (1968; plan); a shepherd brought the coat down (plan); the US consulate in Athens forwarded 'one man's overcoat, wool, gray, with contents of pockets' to Margaret, carbon dated 16 Sept 1968 (ch-02:p66; the page does not say the notebook was in it, CH2-3); her boxes → estate sale (October 1997, ch-01:p88) → Szabo → Mara (Ch.1, in a Phillies cigar box, ch-01:p98); refused by him Ch.25; read and returned Ch.35", source: "ch-02:p66; outline:ch-27; foundation:§3; ch-01:p88; ch-01:p98; outline:ch-25; outline:ch-35" }
      - { item: "fenns-overcoat", status: "gray wool man's overcoat, 'with contents of pockets', forwarded by the US consulate in Athens to Miss Margaret Fenn (carbon dated 16 September 1968)", source: "ch-02:p66" }
      - { item: "fenns-plymouth", status: "sold before the trip (February 1968) to a mailman in Jenkintown for $600 and a sack of oranges", source: "ch-02:p13" }
      - { item: "fenns-good-flashlight-and-kite-string", status: "to take in on 22 July 1968 ('Going in tomorrow first thing with the good flashlight and a ball of kite string'); in 1967 he wanted 'a better flashlight'", source: "ch-02:p2; ch-02:p69" }
      - { item: "fenns-boots", status: "'going at the toes' (June 1968); the goat-boy's mother's cousin offers to stitch them", source: "ch-02:p48" }
      - { item: "venetian-map", status: "his ballpoint annotations (coordinates, BIBLIOTHECA?, doorway = 'a little picture of the cave mouth'); kept by Margaret; estate sale → Szabo → Mara (Ch.1)", source: "ch-01:p78; ch-01:p90; ch-02:p2" }
      - { item: "phillies-cigar-box", status: "sold with the chart; holds the notebook on loose tobacco crumbs in Ch.1 (whose box it was originally is not stated)", source: "ch-01:p98; ch-01:p99" }
    location_log:
      - { chapter: 2, location: "philadelphia", scene: "1967 (documents): Thanksgiving with Margaret; 'the big new library at the university' (university-library); 'the Free Library' (an Army map with the cave's position); St. George's (Father Kostas); the Terminal", travel_noted: false, flashback: true, flashback_year: 1967, source: "ch-02:p1; ch-02:p2" }
      - { chapter: 2, location: "delphi-modern → corycian-cave", scene: "April–July 1968 (documents): a room over a taverna in the moved village; repeated four-hour climbs to the plateau and the cave; slept up there; the slot at the back", travel_noted: true, flashback: true, flashback_year: 1968, note: "arrived Athens 2 April 1968 by TWA", source: "ch-02:p13; ch-02:p17; ch-02:p19; ch-02:p21; ch-02:p69" }
      - { chapter: 25, location: "puteoli", scene: "upper room by the harbor", travel_noted: false, source: "outline:ch-25" }
      - { chapter: 27, location: "cumae", scene: "Sibyl's cave (takes Mara, Lucius and the baby Aelia)", travel_noted: true, source: "outline:ch-27" }
      - { chapter: 29, location: "pompeii", scene: "Saturnalia dinner", travel_noted: true, source: "outline:ch-29" }
      - { chapter: 33, location: "puteoli", scene: "his room", travel_noted: false, source: "outline:ch-33" }
      - { chapter: 35, location: "puteoli", scene: "deathbed, upper room", travel_noted: false, source: "outline:ch-35" }
    knowledge:
      - { fact: "cold air from a slot at the back of the Corycian Cave (1968): 'about a minute' the first time; again a Tuesday morning; then nothing for weeks; on July 21 cold enough to see his breath, lasting 'a whole cigarette, which is the longest yet'", learned_chapter: 0, method: "discovered", note: "pre-story; in his notebook", source: "ch-02:p19; ch-02:p20; ch-02:p69" }
      - { fact: "the scholion: the Ptolemies' books carried out of Alexandria by ship to 'the cave of the nymphs on Parnassus, and they are there'", learned_chapter: 0, method: "told_by:father-kostas", note: "Thanksgiving 1967; Fenn found the note in the German's book himself and had it translated", source: "ch-02:p1" }
      - { fact: "the cave's coordinates, 38° 31′ N, 22° 32′ E, taken from 'the Army map down at the Free Library', which 'puts the cave up the mountain from' Castri; the Venetian chart has Castri 'right where it ought to be' ('those Venetians knew their business')", learned_chapter: 0, method: "discovered", note: "Thanksgiving 1967 entry; he wrote the figures on the chart in ballpoint 'so I'd have it', with 'a little picture of the cave mouth beside it'. Was 'read from the Venetian chart' (inferred) before polish cycle 1 gave him a source", revised: "2026-10-18 (re-sync)", source: "ch-02:p2" }
      - { fact: "the cave holds no visible books ('a big wet barn of a place' with names scratched on the walls, many French)", learned_chapter: 0, method: "witnessed", note: "April 1968", source: "ch-02:p17" }
      - { fact: "the doors 'breathe with the earth'; doors don't deliver to matching dates (1968 → AD 41); an opening lasts hours at most, never days", learned_chapter: 0, method: "inferred", note: "34 years of tracking", revised: "2026-10-18", source: "foundation:§3; foundation:§9; outline:ch-25" }
      - { fact: "the doors are one door with many mouths: 'it' takes back the one it brought", learned_chapter: 0, method: "inferred", note: "his belief; it states the canonical law (anyone the doors brought, no one native) though he does not know the native half", revised: "2026-10-18", source: "foundation:§4d; foundation:§9; STATE:ARCH-16" }
      - { fact: "Vesuvius destroys Pompeii in AD 79", learned_chapter: 0, method: "prior_knowledge", note: "from school; says so plainly to Mara in Ch.25", revised: "2026-10-18", source: "outline:ch-25; foundation:§3; STATE:ARCH-16" }
      - { fact: "a Pompeian tomb's painted door 'breathed cold' the night of the AD 62 quake (the opening lasted part of one night)", learned_chapter: 0, method: "overheard", note: "a tavern story heard three days later; he had been down with fever in Misenum; pre-story, AD 62", revised: "2026-10-18", source: "outline:ch-25; foundation:§3" }
      - { fact: "the Pompeii door: the painted false door of a freedman's tomb outside the Nuceria Gate, dormant", learned_chapter: 0, method: "discovered", note: "found by following the tavern story, already shut; has waited for it since 62", revised: "2026-10-18", source: "outline:ch-25; foundation:§3" }
      - { fact: "his first two dates for the reopening (AD 71, then 73), worked from the tremor rhythm alone, were wrong: three nights at the tomb each time, and it stayed shut", learned_chapter: 0, method: "witnessed", note: "pre-Ch.25; the 73 vigil was in autumn (FLEX)", revised: "2026-10-18", source: "outline:ch-25; foundation:§3; STATE:ARCH-16" }
      - { fact: "the Pompeii door's next opening: late summer AD 79, in the night after the mountain opens", learned_chapter: 0, method: "inferred", note: "after 73 he rebuilt the tables around the year he knew from school; his tremor figures now fit", revised: "2026-10-18", source: "outline:ch-25; foundation:§3" }
      - { fact: "whether a door takes anyone but the one it brought: UNKNOWN to him (always alone); never learns", learned_chapter: 0, method: "inferred", source: "outline:ch-25; outline:ch-33; foundation:§9" }
      - { fact: "Mara is from 1998", learned_chapter: 25, method: "witnessed", note: "she speaks English to him", source: "outline:ch-25" }
      - { fact: "Mara has his 1968 notebook, bought at an estate sale in Chestnut Hill", learned_chapter: 25, method: "told_by:mara-reyes", note: "refuses it ('Keep it. I know what's in it.')", revised: "2026-10-18", source: "outline:ch-25; STATE:ARCH-17" }
      - { fact: "his sister Margaret is dead", learned_chapter: 25, method: "inferred", note: "from 'estate sale'; does not ask whose; the name is not spoken in Ch.25", revised: "2026-10-18", source: "outline:ch-25; character-bible.md#august-fenn-augurinus; STATE:ARCH-17" }
      - { fact: "1990s vocabulary such as 'voicemail' exists", learned_chapter: 26, method: "told_by:mara-reyes", note: "via her letter; rages (once only)", source: "outline:ch-26" }
    knowledge_absent: ["Mara's tremor notes in his notebook's back pages (Ch.35: he reads only his own 1968 front pages)", "that the door will not take natives (never learns)"]
    ch3_mentions:
      - { value: "Mara's narration (her reading of his notebook, not new facts about him): he slept up there; spent 'most of a summer on this floor in the dark'; read the map right in a library in Philadelphia in 1967 without ever seeing the mountain; called the cave a barn ('He had undersold it'); sat on the floor in the dark 'with his cigarettes and his notebook and his better flashlight, if he had ever got the better flashlight'", source: "ch-03:p4; ch-03:p7; ch-03:p51; ch-03:p67" }
      - { value: "Mara's compressed version of his last breaths: 'stood here with his arm in a hole for the length of a cigarette, and written it down, and come back on Tuesday' (order differs from his entries: CH3-1)", source: "ch-03:p71" }
    death: { when: "winter AD 78-79", chapter: 35, note: "dies wanting the door; any spoken count is his (37 years, nearly 38); Mara's narration must not say 'months' away (she refuses the date until Ch.36)", source: "STATE:ARCH-6; outline:ch-35; foundation:§10" }
    arc_waypoints:
      - { chapter: 2, waypoint: "notebook voice: confident capitals (Thanksgiving 1967) to a small leaning hand (May 1968) to entries that barely mark the page; last entry July 21, 1968: going in tomorrow, back before Labor Day", source: "ch-02:p1; ch-02:p18; ch-02:p47; ch-02:p68; ch-02:p69" }
      - { chapter: 25, waypoint: "found in Puteoli; gives the WHEN in under a minute", source: "outline:ch-25" }
      - { chapter: 27, waypoint: "shows Mara the dead door at Cumae", source: "outline:ch-27" }
      - { chapter: 29, waypoint: "inside the family at Saturnalia", source: "outline:ch-29" }
      - { chapter: 35, waypoint: "asks for the notebook, reads his 1968 front pages, says 'Margaret' (first time); Zippo catches; gives Mara his tables, Zippo, dime, paperback and the notebook back; dies packed", source: "outline:ch-35" }
    arc_notes: "Cautionary mirror by example; never admits he lived here."

  kallia:
    canonical_name: "Kallia"
    aliases: []
    importance: supporting
    role: "widow; keeps a pilgrims' lodging by the Castalian spring; Mara's first foothold and nominal guardian"
    first_appearance: { chapter: 5, note: "first live appearance; 'A woman appeared on the road with a jar on her head and a lamp in her hand'", source: "ch-05:p137" }
    last_appearance: { chapter: 16, note: "farewell, Delphi, autumn AD 71 (intercut)", source: "outline:ch-16" }
    name_on_page: { value: "Mara learns it only when a lodger shouts 'Kallia!' from the gallery; 'Kallia, then.' Kallia never gives it and never asks Mara's", source: "ch-05:p194; ch-05:p200" }
    physical:
      age: { value: "'a woman of fifty'", at_chapter: 5, source: "ch-05:p140" }
      face: { value: "broad and brown, lined across the forehead", source: "ch-05:p140" }
      hair: { value: "gray, dragged back under a dark kerchief", source: "ch-05:p140" }
      clothing: { value: "sandals; a skirt (held up to wash her feet); the kerchief", source: "ch-05:p140; ch-05:p143" }
      carriage: { value: "carries the full jar on her head; unloads 'in one movement, lamp on the lip and jar on the paving'; demonstrates head-carrying with 'her back straight and her neck long, carrying nothing'", source: "ch-05:p137; ch-05:p138; ch-05:p163" }
      carriage_ch7: { value: "walks the court with an empty jar on her head, eyes on the paving 'a few steps ahead of her feet', 'and the wool round her ankles hardly stirred'; washes standing at the bath, 'the only woman in the room on her feet'; once carried a jar up from Kirrha on her own head ('eleven summers ago')", source: "ch-07:p20; ch-07:p44; ch-07:p128" }
    own_moment_ch5: { value: "before she sees Mara: she fishes a limp pilgrims' garland (white flowers on a ring of twisted wool) out of the basin with her bare arm, flings it into the dark down the slope ('Boeotians,' she said to the dark), then kicks off one sandal and stands on one leg, skirt held up, washing each foot in turn under the overflow with her eyes shut, 'quite still while it ran'", source: "ch-05:p138; ch-05:p139; ch-05:p140" }
    traits:
      - { trait: "widow", source: "foundation:§3", mutable: false, ch5_note: "not stated on the page in Ch.5 (no husband mentioned either way)", ch6_note: "ON THE PAGE in Ch.6 as how others name her: 'the widow' (Mara, p28, p30; Valens, p102, p270, p326) and 'the widow Kallia's' (Valens to the charcoal burner, p315). The continuity repair (W-16) changed four others to 'Kallia' (p115, p158, p164, p288). She never speaks of it herself. Mara first hears it from Valens ('The widow carries her own water again', p102)", ch6_source: "ch-06:p28; ch-06:p30; ch-06:p102; ch-06:p270; ch-06:p315; ch-06:p326", ch7_note: "Ch.7: 'my husband's brother's girl' (Kallia, p131; p149) is the first time she names a husband of her own. Sosandros: 'It will stay up for one widow' (p156). 'You've had no other name on that line for years' (p169)", ch7_source: "ch-07:p131; ch-07:p149; ch-07:p156; ch-07:p169" }
      - { trait: "speaks in imperatives and practical questions: 'Out of the basin. People drink that. Use the trough at the end.' / 'Who beat you?' / 'Hands.' / 'Turn them.' / 'Open your mouth.' / 'What's that? Lead?' / 'Who saw you come down here?' / 'Can you carry water?' / 'Can you card wool?' / 'Weave?' / 'Grind? Cook?' / 'Whose are you?' / 'Bring the jar.' / 'The step.' She lets Mara's long English outburst finish ('She let me finish') and points at the jar", source: "ch-05:p141; ch-05:p144; ch-05:p147; ch-05:p149; ch-05:p151; ch-05:p155; ch-05:p158; ch-05:p160; ch-05:p161; ch-05:p164; ch-05:p166; ch-05:p168; ch-05:p173; ch-05:p177; ch-05:p180", mutable: false }
      - { trait: "never touches Mara on the page: she inspects by lamplight, demonstrates opening her own mouth and carrying on the head, and throws the blanket from the doorway", source: "ch-05:p148; ch-05:p152; ch-05:p163; ch-05:p208", mutable: false }
      - { trait: "deciding against her own preference: 'I could see her deciding something and disliking it'", source: "ch-05:p157", mutable: true }
      - { trait: "pursues what is owed to her: bangs on a neighbor's door 'with her fist' after dark for her horsehair sieve ('It's been in your house a month. Your wife borrowed my good one to strain her must, and it was to come back next morning'), goes round the mesh with one finger, finds a hole in it ('It had no hole. Mend it. Your wife and I fill our jars at the same spring.')", source: "ch-05:p181; ch-05:p183; ch-05:p185; ch-05:p187; ch-05:p189; ch-05:p191", mutable: false }
      - { trait: "careful with resources: takes the lamp away 'because lamp oil was lamp oil'; 'Don't touch the oil'", source: "ch-05:p204; ch-05:p205", mutable: false }
      - { trait: "speaks of her household, not herself: 'I've a houseful of Thebans, and the girl ran off at the vintage'; to the gallery, Mara is 'A pair of hands' who 'can carry'", source: "ch-05:p171; ch-05:p197; ch-05:p199", mutable: false }
      - { trait: "hears Mara's English 'without any change in her face'; lets the long outburst run ('She let me finish'); takes 'Eggs. I can do eggs.' 'for a no'", source: "ch-05:p146; ch-05:p160; ch-05:p169; ch-05:p170", mutable: false }
      - { trait: "cannot read", source: "outline:ch-10", mutable: false, ch7_note: "consistent: after the clerk writes, she asks Mara 'What did he put?' (ch-07:p177)" }
      - { trait: "sweeps the threshold of her son's empty room every morning before her own and leaves the broom across it", source: "foundation:§3; outline:ch-07", mutable: true, ch7_confirmed: "WRITTEN: the morning rule and the last morning (ch-07:p37; ch-07:p185). The page does not say whose room it is (CH7-7)" }
      - { trait: "never says her son's name until the letter forces it once (Ch.10)", source: "foundation:§3; outline:ch-10", mutable: true }
      - { trait: "inspects Mara's hands and teeth; takes her in as unpaid help, not out of kindness", source: "outline:ch-05; ch-05:p147-p155; ch-05:p197; ch-05:p202", mutable: false, ch5_note: "CONFIRMED on the page: hands by lamplight (palms up), teeth 'with the flame under my chin'; her work orders; 'A pair of hands'. No pay is mentioned" }
      - { trait: "puts Valens on the floor across Mara's doorway on consultation night (lodging crammed with pilgrims; Celer's men on the road)", source: "outline:ch-14", mutable: true }
      # --- Ch.6 (prose) ---
      - { trait: "her own life, not Mara's: plants her back against the pomegranate trunk 'with her arms crooked out from her sides' to keep the gray mule out of her court ('Not in my court, Valens … Unload in the lane.'; 'She had that tree to the height of her head last winter.' / 'Then she can stand in the lane and think about the brown.')", source: "ch-06:p47; ch-06:p48; ch-06:p49; ch-06:p50; ch-06:p52", mutable: false }
      - { trait: "judges wood by smelling the cut end ('Wet.' / 'It'll spit. The last lot spat a coal on a Theban's cloak, and I paid for the cloak.' / 'Then it'll spit oak.'); haggles ('Four now, and the fifth when I've seen it burn without spitting'); pays from a knot in the corner of her kerchief and ties it up again 'more slowly than she had untied it'", source: "ch-06:p53; ch-06:p54; ch-06:p56; ch-06:p58; ch-06:p66; ch-06:p67", mutable: false }
      - { trait: "asks after the sea and the east: 'Is the sea shut yet?' / 'Did anything come in from the east before it went?' / 'Letters.' / 'Nobody asked what you carry.' (unexplained on the page)", source: "ch-06:p68; ch-06:p70; ch-06:p72; ch-06:p74", mutable: true }
      - { trait: "orders, not talk: 'You. Under the stair. Bark up.'; to the gallery, 'When the hearth comes'; of Mara, 'Don't wait for an answer. She doesn't talk.'", source: "ch-06:p58; ch-06:p61; ch-06:p76", mutable: false }
      - { trait: "lets Mara go before light with only 'The shovel comes back.' and 'Shut the gate behind you.', from the dark at the top of the outside stair. No question, no farewell, no touch; she still has not asked Mara's name", source: "ch-06:p115; ch-06:p153; ch-06:p154; ch-06:p156", mutable: false }
      - { trait: "keeps Mara on lentils, does not hit her, and was 'waiting for me in the court with the broom' on her first morning", source: "ch-06:p38; ch-06:p271; ch-06:p292; ch-06:p294", mutable: false }
      # --- Ch.7 (prose) ---
      - { trait: "teaches by tasks and short orders: 'Shorter.' / 'Shorter. From the knee.' / 'You see their feet.' / 'You've no ears. I answer.' / 'Now you.' / 'Like that. Not like a carter in a wine-shop.' / 'You sit like you paid for the bench.' / 'In here you look at the pots.'", source: "ch-07:p16; ch-07:p18; ch-07:p22; ch-07:p24; ch-07:p27; ch-07:p29; ch-07:p35", mutable: false }
      - { trait: "sits once, on the low stool by the hearth, to show how ('sitting was the one thing Kallia never did in my sight'), and is up 'before the stool had stopped rocking'", source: "ch-07:p26", mutable: false }
      - { trait: "lies flatly for Mara in public ('They keep them like that where she's from.' / 'Over the sea.' / 'Pox … When she was small.' / 'It took one on her.') and then turns the room on the questioner ('Your bread's burning, or your husband's mother is eating it.'). The baker's wife: 'Everything's over the sea with you'", source: "ch-07:p44; ch-07:p46; ch-07:p47; ch-07:p51; ch-07:p53", mutable: false }
      - { trait: "asks about Mara's country only in terms of labor: 'who carries the water?' / 'And the wool?' / 'What do the women do all day?' / 'Who pays for a pot that's broken?'; then 'There's no such country.' / 'Then why aren't you in it?' / 'I want that basket done before the lamp goes.'", source: "ch-07:p77; ch-07:p82; ch-07:p84; ch-07:p86; ch-07:p89; ch-07:p91; ch-07:p94", mutable: false }
      - { trait: "keeps the shut room and says nothing of it: sweeps its boards first every morning, leaves that broom across the threshold, does the house with 'the other one', and puts the broom back at its slant 'with no word'. To 'who slept in the shut room upstairs': 'It's swept' and 'Tighter, I said'", source: "ch-07:p37; ch-07:p95; ch-07:p185", mutable: true }
      - { trait: "counts the cost of a broken thing in labor and years ('That jar came up from Kirrha on my own head, eleven summers ago, and I've not had to buy one since'); looks first at Mara's wrist ('Who?' / 'Did he touch you?'); sweeps the pieces into the ash pail 'with her toe'", source: "ch-07:p123; ch-07:p124; ch-07:p126; ch-07:p128", mutable: false }
      - { trait: "plans the lie and its defence as orders, in the dark ('You're my husband's brother's girl.' / 'From Syracuse.' / 'If he asks you anything, you've a cold.'), and talks past 'What was he called?'", source: "ch-07:p131; ch-07:p133; ch-07:p135; ch-07:p136; ch-07:p137", mutable: true }
      - { trait: "stands for her own house before the council: 'I do.' / 'Who stands for my house, if I don't? You've had no other name on that line for years. Write me.' Pays the two obols from the knot in her kerchief", source: "ch-07:p167; ch-07:p169; ch-07:p170", mutable: false }
      - { trait: "has no name to give the clerk for Mara and opens her mouth and shuts it ('without once asking what I was called'). Afterwards she asks 'Say your name for me.' and uses it at once, the Delphian way: 'Maira. The water.'", source: "ch-07:p157; ch-07:p180; ch-07:p182", mutable: false }
      - { trait: "still never touches Mara on the page (the himation is dropped over her shoulders from behind) and still says nothing about herself or her son", source: "ch-07:p10", mutable: false }
    voice_markers:
      ref: "character-bible.md#kallia"
    relationships:
      ariston: { type: "mother", established: "foundation:§3", current_status: "son alive in Emesa, not coming home (Ch.10)" }
      mara-reyes: { type: "employer → registered guardian/kinswoman", established: "ch-05:p141", current_status: "Ch.5: takes Mara home from the spring as unpaid labor; storeroom, blanket, work orders. Planned: parted Ch.16", ch7_status: "Ch.7: registered guardian. The record: 'kinswoman of Kallia, of her house and in her keeping' (Kallia's cover: her husband's brother's girl, from Syracuse). Before it: the lessons, the girl's clothes, the lies at the bath, the shovel taken back, 'There's no such country.' After it: 'Maira. The water.' and the midwinter invitation ('You'll come.')", ch7_source: "ch-07:p7; ch-07:p10; ch-07:p44; ch-07:p89; ch-07:p131; ch-07:p172; ch-07:p182; ch-07:p189" }
      kallias-cousin: { type: "cousin", established: "outline:ch-11", current_status: "asks too much to stand as Mara's representative" }
      sieve-neighbor: { type: "neighbor in her lane; his wife borrowed Kallia's sieve 'to strain her must' a month ago", established: "ch-05:p181", current_status: "sieve returned at night with a hole; told to mend it", source: "ch-05:p181-p192" }
      kallias-lodgers: { type: "lodgers: 'a houseful of Thebans', a pilgrim on the gallery (asks for lentils), a man singing about a girl from Corinth", established: "ch-05:p171", current_status: "in residence", source: "ch-05:p171; ch-05:p193; ch-05:p194; ch-05:p209", ch7_status: "Ch.7: 'Four Thebans till the thaw' ('on the Boeotian list'). They hang on the balustrade to watch the lessons and offer advice. A bassoon-voiced one jokes about the jar; one asks 'is she a goat, that she eats the hedge?'; 'the Thebans salt everything twice'. Last winter Kallia told the bath her Thebans 'came by ship' (they walked, four days)", ch7_source: "ch-07:p15; ch-07:p25; ch-07:p47; ch-07:p62; ch-07:p144; ch-07:p183" }
      kallias-runaway-girl: { type: "former help ('the girl ran off at the vintage')", established: "ch-05:p171", current_status: "gone", ch7_status: "'She took herself off when the grapes came in, in what she stood up in'; her tunic, cord and himation go to Mara ('Not to carry water in')", ch7_source: "ch-07:p12; ch-07:p14" }
      valens: { type: "buys firewood from him; calls him by name", established: "ch-06:p48", current_status: "Ch.6: split oak this month ('Split this month'); the last lot was pine; his brown mule ate her pomegranate last winter; haggle settled at four now and the fifth later, one coin given back; she asks him about the sea, the east and letters", source: "ch-06:p48; ch-06:p50; ch-06:p55; ch-06:p57; ch-06:p66; ch-06:p67; ch-06:p68", ch7_status: "Ch.7: withholds the fifth coin ('It spat.' / 'Twice. Once on my good hearthstone and once in the lentils. When it's done a month without spitting, you'll have your coin.'); tells him 'She's simple.'", ch7_source: "ch-07:p98; ch-07:p100; ch-07:p105" }
      theban-on-gallery: { type: "lodger", established: "ch-06:p75", current_status: "'Kallia! … Are those lentils ever coming?' / 'When the hearth comes'", source: "ch-06:p75; ch-06:p76" }
      sosandros: { type: "the council's clerk; they use each other's names", established: "ch-07:p142", current_status: "'Sosandros' / 'Kallia. The lodging over the spring.' He writes her down as Mara's keeper: 'It will stay up for one widow'", source: "ch-07:p142; ch-07:p143; ch-07:p156; ch-07:p172" }
      salt-seller: { type: "knows of Kallia's standing ('Kallia has a tongue on her and the council's ear')", established: "ch-07:p121", current_status: "not shown together", source: "ch-07:p119; ch-07:p121" }
      bakers-wife-bath: { type: "bath acquaintance", established: "ch-07:p42", current_status: "remembers Kallia saying her Thebans 'came by ship' last winter", source: "ch-07:p47" }
      kallias-husband: { type: "late husband (unnamed)", established: "ch-07:p131", current_status: "dead (she is 'the widow'). The cover's father is a brother of his in Syracuse, whom Kallia never names; by the record he is 'Aimilios', the name Mara supplied", source: "ch-07:p131; ch-07:p136; ch-07:p137; ch-07:p156; ch-07:p163; ch-07:p172" }
    household_ch5: { value: "'A short way above the spring the road turned off between houses into a lane'; the house is at the lane's end, behind a gate in a wall: a courtyard with a pomegranate tree, an outside staircase to a gallery, doors on every side (lamps and voices behind two, snoring behind a third); a hearth under a lean-to roof with a pot in the embers and a big water jar; a storeroom under the stairs (jars, sacks, a mat, oregano hanging from a beam, mice in the barley). the lodgers eat lentils from the pot ('Scrape it yourself'); 'a houseful of Thebans'; her help ran off at the vintage", source: "ch-05:p171; ch-05:p181; ch-05:p193; ch-05:p195; ch-05:p201; ch-05:p205; ch-05:p206; ch-05:p210" }
    household_ch6: { value: "a month on: Thebans still lodging (one wants his cloak beaten; one on the gallery wants lentils); the lane from the gate to the turn glazed with ice from Mara's slopped water; the pomegranate in the court; split oak stacked under the outside stair, ends crosswise; the ash pail by the hearth with the little iron shovel upright in it; the big jar; the storeroom under the stairs with her jars, where Mara sleeps; the gate and its gatepost (Mara set the watch by its noon shadow)", source: "ch-06:p13; ch-06:p37; ch-06:p38; ch-06:p42; ch-06:p49; ch-06:p59; ch-06:p75; ch-06:p152; ch-06:p288" }
    household_ch7: { value: "winter: four Thebans 'till the thaw' (on the Boeotian list); Mara as kinswoman; the storeroom (Mara's mat; the duffel); the court between the hearth and the gate; a low stool by the hearth; the hearth under the lean-to; the store jar; the ash pail, with the shovel back in it; the woodstack; two brooms (one only for the shut room's boards); a lidded pot beside the jars; the dung heap at the lane's end; the shut room off the gallery, swept daily. Kallia's second-best jar is broken, and the old one leaks", source: "ch-07:p7; ch-07:p15; ch-07:p26; ch-07:p36; ch-07:p37; ch-07:p128; ch-07:p144; ch-07:p187; ch-07:p191; ch-07:p194" }
    location_log:
      - { chapter: 5, location: "castalian-spring → kallias-house", scene: "at the spring after dark with a jar and a lamp (fills the jar at the nearest lion); up the road and the lane (the sieve neighbor's door); her courtyard and hearth; once to the storeroom door with a blanket", travel_noted: true, source: "ch-05:p137; ch-05:p176; ch-05:p181; ch-05:p193; ch-05:p201; ch-05:p207" }
      - { chapter: 6, location: "kallias-house", scene: "(backfill) in the gateway behind Mara, at the pomegranate, in the lane over the wood, then in to the hearth; before light on the climb day, a voice from the dark at the top of the outside stair. Not on the climb", travel_noted: false, source: "ch-06:p47; ch-06:p53; ch-06:p76; ch-06:p153" }
      - { chapter: 7, location: "kallias-house → delphi-baths → delphi-council-hall → kallias-house", scene: "the court (lessons; carding); the gate (Valens); the hearth (the broken jar); the storeroom doorway at night (the Syracuse plan); the bath; the council hall (answers for Mara); the gallery on the last morning (the broom)", travel_noted: false, source: "ch-07:p15; ch-07:p38; ch-07:p76; ch-07:p96; ch-07:p123; ch-07:p130; ch-07:p141; ch-07:p185" }
    possessions:
      - { item: "borrowed-himation", status: "the runaway girl's, left behind at the vintage; put on Mara two days after the mountain (Ch.7); 'It's the warmest thing in this house' (for midwinter); planned: given to Mara, Ch.16", source: "ch-07:p10; ch-07:p12; ch-07:p191; outline:ch-16" }
      - { item: "kallias-broom", status: "Ch.7: laid across the shut room's threshold each morning, with a second broom for the rest of the house. Planned: still across it in Ch.10; put away in Ch.16", source: "ch-07:p37; ch-07:p185; outline:ch-10; outline:ch-16" }
      - { item: "kallias-lamp", status: "photographed on the sill in morning light at the farewell (named frame, Ch.16); Kallia does not ask what the camera does", source: "outline:ch-16; foundation:§4f", ch5_note: "Ch.5: she carries 'a lamp' to the spring and home (material not stated on the page; character-bible says clay). Whether it is the Ch.16 lamp is not stated", ch5_source: "ch-05:p137; ch-05:p205" }
      - { item: "water jar", status: "carried full on her head to and from the spring; Mara carries it home on her hip", source: "ch-05:p137; ch-05:p143; ch-05:p178" }
      - { item: "kallias-sieve", status: "'my good one' (round wooden frame, fine horsehair mesh); lent to the neighbor's wife a month ago; reclaimed at night with a hole in it", source: "ch-05:p185; ch-05:p188; ch-05:p189" }
      - { item: "goat-hair-blanket", status: "thrown over Mara's legs in the storeroom ('Blanket'). Ch.6: Mara sleeps under it for a month, folds it in four on the mat when she leaves, and thanks Kallia for it in English", source: "ch-05:p208; ch-06:p152; ch-06:p155" }
      - { item: "kallias-ash-shovel", status: "her 'little iron shovel', kept upright in the ash pail by the hearth. Mara borrows it for the cave ('The shovel comes back.'); it is back in Mara's hands at the first houses at the end of Ch.6, not yet returned", source: "ch-06:p42; ch-06:p154; ch-06:p340", ch7_status: "back in the ash pail: Mara returns it at first light, the edge turned. 'Let the god put an edge back on it.'", ch7_source: "ch-07:p2; ch-07:p7" }
      - { item: "ash pail", status: "by the hearth, half full every morning; Valens throws its ashes on the lane's ice", source: "ch-06:p42" }
      - { item: "money", status: "kept in a knot in the corner of her kerchief", source: "ch-06:p67", ch7: "the clerk's fee of two obols from the kerchief knot; an obol to Mara for salt (ch-07:p63; ch-07:p170; ch-07:p173)" }
      - { item: "kallias-second-best-jar", status: "broken at the spring in Ch.7; the pieces swept into the ash pail", source: "ch-07:p108; ch-07:p128" }
      - { item: "the old jar", status: "leaks; used after the second-best jar breaks", source: "ch-07:p128" }
      - { item: "carding combs and a basket of fleece", status: "she cards at night on her feet, with the basket propped on her hip", source: "ch-07:p76; ch-07:p88" }
      - { item: "a lidded pot (kept beside the jars)", status: "the household's latrine pot, emptied on the dung heap at the lane's end", source: "ch-07:p36" }
    knowledge:
      - { fact: "Mara is a foreign woman with no status (a possible runaway)", learned_chapter: 5, method: "inferred", basis: "on the page: trousers, wet hair, kneeling in the god's spring; the stripes on her arm ('Who beat you?'); hands soft, clean and pink with no hard place but a pen callus; a metal filling ('What's that? Lead?'); speaks in a tongue Kallia does not follow; cannot carry, card, weave, grind or cook ('Eggs'); to 'Whose are you?', 'Mine.'", note: "the subtext (runaway who will bring trouble) is the outline's; the page gives the questions and 'deciding something and disliking it'", source: "ch-05:p140; ch-05:p144; ch-05:p146; ch-05:p150; ch-05:p155; ch-05:p157; ch-05:p162-p175; outline:ch-05" }
      - { fact: "Mara was beaten (the stripes on her arm); Mara's answer ('A man with a stick, at the temple. Over a paint job.') is in English", learned_chapter: 5, method: "witnessed", note: "she sees the welts; whether she understands the English is not stated ('heard the English without any change in her face')", source: "ch-05:p144; ch-05:p145; ch-05:p146" }
      - { fact: "Mara 'doesn't talk' (her reading after a month: no Greek from Mara)", learned_chapter: 6, method: "inferred", source: "ch-06:p39; ch-06:p61" }
      - { fact: "the sea is shut: the last ship left Kirrha eight days ago; from the east before it came oil, Cretan wine and a man with dogs; Valens carries no letters", learned_chapter: 6, method: "told_by:valens", note: "what she hoped for in 'Letters.' is not stated on the page (outline: her son Ariston's letter, Ch.10)", source: "ch-06:p68; ch-06:p69; ch-06:p70; ch-06:p71; ch-06:p72; ch-06:p73" }
      - { fact: "Mara goes out before light with the duffel and the ash shovel, after doing the morning's chores", learned_chapter: 6, method: "witnessed", note: "from the dark at the top of the outside stair; she speaks only of the shovel ('She knows the shovel is going'). Whether she knows where Mara is going, or with whom, is not stated", source: "ch-06:p152; ch-06:p153; ch-06:p154; ch-06:p159" }
      # --- Ch.7 (prose) ---
      - { fact: "Mara went to the cave and turned the shovel's edge 'On the god's rock. At the cave.'", learned_chapter: 7, method: "told_by:mara-reyes", note: "with whom is not said: 'That was all she said about the mountain that morning'", source: "ch-07:p6; ch-07:p8" }
      - { fact: "the town says Mara has been up a mountain ('So the town says.')", learned_chapter: 7, method: "overheard", note: "town talk; the charcoal burner is the only witness on the page (ch-06:p183; ch-06:p308)", source: "ch-07:p20" }
      - { fact: "the spring knows Mara 'came on a boat', and calls her simple", learned_chapter: 7, method: "overheard", source: "ch-07:p73; ch-07:p139" }
      - { fact: "Mara's account of her country: water by pipe, hot at the turn of a handle; wool and clothes bought ready-made; women 'go out to work, the same as the men'; she mends old pots that somebody has dug up, paid by 'a city', in 'a room under the ground with a lamp'", learned_chapter: 7, method: "told_by:mara-reyes", note: "Kallia disbelieves it ('There's no such country.') and asks nothing about where it is", source: "ch-07:p79; ch-07:p81; ch-07:p83; ch-07:p85; ch-07:p87; ch-07:p89; ch-07:p94" }
      - { fact: "a man with donkeys, 'From the west somewhere', took Mara by the wrist at the spring, and the jar broke", learned_chapter: 7, method: "told_by:mara-reyes", note: "she looks at the wrist first", source: "ch-07:p123; ch-07:p125; ch-07:p127" }
      - { fact: "Mara's marks at the bath: the pale band on her wrist, the round scar on her left arm, the unsinged legs", learned_chapter: 7, method: "witnessed", note: "she covers each with a lie ('Pox … When she was small.')", source: "ch-07:p44; ch-07:p48; ch-07:p51" }
      - { fact: "Mara's name, given at the council as 'Mara' and repeated to her at home as 'Maira'; her father's name, Aimilios", learned_chapter: 7, method: "witnessed", note: "she stood beside Mara at the table when Mara said 'Mara' (p158) and 'Aimilios' (p163), then said 'Say your name for me.' (p180) and was told 'Maira' (p181). The Ch.5-6 knowledge_absent item 'Mara's name' is now CLOSED", source: "ch-07:p158; ch-07:p163; ch-07:p178; ch-07:p180; ch-07:p181" }
      - { fact: "what the clerk wrote: free; Kallia's husband's kin, from Syracuse; of her house; in her keeping; the father's name and Mara's", learned_chapter: 7, method: "told_by:mara-reyes", note: "Kallia cannot read the wax. Mara's summary says 'your husband's kin', which the line itself does not", source: "ch-07:p177; ch-07:p178" }
      - { fact: "Mara means to consult the Oracle", learned_chapter: 8, method: "told_by:mara-reyes", note: "Kallia mentions it on the descent", source: "outline:ch-08" }
      - { fact: "Ariston is alive, married in Emesa, a child coming, discharge land in Syria, not coming home", learned_chapter: 10, method: "told_by:mara-reyes", note: "Mara reads the letter aloud", source: "outline:ch-10" }
    knowledge_absent: ["Mara's origin (never told)", "the door", "Mara's name (Ch.5: never asked, never given; CLOSED in Ch.7: told 'Maira', ch-07:p181)", "the content of Mara's English outburst at the spring: Philadelphia, a museum basement, lamps, three weeks, a credit card, a dead man's notebook, her cousin, June, a cave 'yesterday', ten minutes by her father's Seiko (heard, not understood, ch-05:p159; ch-05:p160)", "who beat Mara and why, beyond the welts (the answer was in English, ch-05:p145)"]
    knowledge_absent_ch6: ["the deal: that Mara paid Valens with her father's watch (made in the lane after Kallia went in, ch-06:p76)", "where Mara went on the climb day and with whom (not stated on the page)", "the charcoal burner's story and Valens's lies to him ('She's the widow Kallia's … came off a ship', ch-06:p315; ch-06:p319), unless the gossip reaches her"]
    knowledge_absent_ch7: ["the deal and the watch (still not shown)", "whether Valens took Mara up the mountain (the page says only 'So the town says' and 'At the cave')", "Mara's origin: she disbelieves the country Mara describes", "why Mara knows the bath's powder is bad for teeth, or what the scar really is"]
    arc_waypoints:
      - { chapter: 5, waypoint: "finds Mara at the spring; inspects hands and teeth; takes her home as a pair of hands", source: "ch-05:p137; ch-05:p150; ch-05:p154; ch-05:p177; ch-05:p197" }
      - { chapter: 6, waypoint: "a month of Mara's labor; guards her pomegranate, haggles over wet oak, asks after the shut sea and letters; lets Mara go before light with 'The shovel comes back.'", source: "ch-06:p38; ch-06:p49; ch-06:p66; ch-06:p68; ch-06:p154" }
      - { chapter: 7, waypoint: "dresses Mara in the runaway girl's clothes, teaches her to pass, invents the Syracuse cover and answers for her at the council ('Write me.'). Names her for the first time ('Maira. The water.') and asks her up the mountain at midwinter", source: "ch-07:p10; ch-07:p15; ch-07:p131; ch-07:p169; ch-07:p182; ch-07:p189" }
      - { chapter: 10, waypoint: "says Ariston's name once; rents the room to a pilgrim from Elis", source: "outline:ch-10" }
      - { chapter: 16, waypoint: "gives Mara the himation; sweeps; puts the broom away", source: "outline:ch-16" }
    arc_notes: "A mother losing a son to the life he chose."

  theano:
