  sosandros:
    canonical_name: "Sosandros"
    former_slug: "council-clerk"
    aliases: ["the clerk in the doorway", "a thin man in the doorway", "the council's clerk"]
    importance: supporting
    role: "clerk to the Delphian council; enters households on the tribute lists"
    first_appearance: { chapter: 5, source: "ch-05:p100", note: "unnamed in Ch.5. Ch.7 identifies him ('Behind the table sat the thin man I had last seen in a doorway correcting the herald on the emperor's titles', ch-07:p141), and Kallia names him ('Sosandros', ch-07:p142). Merged from council-clerk because the page itself identifies him, not by inference" }
