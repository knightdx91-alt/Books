  emilio-reyes:
    canonical_name: "Emilio Reyes"
    aliases: [{ alias: "Aimilios", note: "the Greek form printed on his Nicosia offprints; Mara gives it to the clerk as her father's name ('daughter of Aimilios')", source: "ch-07:p163; ch-07:p172" }]
    importance: supporting
    role: "Mara's father (deceased); field archaeologist; present only as objects and the tape"
    first_appearance: { chapter: 1, mode: "absence (memorial; outgoing message)", source: "ch-01:p1; ch-01:p181" }
    physical:
      age: { value: 68, at_death: "January 1998", birth_year: "1929-30", source: "foundation:§10" }
    traits:
      - { trait: "field archaeologist at a Philadelphia university; eight months a year on digs", source: "foundation:§3; foundation:§11.1; ch-01:p2 (the carousel: 'forty years of my father's trenches'); ch-01:p191 ('thirty-odd years of trench walls' — polish cycle 1)", mutable: false }
      - { trait: "promised 'next season, you come with me' for twenty-five years; never took her", source: "foundation:§3", mutable: false }
      - { trait: "dug in Cyprus (eleven seasons with Doug Fessler; Paphos 1984; Kourion 1992), Sicily (two seasons with Doug) and Turkey (slides)", source: "ch-01:p4; ch-01:p18; ch-01:p25; ch-01:p172", mutable: false }
      - { trait: "'generous with his time' (Doug's eulogy): climbed into a student's section in his good shirt; gave a Sunday to a village boy; sat up until 2 a.m. over Doug's sherd with a 7 a.m. flight", source: "ch-01:p5; ch-01:p18", mutable: false }
      - { trait: "showed his dig slides every September at the kitchen table, projected on a bedsheet thumbtacked over the china cabinet", source: "ch-01:p11", mutable: false }
      - { trait: "read Dick Francis on planes (Wild Horses overdue at the Free Library)", source: "ch-01:p170; ch-01:p171", mutable: false }
      - { trait: "talked every season of jacking up the sagging porch (drawn on the back of a context sheet); shoveled Pat's walk when home", source: "ch-01:p24; ch-01:p168; ch-01:p163", mutable: false }
      - { trait: "offended for a week when the store recommended the two-tape answering machine as 'easier for older people' (December 1991)", source: "ch-01:p167", mutable: false }
      - { trait: "wore his 1966 Seiko daily, took it off at night face up on a folded handkerchief on the nightstand", source: "ch-01:p190", mutable: false }
      - { trait: "kept only his study (the back bedroom) in order; decades of field notebooks in yellow surveyor's covers, browned at the spine where his thumb opened them, each labelled with a site and a year; wrote small and fast, leaning forward, 'like a man running for a bus'; site plans pinned on the cork strip over his desk 'until their corners curled'", source: "ch-02:p45; ch-02:p46", mutable: false }
      - { trait: "'never in his life returned a form on time' (Mara); never typed up his notebooks (Halloran: 'He never got round to typing anything, did he')", source: "ch-02:p31; ch-02:p36", mutable: false }
      - { trait: "director of record for the Campanian survey season; last season's north transects exist only in his notebooks", source: "ch-02:p28; ch-02:p36", mutable: false }
      # --- Ch.3 (Mara's memories) ---
      - { trait: "always took the site from a hilltop first before a spade touched it ('the house they lived in a white speck and the trenches not yet cut'), horizon a third of the way from the top; called it 'the only honest picture of a season'", source: "ch-03:p6", mutable: false }
      - { trait: "brought Mara a sherd in his shirt pocket every September, wrapped in a page of the Cyprus Mail (a cooking-pot scrap with soot on its belly, a lamp rim, a strap handle with the potter's thumbprint)", source: "ch-03:p25", mutable: false }
      - { trait: "balanced the lens cap in a frame for scale and dropped it into his pocket rather than refit it (Mara: 'which he also would have done')", source: "ch-03:p49", mutable: false }
      - { trait: "home one July when Mara was seven ('My father was home that July, which was itself unusual'; the page does not say why; Septembers were home months: the slides 'every September', ch-01:p11; the sherds 'every September', ch-03:p25); in a thunderstorm blackout took her down the cellar with a flashlight and switched it off to show her real underground dark; she screamed; he switched it on at once, was sorry for an hour, and left a butterscotch Krimpet (Tastykake) unwrapped on a napkin on her plate in the morning", source: "ch-03:p64", mutable: false }
      # --- Ch.6 (Mara's memories) ---
      - { trait: "wound the Seiko 'at the kitchen counter on the few mornings he was there, while the percolator went, talking all the while about something else' (Ch.6 polish cycle 1; was 'each morning of my childhood')", source: "ch-06:p132", mutable: false }
      - { trait: "'he came home when he said he would maybe twice in my whole life' (Mara, in English, to Valens's back)", source: "ch-06:p164", mutable: false }
      # --- Ch.7 (Mara's memories) ---
      - { trait: "his name was printed 'Aimilios Reyes' on offprints from Nicosia; he pinned one to the corkboard by the telephone for a joke and left it there for years", source: "ch-07:p163", mutable: false }
      - { trait: "showed Syracuse in his slides: 'a quarry deep enough to stand a church in, a fountain full of papyrus and ducks', and told her 'in our dark kitchen' that the gelato there 'tasted of nothing but cold'. He never took her (foundation §3; the draft's 1979 Fiat trip was repaired before finalize, audit C-01)", source: "ch-07:p140", mutable: false }
    voice_markers:
      ref: "character-bible.md#emilio-reyes"
    greeting_ch1:
      text: "Hello, you've reached the Reyes house, which means you've reached a machine, because I'm out somewhere digging a hole in somebody else's country. Or I'm in the basement looking for the Christmas lights. Tell me who you are and where you're calling from, and say it slowly, and I'll find you. [aside, lower:] Mara? Which one stops it?"
      recorded: "c. December 1991 / 'six years ago' (Mara 26, beside him at the counter; he pressed the wrong button and never re-did it); a radio playing 'Brahms or something like Brahms' in the background"
      source: "ch-01:p180; ch-01:p181; ch-01:p184"
    relationships:
      mara-reyes: { type: "father", established: "ch-01:p1", current_status: "deceased" }
      maras-mother: { type: "former spouse (apart 'since 1981'; character-bible: divorced c. 1981)", established: "ch-01:p3", current_status: "in Phoenix; sent lilies" }
      doug-fessler: { type: "dig colleague: eleven seasons Cyprus, two Sicily", established: "ch-01:p4", current_status: "gave the eulogy" }
      pat: { type: "next-door neighbor; he shoveled her walk", established: "ch-01:p168", current_status: "has his blue Tupperware" }
      nicosia-caller: { type: "friend/colleague in Nicosia (unnamed)", established: "ch-01:p172", current_status: "has not heard of his death; holds his 1992 Kourion drawings" }
      halloran: { type: "permit contact and colleague in Naples (Campanian survey); takes over as director for the season", established: "ch-01:p176", current_status: "Ch.2: the permit passes by the heir's declaration (signed 1 Apr); Halloran wants his last-season notebooks", ch2_source: "ch-02:p28; ch-02:p35; ch-02:p36; ch-02:p44" }
    memorial: { when: "Saturday the fourteenth (March 1998), two o'clock", where: "university museum upper gallery", eulogist: "doug-fessler", note: "a priest gave a reading earlier (Gloria, p141); lilies from Mara's mother; three lemon cakes; slide carousel of his digs", source: "ch-01:p2; ch-01:p3; ch-01:p4; ch-01:p141; ch-01:p174" }
    possessions:
      - { item: "microcassette", status: "his outgoing message (greeting tape); ejected by Mara Ch.1", source: "ch-01:p188" }
      - { item: "fathers-seiko-watch", status: "stopped at ten past four on his nightstand; wound and taken by Mara Ch.1; resized for her Ch.2", source: "ch-01:p190; ch-01:p191; ch-02:p14" }
      - { item: "fathers-pentax-k1000", status: "on the shelf over his bureau; handled and put back Ch.1; loaded by Mara Ch.2", source: "ch-01:p192; ch-02:p64" }
      - { item: "answering-machine", status: "Panasonic two-tape on the kitchen counter", source: "ch-01:p167" }
      - { item: "emilio-rowhouse", status: "his house (off Baltimore Avenue); estate with a lawyer on Walnut Street", source: "ch-01:p116; ch-01:p163" }
      - { item: "cypriot-lamp", status: "chipped nozzle; on the bedroom shelf beside the Pentax", source: "ch-01:p192" }
      - { item: "kourion-drawings", status: "1992 Kourion drawings, under a friend's bed in Nicosia", source: "ch-01:p172" }
      - { item: "overdue-library-book", status: "Wild Horses (Dick Francis), overdue to the Free Library, Walnut Street West", source: "ch-01:p170" }
      - { item: "emilio-field-notebooks", status: "bottom shelf of the study bookcase; Mara runs a finger along the spines and does not take one down (Ch.2); Halloran wants last season's by the end of June", source: "ch-02:p36; ch-02:p38; ch-02:p46" }
      - { item: "campanian-survey-permit", status: "the permesso is still in his name; Halloran needs a name by 20 April (Ch.1). Ch.2: the cession is refused ('Firma mancante'); Mara signs the heir's declaration Wed 1 Apr and faxes it to Naples", source: "ch-01:p176; ch-02:p30; ch-02:p44" }
      - { item: "study-desk-and-cork-strip", status: "the cork strip over his desk (site plans once) now holds the Venetian chart's mat board; blotter; his chair", source: "ch-02:p45; ch-02:p46" }
    death: { when: "January 1998", age: 68, source: "foundation:§10; ch-01:p123 (Inquirer obituary 'In January'); ch-01:p176 (Halloran: 'since January'); ch-01:p190 (Seiko stopped 'in January')" }

  halloran:
    canonical_name: "Prof. Halloran"
    aliases: ["Halloran"]
    importance: minor
    role: "Emilio's permit contact, phoning from Naples"
    first_appearance: { chapter: 1, mode: "answering machine", source: "ch-01:p176" }
    traits:
      - { trait: "in Naples; handles Emilio's permit for the Campanian survey season", source: "ch-01:p176", mutable: false }
      - { trait: "on the page: says 'ringing', 'rung'; apologizes before the request; never says 'died' ('the family of Professor Reyes', 'since January'); forgets the six-hour time difference; starts to give a fax number (081 552 …) and abandons it", source: "ch-01:p176", mutable: false }
      - { trait: "Ch.2: married; he and his wife are leaving their Naples flat after thirty-one years for 'the new place'; rings from the floor of an emptied room with the phone in his lap", source: "ch-02:p26", mutable: true }
      - { trait: "Ch.2: accepted by the Soprintendenza as director for the season; explains the cession and the heir's declaration precisely; says 'I'm an old fool with forms'; offers to 'walk it over himself'; 'The line clicked twice, somewhere under the ocean'", source: "ch-02:p28; ch-02:p32; ch-02:p35", mutable: false }
      - { trait: "Ch.2: still never says 'died' ('In Emilio's place, I mean'; 'If they're in the house'); takes her laughter for crying, then 'Oh, thank God. I couldn't tell which' (the word 'went round his bare room and came back down the line'); 'I'm glad you laughed'", source: "ch-02:p32; ch-02:p34; ch-02:p36; ch-02:p40; ch-02:p42", mutable: false }
      - { trait: "Ch.2: speaks Italian to the new tenants ('not cheerfully'); hears 'Greece' as a holiday ('He was pleased for me, as if I'd said Florida'; 'Sure, that's practically next door')", source: "ch-02:p42", mutable: false }
    voice_markers:
      ref: "character-bible.md#prof-halloran"
    message_ch1:
      text: "Ah. Hello. This message is for the family of Professor Reyes. Ms. Reyes, I hope. It's Halloran, ringing from Naples. […] I'm very sorry indeed to be ringing about paperwork, of all things, and I'm sorry, I should have rung sooner, since January I've been meaning to. The difficulty is the permit. The permesso for the Campanian survey season is still in Emilio's name. The Soprintendenza want another name on it by the twentieth of April or the season lapses, and then of course one begins again from nothing, which takes, well. Years, sometimes. I wondered whether the family would be sending anyone. Anyone at all. It needn't be an archaeologist, strictly, for the paperwork. Or you could fax, if it's easier, the number at the office is zero-eight-one, five-five-two, oh, I'll give it again at the end. I'll try you again. It's six hours later here than with you, which I always forget, so forgive me if I've woken anyone. Oh, the fax. No. I'll ring. Well."
      status: "last message on the incoming tape; erased by Mara (p178); he says he will ring again"
      source: "ch-01:p176; ch-01:p178"
    location_log:
      - { chapter: 1, location: "naples", scene: "message on the machine (from 'the office')", travel_noted: false, source: "ch-01:p176" }
      - { chapter: 2, location: "naples", scene: "phone call from the emptied flat he and his wife are leaving (sitting on the floor), Sat 28 Mar ~10 a.m. Philadelphia time", travel_noted: false, source: "ch-02:p23; ch-02:p26" }
    knowledge:
      - { fact: "Emilio is dead (since January)", learned_chapter: 0, method: "prior_knowledge", source: "ch-01:p176" }
      - { fact: "Mara 'might be in Greece' (said in answer to his 6 July invitation; he takes it as a holiday)", learned_chapter: 2, method: "told_by:mara-reyes", note: "Sat 28 Mar, before she decides (5 May). He is not told why, when or for how long. The plan's 'first' is absent (CH2-1)", source: "ch-02:p41; ch-02:p42" }
      - { fact: "Emilio's last-season notebooks are in the house", learned_chapter: 2, method: "told_by:mara-reyes", source: "ch-02:p37" }
      - { fact: "the signed, notarized heir's declaration (faxed to Naples, Wed 1 Apr; the sending place is no longer stated)", learned_chapter: 2, method: "discovered", note: "receipt not narrated; sent well before his 15 April target", source: "ch-02:p44" }
    knowledge_absent: ["Fenn, the chart, the cave", "her flight (booked 5 May for 19 May)", "that she has decided anything"]
    note: "His Campania invitation is a neutral fact with no payoff by design. Ch.2: one exchange (p40-p42); not referred to again in the chapter."

  irene-szabo:
    canonical_name: "Irene Szabo"
