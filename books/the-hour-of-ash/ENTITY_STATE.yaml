  emilio-reyes:
    canonical_name: "Emilio Reyes"
    aliases: []
    importance: supporting
    role: "Mara's father (deceased); field archaeologist; present only as objects and the tape"
    first_appearance: { chapter: 1, mode: "absence (memorial; outgoing message)", source: "ch-01:p1; ch-01:p197" }
    physical:
      age: { value: 68, at_death: "January 1998", birth_year: "1929-30", source: "foundation:§10" }
    traits:
      - { trait: "field archaeologist at a Philadelphia university; eight months a year on digs", source: "foundation:§3; foundation:§11.1; ch-01:p5 ('forty years of my father's trenches'); ch-01:p207 ('thirty-odd years of trench walls' — polish cycle 1)", mutable: false }
