      - { chapter: 8, detail: "nothing; no scream", source: "outline:ch-08" }
      - { chapter: 19, detail: "painted false door faintly cool on a warm spring afternoon", source: "outline:ch-19" }
      - { chapter: 27, detail: "Fenn's palm on the dead Cumae door", source: "outline:ch-27" }
