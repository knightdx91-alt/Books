      - { fact: "a Wawa on Chestnut Street 'with a hoagie case lit up like an aquarium' (Mara's memory at the height of her hunger, Ch.4)", source: "ch-04:p42" }
      - { fact: "Ch.5 (Mara's references): a car alarm on Baltimore Avenue at three in the morning; the Mummers; Dr. Pinsky's dental office on Walnut Street (oldies station, paper bib on a beaded chain); the Rite Aid on Chestnut; 'I work in a museum in Philadelphia, in a basement'", source: "ch-05:p1; ch-05:p68; ch-05:p153; ch-05:p159" }
      - { fact: "Ch.6 (Mara's references): Larchwood, a building with a ground-floor apartment (the January '94 ice storm, cat litter on the front steps); 'I make the cracks in old pots disappear' (Ch.6 polish cycle 1; was 'I mend broken things in a basement for money'); her way home if the cave opened: 'call Gloria collect from Kennedy … and then the train home to Philadelphia, and my own kitchen'", source: "ch-06:p43; ch-06:p164" }
      - { fact: "Ch.7 (Mara's references): a pediatric clinic in West Philadelphia (her smallpox vaccination); an apartment on Rittenhouse Square (a friend's husband's gin and tonic); a zip code at the end of her address; city water 'through a pipe in the wall', hot 'at any hour of the night'; her vowel 'as flat as Philadelphia'", source: "ch-07:p54; ch-07:p58; ch-07:p79; ch-07:p81; ch-07:p159; ch-07:p183" }

  university-museum:
    canonical_name: "the university museum (Philadelphia)"
    era: "1998"
    aliases: ["the museum"]
    note: "not named on the page; organization entry philadelphia-university-museum"
    facts:
      - { fact: "upper gallery: emptied of its cases for the afternoon except a long bolted-down run of Coptic textiles; parquet floor; folding tables down the middle (foil trays of baked ziti, a crockpot of meatballs with its cord taped to the parquet, an Acme sheet cake piped with a trowel, three lemon cakes); Sterno burning blue under chafing dishes; at the far end a slide carousel and a humming projector, shown on a screen", source: "ch-01:p1; ch-01:p2; ch-01:p25" }
      - { fact: "coat rack on rollers and the guest-book table by the elevators", source: "ch-01:p26" }
      - { fact: "a door marked STAFF to the back stairs: poured concrete painted battleship gray, handrail wrapped in electrical tape; out to a loading dock with an overhang on the south side of the building", source: "ch-01:p26" }
      - { fact: "front steps (Mara returns by them, nearly five)", source: "ch-01:p136" }
      - { fact: "Mara's conservation lab is in the basement: always cold; a fume hood with a fan; overhead light and a low raking lamp; a magnifier (she takes it home in June); a fax machine (Halloran's form comes through it, and she faxes the signed declaration to Naples from it)", source: "ch-02:p6; ch-02:p7; ch-02:p8; ch-02:p44; ch-02:p47" }
      - { fact: "storerooms: the North African lamp was damaged there c.1935 and mended with shellac", source: "ch-02:p6" }
      - { fact: "the lab sink, with a kettle; above it, taped up and gone wavy from the steam, Mara's one-page procedure for interns on unprovenanced finds", source: "ch-03:p57" }
      - { fact: "the night men clean the museum corridors with a pine-oil cleaner", source: "ch-03:p15" }
      - { fact: "Ch.7, Mara to Kallia: 'My work is pots older than this house, that somebody has dug up' … 'A city does. The whole city pays me, and I sit in a room under the ground with a lamp and make them whole again for it' (her simplification for Kallia; the lab is the museum's basement)", source: "ch-07:p85; ch-07:p87" }
    distances:
      - { to: "szabo-shop", value: "cab from Spruce Street over the river to Pine and Tenth; trolley back plus a walk down from Thirty-Third Street", source: "ch-01:p32; ch-01:p37; ch-01:p136" }

  szabo-shop:
    canonical_name: "I. Szabo · Maps · Prints · Small Antiques (Pine Street)"
    era: "1998"
    aliases: ["Szabo's shop"]
    facts:
      - { fact: "on Antique Row, Pine Street (Mara gets out at Tenth); window lettered in flaking gold 'I. SZABO · MAPS · PRINTS · SMALL ANTIQUES'; a stapled Chinese export platter on a wire stand in the window", source: "ch-01:p37; ch-01:p40" }
      - { fact: "door kept locked; buzzer and a speaker over the door; the door sticks ('Pull the door hard')", source: "ch-01:p41; ch-01:p135" }
      - { fact: "deep and narrow; smells of foxed paper and the hot dust on a space heater (orange bars by the counter); framed prints frame to frame on both walls (botanical plates, a Hogarth, the Battery in 1840); gray steel flat files at the back (drawers open with a steel shriek); glass counter; a small TV on a shelf behind the counter; a mat at the door; a ledger; a receipt pad; an old board cutter; a register", source: "ch-01:p45; ch-01:p48; ch-01:p54; ch-01:p67; ch-01:p121; ch-01:p131; ch-01:p134" }
      - { fact: "a barber next door (Szabo's five-dollar bet)", source: "ch-01:p113" }

  emilio-rowhouse:
    canonical_name: "Emilio Reyes's rowhouse"
    era: "1998"
    aliases: ["the house", "the Reyes house"]
    facts:
      - { fact: "on a narrow street off Baltimore Avenue; fourth in a row of twelve; porch sags toward the middle 'like a hammock'; a front window with the radiator under it (child Mara knelt on the radiator cover to watch the corner for taxis); a humming streetlight in front", source: "ch-01:p163" }
      - { fact: "the key sticks unless the door is lifted by the knob", source: "ch-01:p163" }
      - { fact: "Ch.1 state: two months of mail on the hall floor; refrigerator stocked by neighbors (foil, Tupperware, Dorothy's Pyrex), eggs with a January date, a jar of pickles; Gloria's ziti added", source: "ch-01:p164; ch-01:p165" }
      - { fact: "kitchen: table (china cabinet once in the room where slides were shown), counter, wall phone, the answering machine on the counter, a window over the sink", source: "ch-01:p11; ch-01:p165; ch-01:p167; ch-01:p193" }
      - { fact: "upstairs bedroom: radiator turned down; bed made badly; nightstand (Seiko on a folded handkerchief); clock radio with red numbers; shelf over the bureau (Pentax, a Cypriot lamp with a chipped nozzle, bathtub-swollen paperbacks); a basement (the greeting mentions Christmas lights)", source: "ch-01:p181; ch-01:p190; ch-01:p191; ch-01:p192" }
      - { fact: "phone number: one Mara has known by hand since before she could spell; written on Szabo's check", source: "ch-01:p126" }
      - { fact: "someone besides Mara has a key (neighbors have been in)", source: "ch-01:p165" }
      - { fact: "kitchen (Ch.2): a wall phone with a coiled cord pulled straight in places; the sink and a drainboard (the cereal box goes over its edge); dish rack; linoleum floor; a dish towel", source: "ch-02:p23; ch-02:p31; ch-02:p35" }
      - { fact: "a broom in the cellar way", source: "ch-02:p43" }
      - { fact: "study: the back bedroom, 'the only room in the house he had ever kept in order'; his desk with a blotter and chair; a strip of cork over the desk (once his site plans, now the chart's mat board); a bookcase whose bottom shelf holds decades of his field notebooks", source: "ch-02:p45; ch-02:p46" }
      - { fact: "a porch where circulars pile up; a flowerpot (Gloria: leave the key there, not under the mat); Dorothy's dish still in the refrigerator in May", source: "ch-02:p60; ch-02:p62" }
      - { fact: "Mara is there every Saturday by May; the duffel stands by its door the night before the flight", source: "ch-02:p55; ch-02:p68" }
      - { fact: "a cellar with steps where Emilio switched off the flashlight when she was seven ('our own cellar'), in a thunderstorm that knocked out the power", source: "ch-03:p64" }

  nicosia:
    canonical_name: "Nicosia (1998)"
    era: "1998"
    aliases: []
    facts:
      - { fact: "home of the unnamed friend with Emilio's 1992 Kourion drawings; raining; 'the place by the walls'", source: "ch-01:p172; ch-01:p173" }
      - { fact: "Emilio's offprints from Nicosia printed his name as 'Aimilios Reyes'", source: "ch-07:p163" }

  maras-apartment:
    canonical_name: "Mara's apartment (Philadelphia, 1998)"
    era: "1998"
    aliases: ["my own apartment"]
    facts:
      - { fact: "by May she uses it 'for very little else' than flossing", source: "ch-02:p50" }
      - { fact: "bathroom: a medicine-cabinet mirror with the silvering gone at one corner, and a light over it that buzzes", source: "ch-02:p50" }
      - { fact: "kitchen: the phone book on top of the refrigerator", source: "ch-02:p50" }
      - { fact: "hall closet: the half-packed canvas duffel; a dresser drawer: the passport at the back under a toaster warranty", source: "ch-02:p53" }
      - { fact: "her closet: the Buster Brown shoebox of her father's sherds on the top shelf, behind the winter sweaters", source: "ch-03:p25" }
      - { fact: "'an apartment with a radiator that knocks all night in February, and the rent is due on the first, and I'm behind by now, I suppose, unless they've given it to somebody else' (Mara, Ch.6; 'three months' was cut in the continuity repair, CH6-3 RESOLVED)", source: "ch-06:p164" }

  university-library:
    canonical_name: "the university library (Philadelphia)"
    era: "1967 / 1998"
    aliases: ["the big new library at the university (Fenn, 1967)"]
    note: "not named; on the same campus as the museum by implication (Mara walks up at lunch and back down to the lab)"
    facts:
      - { fact: "1967: Fenn slit the uncut leaves of the German's volume there with his thumb; 'The girl at the desk looked at me like I came about the radiators'", source: "ch-02:p1" }
      - { fact: "1998: stacks where food is not allowed; the Leipzig 1838 volume in marbled boards on a bottom shelf; still slit only up to the scholion's page", source: "ch-02:p10" }
    distances:
      - { to: "university-museum", value: "up at lunch and back down to the lab (a walk; no figure)", source: "ch-02:p10; ch-02:p11" }

  delphi-modern:
    canonical_name: "Delphi (modern village, 1968 / 1998)"
    era: "1968 / 1998"
    aliases: ["the real Delphi isn't (Fenn)"]
    facts:
      - { fact: "'they picked up the whole village and moved it down the road so the French could dig' (Fenn, 1968; cf. Kastri moved in the 1890s, Ch.1)", source: "ch-02:p17" }
      - { fact: "1968: Fenn's room over a taverna; the owner's mother feeds him beans; a goat eats what is left on the sill, including half a postcard", source: "ch-02:p17" }
      - { fact: "1968: the Athens bus arrives here (a passenger leaves a week-old Herald Tribune on Fenn's table)", source: "ch-02:p54" }
      - { fact: "1998: Mara's room, with a balcony the width of a bookshelf; swifts below the balcony; a woman at the desk downstairs", source: "ch-03:p4" }
      - { fact: "1998: a kiosk selling walkers' maps of Parnassus", source: "ch-03:p7" }
      - { fact: "1998: the museum, a guard in a blue uniform at the door who tears tickets (Mara's visit on Wednesday); the stadium at the top of the sanctuary (photographed by Mara in the last of the light)", source: "ch-03:p6; ch-03:p59" }
      - { fact: "1998: 'the four o'clock bus' (the day visitor's way back after an hour at the cave; route not stated)", source: "ch-03:p4" }
      - { fact: "1998, Mara's recollection in Ch.5: on Wednesday she saw the temple 'as everybody saw it', six gray columns with the light going, two hundred tourists photographing from one place on the path; the Athenian treasury 'white and alone on its terrace, the one on all the postcards'; the Castalian spring a dry niche behind a wire fence with a four-language sign about falling stones", source: "ch-05:p21; ch-05:p65; ch-05:p67; ch-05:p69" }
      - { fact: "1998: the ephorate here would be told of a find and 'send a man up in a month'", source: "ch-03:p57" }
      - { fact: "1998 (Mara's plan if the cave opened, Ch.6): 'the hotel on the main street in Delphi', a hot shower, 'the first bus out'", source: "ch-06:p164" }
      - { fact: "1998 (Mara's memory at dawn on the cliff, Ch.6): the temple as 'the gray one on the postcards'", source: "ch-06:p176" }
    distances:
      - { to: "corycian-cave", value: "four hours up on foot (Fenn, 1968)", source: "ch-02:p17" }
      - { to: "arachova", value: "not stated (Mara leaves Delphi at seven; a taxi out of Arachova drops her at the end of the asphalt a little after nine)", source: "ch-03:p3; ch-03:p4" }

  athens:
    canonical_name: "Athens"
    era: "1968 / 1998"
    aliases: []
    facts:
      - { fact: "Fenn flew in by TWA on 2 April 1968", source: "ch-02:p13" }
      - { fact: "the American consulate in Athens issued the effects carbon of 16 September 1968", source: "ch-02:p65" }
      - { fact: "Mara's Olympic Airways destination from Kennedy, Tue 19 May 1998", source: "ch-02:p51; ch-02:p52" }

  arachova:
    canonical_name: "Arachova (1998)"
    era: "1998"
    aliases: []
    facts:
      - { fact: "the taxi driver's village (he left her where the asphalt gave out and the road went on as two ruts of white gravel)", source: "ch-03:p3" }
      - { fact: "the German hiker's wife waits here 'with her knee'", source: "ch-03:p35" }
      - { fact: "AD 70 (Ch.5): 'Where Arachova had been there was a village, lower and smaller, earth roofs stepping down the hill with smoke leaking through them'; dogs come out; a man splitting wood holds his axe in the air until she is past", source: "ch-05:p3" }
      - { fact: "Ch.5 recalls the 1998 taxi: it 'had brought me up from Arachova and across this plain on asphalt'; at first light she sets off 'back the way it had come, on foot, eastward' (agrees with ch-03:p3; CH5-5 RESOLVED)", source: "ch-05:p2; ch-03:p3" }

  phoenix:
    canonical_name: "Phoenix (1998)"
    era: "1998"
    aliases: []
    facts:
      - { fact: "where Mara's mother lives (sent lilies); Mara tells the German hiker so", source: "ch-01:p3; ch-03:p40" }

  naples:
    canonical_name: "Naples (1998)"
    era: "1998"
    aliases: []
    facts:
      - { fact: "Halloran phones from here about the Campanian survey season ('the office'; fax number begins 081 552; six hours ahead of Philadelphia)", source: "ch-01:p176" }
      - { fact: "Halloran's flat of thirty-one years, emptied for the move to 'the new place'; the telephone stays until the new tenants take over the line", source: "ch-02:p26; ch-02:p42" }
      - { fact: "the survey's season starts 6 July 1998 (three or four weeks); a dig house with a decent room with a window, unassigned (location not stated)", source: "ch-02:p40" }

  kalivia-plateau:
    canonical_name: "Kalivia plateau"
    era: "1998 / AD 70"
    aliases: ["the plain"]
    facts:
      - { fact: "trailhead to the Corycian Cave; thyme, goat bells, wind", source: "ch-03:p1" }
      - { fact: "PLAN: 'a refuge hut (1998) that is a shepherd's stone pen in AD 70'. NOT ON THE PAGE in Ch.3: there is no refuge hut; the 1998 structure by the path is already a shepherd's pen (CH3-3). Ch.4 shows a pen on the same spot in AD 70 ('Past the firs a pen stood where the pen had stood that morning'), unbroken (see below); still no hut by the path (CH3-3 ch4_note)", source: "outline:ch-03; outline:ch-04; ch-03:p14; ch-04:p61" }
      - { fact: "reached via Olympic Airways to Athens and the KTEL bus to Delphi (plan). Ch.3 stages only a taxi out of Arachova across the high plain to the end of the asphalt", source: "foundation:§9; ch-03:p3" }
      - { fact: "1998, May: a long floor of new grass between the mountains, a wet, 'almost violent green with yellow in it'; the shepherds' summer huts of Kalivia in loose clusters (rough gray stone, tin roofs rusted orange at the seams); stone pens; a white church hardly bigger than a garage; on the far slope the ski lifts idle for the summer, 'with their chairs hanging in a row'; a black plastic bag caught on a pen wall", source: "ch-03:p5" }
      - { fact: "1998: the road lies 'across the bottom of everything like a dropped bootlace' seen from the slope; a truck crawls along it without a sound", source: "ch-03:p1; ch-03:p5" }
      - { fact: "1998: beside the path above the plain, a shepherd's pen whose fallen corner was rebuilt by a second builder: the old stones set on edge in a long herringbone, the new ones laid flat in courses, and a length of bedspring mortared into the join as a gate hinge (Mara photographs the join twice)", source: "ch-03:p14" }
      - { fact: "seen from the cave mouth at Mara's exit: the sun low over the western ridge; half the plateau in shadow; the lit half 'a paper-bag brown that I put down to the light'; beyond it the high summits lit to their tops, 'gray rock all the way up the gullies where the snow had lain that morning'; woodsmoke rising from below; bells under the lip", source: "ch-03:p82" }
      - { fact: "AD 70 (Ch.4): the path above the plain is 'only a goat track now, beaten pale through dead thyme'; no road where Mara looks ('He looked where I was looking and saw grass')", source: "ch-04:p60" }
      - { fact: "AD 70 (Ch.4): 'Past the firs a pen stood where the pen had stood that morning' (the page says 'a pen', not that the same pen survived), known 'by the bend of the track and the slab behind it'. Its wall runs in herringbone 'right round, every stone on edge, leaning on its neighbor'; 'The corner kept the same long slant as the rest' (no rebuilt corner, no flat courses, no bedspring). A hurdle of woven brush closes the gap, tied to a post with a twist of green withy. The slab behind the pen is new in Ch.4 (not in ch-03:p14; an added detail, not part of CH4-5's order question)", source: "ch-04:p61" }
      - { fact: "AD 70 (Ch.4), seen from the pen at sundown: the plain in shadow, 'brown from end to end, with two threads of smoke going up'; low huts 'roofed with brush held down by stones' (no tin roofs, no white church on the page); 'Grass grew where the road had crossed'; across the plain 'more firs' climb 'in one dark mass, and the ridge above them had only sky on it' (a different stand from the firs above the pen) (no ski runs or lifts; the word 'pylons' is not used)", source: "ch-04:p62" }
      - { fact: "AD 70 (Ch.5), the night after the arrival: no road where the slope runs out ('walking toward a road that was not there'); she finds a wall with the flashlight, and a dog out on the plain goes 'frantic at the beam' until she puts it out; she sleeps in the corner of 'what smelled like a sheepfold'; the dog barks at intervals all night; heavy dew. At first light she sets off 'back the way it had come, on foot, eastward, over stubble and dung and plowed-up stones' to the lip, where a cart track begins", source: "ch-05:p1; ch-05:p2" }
      - { fact: "AD 70, Ch.6 (November by the plan; the month is not named on the page): 'Where the cliffs ended there was the plain, under snow, a hand deep where the wind had left it alone and up to the knee where it had drifted along the walls'. The huts Mara saw from above that first evening stand 'with their brush roofs weighed down and not one of them smoking'. The crust holds for a step, then breaks. Valens reads the ground 'by the lie of the walls and the tops of the thornbushes'. A buried ditch shows as 'a line of softer snow'. 'Nobody's up there now but the charcoal men, and they're coming down' (Valens)", source: "ch-06:p96; ch-06:p190; ch-06:p191; ch-06:p202" }
      - { fact: "AD 70, Ch.6: 'the pen under the firs' still stands, stones on edge and propped all round with snow along every slant; 'Somebody had tied the hurdle shut with a fresh withy since October' (CH3-3 ch6_note)", source: "ch-06:p219" }
      - { fact: "AD 70, Ch.6, the descent in falling snow: 'Below the mouth there was only snow and wind'; under the firs before she sees them; the light goes off the snow so slowly she cannot say when; among the firs 'the snow fell straight down between the trunks, very quiet'; then 'Past the pen we crossed the plain, and I did not see the huts' to the top of the cliff path. Order cave → firs → pen → plain → cliff top, as in Ch.3-4 (continuity repair W-09; the pre-revision text crossed the plain before the firs)", source: "ch-06:p276; ch-06:p277; ch-06:p286; ch-06:p307" }
      - { fact: "Ch.7: 'the plain', under snow, is where the women go at midwinter ('Onto the plain. In the snow, at night, with torches'), below the firs and the cave", source: "ch-07:p191; ch-07:p194" }

  corycian-cave:
    canonical_name: "the Corycian Cave"
    era: "1998 / AD 41-71"
    aliases: ["the cave of the nymphs on Parnassus", "the nymphs' cave", "the Korykian cave (Mara to Valens, ch-06:p82)", "Pan's cave (Valens, ch-06:p83; the charcoal burner, ch-06:p314)", "Pan's 'house' (Valens, ch-06:p226)"]
    facts:
      - { fact: "the crossing site (Mara 1998, Ch.3 on the page; Fenn 1968)", source: "STATE:ARCH-2; foundation:§9; ch-03:p73" }
      - { fact: "sacred to Pan and the nymphs; 'more than twenty thousand' knucklebones excavated there (the French 'sieved' them out of the floor at the beginning of the seventies)", source: "foundation:§9; ch-03:p54" }
      - { fact: "ΚΩΡΥΚΕΙΟ ΑΝΤΡΟ on the 1998 walker's map; Fenn's 38° 31′ / 22° 32′ falls a few hundred yards from its symbol", source: "ch-03:p7" }
      - { fact: "1998 approach: a path marked with red paint squares on boulders every fifty yards (drips dried in beads); seen from below as a dark arch in a low gray cliff, wider than high, a scrub oak growing out of a crack over the lip; the arch's left-hand post leans where the rock broke away and its top is flattened (= Fenn's drawing)", source: "ch-03:p8; ch-03:p46" }
      - { fact: "1998: the last paint is on 'a gray block' at the final turn below the mouth, facing the cave, with a red square and an arrow pointing at the arch", source: "ch-03:p48" }
      - { fact: "1998 mouth: ground trodden bare, goat droppings 'black and shiny as olive pits'; to the right of the arch a smoothed patch at shoulder height with worn Greek capitals, lichened: ΝΥΜΦ… (rest lost) and ΠΑΝ, cut deeper and very clear, with a small ledge beneath", source: "ch-03:p49" }
      - { fact: "first chamber: the floor slopes down from the lip, loose and stony; daylight goes a little way and stops; a single hall running back into the mountain farther than daylight follows, 'with a roof that went up into darkness in the middle'; the floor 'full of stalagmites, pale and lumpy and gleaming'; near the middle a great slumped stalagmite ('a great slumped mass', no size given) with a dull shine on its near shoulder where hands have been laid on it 'for a span of years I could not begin to guess at'", source: "ch-03:p51" }
      - { fact: "cave cold: 'the cold of a cellar in August', damp and steady; smells of wet stone, earth and faintly of goats; drips falling into water in different places and keys", source: "ch-03:p52" }
      - { fact: "graffiti on the walls near the mouth (1998): hundreds of names cut with knives and nails, many French in capitals dated 1840s–1850s; a 1952 cut through a French lieutenant; lowest, at hip height, a heart in blue felt-tip with two pairs of initials and 1996", source: "ch-03:p53" }
      - { fact: "the floor (1998): loose and gray-brown where the French spoil went back in; a goat's sleeping hollow; near the slumped stalagmite a drip has washed out a basin as wide as a soup plate, where the knucklebone lay", source: "ch-03:p54; ch-03:p55" }
      - { fact: "the way to the slot: past the slumped stone the floor climbs as ridged, slick flowstone with a skin of water; daylight fails; on the left the roof comes down until one must stoop and meets a great slab split from the wall and leaning there; between slab and low roof a vertical crack: at shoulder height 'just wide enough to take my forearm', pinched shut above; lower down it widens, and 'along the floor it was a good foot and a half across' (roughly a tent shape: an adult enters kneeling, sideways, back to the slab); a flashlight beam finds a bend four or five feet in, and beyond the bend 'the beam ran on into black'", source: "ch-03:p60; ch-03:p61" }
      - { fact: "at the crack (Mara, 1998): still air and cave cold from about noon until 1:40; then a dry, edged cold from behind the rock, breath visible, the cave's sounds thinning to nothing, ear pressure; she went in kneeling at the wide bottom; after she backed out, cave air again and nothing from the crack", source: "ch-03:p62; ch-03:p68; ch-03:p69; ch-03:p70; ch-03:p78" }
      - { fact: "the trail's paint blaze is gone on the far side of the crossing: the last-turn boulder carries no red and no trace of it, its face covered in gray-green and orange lichen rosettes as wide as a hand", source: "ch-03:p83; outline:ch-03" }
      - { fact: "after the crossing (Mara's exit): low yellow-to-orange light slanting deep into the cave; a chill under the arch; woodsmoke; fresh dung; goat bells below the lip; on the slope below the mouth 'the thyme was over, every flower head dried to a brown husk on its stalk'", source: "ch-03:p80; ch-03:p82" }
      - { fact: "AD 70 mouth (Ch.4): goats scattered down the slope 'below the lip'; a rock 'round the corner of the arch, out of the wind' where the goat-boy sits; dust at its foot. The rock face above is 'dressed flat and cut with letters' with sharp edges and red paint in the bottoms of the strokes: 'ΝΥΜΦΑΙΣ, and further along ΠΑΝΙ, every letter there' (1998: ΝΥΜΦ… and ΠΑΝ, ch-03:p49; CH4-4). On the ledge under the letters: a clay lamp with a sooted nozzle and three knucklebones in a row", source: "ch-04:p2; ch-04:p3; ch-04:p28" }
      - { fact: "the goat-boy calls it 'tou antrou' ('Ek tou antrou?'), 'nearly the word printed on my walker's map' (ΑΝΤΡΟ)", source: "ch-04:p17; ch-04:p18" }
      - { fact: "AD 70, from the foot of the slope at dusk: 'the cave showed black in the gray cliff with one star over it'", source: "ch-04:p80" }
      - { fact: "shut after Mara's crossing: only cold (Ch.6), nothing (Ch.8)", source: "outline:ch-06; outline:ch-08", ch6_confirmed: "Ch.6 WRITTEN (see the AD 70 November rows below). The page shows a null test, not the word 'shut'", ch6_source: "ch-06:p239; ch-06:p245" }
      - { fact: "AD 70, Ch.6 (snow day, November by the plan), the mouth: 'The cave had not moved. Its arch was half full of snow, blown in under the lip and shaped there into a long smooth wave that ran back into the dark.' The letters in the dressed rock by the arch are 'still red at the bottom of their strokes, and snow had settled in the strokes, white in red'. 'The ledge below held only snow' (the Ch.4 lamp and knucklebones are gone). Valens ties the mules in the lee of the rock, leaves a corner of crust on the ledge for Pan ('It's his house'), and makes fire crouched in the mouth with his back to the wind. By the time they leave, snow is falling through the arch in big wet flakes, the tracks are going soft, and the crust on the ledge 'wore a cap of it'", source: "ch-06:p221; ch-06:p225; ch-06:p226; ch-06:p230; ch-06:p234; ch-06:p274" }
      - { fact: "AD 70, Ch.6, inside: the slope of the floor; the hall; 'the great pale lump of stone with its shoulder shining' (the slumped stalagmite, ch-03:p51); the flowstone (Valens stands on it 'with his feet set across two of its ridges'); the slab; the crack ('The slab was there. The crack was there.'); the drip 'far back in the hall, falling into its basin'; an echo that answers 'late' and gives her cry back 'from places I could not see'. Lit only by pine torches", source: "ch-06:p3; ch-06:p7; ch-06:p24; ch-06:p237; ch-06:p238; ch-06:p250; ch-06:p251" }
      - { fact: "AD 70, Ch.6, the crack: its floor is scraped down to bare rock 'as far in as my arm would reach'. At the bend, earth 'frozen into plates', each with 'a skin of rime on its underside', and under it 'black grit, packed hard'. Under the last plate, 'the same gray rock, with a little water standing in a pit of it under a lid of ice'. Dug 'down to rock on every side'", source: "ch-06:p1; ch-06:p34; ch-06:p243" }
      - { fact: "AD 70, Ch.6, the null test: 'Everything in there was cold … Now the whole mountain had turned to cold' (in May 'this rock had let out a cold of its own, and my skin had singled it out at once'); palm in the gap, 'Rock. Air. Cold that was only cold.'; after 1:40 and to 'five to two' by the watch: 'The rock was cold. Behind me the torch flame stood straight up.'", source: "ch-06:p2; ch-06:p8; ch-06:p13; ch-06:p239; ch-06:p245; ch-06:p247" }
      - { fact: "Fenn left his coat at the cave mouth in 1968, the notebook in its pocket; a shepherd brought the coat down", source: "outline:ch-27; foundation:§3", ch2_note: "Ch.2 shows only the consulate forwarding the overcoat 'with contents of pockets' (ch-02:p66); CH2-3" }
      - { fact: "1968 (Fenn): 'a big wet barn of a place with names scratched all over the walls, a lot of them French'", source: "ch-02:p17" }
      - { fact: "1968 (Fenn): the slot is 'Way in past where the good light gives out, the rock comes down low on the left and there's a kind of slot you could get your arm into'. Cold air at its back for 'about a minute', then 'like somebody shut a door in another part of the house'; cold again one Tuesday morning; then nothing for weeks; on July 21 cold enough to see his breath, for 'a whole cigarette'", source: "ch-02:p19; ch-02:p20; ch-02:p69" }
      - { fact: "Fenn slept up there at least once (1968)", source: "ch-02:p21" }
      - { fact: "the scholion's name for it: 'the cave of the nymphs on Parnassus'", source: "ch-02:p1" }
      - { fact: "Ch.7: Mara turned the shovel's edge 'On the god's rock. At the cave.'; from the court she pictures 'the dark arch and its painted letters' above the firs", source: "ch-07:p4; ch-07:p6; ch-07:p194" }
    distances:
      - { to: "delphi", value: "the goat-boy: 'Makran' (far); at the foot of the slope he turns her by the sleeve toward 'the dark gap between the mountains'. Ch.5: 'It was most of a day down the mountain' (from the foot of the slope, after a night in a sheepfold: the plain, the lip, the village, the valley road, Delphi by afternoon). Her return plan: the cart track by full light, the plain, the long climb to the firs, 'the cave at the top of it by noon'", source: "ch-04:p74; ch-04:p78; ch-05:p1; ch-05:p210" }
      - { to: "delphi-modern", value: "'four hours up and every one of them uphill' to the plateau and the cave (Fenn, 1968)", source: "ch-02:p17" }
      - { to: "delphi", value: "AD 70 by the cliff stair (Valens): 'In summer, a morning. In this, a morning and more'; down 'Before dark, if you're quick in there'. Ch.6 as walked: left Kallia's lane before light, daylight on the last of the cliff, the cave by about midday ('The light's off the mouth. Past the middle of the day' after digging a while), out after two, the first houses after dark", source: "ch-06:p10; ch-06:p98; ch-06:p100; ch-06:p157; ch-06:p176; ch-06:p339" }
      - { to: "kalivia-plateau", value: "from the end of the asphalt: under three hours with the duffel and rests (derived: taxi drop 'a little after nine'; inside the mouth by noon, when 'the light had come in white and flat'); the German, met above the pen: 'For me, forty minutes. For you, with the house, one hour'", source: "ch-03:p3; ch-03:p27; ch-03:p80" }
      - { to: "cliff-stair-above-delphi (the cliff top)", value: "'the better part of a morning' on the gray mule in November (Mara, Ch.7)", source: "ch-07:p194" }

  parnassus:
    canonical_name: "Mount Parnassus"
    aliases: ["Parnassus"]
    facts:
      - { fact: "Thyiades' winter rites; women trapped by snow until dawn (Ch.8)", source: "outline:ch-08; foundation:§9" }
      - { fact: "high summer pasture with a shepherd hut (Ch.15)", source: "outline:ch-15" }
      - { fact: "1998: Liakoura is the summit (the German climbs it by six a.m.); the high summits' gullies 'streaked with old snow' in May (no colour given); limestone 'pale gray', fluted by rain into channels and knife-edged ridges; thyme in low gray cushions, scrub oak; a fir belt above the pen (tall, dark, very straight; cones upright on the branches; thick resin smell)", source: "ch-03:p1; ch-03:p8; ch-03:p15; ch-03:p23; ch-03:p45" }
      - { fact: "1998: the yellow-and-black E4 (named only by the German) goes 'over the summit and down the other side and on, many days, to the sea'; the cave path is marked separately in red (the E4 signpost is cut in the author fixes)", source: "ch-03:p8; ch-03:p27" }
      - { fact: "at Mara's exit from the cave (far side of the crossing): the high summits stand lit to their tops with 'gray rock all the way up the gullies where the snow had lain that morning' (no snow); the thyme on the slope below the mouth 'was over, every flower head dried to a brown husk on its stalk'", source: "ch-03:p45; ch-03:p82" }
      - { fact: "AD 70 descent (Ch.4): a goat track through dead thyme from the mouth; 'Past the firs a pen'; 'Halfway down' a thornbush (the boy's heel); 'At the foot of the slope' he turns her toward 'the dark gap between the mountains'. Order cave → firs → pen matches Ch.3 in reverse (ch-03:p14; ch-03:p15; CH4-5 RESOLVED)", source: "ch-04:p60; ch-04:p61; ch-04:p68; ch-04:p73; ch-04:p74" }
      - { fact: "AD 70, the month before Ch.6: 'the snow had come a little lower on Parnassus every night', seen from the spring: 'first the summits and then the shoulders and then the rim of the cliffs above the sanctuary, white along its edge'; at sunset the snow on the cliff rim turns pink", source: "ch-06:p39; ch-06:p77" }
      - { fact: "AD 70, Ch.6: in snow season the mountain is empty but for the charcoal men, 'and they're coming down'; a charcoal kiln burns at the top of the cliff path; a long bank of cloud stands up behind the ridge over the summits as they reach the pen ('Snow by afternoon'); the road over the mountain to Boeotia is 'under snow. All of it.'", source: "ch-06:p96; ch-06:p149; ch-06:p220; ch-06:p307" }

  delphi:
    canonical_name: "Delphi (AD 70-71)"
    aliases: []
    facts:
      - { fact: "genteel decline but busy; the temple of Apollo painted red, blue and gilt", source: "foundation:§9; outline:ch-05", ch5_confirmed: "busy (pilgrims, hawkers, guides, sacrifices); poorer since the bronzes went ('there's no buying. Everybody's poorer', ch-05:p115); the temple painted (see temple-of-apollo-delphi)" }
      - { fact: "Sacred Way: crowds, hawkers, treasuries, painted statues, empty statue bases with fresh pry-marks (Nero took hundreds three years earlier)", source: "outline:ch-05", ch5_confirmed: "CONFIRMED in Ch.5 (see delphi-sacred-way): 'five hundred of the god's bronzes'; lead 'two or three years of weather at the very most' (ch-05:p48; ch-05:p51)" }
      - { fact: "Castalian spring; Kallia's pilgrims' lodging beside it", source: "outline:ch-05", ch5_note: "the spring is on the page (castalian-spring). After polish cycle 1: 'A short way above the spring the road turned off between houses into a lane'; Kallia's house is at the lane's end (kallias-house; CH5-1 RESOLVED: near the spring, a short walk above it)", ch5_source: "ch-05:p181" }
      - { fact: "agora: herald announces Titus's capture of Jerusalem; reward notice for 'Lupus' posted", source: "outline:ch-05; outline:ch-09", ch5_note: "Ch.5: the herald proclaims in the market square below the gate (delphi-market-square). No reward notice is in the square in Ch.5 (planned Ch.9; meta P5)" }
      - { fact: "AD 70 approach from the east (Ch.5): the road climbs from the Pleistos side; the town begins with a running track below the road (young men racing, stripped and oiled); then the cliffs close in, two sheer gray faces with a cleft and the spring; up the last of the hill into the town and its gateway", source: "ch-05:p21; ch-05:p22" }
      - { fact: "a house 'down past the stadium road' that takes in girls on their own (the procurer's offer)", source: "ch-05:p130" }
      - { fact: "the council and the people of the Delphians, under the archon Kleodamos, decree a sacrifice of oxen to Pythian Apollo on the fourth day after the proclamation (autumn AD 70), with a procession from the council house to the altar, lamps in doorways on the eve, a feast day, strangers kept from the altar, meat for citizens in the square; four oxen ('Four oxen, he says. For the whole town?'); last time, 'for the Nemean thing', one ox and a sheep. Mara is 'nearly sure' the herald said 'the fourth day' and 'nothing about four oxen'", source: "ch-05:p99; ch-05:p102; ch-05:p118; ch-05:p119; ch-05:p128" }
      - { fact: "pilgrims from Boeotia (a garland in the spring: 'Boeotians') and Thebes (Kallia's lodgers)", source: "ch-05:p139; ch-05:p171" }
      - { fact: "Ch.6: the path to the plain leaves the town 'past the high corner of the sanctuary wall, where the dogs knew him and kept quiet' and goes straight at the cliff (cliff-stair-above-delphi). Before light the town is asleep; after dark it shows lamps 'yellow in the doorways, with smoke lying low over the roofs'; 'The sanctuary dogs let us by'", source: "ch-06:p160; ch-06:p327; ch-06:p339" }
      - { fact: "Ch.6: seen from the top of the cliff at dawn, 'terraces and roofs and the sanctuary laid out down its slope like a model under glass, with the temple in the middle of it, very small'", source: "ch-06:p176" }
      - { fact: "Ch.6: the decreed sacrifice (Ch.5) has happened. To the charcoal burner it means 'the god's ox' with 'the number four in it, and the council, and a grievance about meat'; he 'ate … Smoke'; Valens 'was at Kirrha'", source: "ch-06:p312; ch-06:p313; ch-06:p314" }
      - { fact: "Ch.6, town talk: 'He'll have you all over the town by the next market' (Valens, of the charcoal burner): the market is where gossip spreads", source: "ch-06:p328" }
      - { fact: "polygonal wall carries manumission records (sale to Apollo; paramone clauses)", source: "outline:ch-09; foundation:§9" }
      - { fact: "consultation on fixed (monthly) days in the warm season; the year's first on the seventh of Bysios; goat must shiver at cold water; women ask through a male representative", source: "foundation:§9; foundation:§3; outline:ch-13" }
      - { fact: "Theano's house (crows), where she names Pompeii to Mara off duty; Valens recounts the consultation at Kallia's lodging (not an inn)", source: "outline:ch-08; outline:ch-13; outline:ch-14" }
      - { fact: "Ch.7 (winter AD 70-71): 'the first thing the town did with a stranger was work out who' she belonged to; the women at the spring look past a woman to see who sent her down; men in a lane slow to see whether anyone is coming behind her", source: "ch-07:p1" }
      - { fact: "Ch.7: past the colonnade, the market with stalls of clay women and white wool and a salt row (salt-seller, sprat-seller), and a fountain; the public latrine beside the market; the bath below the sanctuary near the running track; the council hall beside the square; a baker's hatch that takes a tally stick", source: "ch-07:p36; ch-07:p38; ch-07:p63; ch-07:p70; ch-07:p72; ch-07:p141" }
      - { fact: "Ch.7: the talk at the spring is that Vespasian means to take back Nero's freedom (tribute again); the council enters every household on wax tablets 'before Rome put a governor back in Corinth to ask for it'", source: "ch-07:p129" }
      - { fact: "Ch.7: by the last morning of the month the cliffs above Kallia's roof are 'white to their rim'", source: "ch-07:p194" }

  castalian-spring:
    canonical_name: "the Castalian spring"
    era: "1998 / AD 70"
    aliases: ["the god's spring", "the spring"]
    facts:
      - { fact: "May 1998 (Mara's memory): 'a dry niche behind a wire fence with a sign in four languages about falling stones'", source: "ch-05:p21" }
      - { fact: "AD 70: out of the cleft between two sheer gray cliff faces; bronze lion heads stand out from a wall of dressed stone and pour into a long basin; pilgrims wet their hair; women wait with jars; a man sits at a little table with a ladle and a dish of coins", source: "ch-05:p21" }
      - { fact: "at nearly dark: five white ropes of water from the lions' mouths, 'a noise much bigger than they were'; air comes down the gorge 'smelling of moss and cold water'; the coin table gone; 'The cold of it stopped my breath'", source: "ch-05:p134; ch-05:p136" }
      - { fact: "an overflow at the far end runs out through a channel in the stone; people drink from the basin, and Kallia sends Mara to 'the trough at the end'; pilgrims leave garlands in the basin", source: "ch-05:p138; ch-05:p141" }
      - { fact: "neighbors in Kallia's lane fill their jars here ('Your wife and I fill our jars at the same spring')", source: "ch-05:p191" }
      - { fact: "Ch.6: Mara calls the spring 'the lions' ('I watched it at the lions while the second jar filled'; 'made the trip to the lions twice in the dark'); from it she watches the snow line come down Parnassus", source: "ch-06:p39; ch-06:p152" }
      - { fact: "Ch.7: at the end of the afternoon drovers bring their animals to 'the trough at the bottom of the basin'; the women draw at the lions (Mara at 'the third lion', with green weed 'combed all one way by the water' on its lower lip); steps lead down to it. The salt-seller: donkeys 'drinking the god's water at the wrong end of his basin … before somebody fetches a priest to them'. The spring's talk: 'At the spring they say you're simple'; 'The whole spring knows you came on a boat'. Mara cuts lentisk on the hillside 'under the spring' and chews it at the trough", source: "ch-07:p58; ch-07:p73; ch-07:p108; ch-07:p110; ch-07:p117; ch-07:p121; ch-07:p139" }
    distances:
      - { to: "kallias-house", value: "Mara's round trip 'From Kallia's gate to the spring and back. With a full jar.' is her measure for half an hour (her answer for the long hand going from 'ten past one' to the eight). Derived: about thirty minutes with a full jar", source: "ch-06:p13; ch-06:p15; ch-06:p17" }

  delphi-sacred-way:
    canonical_name: "the Sacred Way (Delphi, AD 70)"
    era: "AD 70"
    aliases: ["the Way"]
    facts:
      - { fact: "starts above the market square and gate with a stone basin on a pillar where passers-by dip two fingers and touch the forehead", source: "ch-05:p23" }
      - { fact: "paving worn 'glassy by so many soles'; climbs, makes a bend, then 'doubled back' past more treasuries to a ramp beside the great wall", source: "ch-05:p38; ch-05:p53; ch-05:p65" }
      - { fact: "the Corcyraean bronze bull on a high base: 'polished bright', gilded horns, inlaid eyes (white with a dark stone pupil), dewlap folds finely chased; by 'A man from Aegina' (the guide)", source: "ch-05:p26; ch-05:p29; ch-05:p30; ch-05:p31" }
      - { fact: "painted marble figures: tinted brown skin, red lips, eyes with black lashes drawn one by one; a girl on a column with a basket on her head, painted earrings, pink nipples through a painted dress", source: "ch-05:p31" }
      - { fact: "'the next treasury' (unnamed since the author fixes): along its top a frieze of gods fighting giants against Egyptian blue (a giant's head bitten off by a lion)", source: "ch-05:p36" }
      - { fact: "the place where 'the boxer from Thasos' stood ('whose statue killed a man, which is another story and costs extra')", source: "ch-05:p37" }
      - { fact: "the Kroton runner's base: waist-high limestone, an inscription cut deep and filled with red (the people of Kroton set up this man for the god), two foot sockets planted for a stride, NO statue; a fresh curved flake broken from the lip of the nearer socket (raw crystal face, no dirt or lichen), a chopped crumb of lead in its bottom, chisel bites along the second socket, old green copper streaks down the face; a lichen rosette as broad as a coin in one corner", source: "ch-05:p42; ch-05:p44" }
      - { fact: "more robbed bases: one with two holes; one with a single bronze heel left in its socket, the foot sawn through above the instep (cut face green-brown, 'fine-ridged from the saw')", source: "ch-05:p45" }
      - { fact: "five hundred bronzes went down to Kirrha in ox-carts and onto the ships; the Thessalians taken off their horses and the horses left (the guide)", source: "ch-05:p48" }
      - { fact: "hawkers and trade: a wool seller, guides competing for strangers (one from Amphissa), a goat going up to sacrifice to a flute", source: "ch-05:p25; ch-05:p32; ch-05:p33" }
      - { fact: "above the bend: treasuries 'shoulder to shoulder with their doors shut'; the Athenians' among them, not recognizable to Mara (in 1998 'white and alone on its terrace')", source: "ch-05:p65" }
      - { fact: "a great wall of stones 'fitted together in curving shapes', written over in lines too small to read walking (the polygonal wall; its manumission records are planned for Ch.9)", source: "ch-05:p65; outline:ch-09" }
      - { fact: "at the top of the ramp: an altar of black stone edged with white, smoking; a priest's assistant sluicing blood off its step; the goat tied to a ring at the foot of the step, alive, eating someone's laurel", source: "ch-05:p65" }

  temple-of-apollo-delphi:
    canonical_name: "the temple of Apollo (Delphi)"
    era: "1998 / AD 70"
    aliases: ["the god's house", "my temple"]
    facts:
      - { fact: "1998 (Wednesday, Mara's visit): 'six gray columns on a long platform with the cliffs behind them and the light going', two hundred tourists photographing from the same spot on the path", source: "ch-05:p67; ch-05:p69" }
      - { fact: "AD 70: 'It had all its columns.' Columns dressed in fine creamy stucco (marble dust in the lime, 'beautifully laid'); 'The grooved blocks along the frieze were blue so dark it was nearly black and the panels between them red'; cornice banded red, blue and gold; gilded shields along the front flashing in the altar smoke; in the pediment the god among his family, skin tinted, hair gilded, mouth painted; gilt figures at the roof corners", source: "ch-05:p66; ch-05:p67; ch-05:p72" }
      - { fact: "the steps are 'a mason's steps and not a person's, each one as high as my knee'; between the columns it is cool and the altar's noise drops away", source: "ch-05:p72" }
      - { fact: "a low molding along the foot of the porch wall, painted with a key pattern in red and Egyptian blue: under a lifted flake an older, paler, finer blue; the new blue slopped over the old border; a hand's breadth behind a column missed", source: "ch-05:p72" }
      - { fact: "kept by men in white tunics with a purple stripe and a staff; a temple slave with a rod; 'Get her down before the priest comes out'; touching the god's house unwashed is an offense", source: "ch-05:p74; ch-05:p75; ch-05:p78; ch-05:p79; ch-05:p84" }
      - { fact: "Ch.6, seen at dawn from the last of the cliff: very small in the middle of the sanctuary; 'From up there the paint did not show. For the space of a breath it was nearly the gray one on the postcards; then the sun cleared the ridge and found the gilt on the roof'", source: "ch-06:p176" }
      - { fact: "repainted every spring 'when the snow's gone': the priests hang a man off the roof on a rope 'with a pot of red'; the same cheap man every year (Valens)", source: "ch-06:p177; ch-06:p179; ch-06:p181" }

  delphi-market-square:
    canonical_name: "the market square below the gate (Delphi, AD 70)"
    era: "AD 70"
    aliases: ["the agora (plan)", "the square"]
    facts:
      - { fact: "below the gate, with a colonnade along one side; every shop sells something to give the god: clay women, white wool, laurel, strings of small pierced clay discs stamped with something worn flat", source: "ch-05:p23" }
      - { fact: "a money-changer's table; stalls with shutters, put up when the sun goes off the square; a fountain at the bottom of the square", source: "ch-05:p98; ch-05:p117" }
      - { fact: "a door at the end of the colonnade from which the herald steps onto a block; a clerk in the doorway; the council house is the procession's starting point", source: "ch-05:p94; ch-05:p100; ch-05:p102" }
      - { fact: "the sun goes off it about an hour after the proclamation; at dusk it is a place where a woman alone is approached ('It gets cold in this square after dark')", source: "ch-05:p117; ch-05:p130" }
      - { fact: "Ch.7: the salt market past the colonnade; a fountain, where a man laughs along with the row; the council hall beside the square", source: "ch-07:p63; ch-07:p70; ch-07:p141" }

  kallias-house:
    canonical_name: "Kallia's house (lodging)"
    era: "AD 70"
    aliases: ["Kallia's lodging"]
    facts:
      - { fact: "reached from the spring 'up the dark road': 'A short way above the spring the road turned off between houses into a lane so narrow that the jar scraped the wall'; the sieve neighbor's door halfway along; a gate in a wall at the lane's end (CH5-1 RESOLVED: near the spring, a short walk above it, as foundation 'by the Castalian spring' and the bible's 'near' have it)", source: "ch-05:p176; ch-05:p178; ch-05:p181; ch-05:p193" }
      - { fact: "a courtyard with a pomegranate tree; a staircase up the outside wall to a gallery; doors on every side; smell of lentils and smoke", source: "ch-05:p193" }
      - { fact: "a hearth under a lean-to roof with a pot in the embers and a big water jar beside it (one full spring jar fills it to the shoulder)", source: "ch-05:p201; ch-05:p203" }
      - { fact: "the storeroom: a low doorway under the stairs; storage jars (she barks her hip on 'the shoulder of a storage jar'), sacks, barley, a mat on the floor, oregano hanging from a beam; smells of oil, dust and mice", source: "ch-05:p205; ch-05:p206; ch-05:p210" }
      - { fact: "lodgers: Thebans, a pilgrim on the gallery, a singer, a snorer", source: "ch-05:p171; ch-05:p193; ch-05:p194" }
      - { fact: "Ch.6, the lane: from the gate to its turn, ice made from Mara's water slopped twice a day ('one coat on another, like the paint on a fire escape'); Valens ashes it. Mules are unloaded in the lane, not the court ('Not in my court')", source: "ch-06:p37; ch-06:p42; ch-06:p48; ch-06:p53" }
      - { fact: "Ch.6, the court and house: the pomegranate (eaten to head height by Valens's brown mule last winter); the gateway; the gate and its gatepost (Mara set the watch by its shortest shadow); a stack of split oak under the outside stair, ends crosswise, bark up; the ash pail by the hearth with the iron shovel upright in it; the big jar; the gallery (Thebans); the storeroom under the stairs ('Under Kallia's stairs. With her jars.')", source: "ch-06:p13; ch-06:p42; ch-06:p49; ch-06:p50; ch-06:p58; ch-06:p59; ch-06:p75; ch-06:p152; ch-06:p288" }
      - { fact: "Ch.6: the Thebans are still lodging a month on (a Theban's cloak beaten; a Theban's cloak burned by a spitting coal from the last wood; a Theban on the gallery wanting lentils)", source: "ch-06:p38; ch-06:p56; ch-06:p75" }
      - { fact: "Ch.7: the court 'between the hearth and the gate'; the gallery with a balustrade (the Thebans watch from it) and the lodgers' rooms along it; one shut door 'at the end of the gallery, past the lodgers' rooms, where they never went', 'the shut room upstairs', swept every morning; the hearth 'under the lean-to'; a low stool; the store jar; the storeroom (Mara's mat) under the stair; a lidded pot by the jars; the dung heap at the lane's end; the woodstack", source: "ch-07:p15; ch-07:p25; ch-07:p26; ch-07:p36; ch-07:p37; ch-07:p95; ch-07:p130; ch-07:p187; ch-07:p191" }
      - { fact: "Ch.7: Sosandros calls it 'The lodging over the spring'", source: "ch-07:p143" }

  descent-road-to-delphi:
    canonical_name: "the road down from Parnassus to Delphi (AD 70)"
    era: "AD 70"
    aliases: []
    facts:
      - { fact: "from the plain's eastern lip a cart track (two ruts, a hump of turf, a broken cartwheel in the ditch with spokes weathered silver) down to the village where Arachova had been", source: "ch-05:p2; ch-05:p3" }
      - { fact: "below the village the road drops in loops along a long valley; scrub gives way to dry-stone-walled olive terraces stepping down to a river heard at the bottom of a gorge; families beating the boughs with canes onto spread cloths (the olive harvest)", source: "ch-05:p4" }
      - { fact: "an olive press in a farmyard where the road makes an elbow round a spur: a blindfolded donkey turning millstones in a stone basin; a beam press weighted by a windlass and hanging stones crushing rush baskets of paste; oil skimmed from a sunk jar with a shell; a black, sour run-off channel alive with wasps", source: "ch-05:p6" }
      - { fact: "below the press the road meets another climbing from the gorge (pilgrim families; the ox-cart of oil jars is cut in the author fixes)", source: "ch-05:p16" }
    distances:
      - { to: "delphi", value: "from the foot of the cave slope: a night (sheepfold) and 'most of a day' on foot; she reaches the town in the afternoon", source: "ch-05:p1; ch-05:p69" }

  cliff-stair-above-delphi:
    canonical_name: "the cliff stair above Delphi (AD 70)"
    era: "AD 70"
    aliases: ["the stair (Valens)", "the cliff path", "the zigzags"]
    facts:
      - { fact: "the direct way from Delphi to the plain: leaves the town 'past the high corner of the sanctuary wall' and 'went at the cliff in short zigzags, cut steps and worn rock and loose stone'. Going up, the drop is on the left 'from the first turn to the last'. Mara did not know it existed: 'between the plain and Delphi stood only cliff' (she had come down by 'the long road round')", source: "ch-06:p38; ch-06:p160; ch-06:p163" }
      - { fact: "Ch.6 (snow season): 'The stair's ice from the second turn'. Valens binds sacking on every hoof 'Two turns up' where the ice begins. 'Step where she steps'. Going down 'was worse than coming up': the gray sits back on her haunches step to step, and twice Mara's boots go from under her and the tail holds her. 'The edge has gone along this bit' ('Keep to the wall')", source: "ch-06:p96; ch-06:p172; ch-06:p173; ch-06:p327; ch-06:p333" }
      - { fact: "from the top at dawn: the whole fall of the mountain, terraces and roofs and the sanctuary 'like a model under glass', the temple very small, its roof gilt catching the sun; at dusk the valley 'sunk into gray', a few lamps far down where the town is", source: "ch-06:p176; ch-06:p327" }
      - { fact: "a fork near the top turns off toward a charcoal kiln on the slope ('a thread of smoke'). The kiln sits at the top of the cliff path, off to the left coming down: 'a long hump of earth and turf with smoke seeping from every seam', a red glow low in the snow, smoke 'sour where woodsmoke would have been sweet'", source: "ch-06:p185; ch-06:p307" }
      - { fact: "used by a charcoal burner with a donkey (on the path 'since the town' at dawn)", source: "ch-06:p182; ch-06:p183" }
    distances:
      - { to: "corycian-cave", value: "'In summer, a morning. In this, a morning and more' (Valens), via the plain and the pen under the firs", source: "ch-06:p98; ch-06:p219" }
    note: "the page never names it. 'The stair' is Valens's word (p20, p22, p96, p273). Historically the Kaki Skala, but that name is NOT on the page"

  # --- Ch.7 ---
  delphi-baths:
    canonical_name: "the bath (Delphi)"
    aliases: ["the bath"]
    facts:
      - { fact: "'below the sanctuary near the running track'. The women have it 'from first light until the sun was over the cliffs'; then the men 'came down from their exercise and it was theirs'. The bath-keeper's wife takes the coin at the door. A changing room with niches for clothes and wooden clogs, 'because the floor of the hot room would take the skin off a bare sole'; a hot room and a warm room; on a shelf by the warm room's door, a dish of burnt-horn tooth powder; the women rinse and spit in the drain", source: "ch-07:p38; ch-07:p55" }

  delphi-latrine:
    canonical_name: "the public latrine (Delphi)"
    aliases: []
    facts:
      - { fact: "beside the market: 'a long room with a marble bench round three walls, holes cut along it at a sociable distance over a channel of running water, and a sponge on a stick standing in a bucket at the entrance'. Men's ground", source: "ch-07:p36" }

  delphi-council-hall:
    canonical_name: "the council hall (Delphi)"
    aliases: []
    facts:
      - { fact: "'a long hall beside the square, with benches round the walls and a brazier going in the middle'; householders queue from the door to the clerk's table at the far end; the tribute registration, winter AD 70-71; a stone step at the door 'worn into a dip in the middle by everybody who had ever left that room'", source: "ch-07:p141; ch-07:p174" }
    note: "possibly the Ch.5 council house (the procession's start, organizations.delphi-council); the page does not say they are the same building"

  syracuse:
    canonical_name: "Syracuse"
    aliases: ["Syrakousai"]
    facts:
      - { fact: "AD 70, the cover: Mara's city ('From Syracuse'). Kallia: 'West, by water. Past Corinth, past everywhere'; 'They talk strange over there'; 'Half Syracuse is Roman'. Sosandros: 'Syrakousai' (his correction, and the record); 'Sicilian … They all talk like that over there'", source: "ch-07:p133; ch-07:p135; ch-07:p137; ch-07:p150; ch-07:p160; ch-07:p165; ch-07:p172" }
      - { fact: "1998 side: Mara knows it only 'from his slides' (Emilio's): 'a quarry deep enough to stand a church in, a fountain full of papyrus and ducks', and his account of a gelato that 'tasted of nothing but cold'. She has NOT been there; the draft's trip at fourteen was repaired before finalize (audit C-01; foundation §3 'never took her')", source: "ch-07:p140" }

  amphissa:
    canonical_name: "Amphissa"
    aliases: []
    facts:
      - { fact: "west of Delphi; the drover's accent is 'from somewhere west, Amphissa or beyond it' (Mara's guess)", source: "ch-07:p111" }
  patrae:
    canonical_name: "Patrae"
    era: "AD 70"
    aliases: []
    facts:
      - { fact: "mentioned only: Valens's guess at where Mara's 'big house' is ('Corinth, or Patrae')", source: "ch-06:p328" }

  philadelphia-in-asia:
    canonical_name: "Philadelphia (in the province of Asia)"
    era: "AD 70"
    aliases: []
    facts:
      - { fact: "mentioned only: 'There's a Philadelphia in Asia … Past Sardis. A man I knew came from there.' / 'Past Asia there's only Parthians.' (Valens). Mara: 'Farther' / 'Past them.'", source: "ch-06:p167; ch-06:p168; ch-06:p169; ch-06:p170" }

  boeotia:
    canonical_name: "Boeotia"
    era: "AD 70"
    aliases: []
    facts:
      - { fact: "pilgrims from Boeotia leave garlands in the Castalian spring ('Boeotians'); Kallia's Theban lodgers", source: "ch-05:p139; ch-05:p171" }
      - { fact: "Ch.6: 'The road over to Boeotia's under snow. All of it.' (Valens, assuming she means to cross the mountain: 'I am not going over.')", source: "ch-06:p149; ch-06:p150" }
      - { fact: "Ch.7: Kallia's four Thebans are 'on the Boeotian list', not Delphi's; 'they walked here from four days up the road' (the baker's wife)", source: "ch-07:p47; ch-07:p144" }

  jerusalem:
    canonical_name: "Jerusalem"
    era: "AD 70"
    aliases: ["Jerusalem of the Jews"]
    facts:
      - { fact: "taken by storm by Titus; its temple burned and the city thrown down; the war in Judaea ended (proclamation at Delphi, autumn AD 70). Mara: the temple burned in August and the upper city fell in September of 70", source: "ch-05:p97; ch-05:p108" }
      - { fact: "to the men at the Delphi fountain, the Jews are 'Over past Syria somewhere'", source: "ch-05:p123" }

  valens-yard:
    canonical_name: "Valens's mule yard"
    aliases: []
    facts:
      - { fact: "on the Kirrha–Delphi road; mules, horses, a tack shed", source: "outline:ch-11; foundation:§3" }

  kirrha:
    canonical_name: "Kirrha"
    aliases: ["the Kirrha road"]
    facts:
      - { fact: "port below Delphi; Valens bought Felix off a slaver here", source: "foundation:§3" }
      - { fact: "harbor where Plautia's brother's freedman found Valens (autumn AD 70)", source: "outline:ch-12; foundation:§3" }
      - { fact: "Ariston's autumn letter sat at the harbor all winter while the sea was closed; up the hill with the first carter of the year", source: "outline:ch-10" }
      - { fact: "source of the consultation goat; road where Celer's men attack (one dies, two run)", source: "outline:ch-11; outline:ch-12" }
      - { fact: "embarkation for the gulf crossing to Lechaion (autumn AD 71)", source: "outline:ch-16" }
      - { fact: "Ch.5: the press woman's husband has been 'Two days at Kirrha with the jars' (oil); Nero's five hundred bronzes went 'down to Kirrha in ox-carts and onto the ships'; the press woman's first word to Mara is 'Kirrha?'", source: "ch-05:p8; ch-05:p48" }
      - { fact: "Ch.6: 'The last ship went out of Kirrha eight days ago' (said the afternoon before the climb); before it, from the east, 'Oil. Wine from Crete. A man with dogs to sell.'; Valens was 'at Kirrha' at the time of the god's ox", source: "ch-06:p69; ch-06:p71; ch-06:p313" }
      - { fact: "Ch.7: oil at 'Thirty-two the jar at Kirrha' (the latrine men, who blame 'the Jews' war'); Kallia carried her second-best jar up from Kirrha on her head 'eleven summers ago'", source: "ch-07:p36; ch-07:p128" }

  corinth:
    canonical_name: "Corinth"
    aliases: []
    facts:
      - { fact: "Roman colony with games and an amphitheatre; no proconsul during Achaea's 'freedom' (late 67 to its revocation); a proconsul governs again from Corinth by 71 (in this book)", source: "foundation:§9; foundation:§3" }
      - { fact: "Plautia lives in her brother's house", source: "outline:ch-16" }
      - { fact: "provincial record office holds the archive copy of Valens's manumission; newly back under the restored proconsul, on whose staff Celer serves again", source: "outline:ch-16; outline:ch-17" }
      - { fact: "a colonnade where Celer meets Valens; scaffolding Celer won't walk under", source: "outline:ch-17" }
      - { fact: "autumn AD 70: 'Letters have come up from Corinth with the ship' to the Delphi council, bringing the news of Jerusalem (meta P5)", source: "ch-05:p95" }
      - { fact: "Ch.6: Valens's mules 'came from Corinth' (so, he says, they know only Latin); Valens guesses Mara ran from 'a big house. Corinth, or Patrae'", source: "ch-06:p200; ch-06:p328" }
      - { fact: "Ch.7: the spring's guess is that the council must finish its lists 'before Rome put a governor back in Corinth to ask for it', so there is no governor yet (agrees with the world rule; CH7-4 RESOLVED). Kallia, of Syracuse: 'West, by water. Past Corinth, past everywhere'", source: "ch-07:p129; ch-07:p135" }

  isthmia:
    canonical_name: "Isthmia (the Isthmian Games)"
    aliases: []
    facts:
      - { fact: "games in spring AD 72 empty the city of officials; athletes, pine-crowns, sausage sellers", source: "foundation:§9; outline:ch-17" }

  lechaion:
    canonical_name: "Lechaion"
    aliases: []
    facts:
      - { fact: "Corinth's harbor on the gulf; arrival from Kirrha (Ch.16)", source: "outline:ch-16" }
      - { fact: "wet quay: the ten-word wedding; a mule refuses the gangplank (spring AD 72)", source: "outline:ch-18" }

  puteoli:
    canonical_name: "Puteoli"
    aliases: []
    facts:
      - { fact: "harbor with moles; arrival spring AD 72; view of Misenum's fleet and the mountain", source: "outline:ch-19" }
      - { fact: "Fenn's upper room by the harbor: star charts, wax tablets, a dead Zippo, a potted basil", source: "outline:ch-25" }
      - { fact: "sulphur fields and steam vents nearby (texture)", source: "outline:ch-27" }

  vesuvius:
    canonical_name: "the mountain (Vesuvius)"
    aliases: ["the mountain of vines by the western sea", "a fine mountain for vines"]
    facts:
      - { fact: "green, vine-covered, a single broad summit (AD 72)", source: "outline:ch-19" }
      - { fact: "not mentioned or framed in Ch.34 (Surrentum)", source: "outline:ch-34" }
      - fact: "a thread of cloud on the summit at dawn 19 Aug 79 'that may only be cloud'"
        source: "outline:ch-38; foundation:§4 row 38"
        resolved_from_conflict: true
        resolved_date: "2026-10-18"
        resolution_note: "C5: foundation's 'smoking very faintly' portent removed (STATE:ARCH-14)"
      - { fact: "column rises ~1 p.m. 24 Aug 79, umbrella-pine shape", source: "outline:ch-39; foundation:§9" }

  pompeii:
    canonical_name: "Pompeii"
    aliases: []
    facts:
      - fact: "still rebuilding after the AD 62 earthquake: scaffolds, patched columns, trades in demand — 'a city ten years after the quake and still mending' at the AD 72 arrival"
        source: "foundation:§9; foundation:§5; foundation:§10; outline:ch-19"
        resolved_from_conflict: true
        resolved_date: "2026-10-18"
        resolution_note: "C8: 'seventeen' corrected to 'ten' in outline Ch.19 and foundation §5; Ch.20 and Ch.30 cite no count (STATE:ARCH-14)"
      - { fact: "tombs line the roads out of every gate; the Herculaneum Gate road (marble benches, grand altars) and the Stabian Gate's few tombs have no painted door; use modern gate names, never a 'Vesuvius Gate'", source: "outline:ch-19" }
      - { fact: "Via dell'Abbondanza: Grata's thermopolium; the family rents rooms behind and the shop front", source: "foundation:§3; outline:ch-19; outline:ch-20" }
      - { fact: "painted election notices; one painted over the old earthquake crack in Grata's wall", source: "outline:ch-20" }
      - { fact: "amphitheatre and gladiator barracks", source: "outline:ch-21; outline:ch-28" }
      - { fact: "a street fountain (the pebble)", source: "outline:ch-20" }
      - { fact: "Temple of Isis", source: "outline:ch-32" }
      - { fact: "mime show at a street stage (Ch.29)", source: "outline:ch-29" }
      - { fact: "Nuceria Gate and its necropolis", source: "outline:ch-19" }
      - { fact: "Vinalia Rustica 19 Aug: first new wine, garlands", source: "outline:ch-38; foundation:§9" }
      - { fact: "news of Vespasian's death in the streets since late June 79; the posted notice in early July", source: "foundation:§9; outline:ch-36" }
    distances:
      - { to: "puteoli", value: "coast road past villas, salt pans and the Sarno; two days with mules and baggage, a night at a roadside inn near Neapolis", source: "outline:ch-19" }

  nuceria-gate-tomb:
    canonical_name: "the tomb with the painted false door (outside the Nuceria Gate)"
    aliases: ["the door", "the tomb", "where the dead go out of the city"]
    facts:
      - { fact: "a small freedman's tomb with a painted false door, in the necropolis outside the Nuceria Gate; the door home; marked in the god's answer as 'the door painted on a dead man's house'", source: "STATE:ARCH-3; STATE:ARCH-4; outline:ch-13; outline:ch-19" }
      - { fact: "AD 62: breathed cold for part of the quake night (tavern story Fenn heard three days later)", source: "outline:ch-25; foundation:§3" }
      - { fact: "AD 71 and AD 73: shut through Fenn's three-night vigils", source: "outline:ch-25" }
      - { fact: "Ch.19: faintly cool on a warm spring afternoon — dormant", source: "outline:ch-19" }
      - { fact: "Ch.30 (after a tremor): the same faint coolness under sun-warmed plaster, no colder; Valens sees it", source: "outline:ch-30; foundation:§4f" }
      - { fact: "Ch.36: cooler than before", source: "outline:ch-36" }
      - { fact: "Ch.41: cold in the hot night; strangers shelter in neighboring tombs", source: "outline:ch-41" }
      - { fact: "Ch.42: opens before dawn 25 Aug 79 onto a sodium streetlamp, chain-link fence, cicada, distant scooter, diesel and pine (1998, or near it)", source: "outline:ch-42" }
      - { fact: "Ch.43: the seam closes", source: "outline:ch-43" }

  nuceria-road:
    canonical_name: "the Nuceria road (the road between the tombs)"
    aliases: []
    facts:
      - { fact: "the family walks out along it at first light, 25 Aug 79", source: "outline:ch-44" }

  nuceria:
    canonical_name: "Nuceria"
    aliases: []
    facts:
      - { fact: "Grata's sister lives here", source: "outline:ch-38" }

  sarno-river-port:
    canonical_name: "the Sarno river port / mouth"
    aliases: ["the Sarno mouth"]
    facts:
      - { fact: "hired boat with a painted eye; the backup plan (early Aug 79)", source: "outline:ch-37" }
      - { fact: "24 Aug: sea heaving, rafts of pumice, onshore wind; boat cannot come in", source: "outline:ch-40" }

  stabiae:
    canonical_name: "Stabiae"
    aliases: []
    facts:
      - { fact: "Felix tries for it with the boat (Ch.40)", source: "outline:ch-40" }

  neapolis:
    canonical_name: "Neapolis"
    aliases: []
    facts:
      - { fact: "a roadside inn near it: the night stop on the two-day coast road, Puteoli → Pompeii (Ch.19)", source: "outline:ch-19" }
      - { fact: "Valens's proposed escape destination ('tomorrow')", source: "outline:ch-37" }

  misenum:
    canonical_name: "Misenum"
    aliases: []
    facts:
      - { fact: "the fleet, seen from the deck at Puteoli (Ch.19)", source: "outline:ch-19" }
      - { fact: "Fenn lay with fever here during the AD 62 quake and missed the Pompeii opening", source: "outline:ch-25; foundation:§3" }

  rome:
    canonical_name: "Rome (AD 74)"
    aliases: []
    facts:
      - { fact: "Basilica Julia tribunals: the dowry suit (actio rei uxoriae), spring AD 74, before a single iudex with assessors among the benches of other courts; no jury", source: "outline:ch-22; STATE:ARCH-5" }
      - { fact: "the Forum Mara visited as a student in 1991, now whole", source: "outline:ch-22" }
      - { fact: "Flavian Amphitheatre rising in scaffolding; the smell of the Tiber", source: "outline:ch-22" }
      - { fact: "AD 70 (Ch.4), from Phocis: the goat-boy knows there is a Kaisar 'En Rómi' ('Késar'); he does not name him", source: "ch-04:p63; ch-04:p64; ch-04:p66" }
      - { fact: "AD 70 (Ch.5), the Delphi guide's version: the singer died 'in a ditch outside Rome with his own knife in his neck', and the god's bronzes stand 'on somebody's doorstep over there'. Mara's correction: a freedman's villa, June 68", source: "ch-05:p50; ch-05:p51" }

  appian-way-inn:
    canonical_name: "the inn on the Appian Way near Tarracina"
    aliases: []
    facts:
      - { fact: "flea-bitten roadside inn; bad supper; landlady; rain on the roof tiles; rough blanket", source: "outline:ch-23" }

  cumae:
    canonical_name: "Cumae (the Sibyl's cave)"
    aliases: []
    facts:
      - { fact: "long trapezoidal gallery, cut light; contains a dead door", source: "outline:ch-27" }
      - { fact: "approach via the Phlegraean fields and Lake Avernus", source: "outline:ch-27" }

  surrentum:
    canonical_name: "Surrentum"
    aliases: []
    facts:
      - { fact: "across the bay by boat; cliffs; a fish lunch; green water; an inn (summer AD 78)", source: "outline:ch-34" }

  emesa:
    canonical_name: "Emesa (Syria)"
    aliases: []
    facts:
