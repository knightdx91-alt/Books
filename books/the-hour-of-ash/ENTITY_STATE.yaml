    knowledge:
      - { fact: "Pompeii is destroyed by Vesuvius in AD 79 (1998 education; 1988 plaster-cast exhibition as a graduate student)", learned_chapter: 0, method: "prior_knowledge", first_in_scene: 14, source: "outline:ch-14" }
      - { fact: "Pliny's account: column ~1 p.m. like an umbrella pine; ~18 hours of pumice; roofs collapse; boats cannot land; surges reach Pompeii ~6:30-7:30 a.m. on the 25th; date 24 August", learned_chapter: 0, method: "prior_knowledge", first_in_scene: 36, note: "date stated in present thought Ch.36; hours told to Valens Ch.37", source: "outline:ch-36; outline:ch-37; foundation:§9" }
      - { fact: "the chart (and the cigar box with the notebook) came from Margaret Fenn's estate sale in Chestnut Hill last October (1997): an old lady, no children, a house full of boxes; her brother, a 'treasure hunter', went to Greece in sixty-eight and did not come back; the sister kept his things; the brother wrote on the chart", learned_chapter: 1, method: "told_by:irene-szabo", note: "Szabo does not say the brother's name", source: "ch-01:p96; ch-01:p98; ch-01:p100; ch-01:p102" }
      - { fact: "the notebook's owner: 'A. J. FENN' on the oilcloth cover, in the same square capitals as the ballpoint on the chart", learned_chapter: 1, method: "discovered", note: "she closes the lid without reading it; notebook unread at chapter end", source: "ch-01:p111; ch-01:p112" }
      - { fact: "the chart is a Venetian survey from Morosini's war (1687-88), coast sounded by the navy; Szabo bought it because 'the coast is right' and it says Castri, not Delfi; the Fenn lot also held Navy uniforms, forty years of National Geographic and a glassless diving helmet", learned_chapter: 1, method: "told_by:irene-szabo", source: "ch-01:p86; ch-01:p88; ch-01:p117" }
      - { fact: "Szabo's reading of the ink: the brother was hunting 'a library' (the one people dig for, Alexandria)", learned_chapter: 1, method: "told_by:irene-szabo", note: "Szabo's opinion; Mara notes the question mark after BIBLIOTHECA 'did not look sure'", source: "ch-01:p106; ch-01:p108; ch-01:p109" }
      - fact: "Halloran (ringing from Naples): the permesso for the Campanian survey season is still in Emilio's name; the Soprintendenza want a name on it by the twentieth of April or the season lapses (then 'one begins again from nothing'); asks whether the family will send anyone; 'It needn't be an archaeologist, strictly, for the paperwork'"
        learned_chapter: 1
        method: "told_by:halloran"
        note: "recorded message on the incoming tape; she wrote nothing down and erased it (p194). Deadline vs character-bible sample line: meta.contradictions CH1-1"
        source: "ch-01:p192; ch-01:p194"
      - { fact: "a friend in Nicosia (unnamed) has found Emilio's 1992 Kourion drawings, the whole box, under his bed, and has not heard of the death", learned_chapter: 1, method: "told_by:nicosia-caller", note: "message; she infers he has not heard", source: "ch-01:p188; ch-01:p189" }
      - { fact: "Pat next door has Emilio's blue Tupperware; Emilio shoveled her walk; the Free Library (Walnut Street West) wants Wild Horses back; the department office booked the upper gallery, Saturday the fourteenth, two o'clock; an unnamed woman breathed 'Oh, Emilio' and hung up", learned_chapter: 1, method: "told_by:pat", note: "all on the incoming tape (method covers Pat's message; the others are told_by their callers)", source: "ch-01:p184; ch-01:p186; ch-01:p190; ch-01:p191" }
      - { fact: "Tía Nilda (78) phoned the house on Thursday to tell Emilio the memorial time, got his greeting, and had to lie down; the incoming tape is full", learned_chapter: 1, method: "told_by:gloria", source: "ch-01:p176" }
      - { fact: "Emilio used to talk about rebuilding the porch every season's last week (drawn on the back of a context sheet) and talked about Mara on site 'all the time'", learned_chapter: 1, method: "told_by:doug-fessler", source: "ch-01:p27" }
      - { fact: "the dean plans a lecture fund in Emilio's name, every spring", learned_chapter: 1, method: "told_by:dean", source: "ch-01:p13" }
      - { fact: "neighbors have been in the house and stocked the refrigerator (Dorothy's Pyrex: RETURN DISH); someone has a key she did not know about", learned_chapter: 1, method: "inferred", source: "ch-01:p181" }
      - { fact: "Szabo read a Reyes professor's obituary in the Inquirer in January and asked; Mara deflected ('It's a common name')", learned_chapter: 1, method: "witnessed", source: "ch-01:p139; ch-01:p140; ch-01:p141" }
      - { fact: "Halloran invites her to Campania for July in Emilio's place", learned_chapter: 2, method: "told_by:halloran", source: "outline:ch-02" }
      - { fact: "Fenn's theory: Ptolemaic scrolls carried to 'the cave of the nymphs on Parnassus'; his coordinates", learned_chapter: 2, method: "discovered", source: "outline:ch-02" }
      - { fact: "Fenn (1968) put his hand in at the back of the cave and felt cold air", learned_chapter: 2, method: "discovered", source: "outline:ch-02" }
      - { fact: "Fenn's sister was Margaret (he wrote she could stop telling people he was in Mexico)", learned_chapter: 2, method: "discovered", source: "outline:ch-02" }
      - { fact: "the notebook came home without Fenn: the US consulate in Athens forwarded his personal effects to next of kin in 1968 (effects slip folded inside the back cover)", learned_chapter: 2, method: "discovered", revised: "2026-10-18", source: "outline:ch-02; foundation:§3" }
      - { fact: "the cave door is real (she crossed)", learned_chapter: 3, method: "witnessed", source: "outline:ch-03" }
      - { fact: "the year is AD 70; Vespasian reigns (herald: Titus has taken Jerusalem)", learned_chapter: 5, method: "inferred", note: "overheard the herald; did the history herself; no thought of 79 yet", source: "outline:ch-05" }
      - { fact: "the Corycian door she came by is shut", learned_chapter: 6, method: "discovered", note: "confirmed again Ch.8", source: "outline:ch-06; outline:ch-08" }
      - { fact: "consulting the Oracle needs the pelanos fee, a goat, a Delphian sponsor and a man to ask; women do not go in", learned_chapter: 9, method: "discovered", source: "outline:ch-09" }
      - { fact: "a runaway Thracian, scarred, 'answering to Lupus', is claimed as property of the household of Q. Arrius Celer (reward notice from Corinth)", learned_chapter: 9, method: "discovered", source: "outline:ch-09" }
      - { fact: "Valens is the man on the notice (she watches him read it and walk away)", learned_chapter: 9, method: "inferred", source: "outline:ch-09" }
      - { fact: "Ariston is alive, married in Emesa, a child coming, not coming home", learned_chapter: 10, method: "discovered", note: "she reads the letter aloud", source: "outline:ch-10" }
      - { fact: "Valens reads but pretends he can't; he bought Felix off a slaver and freed him with no paperwork", learned_chapter: 11, method: "discovered", source: "outline:ch-11" }
      - { fact: "Valens's history: the rudis, Nero's games at Corinth, Plautia, Celer's dowry frame; Celer wants him dead (the dowry suit)", learned_chapter: 12, method: "told_by:valens", source: "outline:ch-12" }
      - { fact: "how Valens knows about the suit: last autumn (AD 70) Plautia's brother's freedman found him at Kirrha harbor and asked him to testify; he refused; the reward notice went up within the month — so Celer wants a dead witness", learned_chapter: 12, method: "told_by:valens", revised: "2026-10-18", source: "outline:ch-12; foundation:§3; STATE:ARCH-15" }
      - { fact: "the Oracle's public answer: 'the road home lies under the mountain of vines by the western sea, where the dead go out of the city, at the door painted on a dead man's house' (two markers: the necropolis + a painted door on a tomb)", learned_chapter: 13, method: "told_by:valens", note: "his word-for-word repetition at Kallia's lodging; rendered once", revised: "2026-10-18", source: "outline:ch-13; STATE:ARCH-4" }
      - { fact: "the door home is at POMPEII", learned_chapter: 13, method: "told_by:theano", note: "in person, off duty, at Theano's house (sent for by a temple slave); a widow talking to a woman, not an oracular response", revised: "2026-10-18", source: "outline:ch-13; STATE:ARCH-4 (revised)" }
      - { fact: "the WHEN is withheld: 'not hers to give, or not given'", learned_chapter: 13, method: "told_by:theano", source: "outline:ch-13" }
      - { fact: "Plautia was never Valens's lover", learned_chapter: 16, method: "inferred", note: "from watching, not asking", source: "outline:ch-16" }
      - { fact: "Celer kept Plautia's son Marcus; the archive copy of Valens's manumission is in the provincial record office under Celer's influence", learned_chapter: 16, method: "told_by:plautia", source: "outline:ch-16" }
      - { fact: "the door is a small freedman's tomb with a painted false door outside the Nuceria Gate; faintly cool on a warm spring afternoon; dormant", learned_chapter: 19, method: "discovered", note: "found after a short search: Herculaneum Gate road and Stabian Gate tombs on her first free afternoon, the Nuceria Gate the next afternoon; the god's 'door painted on a dead man's house' lets her know it at once", revised: "2026-10-18", source: "outline:ch-19; foundation:§11.3" }
      - { fact: "Valens is summoned to testify in Rome in spring (dowry suit)", learned_chapter: 21, method: "told_by:plautias-brothers-freedman", note: "the brother's summons, brought by the freedman to Grata's counter by name; the address came via Plautia (Valens sent word summer AD 72)", revised: "2026-10-18", source: "outline:ch-21" }
      - { fact: "a Chaldean in Puteoli 'talks gibberish to himself'", learned_chapter: 24, method: "told_by:gratas-husband", source: "outline:ch-24" }
      - { fact: "Augurinus is August Fenn, alive, marooned since AD 41", learned_chapter: 25, method: "discovered", source: "outline:ch-25" }
      - { fact: "Fenn's history: 1968 crossing, landed AD 41, thirty-four years; doors 'breathe with the earth'; the 62 quake opened Pompeii's door for part of one night; he was down with fever in Misenum and three days later heard a tavern story about a tomb whose painted door 'breathed cold' — which is how he found the door, already shut", learned_chapter: 25, method: "told_by:august-fenn", revised: "2026-10-18", source: "outline:ch-25; foundation:§3" }
      - { fact: "the law in Fenn's words: the doors are one door with many mouths, so 'it' takes back the one it brought — the cave brought her, so Pompeii's mouth will take her", learned_chapter: 25, method: "told_by:august-fenn", note: "a promise; allowlisted phrase use 1/3; 'one door with many mouths' worded once", revised: "2026-10-18", source: "outline:ch-25; foundation:§4d; STATE:ARCH-16" }
      - { fact: "an opening is brief: hours at most, never days", learned_chapter: 25, method: "told_by:august-fenn", revised: "2026-10-18", source: "outline:ch-25; foundation:§9" }
      - { fact: "whether the door would take others is UNKNOWN (Fenn has always been alone)", learned_chapter: 25, method: "told_by:august-fenn", source: "outline:ch-25" }
      - { fact: "the WHEN: late summer, AD 79 (be at the tomb the night after the mountain opens)", learned_chapter: 25, method: "told_by:august-fenn", note: "she rejects it (Ch.25-35); accepted Ch.36", revised: "2026-10-18", source: "outline:ch-25" }
      - { fact: "Fenn's first two dates for the door's reopening (71, then 73) came from the tremor rhythm alone and failed: three nights at the tomb each time; after 73 he rebuilt the tables around 79, which he knows from school is Pompeii's year", learned_chapter: 25, method: "told_by:august-fenn", note: "her fig leaf: wrong twice, and the third date built around the history-book year", revised: "2026-10-18", source: "outline:ch-25; foundation:§3; STATE:ARCH-16" }
      - { fact: "in the autumn of 73 she was living a mile from where Fenn sat at the tomb", learned_chapter: 25, method: "inferred", note: "FLEX", revised: "2026-10-18", source: "outline:ch-25" }
      - { fact: "Fenn understood from 'estate sale in Chestnut Hill' that his sister is dead; he did not ask whose sale; he refuses the notebook ('Keep it. I know what's in it.')", learned_chapter: 25, method: "witnessed", note: "she does not say the name, then or ever, to him", revised: "2026-10-18", source: "outline:ch-25; STATE:ARCH-17" }
      - { fact: "Fenn left his sister a note on the hall table (unnamed in the letter)", learned_chapter: 26, method: "told_by:august-fenn", note: "letter", source: "outline:ch-26" }
      - { fact: "doors can die (the Cumae door is dead)", learned_chapter: 27, method: "witnessed", source: "outline:ch-27" }
      - { fact: "Fenn left his coat at the cave mouth in 1968", learned_chapter: 27, method: "told_by:august-fenn", source: "outline:ch-27" }
      - { fact: "Felix has sworn himself to the gladiator school as auctoratus", learned_chapter: 28, method: "told_by:valens", note: "news waiting on return from Cumae (Ch.27 end)", source: "outline:ch-27; outline:ch-28" }
      - { fact: "the tremor did not open the door (the same faint coolness as the day she found it, under sun-warmed plaster; no colder)", learned_chapter: 30, method: "discovered", revised: "2026-10-18", source: "outline:ch-30" }
      - { fact: "Valens followed her to the tomb and saw her hand on the painted door; he asked nothing", learned_chapter: 30, method: "witnessed", revised: "2026-10-18", source: "outline:ch-30" }
      - { fact: "Fenn still does not know whether the door would take others; has never seen anyone try; would like to see it", learned_chapter: 33, method: "told_by:august-fenn", note: "in Greek, with Valens present; she steers away from the date", revised: "2026-10-18", source: "outline:ch-33" }
      - { fact: "Fenn's sister's name is spoken by him for the first time (after reading his own 1968 front pages)", learned_chapter: 35, method: "witnessed", revised: "2026-10-18", source: "outline:ch-35" }
      - { fact: "Vespasian died 23 June 79; Titus is emperor", learned_chapter: 36, method: "discovered", note: "news in the streets since late June; the early-July posted notice is what makes her sit down", revised: "2026-10-18", source: "outline:ch-36" }
      - { fact: "Fenn's tables and her tremor notes (kept independently since 72 in the back pages of his notebook) agree: the door opens in the night after the mountain opens", learned_chapter: 36, method: "discovered", note: "she copies his key figures into the notebook beside hers", revised: "2026-10-18", source: "outline:ch-36" }
      - { fact: "the plan, locked: stay for the door; the daylight hours after the mountain opens go to the boat (all by sea if it can, the door let go); if the sea refuses, the door at night", learned_chapter: 37, method: "told_by:valens", note: "Valens's one condition; agreed between them", revised: "2026-10-18", source: "outline:ch-37; STATE:ARCH-18" }
      - { fact: "the backup boat cannot land", learned_chapter: 40, method: "witnessed", source: "outline:ch-40" }
      - { fact: "the door opens before dawn 25 Aug; it takes her; Valens, Lucius and Aelia meet plaster (no one native to its side)", learned_chapter: 42, method: "witnessed", source: "outline:ch-42" }
    arc_waypoints:
      - { chapter: 1, waypoint: "leaves her father's memorial to look at antiques (the failure); buys the chart; plays his greeting three times, ejects the tape rather than re-record it; winds and wears his watch", source: "ch-01:p1; ch-01:p132; ch-01:p197; ch-01:p200; ch-01:p202; ch-01:p204; ch-01:p207" }
      - { chapter: 3, waypoint: "crosses (1998 → AD 70)", source: "outline:ch-03" }
