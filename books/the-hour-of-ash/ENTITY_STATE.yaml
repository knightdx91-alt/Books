    ch5_mention: { value: "named again in the herald's decree: 'the archon Kleodamos, and the council and the people of the Delphians, have resolved…' (oxen to Pythian Apollo on the fourth day). Still a name only. The page does not say whether Mara links it to the goat-boy's answer", source: "ch-05:p99" }
