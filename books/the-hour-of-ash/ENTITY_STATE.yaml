      - { fact: "the cave's coordinates, 38° 31′ N, 22° 32′ E, taken from 'the Army map down at the Free Library', which 'puts the cave up the mountain from' Castri; the Venetian chart has Castri 'right where it ought to be' ('those Venetians knew their business')", learned_chapter: 0, method: "discovered", note: "Thanksgiving 1967 entry; he wrote the figures on the chart in ballpoint 'so I'd have it', with 'a little picture of the cave mouth beside it'. Was 'read from the Venetian chart' (inferred) before polish cycle 1 gave him a source", revised: "2026-10-18 (re-sync)", source: "ch-02:p2" }
      - { fact: "the cave holds no visible books ('a big wet barn of a place' with names scratched on the walls, many French)", learned_chapter: 0, method: "witnessed", note: "April 1968", source: "ch-02:p17" }
      - { fact: "the doors 'breathe with the earth'; doors don't deliver to matching dates (1968 → AD 41); an opening lasts hours at most, never days", learned_chapter: 0, method: "inferred", note: "34 years of tracking", revised: "2026-10-18", source: "foundation:§3; foundation:§9; outline:ch-25" }
      - { fact: "the doors are one door with many mouths: 'it' takes back the one it brought", learned_chapter: 0, method: "inferred", note: "his belief; it states the canonical law (anyone the doors brought, no one native) though he does not know the native half", revised: "2026-10-18", source: "foundation:§4d; foundation:§9; STATE:ARCH-16" }
      - { fact: "Vesuvius destroys Pompeii in AD 79", learned_chapter: 0, method: "prior_knowledge", note: "from school; says so plainly to Mara in Ch.25", revised: "2026-10-18", source: "outline:ch-25; foundation:§3; STATE:ARCH-16" }
      - { fact: "a Pompeian tomb's painted door 'breathed cold' the night of the AD 62 quake (the opening lasted part of one night)", learned_chapter: 0, method: "overheard", note: "a tavern story heard three days later; he had been down with fever in Misenum; pre-story, AD 62", revised: "2026-10-18", source: "outline:ch-25; foundation:§3" }
      - { fact: "the Pompeii door: the painted false door of a freedman's tomb outside the Nuceria Gate, dormant", learned_chapter: 0, method: "discovered", note: "found by following the tavern story, already shut; has waited for it since 62", revised: "2026-10-18", source: "outline:ch-25; foundation:§3" }
      - { fact: "his first two dates for the reopening (AD 71, then 73), worked from the tremor rhythm alone, were wrong: three nights at the tomb each time, and it stayed shut", learned_chapter: 0, method: "witnessed", note: "pre-Ch.25; the 73 vigil was in autumn (FLEX)", revised: "2026-10-18", source: "outline:ch-25; foundation:§3; STATE:ARCH-16" }
      - { fact: "the Pompeii door's next opening: late summer AD 79, in the night after the mountain opens", learned_chapter: 0, method: "inferred", note: "after 73 he rebuilt the tables around the year he knew from school; his tremor figures now fit", revised: "2026-10-18", source: "outline:ch-25; foundation:§3" }
