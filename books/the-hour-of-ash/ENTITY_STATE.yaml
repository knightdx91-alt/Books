    knowledge:
      - { fact: "Celer framed him to retain part of Plautia's dowry; he was never her lover", learned_chapter: 0, method: "prior_knowledge", source: "foundation:§3" }
      - { fact: "Plautia's brother is suing Celer for the dowry and wants him as witness; he refused; the reward notice followed within the month, so Celer wants a dead witness", learned_chapter: 0, method: "told_by:plautias-brothers-freedman", note: "autumn AD 70 at Kirrha harbor, before his first appearance (Ch.6); the conclusion about Celer is his own inference; told to Mara Ch.12", revised: "2026-10-18", source: "outline:ch-12; foundation:§3; STATE:ARCH-15" }
      - { fact: "the charcoal men's story 'this autumn': a goat boy up on the mountain saw a nymph walk out of Pan's cave in trousers and eat his cheese", learned_chapter: 0, method: "overheard", note: "heard 'this autumn' (AD 70), before Ch.6 (pre-revision text: 'at the vintage'); the teller is 'the charcoal men', not named", source: "ch-06:p86" }
      - { fact: "the sea is shut: the last ship left Kirrha eight days before; before it, oil, Cretan wine and a man with dogs came in from the east", learned_chapter: 0, method: "prior_knowledge", note: "he tells Kallia; how he knows is not stated (he 'was at Kirrha' at the time of the god's ox, some days after Mara's arrival)", source: "ch-06:p69; ch-06:p71; ch-06:p313" }
      - { fact: "she means to go up to the Korykian cave, 'Where I came in' ('From in there. Not over anything.'), and wants to go 'Tomorrow', alone if need be", learned_chapter: 6, method: "told_by:mara-reyes", note: "in Greek, in the lane at dusk. He hears it as having walked over the mountain ('So you walked over the mountain. In the autumn. Alone.'). Not the door: the plan's first telling is Ch.15", source: "ch-06:p82; ch-06:p84; ch-06:p90; ch-06:p91; ch-06:p93; ch-06:p101" }
      - { fact: "she is the nymph of the goat boy's story ('He gave me the cheese.' / 'He spat out mine.')", learned_chapter: 6, method: "told_by:mara-reyes", source: "ch-06:p87; ch-06:p89" }
      - { fact: "her hands 'never carried a jar till this month'; she talks 'a schoolmaster's Greek'; she has Latin (she laughed at his Latin to the gray); she has a brass coin with the head of an old man with a beard, 'A poet. From farther away than you would believe', that 'buys nothing'", learned_chapter: 6, method: "witnessed", note: "his own reading; she confirms the hands ('No.')", source: "ch-06:p45; ch-06:p107; ch-06:p109; ch-06:p110; ch-06:p112; ch-06:p113; ch-06:p114" }
      - { fact: "her claims: no one is coming after her; 'In Delphi not one person knows my name. Kallia has not asked it.'; 'I have no husband.'; the watch 'was my father's' and 'He does not need it.'", learned_chapter: 6, method: "told_by:mara-reyes", note: "he does not believe the first ('Somebody for you'; 'You told me.')", source: "ch-06:p115; ch-06:p117; ch-06:p120; ch-06:p122; ch-06:p187; ch-06:p189" }
      - { fact: "how the watch works and is kept: it tells the hours with no shadow, sun or water and goes in the dark; it must be wound every morning, forward 'Until it will not go any more. Never past that'; it goes 'A day and a night. A little more'; if forgotten it stops and goes again when wound; inside, a thin strip rolled on itself and a little rocking wheel that lets it open one tooth at a time and turns the hands; dirt, cold, being dropped or the spring running down stop the wheel; men in a far country make thousands, 'For sale. Anyone can buy one.'", learned_chapter: 6, method: "told_by:mara-reyes", note: "she corrects his backward winding; he winds it forward himself to full. Setting the hands is NOT shown to him on the page", source: "ch-06:p125; ch-06:p128; ch-06:p130; ch-06:p134; ch-06:p136; ch-06:p139; ch-06:p141; ch-06:p208; ch-06:p210; ch-06:p213; ch-06:p215; ch-06:p217" }
      - { fact: "the word 'Philadelphia', caught out of her English talk on the cliff; she says it is farther than Asia, past the Parthians", learned_chapter: 6, method: "overheard", note: "he 'could not understand one word' of the rest (Mara's statement), including 'My name is Mara Reyes' at the start of the same speech", source: "ch-06:p163; ch-06:p164; ch-06:p165; ch-06:p168; ch-06:p170" }
      - { fact: "she reads the cut letters at the cave without spelling them out ('To the Nymphs. To Pan.')", learned_chapter: 6, method: "witnessed", source: "ch-06:p223; ch-06:p328" }
      - { fact: "she was waiting for something to open ('Until it opens'), digging for 'Cold … A wind, out of the rock', and meeting no one ('It was not a who')", learned_chapter: 6, method: "told_by:mara-reyes", note: "he answers 'It's cold all over this mountain' / 'Wind all over it' and draws no conclusion on the page", source: "ch-06:p231; ch-06:p278; ch-06:p279; ch-06:p281; ch-06:p285" }
      - { fact: "she filled the widow's jar twice in the dark before leaving", learned_chapter: 6, method: "overheard", note: "from the turn of the lane: 'I heard you at the spring, twice, in the dark'", source: "ch-06:p270" }
      - { fact: "she sleeps 'Under Kallia's stairs. With her jars.', dry; the widow does not hit her and feeds her lentils", learned_chapter: 6, method: "told_by:mara-reyes", source: "ch-06:p288; ch-06:p290; ch-06:p292; ch-06:p294" }
      - { fact: "BELIEF (Ch.6): she is a runaway from 'a big house. Corinth, or Patrae'; she came down off the top in the autumn alone, 'in trousers, so the road wouldn't take you for a woman'; her hands never worked; she reads; she has Latin; she had 'a thing on your wrist no smith in Achaea could make'; she won't give a name, hers or her people's; 'Somebody there wants you back, a father or a husband', with 'the money to look'; and 'there's one man in Delphi who'd take a mule up Parnassus in the snow'", learned_chapter: 6, method: "inferred", note: "the planned mind-reading. Mara: 'Most of it was true, and the whole of it was wrong.' He refuses her true story ('Don't.'). Before that, in the cave, he took her for someone digging up hidden silver", source: "ch-06:p264; ch-06:p266; ch-06:p328; ch-06:p329; ch-06:p331" }
      # --- Ch.7 (prose) ---
      - { fact: "Mara has been taught to walk like a Delphian woman, and has stopped talking (in public)", learned_chapter: 7, method: "witnessed", note: "'She's taught you to walk.' / 'You've stopped talking.' The page does not say whether he has also heard the spring call her simple; her silence at the gate is enough for 'You've stopped talking', so there is no knowledge gap", source: "ch-07:p102; ch-07:p104" }
      - { fact: "Kallia calls her 'simple'; he knows otherwise ('No.')", learned_chapter: 7, method: "told_by:kallia", note: "his 'No.' rests on Ch.6: her Greek, her Latin, the letters read at the cave (ch-06:p223; ch-06:p328)", source: "ch-07:p105; ch-07:p106" }
      - { fact: "Kallia will pay the fifth coin only when the oak has 'done a month without spitting'", learned_chapter: 7, method: "told_by:kallia", source: "ch-07:p100" }
      - { fact: "a reward notice with his description is posted in Delphi", learned_chapter: 9, method: "discovered", note: "see meta.post_patch_flags P5 (timing vs 'within the month' of autumn 70)", revised: "2026-10-18", source: "outline:ch-09" }
      - { fact: "the Oracle's public answer, word for word, including the second marker 'at the door painted on a dead man's house'", learned_chapter: 13, method: "witnessed", note: "heard inside the temple; repeats it exactly at Kallia's lodging", revised: "2026-10-18", source: "outline:ch-13" }
      - { fact: "Mara says she comes from nineteen centuries ahead", learned_chapter: 15, method: "told_by:mara-reyes", note: "disbelieves; thinks her harmlessly mad; does not care", source: "outline:ch-15" }
      - { fact: "Mara says a door in the Corycian cave brought her, and that the old woman told her the door home is in Pompeii (why she must reach Italy)", learned_chapter: 15, method: "told_by:mara-reyes", note: "accepts Pompeii as a place; NOT told the city's fate (that waits for Ch.37)", revised: "2026-10-18", source: "outline:ch-15" }
      - { fact: "the bargain: his papers from Corinth in autumn; sail for Italy in spring as man and wife", learned_chapter: 15, method: "told_by:mara-reyes", source: "outline:ch-15" }
      - { fact: "Mara's origin is TRUE, and a door leads to her time", learned_chapter: 25, method: "overheard", note: "hears Mara and Fenn speak fluent English; belief shown on his face, never declared; follows no English, so learns neither the date nor the door's rules here", revised: "2026-10-18", source: "outline:ch-25; outline:ch-15 (beat subversion)" }
      - { fact: "Felix is sworn to the gladiator school (auctoratus, cannot be bought out before his first fight)", learned_chapter: 28, method: "discovered", source: "outline:ch-28" }
      - { fact: "where the door is: the painted false door of the tomb outside the Nuceria Gate", learned_chapter: 30, method: "witnessed", note: "followed Mara after the tremor; asks nothing", revised: "2026-10-18", source: "outline:ch-30; outline:ch-37" }
      - { fact: "Mara wants to take the children through the door into her century", learned_chapter: 33, method: "told_by:mara-reyes", source: "outline:ch-33" }
      - { fact: "the door might not take him or the children; Fenn does not know and has never seen anyone try", learned_chapter: 33, method: "witnessed", note: "the conversation is held in Greek in front of him; nobody names the date", revised: "2026-10-18", source: "outline:ch-33; outline:ch-37" }
      - { fact: "NEW in Ch.37 only: what the mountain will do, the day, the hours of falling stone, and that the door's night is the eruption's night", learned_chapter: 37, method: "told_by:mara-reyes", note: "everything else about the door he already has (Ch.15, 25, 30, 33)", revised: "2026-10-18", source: "outline:ch-37" }
      - { fact: "the door does not take him or the children", learned_chapter: 42, method: "witnessed", source: "outline:ch-42" }
    knowledge_absent_ch6: ["her name ('You have not asked my name either.' / 'No.'). 'My name is Mara Reyes' was said in English in his hearing and is not shown to register (ch-06:p164; ch-06:p334; ch-06:p335)", "where she came from: he stops her ('Don't.'); 1998, the door and the crossing are not told", "that the crack is what she was testing (he takes 'cold … A wind' as nothing: 'It's cold all over this mountain', ch-06:p279)", "how to SET the watch's hands: only winding is shown to him (the plan's Ch.18 'set near noon by the shadow' needs him to learn it off the page)"]
