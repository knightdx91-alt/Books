# =====================================================================
# WORLD RULES
# =====================================================================
world_rules:
  - { rule: "THE LAW OF THE DOORS: a door takes back anyone who came through a door, from any time, through any mouth, but no one native to its side. Fenn's phrase 'it takes back the one it brought' states this exactly because his 'it' is ALL the doors as one ('one door with many mouths'): the cave brought Mara, so Pompeii's mouth takes her.", revised: "2026-10-18", source: "foundation:§9; foundation:§4d; foundation:§1; outline:ch-25; STATE:ARCH-16" }
  - { rule: "Fenn does not know the native exclusion (always alone); Mara discovers it at the door in Ch.42, never stated as a rule.", source: "foundation:§9; outline:ch-42" }
  - { rule: "WHAT CANNOT PASS: Valens, Lucius and Aelia (all native to the AD side — children born in the past count as native) meet painted plaster.", source: "outline:ch-42" }
  - { rule: "WHAT CAN PASS: the traveler, and the objects she puts through — microcassette, film canister, Fenn's notebook (his key figures and her tremor notes in its back pages), his Zippo and 1964 dime go to the other side in Ch.43 (all made on the modern side). Whether objects made on the ancient side can pass is not established.", revised: "2026-10-18", source: "outline:ch-43; foundation:§4c" }
  - { rule: "A door is felt as a seam of cool air and an absence of sound; no voices, glow or special effects.", source: "foundation:§9; outline:ch-03" }
  - { rule: "OPENING RHYTHM: doors open on their own timing; Fenn's empirical rule is that they 'breathe with the earth'.", source: "foundation:§9; outline:ch-25" }
  - { rule: "OPENING DURATION: an opening lasts hours, never days. AD 62 = part of one night (the quake night); AD 79 = from the night after the mountain opens until before first light on the 25th.", revised: "2026-10-18", source: "foundation:§9; outline:ch-25; audit WARN-016" }
  - { rule: "Tremors alone did not predict the Pompeii door: Fenn's tremor-only dates (71, 73) failed; his 79 date is the tremor tables rebuilt around the known eruption year.", revised: "2026-10-18", source: "outline:ch-25; foundation:§3" }
  - { rule: "The Pompeii door's next opening is late summer AD 79 (Fenn); the arithmetic (Fenn's tables + Mara's independent tremor notes) puts it in the night after the mountain opens; it opens before dawn 25 Aug 79.", source: "outline:ch-25; outline:ch-36; outline:ch-42" }
  - { rule: "An ordinary tremor (AD 77) does not open the door.", source: "outline:ch-30" }
  - { rule: "Dormant/waking door temperature: faintly cool (Ch.19) → the same faint coolness, no colder, after the tremor (Ch.30) → cooler (Ch.36) → cold (Ch.41) → open (Ch.42).", revised: "2026-10-18", source: "outline:ch-19; outline:ch-30; outline:ch-36; outline:ch-41; outline:ch-42; foundation:§4f; audit N-24" }
  - { rule: "Doors do not deliver to matching dates: 1968 → AD 41 (Fenn); May 1998 → autumn AD 70 (Mara). So the far side in Ch.42 is '1998, or near it' only; the narration never asserts the year (Ch.43 says 'the other side' / 'her own century').", revised: "2026-10-18", source: "foundation:§9; outline:ch-03; outline:ch-42; outline:ch-43" }
  - { rule: "A door used for a crossing can stay shut afterwards (the Corycian door, Ch.6 and Ch.8).", source: "outline:ch-06; outline:ch-08" }
  - { rule: "Doors can die (the Cumae door).", source: "outline:ch-27" }
  - { rule: "Each opening is brief: the door's seam closes (Ch.43).", source: "outline:ch-43" }
  - { rule: "The mechanism is never explained (Outlander standard).", source: "foundation:§9" }
  - { rule: "Women did not enter to consult the Oracle; they asked through a male representative. The Pythia speaking to a woman privately, off duty, is not an oracular response (Ch.13).", revised: "2026-10-18", source: "foundation:§9; foundation:§11.4; STATE:ARCH-4 (revised)" }
  - { rule: "Oracle consulted on fixed (monthly) days in the warm months; year's first consultation on the seventh of Bysios; the goat must shiver at a sprinkling of cold water.", revised: "2026-10-18", source: "foundation:§9; foundation:§3" }
  - { rule: "A foreign woman with no guardian is legally nobody; she must be registered as someone's.", source: "foundation:§3; outline:ch-07" }
  - { rule: "Roman marriage needs no priest: consent before witnesses.", source: "outline:ch-18" }
  - { rule: "A husband who divorces an adulterous wife may retain part of her dowry; recovery via the actio rei uxoriae, heard by a single iudex (no jury); the father keeps the children after divorce, and custody/access is not a remedy in a dowry suit.", revised: "2026-10-18", source: "foundation:§3; foundation:§9; outline:ch-22" }
  - { rule: "An auctoratus (free man sworn to a gladiator school for a term) cannot be bought out before his first fight. An informally freed slave (Junian Latin) is free enough to swear the oath.", revised: "2026-10-18", source: "outline:ch-28; foundation:§3" }
  - { rule: "An arena manumission unregistered before a magistrate can be contested as void (Celer's 'property' claim); the Corinth archive copy proves registration.", source: "foundation:§3" }
  - { rule: "The sea is closed from about November to March (letters wait in harbor; Ariston's sat at Kirrha all winter).", source: "foundation:§9; outline:ch-10" }
  - { rule: "Political backdrop: Nero granted Achaea 'freedom' (late 67), removing the proconsul; there is no proconsul in 69; Vespasian revoked it, and in this book a proconsul governs from Corinth again by 71.", revised: "2026-10-18", source: "foundation:§9; foundation:§3" }
  - { rule: "Roman equids went barefoot or in strapped hipposandals; no nailed horseshoes (Ch.24 hooves trimmed).", source: "outline:ch-24" }
  - { rule: "Eruption per Pliny: column ~1 p.m. 24 Aug; ~18 hours of pumice; roofs collapse; boats cannot land; surges reach Pompeii ~6:30-7:30 a.m. 25 Aug. The October theory is never raised.", source: "foundation:§9; STATE:ARCH-10" }
  - { rule: "Narrative law: the narrator's horizon is the moment narrated — no foreshadowing; Mara's historical knowledge of 79 is present-tense dread only.", source: "foundation:§6a; STATE:guardrails" }

# =====================================================================
# ORGANIZATIONS
# =====================================================================
organizations:
  thyiades:
    canonical_name: "the Thyiades"
    aliases: ["the Delphian women of Dionysus"]
    facts:
      - { fact: "winter rites on Parnassus by torchlight (ivy, fawnskins, drums, wine); trapped by snow until dawn in Ch.8", source: "outline:ch-08; foundation:§9" }

  delphic-sanctuary:
    canonical_name: "the sanctuary of Apollo at Delphi"
    aliases: ["the priests", "the prophetes"]
    facts:
      - { fact: "priests hire Mara to mend bronze (incense stand) and pay with contempt", source: "outline:ch-09" }
      - { fact: "a temple slave beats Mara off the steps with a rod", source: "outline:ch-05" }
      - { fact: "the prophetes conducts the consultation; Theano is the Pythia; consultation days are monthly in the warm season", source: "outline:ch-13; foundation:§3" }
      - { fact: "a temple slave carries Theano's summons to Mara (Ch.13)", source: "outline:ch-13" }

  household-of-celer:
    canonical_name: "the household of Q. Arrius Celer"
    aliases: ["Celer's men"]
    facts:
      - { fact: "claims Valens as runaway property (Ch.9 notice; issued autumn AD 70)", source: "outline:ch-09; outline:ch-12" }
      - { fact: "three men attack on the Kirrha road; one dies, two run (Ch.12)", source: "outline:ch-12" }
      - { fact: "still hunting Valens in summer AD 71 (Ch.15)", source: "outline:ch-15" }
      - { fact: "carry Celer around scaffolding", source: "foundation:§3" }

  corinth-record-office:
    canonical_name: "the provincial record office at Corinth"
    aliases: []
    facts:
      - { fact: "holds the archive copy of Valens's manumission under Celer's influence (he is on the restored proconsul's staff by 71–72); a bored fig-eating clerk", source: "outline:ch-16; outline:ch-17; foundation:§3" }

  pompeii-gladiator-school:
    canonical_name: "Pompeii's gladiator school"
    aliases: ["the barracks", "the ludus"]
    facts:
      - { fact: "an old trainer recognizes Lupus; an editor offers an exhibition bout (refused)", source: "outline:ch-21" }
      - { fact: "Felix sworn as auctoratus (AD 76); term served out by Aug 79", source: "outline:ch-28; outline:ch-37" }

  basilica-julia-court:
    canonical_name: "the court in the Basilica Julia"
    aliases: []
    facts:
      - { fact: "a single iudex with assessors hears the dowry suit, spring AD 74; Celer must return the dowry; Plautia's access to Marcus is Celer's private settlement, not the court's order", source: "outline:ch-22" }

  philadelphia-university-museum:
    canonical_name: "the Philadelphia university museum"
    aliases: []
    facts:
      - { fact: "employs Mara as objects conservator; hosts Emilio's memorial in the upper gallery", source: "foundation:§3; ch-01:p1; ch-01:p56" }
      - { fact: "has a dean (and dean's office), a registrar (Frank), a slide library, a classroom wing, and a department office that booked the memorial; the dean plans a spring lecture fund in Emilio's name; no food normally allowed in the galleries; the fire department billed them for the Christmas party", source: "ch-01:p2; ch-01:p9; ch-01:p13; ch-01:p190" }

  soprintendenza:
    canonical_name: "the Soprintendenza (Campania)"
    aliases: []
    facts:
      - { fact: "issues the permesso for the Campanian survey season; wants a new name on Emilio's permit by 20 April 1998 or the season lapses", source: "ch-01:p192" }

  free-library-of-philadelphia:
    canonical_name: "the Free Library of Philadelphia"
    aliases: ["Walnut Street West branch"]
    facts:
      - { fact: "recorded overdue notice to Emilio for Wild Horses", source: "ch-01:p186" }

  philadelphia-inquirer:
    canonical_name: "the Philadelphia Inquirer"
    aliases: ["the Inquirer"]
    facts:
      - { fact: "ran Emilio's obituary in January 1998 ('a professor who dug things'), read by Szabo", source: "ch-01:p139" }
