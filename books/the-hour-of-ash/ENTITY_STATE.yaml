  halloran:
    canonical_name: "Prof. Halloran"
    aliases: ["Halloran"]
    importance: minor
    role: "Emilio's permit contact, phoning from Naples"
    first_appearance: { chapter: 1, mode: "answering machine", source: "ch-01:p176" }
    traits:
      - { trait: "in Naples; handles Emilio's permit for the Campanian survey season", source: "ch-01:p176", mutable: false }
      - { trait: "on the page: says 'ringing', 'rung'; apologizes before the request; never says 'died' ('the family of Professor Reyes', 'since January'); forgets the six-hour time difference; starts to give a fax number (081 552 …) and abandons it", source: "ch-01:p176", mutable: false }
      - { trait: "Ch.2: married; he and his wife are leaving their Naples flat after thirty-one years for 'the new place'; rings from the floor of an emptied room with the phone in his lap", source: "ch-02:p26", mutable: true }
      - { trait: "Ch.2: accepted by the Soprintendenza as director for the season; explains the cession and the heir's declaration precisely; says 'I'm an old fool with forms'; offers to 'walk it over himself'; 'The line clicked twice, somewhere under the ocean'", source: "ch-02:p28; ch-02:p32; ch-02:p35", mutable: false }
      - { trait: "Ch.2: still never says 'died' ('In Emilio's place, I mean'; 'If they're in the house'); takes her laughter for crying, then 'Oh, thank God. I couldn't tell which' (the word 'went round his bare room and came back down the line'); 'I'm glad you laughed'", source: "ch-02:p32; ch-02:p34; ch-02:p36; ch-02:p40; ch-02:p42", mutable: false }
      - { trait: "Ch.2: speaks Italian to the new tenants ('not cheerfully'); hears 'Greece' as a holiday ('He was pleased for me, as if I'd said Florida'; 'Sure, that's practically next door')", source: "ch-02:p42", mutable: false }
    voice_markers:
      ref: "character-bible.md#prof-halloran"
    message_ch1:
      text: "Ah. Hello. This message is for the family of Professor Reyes. Ms. Reyes, I hope. It's Halloran, ringing from Naples. […] I'm very sorry indeed to be ringing about paperwork, of all things, and I'm sorry, I should have rung sooner, since January I've been meaning to. The difficulty is the permit. The permesso for the Campanian survey season is still in Emilio's name. The Soprintendenza want another name on it by the twentieth of April or the season lapses, and then of course one begins again from nothing, which takes, well. Years, sometimes. I wondered whether the family would be sending anyone. Anyone at all. It needn't be an archaeologist, strictly, for the paperwork. Or you could fax, if it's easier, the number at the office is zero-eight-one, five-five-two, oh, I'll give it again at the end. I'll try you again. It's six hours later here than with you, which I always forget, so forgive me if I've woken anyone. Oh, the fax. No. I'll ring. Well."
      status: "last message on the incoming tape; erased by Mara (p178); he says he will ring again"
      source: "ch-01:p176; ch-01:p178"
    location_log:
      - { chapter: 1, location: "naples", scene: "message on the machine (from 'the office')", travel_noted: false, source: "ch-01:p176" }
      - { chapter: 2, location: "naples", scene: "phone call from the emptied flat he and his wife are leaving (sitting on the floor), Sat 28 Mar ~10 a.m. Philadelphia time", travel_noted: false, source: "ch-02:p23; ch-02:p26" }
    knowledge:
      - { fact: "Emilio is dead (since January)", learned_chapter: 0, method: "prior_knowledge", source: "ch-01:p176" }
      - { fact: "Mara 'might be in Greece' (said in answer to his 6 July invitation; he takes it as a holiday)", learned_chapter: 2, method: "told_by:mara-reyes", note: "Sat 28 Mar, before she decides (5 May). He is not told why, when or for how long. The plan's 'first' is absent (CH2-1)", source: "ch-02:p41; ch-02:p42" }
      - { fact: "Emilio's last-season notebooks are in the house", learned_chapter: 2, method: "told_by:mara-reyes", source: "ch-02:p37" }
      - { fact: "the signed, notarized heir's declaration (faxed from the museum lab to Naples, Wed 1 Apr)", learned_chapter: 2, method: "discovered", note: "receipt not narrated; sent well before his 15 April target", source: "ch-02:p44" }
    knowledge_absent: ["Fenn, the chart, the cave", "her flight (booked 5 May for 19 May)", "that she has decided anything"]
    note: "His Campania invitation is a neutral fact with no payoff by design. Ch.2: one exchange (p40-p42); not referred to again in the chapter."

