    first_appearance: { chapter: 3, mode: "reported", source: "ch-03:p4" }
    traits:
      - { trait: "at the desk downstairs from Mara's room; asks whether she is going back to Athens", source: "ch-03:p4", mutable: false }
    knowledge:
      - { fact: "Mara gave up her room at seven on the climb day and was going 'up', not back to Athens", learned_chapter: 3, method: "told_by:mara-reyes", source: "ch-03:p4" }

  delphi-museum-guard:
    canonical_name: "the guard at the Delphi museum door"
    aliases: []
    importance: mentioned_only
    first_appearance: { chapter: 3, mode: "reported", source: "ch-03:p59" }
    traits:
      - { trait: "in a blue uniform; tore Mara's ticket in half on Wednesday 'with tremendous ceremony'; the man she means to give the knucklebone to on her way down", source: "ch-03:p59", mutable: false }

