  # --- Settled author canon ---
  - "TONE/SCOPE: Outlander-style sweeping time-slip historical romance. ONE long standalone (~245k target, 220k floor) running all the way through the eruption and her final choice."
  - "HISTORY: Flavian era. She arrives ~70 AD (Vespasian, r.69-79); romance + family span ~9 years; Vesuvius erupts 79 AD under Titus. NOT Nero (died 68). Keep the political backdrop accurate."
  - "MAP: purports to lead to the lost LIBRARY OF ALEXANDRIA; the real secret beneath the legend is a door through time. Bought at an estate sale of a self-proclaimed treasure hunter who vanished (left notes + coordinates); shopkeeper bought it only because it was accurate for its period."
  - "MECHANISM: following the coordinates opens a time-door. She lands first in GREECE (Delphi). The ORACLE OF DELPHI is the FIRST and ONLY early source of WHERE the door home is (Pompeii / the mountain) and WITHHOLDS the WHEN; she learns the 'when' later by other means (Fenn). Strict canon: Mara does not know the door is in Italy before the Oracle tells her."
  - "GREECE FIRST: a lone foreign woman in antiquity cannot simply travel — she must establish footing/protection in Greece before the long journey to Pompeii. Use this constraint as real obstacle, not hand-waved."
  - "LOVE INTEREST: a disgraced EX-GLADIATOR accused of an affair with a powerful man's wife (the accusation ruined/exiled him). They marry and have children over years in the past."
  - "CLIMAX: when she tries to leave, her family cannot pass through to the future. Choice = stay in the past with them or leave to save herself, AS Vesuvius erupts. The eruption is the literal + emotional ticking clock."
  - "ROMANCE HEAT: explicit when it occurs (on-page, detailed, sensual) BUT NOT a smut/erotica book. Intimacy is OCCASIONAL and earned — a handful of meaningful on-page scenes across the arc (first union, key relationship turns, one late unshadowed joy), none after the eruption begins; tension/yearning does most of the work. The architect places them in the outline."
  - "AUTHENTICITY DIAL (author-chosen 2026-07-06 — 'best of both'): (a) SENSORY/TEXTURAL SPECIFICITY cranked to ~8+ — real, specific, period-correct material detail as the immersion engine and the marketing hook (the carbonized loaf with the baker's stamp, Pliny's black-noon sky and the pumice fall, garum, insulae, oil lamps). (b) HARSHNESS/PACE/READER-COMFORT held at Outlander ~7, romance-forward — the alienness of 1st-c Rome (slavery, gender/status powerlessness, brutality) real and present but never grinding the romance or pace down; escapism and emotional immersion win ties. Authentic-FEELING and still escapist; NOT a purist reconstruction."

