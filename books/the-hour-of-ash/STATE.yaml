project:
  title: "The Hour of Ash"   # author-chosen 2026-07-06 (avoid bare "Pompeii" — Robert Harris owns that)
  genre: "Historical romance / time-slip fantasy"
  subgenre: "Time-travel romance (Outlander-style), ancient Rome"
  language: "English"
  word_count_target: 245000   # long single volume, Outlander-scale (author LENGTH POLICY 2026-07-13: ~245k accepted; 220k hard floor)
  comp_titles: ["Outlander (Diana Gabaldon)"]
  engagement_type: {primary: "empathy (55%)", secondary: "fascination (30%)", tertiary: "self-insertion (15%)"}
  premise: "A modern woman who inherited her late father's love of the ancient world buys an antique map said to lead to the Library of Alexandria, follows its coordinates, and opens a door into 1st-century Greece — where the Oracle of Delphi tells her where (but not when) the door home will reopen, she falls in love with a disgraced ex-gladiator, builds a family, and must choose between them and her own survival as Vesuvius erupts over Pompeii."
  created: "2026-06-21"
  updated: "2026-10-18"

# RUN 2 — FULL RESTART (author Terry, 2026-10-18). The first run (Ch.1-10 finalized, v3 outline)
# was retired in full: manuscript, evaluations, trackers and blueprint. Prior blueprint archived
# under research/prior-run-2026-07/ as reference only; old manuscript recoverable at git
# 2a8db82d471303594bd8c796437df07fded00cfc. Everything below the canon line is rebuilt.
adaptation:
  mode: "genesis-from-bible"
  canon_sources:
    story_bible: "research/story-bible.md"   # author canon (spoken idea); wins over pipeline
  chapter_1_locked: false
  chapters_to_produce: []   # architect v4 fills the count; chapter COUNT and LENGTHS emerge from beats, never from arithmetic

# AUTONOMY — the author's standing instruction for this run (2026-10-18):
# write a chapter -> run EVERY agent on it (dialogue-polish, hook-craft, disruptor, mechanical
# gates, independent evaluator, editor polish loop, entity-tracker on cadence, shape audit) ->
# only when it fully passes, move to the next chapter -> keep going until the author says stop.
# No checkpoint pauses (book-orchestrator FULL AUTONOMY MODE). Commit + push each finished chapter.
autonomy: full
# DRIFT POLICY (author, 2026-10-18): "a full run after each chapter so there is no drift" —
# entity-tracker UPDATE + continuity-guardian audit (new chapter vs ALL prior) + voice-wear +
# shape audit run after EVERY chapter, before the evaluator; never batched.
drift_check: every-chapter

word_floor:
  manuscript_min_words: 220000   # HARD FLOOR (book total) — the only word gate
  manuscript_target_words: 245000 # architect budgets Σ chapter targets ≥ this with a 5-10% margin
  # NO per-chapter floor. Chapter length VARIES WIDELY by design (punch chapters ~1,500; immersive
  # peaks up to ~9,000). The author's 2026-07-13 observation stands: immersive chapters land
  # naturally ~7,000-8,000; do not pad a chapter to a number — padding is AI filler.
  shortest_chapter_floor: 1200

phase:
