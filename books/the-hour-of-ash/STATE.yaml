guardrails:
  - "NO FORESHADOWING (author ruling 2026-09-28, HARD, book-wide target 0): the narrator never reaches forward to spoil an unreached outcome. BANNED: foreknowledge intrusion ('I did not know yet that', 'I would learn/come to', 'it would prove', 'little did I know'), significance-tagging by future loss ('the last time I would', 'the last X I would be given'), survival/outcome implication ('in the years since [survived X]', 'the man who would become'). KEEP past-facing reflection, present-scene dread, and the reader's own historical knowledge of Vesuvius. Enforced by tools/style_check.py --max-foreshadow 0 (default for this book) + the evaluator + voice-dna §0."
  - "ANTI-PREDICTABILITY (author instruction 2026-10-18, HARD): the book must not read as machine-shaped. No three-act skeleton with turning points on the quarter-marks; chapter count and lengths emerge from beats (short punch chapters AND long immersive ones); no two consecutive chapters share a structural approach; openings and endings rotate per the outline's Anti-Predictability Ledger (some chapters simply stop, no hook); no chapter runs the establish->anomaly->escalate->close shape by default. Audited every 5 chapters with python3 tools/shape_check.py (repo root) and at the end with --strict."
  - "NO TICS (author's standing law for EVERY book, 2026-10-18, HARD): TIC BUDGET = 0. No character — the narrator included — carries a verbal tic, catchphrase, refrain, or signature device (no numbering habit, no proverb habit, no performed-candour habit, no cataloguing/pricing/counting device, no scene-button line). Distinctness ONLY via attention/worldview, syntax, evasions and physicality (character-bible.md tic_bearers: []). Motifs are OBJECTS and SITUATIONS, never repeated phrases; any deliberate phrase is capped at 3 uses book-wide (style_check ALLOWLIST stays ≤5 entries). Enforced: style_check tic ceiling + repeated-phrase scan; voice_wear_check (retired phrases + per-POV self-repetition = BLOCKING, not informational); tools/tic_report.py run every chapter — any phrase recurring 3+ times across the book that is not an allowlisted motif is a defect the editor removes before finalize; GESTURE TICS included (2026-10-18): stage business repeated with varied wording (object handling, nods, swallows, 'a long moment'...) fails at 4+ of one class in a chapter or >0.3/1k book-wide; the evaluator's tic-proliferation scan; the per-chapter continuity audit checks for emerging devices."
  - "RETIRED PIPELINE REFLEXES (do not reproduce — they had to be trimmed after the fact in every chapter of run 1): retrospective significance-tagging; define-by-negation openers ('Not X. Not Y. It was Z.'); anaphora triads; performed-candour tics ('I want that on the record', 'I want to be exact', 'let it be said plainly'); any character device used as a scene-button; chapter-closing aphorisms."
  - "Genesis Floor >= 8.5 AND Casual Reader >= 8.5 per chapter (book-evaluator); polish-loop via book-editor (max 5)."
  - "Style gate: python3 tools/style_check.py must stay clean (simile <=4/1k, em-dash <=4 per chapter ABSOLUTE, foreshadowing 0, no NEW cross-chapter repeated phrase, tics under ceiling). Add deliberate motifs to ALLOWLIST (capped registry, not an exemption)."
  - "Mechanical suite per chapter: bash tools/check_chapter.sh N (style, grammar, rhythm, show/tell, voice-wear, metaphor) — all clean before the evaluator runs."
  - "Word floor >= manuscript_min_words (book total only); verify with: wc -w manuscript/chapters/chapter-*.md."
  - "PACING CHECK after EVERY chapter (required): scene/summary balance, dialogue share vs the chapter's planned band, the emotional slot vs neighbours, hook/pull or deliberate no-pull per the ledger, length vs beat. Logged one line per chapter in feedback/progress.md."
  - "Build to the story bible; honor the beat order; historically accurate 'to a certain point' (Outlander standard) — real period detail + real political backdrop, fictional leads."
  # --- Settled author canon ---
  - "TONE/SCOPE: Outlander-style sweeping time-slip historical romance. ONE long standalone (~245k target, 220k floor) running all the way through the eruption and her final choice."
  - "HISTORY: Flavian era. She arrives ~70 AD (Vespasian, r.69-79); romance + family span ~9 years; Vesuvius erupts 79 AD under Titus. NOT Nero (died 68). Keep the political backdrop accurate."
  - "MAP: purports to lead to the lost LIBRARY OF ALEXANDRIA; the real secret beneath the legend is a door through time. Bought at an estate sale of a self-proclaimed treasure hunter who vanished (left notes + coordinates); shopkeeper bought it only because it was accurate for its period."
  - "MECHANISM: following the coordinates opens a time-door. She lands first in GREECE (Delphi). The ORACLE OF DELPHI is the FIRST and ONLY early source of WHERE the door home is (Pompeii / the mountain) and WITHHOLDS the WHEN; she learns the 'when' later by other means (Fenn). Strict canon: Mara does not know the door is in Italy before the Oracle tells her."
  - "GREECE FIRST: a lone foreign woman in antiquity cannot simply travel — she must establish footing/protection in Greece before the long journey to Pompeii. Use this constraint as real obstacle, not hand-waved."
  - "LOVE INTEREST: a disgraced EX-GLADIATOR accused of an affair with a powerful man's wife (the accusation ruined/exiled him). They marry and have children over years in the past."
  - "CLIMAX: when she tries to leave, her family cannot pass through to the future. Choice = stay in the past with them or leave to save herself, AS Vesuvius erupts. The eruption is the literal + emotional ticking clock."
  - "ROMANCE HEAT: explicit when it occurs (on-page, detailed, sensual) BUT NOT a smut/erotica book. Intimacy is OCCASIONAL and earned — a handful of meaningful on-page scenes across the arc (first union, key relationship turns, one late unshadowed joy), none after the eruption begins; tension/yearning does most of the work. The architect places them in the outline."
  - "AUTHENTICITY DIAL (author-chosen 2026-07-06 — 'best of both'): (a) SENSORY/TEXTURAL SPECIFICITY cranked to ~8+ — real, specific, period-correct material detail as the immersion engine and the marketing hook (the carbonized loaf with the baker's stamp, Pliny's black-noon sky and the pumice fall, garum, insulae, oil lamps). (b) HARSHNESS/PACE/READER-COMFORT held at Outlander ~7, romance-forward — the alienness of 1st-c Rome (slavery, gender/status powerlessness, brutality) real and present but never grinding the romance or pace down; escapism and emotional immersion win ties. Authentic-FEELING and still escapist; NOT a purist reconstruction."

